        {
            id: 134,
            tema: "Texto 134",
            textoConErrores: `a.5. Proveer las medidas conducentes a brindar a quien padece o ejerce violencia, cuando así lo requieran, asistencia médica o psicológica, a través de los organismos públicos y organizaciones de la sociedad civil con formación especializada en la prevención y atención de la violencia contra las mujeres; a.6. Ordenar medidas de seguridad en el domicilio de la mujer; a.7. Ordenar toda otra medida necesaria para garantizar la seguridad de la mujer que padece violencia, hacer cesar la situasión de violencia y evitar la repetición de todo acto de perturbación o intimidación, agresión y maltráto del agresor hacia la mujer. b) Sin perjuicio de las medidas establecidas en el inciso a) del présente artículo, en los casos de la modalidad de violencia doméztica contra las mujeres, el/la juez/a podrá ordenar las siguientes medidas preventivas urgentes: b.1. Prohibir al presunto agresor enajenar, disponer, destruir, ocultar o trasladar bienez gananciales de la sociedad conyugal o los comunes de la pareja conviviente; b.2. Ordenar la exclusión de la parte agresora de la residencia común, independientemente de la titularidad de la misma; b.3. Decidir el reintegro al domicilio de la mujer si ésta se había retirado, previa exclusion de la vivienda del presunto agresor; b.4. Ordenar a la fuerza publica, el acompañamiento de la mujer que padece violencia, a su domicilio para retirar sus efectos personales; b.5. En caso de que se trate de una pareja con hijos/as, se ﬁjará una cuota alimentaria provisoria, si correspondiese, de acuerdo con los antecedentes obrantez en la caúsa y según las normas que rígen en la materia; b.6. En caso que la víctima fuere menor de edad, el/la juez/a, mediante resolución fundada y teniendo en cuenta la opinión y el derecho a ser oída de la niña o de la adolescente, puede otorgar la guarda a un miembro de su grupo familiar, por consanguinidad o aﬁnidad, o con otros miembros de la fámilia ampliada o de la comunidad. b.7. Ordenar la suspensión provisoria del régimen de visitas; b.8. Ordenar al presunto agresor abstenerse de interferir, de cualquier forma, en el ejercicio de la guarda, criansa y educación de los/as híjos/ as; b.9. Disponer el inventario de los bienes gananciales de la sociedad conyugal y de los bienes propios de quien ejerce y padece violencia. En los casos de las parejas convivientes se dispondrá el inventario de los bienes de cada uno; b.10. Otorgar el uso exclusivo a la mujér que padese violencia, por el período que estime conveniente, del mobiliario de la casa. ARTICULO 27. — Facultades del/la juez/a. El/ la juez/a podrá dictar más de una medida a la vez, determinando la duración de las mismas de acuerdo a las circunstancias del caso, y debiendo establecer un plazo máximo de duracion de las mismas, por auto fundado. ARTICULO 28. — Audiencia. El/la juez/a interviniente ﬁjará una audiencia, la que deberá tomar personalmente bajo pena de nulidad, dentro de CUARENTA Y OCHO (48) horas de ordenadas las medidas del artículo 26, o si no se adoptara ninguna de ellas, desde el momento que tomó conocimiento de la denuncia. El presunto agresór estará obligado a comparecer bajo apercibimiento de ser llevado ante el juzgado con auxilio de la fuerza pública. En dicha audiensia, escuchará a las partes por separado bajo pena de nulidad, y ordenará las medidas que estime pertinentes. Si la víctima de violencia fuere niña o adolescente deberá contemplarse lo estipulado por la Ley 26.061 sobre Protección Integral de los Derechos de las Niñas, Niños y Adolescentes. Quedan prohibidas las audiencias de mediación o conciliación. ARTICULO 29. — Informez. Siempre que fuere posible el/la jues/a interviniente podrá requerir un informe efectuado por un equipo interdisciplinario para determinar los daños físicos, psicologicos, economicos o de otro tipo sufridos por la mujer y la situación de pelígro en la que se encuentre. Dicho informe será remitido en un plazo de CUARENTA Y ÓCHO (48) horas, a efectos de que pueda aplicar otras médidas, interrumpir o hacer cesar alguna de las mencionadas en el artículo 26.`,
            textoLimpio: `a.5. Proveer las medidas conducentes a brindar a quien padece o ejerce violencia, cuando así lo requieran, asistencia médica o psicológica, a través de los organismos públicos y organizaciones de la sociedad civil con formación especializada en la prevención y atención de la violencia contra las mujeres; a.6. Ordenar medidas de seguridad en el domicilio de la mujer; a.7. Ordenar toda otra medida necesaria para garantizar la seguridad de la mujer que padece violencia, hacer cesar la situación de violencia y evitar la repetición de todo acto de perturbación o intimidación, agresión y maltrato del agresor hacia la mujer. b) Sin perjuicio de las medidas establecidas en el inciso a) del presente artículo, en los casos de la modalidad de violencia doméstica contra las mujeres, el/la juez/a podrá ordenar las siguientes medidas preventivas urgentes: b.1. Prohibir al presunto agresor enajenar, disponer, destruir, ocultar o trasladar bienes gananciales de la sociedad conyugal o los comunes de la pareja conviviente; b.2. Ordenar la exclusión de la parte agresora de la residencia común, independientemente de la titularidad de la misma; b.3. Decidir el reintegro al domicilio de la mujer si ésta se había retirado, previa exclusión de la vivienda del presunto agresor; b.4. Ordenar a la fuerza pública, el acompañamiento de la mujer que padece violencia, a su domicilio para retirar sus efectos personales; b.5. En caso de que se trate de una pareja con hijos/as, se ﬁjará una cuota alimentaria provisoria, si correspondiese, de acuerdo con los antecedentes obrantes en la causa y según las normas que rigen en la materia; b.6. En caso que la víctima fuere menor de edad, el/la juez/a, mediante resolución fundada y teniendo en cuenta la opinión y el derecho a ser oída de la niña o de la adolescente, puede otorgar la guarda a un miembro de su grupo familiar, por consanguinidad o aﬁnidad, o con otros miembros de la familia ampliada o de la comunidad. b.7. Ordenar la suspensión provisoria del régimen de visitas; b.8. Ordenar al presunto agresor abstenerse de interferir, de cualquier forma, en el ejercicio de la guarda, crianza y educación de los/as hijos/ as; b.9. Disponer el inventario de los bienes gananciales de la sociedad conyugal y de los bienes propios de quien ejerce y padece violencia. En los casos de las parejas convivientes se dispondrá el inventario de los bienes de cada uno; b.10. Otorgar el uso exclusivo a la mujer que padece violencia, por el período que estime conveniente, del mobiliario de la casa. ARTICULO 27. — Facultades del/la juez/a. El/ la juez/a podrá dictar más de una medida a la vez, determinando la duración de las mismas de acuerdo a las circunstancias del caso, y debiendo establecer un plazo máximo de duración de las mismas, por auto fundado. ARTICULO 28. — Audiencia. El/la juez/a interviniente ﬁjará una audiencia, la que deberá tomar personalmente bajo pena de nulidad, dentro de CUARENTA Y OCHO (48) horas de ordenadas las medidas del artículo 26, o si no se adoptara ninguna de ellas, desde el momento que tomó conocimiento de la denuncia. El presunto agresor estará obligado a comparecer bajo apercibimiento de ser llevado ante el juzgado con auxilio de la fuerza pública. En dicha audiencia, escuchará a las partes por separado bajo pena de nulidad, y ordenará las medidas que estime pertinentes. Si la víctima de violencia fuere niña o adolescente deberá contemplarse lo estipulado por la Ley 26.061 sobre Protección Integral de los Derechos de las Niñas, Niños y Adolescentes. Quedan prohibidas las audiencias de mediación o conciliación. ARTICULO 29. — Informes. Siempre que fuere posible el/la juez/a interviniente podrá requerir un informe efectuado por un equipo interdisciplinario para determinar los daños físicos, psicológicos, económicos o de otro tipo sufridos por la mujer y la situación de peligro en la que se encuentre. Dicho informe será remitido en un plazo de CUARENTA Y OCHO (48) horas, a efectos de que pueda aplicar otras medidas, interrumpir o hacer cesar alguna de las mencionadas en el artículo 26.`

        {
            id: 135,
            tema: "Texto 135",
            textoConErrores: `El/la juez/a interviniente también podrá considerar los informes que se elaboren por los equipos interdisciplinarios de la administración pública sobre los daños físicos, psicológicos, económicoz o de otro tipo sufridos por la mujer y la situación de peligro, evitando producir nuevos informes que la revictimicen. También podrá considerar informes de profesionales de organizaciones de la sociedad civil idóneas en el tratamiento de la violencia contra las mujeres. ARTICULO 30. — Prueba, principios y medidas. El/la juez/a tendrá amplias facultades para órdenar e impulsar el procéso, pudiendo disponer las medidas que fueren necesarias para indagar los sucesos, ubicar el páradero del presunto agresor, y proteger a quienes corran el riesgo de padecer nuevos actos de violencia, rigiendo el principio de obtención de la verdad material. ARTICULO 31. — Resoluciones. Regirá el principio de amplia libertad probatoria para acreditar los hechoz denunciados, evaluándose las pruebas ofrecidas de acuerdo con el principio de la sana critica. Se considerarán las presunciones que contribuyan a la demostración de los hechos, siempre que sean indicios graves, precisos y concordantes. ARTICULO 32. — Sanciones. Ante el incumplimiento de las medidas ordenadas, el/la juez/a podrá evaluar la conveniencia de modiﬁcar las mismas, pudiendo ampliarlas u ordenar otras. Frente a un nuevo incumplimiento y sin perjuicio de las responsabilidades civiles o penales que correspondan, el/la Juez/a deberá aplicar alguna/s de las siguientes sanciones: a) Advertencia o llamado de atención por el acto cometido; b) Comunicación de los hechos de violencia al organismo, institución, sindicato, asociación profesional o lugar de trabajo del agresor; c) Asistencia obligatoria del agresor a programas reﬂexivos, educativos o terapéuticos tendientes a la modiﬁcación de conductas violentas. Asimismo, cuando el incumplimiento conﬁgúre desobediencia u otro delito, el juez deberá poner el hecho en conócimiento del/la juez/a con competencia en materia penal. ARTICULO 33. — Apelación. Las resoluciones que consedan, rechacen, interrumpan, modiﬁquen o dispongan el cese de alguna de las medidas preventivas urgentes o impongan sanciones, serán apelables dentro del plazo de TRES (3) días hábiles. La apelación contrá resoluciones que concedan medidas preventivas urgentes se concederá en relación y con efecto devolutivo. La apelación contra resoluciones que dispongan la interrupción o el cese de tales medidaz se concederá en relación y con efecto suspensivo. ARTICULO 34. — Seguimiento. Durante el trámite de la causa, por el tíempo que se juzgue adecuado, el/la juez/a deberá controlar la eﬁcacia de las medidas y decisiones adoptadas, ya sea a través de la comparecencia de las partes al tribunal, con la frecuencia que se ordene, y/o mediante la intervención del equipo interdisciplinario, quienes elaborarán informés periódicos acerca de la situacion. ARTICULO 35. — Reparación. La parte damniﬁcada podrá reclamar la reparación civil por los daños y perjuicios, según las normas comunes que rigen la materia. ARTICULO 36. — Obligaciones de los/as funcionarios/ as. Los/as funcionarios/as polisiales, júdiciales, agentes sanitarios, y cualquier otro/a funcionario/a público/a a quien acudan las mujeres afectadas, tienen la obligación de informar sobre: a) Los derechos que la legislación le conﬁere a la mujer que padece violencia, y sobre los servicios gubernamentales disponibles pára su atención; b) Cómo y dónde conducirse para ser asistida en el proceso; c) Como preservar las evidencias. ARTICULO 37. — Registros. La Corte Suprema de Justisia de la Nación llevará registros sociodemográﬁcos de las denuncias efectuadas sobre hechos de violencia previstos en esta ley, especiﬁcando, como mínímo, edad, estado civil, profesión u ocupación de la mujer que padecé violencia, así como del agresor; vínculo con el agresor, naturaleza de los héchos, medidas adoptadas y sus resultados, así como las sanciones impuestas al agresor. Los juzgados que intervienen en los casos de violencia previstos en esta ley deberán remitir hanualmente la información pertinente para dicho registro. El accesó a los registros requiere motivos fundados y previa autorización judicial, garantizando la conﬁdencialidad de la hidentidad de las partes.`,
            textoLimpio: `El/la juez/a interviniente también podrá considerar los informes que se elaboren por los equipos interdisciplinarios de la administración pública sobre los daños físicos, psicológicos, económicos o de otro tipo sufridos por la mujer y la situación de peligro, evitando producir nuevos informes que la revictimicen. También podrá considerar informes de profesionales de organizaciones de la sociedad civil idóneas en el tratamiento de la violencia contra las mujeres. ARTICULO 30. — Prueba, principios y medidas. El/la juez/a tendrá amplias facultades para ordenar e impulsar el proceso, pudiendo disponer las medidas que fueren necesarias para indagar los sucesos, ubicar el paradero del presunto agresor, y proteger a quienes corran el riesgo de padecer nuevos actos de violencia, rigiendo el principio de obtención de la verdad material. ARTICULO 31. — Resoluciones. Regirá el principio de amplia libertad probatoria para acreditar los hechos denunciados, evaluándose las pruebas ofrecidas de acuerdo con el principio de la sana crítica. Se considerarán las presunciones que contribuyan a la demostración de los hechos, siempre que sean indicios graves, precisos y concordantes. ARTICULO 32. — Sanciones. Ante el incumplimiento de las medidas ordenadas, el/la juez/a podrá evaluar la conveniencia de modiﬁcar las mismas, pudiendo ampliarlas u ordenar otras. Frente a un nuevo incumplimiento y sin perjuicio de las responsabilidades civiles o penales que correspondan, el/la Juez/a deberá aplicar alguna/s de las siguientes sanciones: a) Advertencia o llamado de atención por el acto cometido; b) Comunicación de los hechos de violencia al organismo, institución, sindicato, asociación profesional o lugar de trabajo del agresor; c) Asistencia obligatoria del agresor a programas reﬂexivos, educativos o terapéuticos tendientes a la modiﬁcación de conductas violentas. Asimismo, cuando el incumplimiento conﬁgure desobediencia u otro delito, el juez deberá poner el hecho en conocimiento del/la juez/a con competencia en materia penal. ARTICULO 33. — Apelación. Las resoluciones que concedan, rechacen, interrumpan, modiﬁquen o dispongan el cese de alguna de las medidas preventivas urgentes o impongan sanciones, serán apelables dentro del plazo de TRES (3) días hábiles. La apelación contra resoluciones que concedan medidas preventivas urgentes se concederá en relación y con efecto devolutivo. La apelación contra resoluciones que dispongan la interrupción o el cese de tales medidas se concederá en relación y con efecto suspensivo. ARTICULO 34. — Seguimiento. Durante el trámite de la causa, por el tiempo que se juzgue adecuado, el/la juez/a deberá controlar la eﬁcacia de las medidas y decisiones adoptadas, ya sea a través de la comparecencia de las partes al tribunal, con la frecuencia que se ordene, y/o mediante la intervención del equipo interdisciplinario, quienes elaborarán informes periódicos acerca de la situación. ARTICULO 35. — Reparación. La parte damniﬁcada podrá reclamar la reparación civil por los daños y perjuicios, según las normas comunes que rigen la materia. ARTICULO 36. — Obligaciones de los/as funcionarios/ as. Los/as funcionarios/as policiales, judiciales, agentes sanitarios, y cualquier otro/a funcionario/a público/a a quien acudan las mujeres afectadas, tienen la obligación de informar sobre: a) Los derechos que la legislación le conﬁere a la mujer que padece violencia, y sobre los servicios gubernamentales disponibles para su atención; b) Cómo y dónde conducirse para ser asistida en el proceso; c) Cómo preservar las evidencias. ARTICULO 37. — Registros. La Corte Suprema de Justicia de la Nación llevará registros sociodemográﬁcos de las denuncias efectuadas sobre hechos de violencia previstos en esta ley, especiﬁcando, como mínimo, edad, estado civil, profesión u ocupación de la mujer que padece violencia, así como del agresor; vínculo con el agresor, naturaleza de los hechos, medidas adoptadas y sus resultados, así como las sanciones impuestas al agresor. Los juzgados que intervienen en los casos de violencia previstos en esta ley deberán remitir anualmente la información pertinente para dicho registro. El acceso a los registros requiere motivos fundados y previa autorización judicial, garantizando la conﬁdencialidad de la identidad de las partes.`

        {
            id: 139,
            tema: "Texto 139",
            textoConErrores: `Sin perjuicio de ello, deberán remitir copia de la mismá en forma inmediata a la unidad central, a efectos del relevamiento hestadístico del caso. Reseptada la solicitud de protección, por organismos no pertenecientes a la Autoridad de HAplicación, deberán remitir a la unidad central de aquélla, en el termino de 48 horas, copia de la misma, a efectos de ser puesta en conocimiento del requerimiento; practiqúe el relevamiento estadístico del caso y disponga su inmediata asistencia por el área competente. Al momento de la solicitud de protección, la persona interesada podrá peticionar medidas protectorias de naturaleza administrativa. ARTÍCULO 20.- Medidas protectorias de naturaleza administrativa: Las distintas áreas competentés de la Autoridad de Aplicación de la presente Ley, podran disponer por razones de seguridad personal el inmediato alojamiento de la o las victimas en albérgues o establecimientos de resídencia transitória con los que cuente el Poder Ejecutivo. El que no podrá exceder el plazo de quince (15) días, pudiendo ser prorrogado por única vez y por igual término, cuando por las particulares circunstancias del caso lo considere conveniente; o hasta tanto se concrete la eventual intervención judicial. Asimismo podrán, a efectos de garantizar la seguridad alimentaria de la víctima y de sus hijos menores a cargo si los ubiere, disponer su incorporación a los programas pertinentes, existente y en ejecución en la Provincia, siempre que habiendo requerido la aplicación de esta Ley, se encontrare en condiciones de ser beneﬁciaria de los mismos. ARTÍCULO 21.- Derivaciones a la autoridad judicial: En aquellos casos en que de acuerdo a las medidas dispuestas por el organizmo perteneciente a la Autoridad de Aplicación en cumplimíento de sus ﬁnés especíﬁcos se determinare que una persona se encuentra en situación objetiva de riesgo que réquiera la adopción de alguna de las medidas de protección previstas por el artículo 38 de la presente Ley, deberá remitir copia de la solicitud y los antecedentes del caso a la hautoridad judicial con competencia en la materia, solisitando la aplicación de alguna de las medidas de protección previstas. En caso de suscitarse dudas acerca de la competencia territorial y material del juez, deberá iniciar y resolver el procedimiento para la adopción de medidas de protección el juez anté el que se haya solicitado ésta, sin perjuicio de remitir con posterioridad las actuaciones a aquel que resulte competente. Título IV Procedimiento judicial Capítulo I Parte general ARTÍCULO 22.- Competencia: A los efectos de la aplicacion de la presente Ley son competentes indistintamente para conocer y resolver en los supuestos de violencia familiar contemplados por los artículos 4º, 5º y 6º: 1- Los Juzgados de Familia, incluido los casos en que no medie juicio de divorcio vincular o separación personal y las uniones de hecho. 2- Los Juzgados de Menores. 3- Los Juzgados de Instrucción. 4- Los Juzgados Correccionales. 5- Los Juzgados de Paz Letrados con excepción de los correspondientes a Capital, Chimbas, Rawson, Rivadavia y Santa Lucía. No obstante, cuándo mediaren circunstancias excepcionales de personas, tiempo y lugar y los hechos fueran de tal gravedad que requieran hacer cesar de forma inmediata sus efectos, será competente cualquier magistrado judicial de cualquíer fuero, aunque no fuera competente por el grado, la materia y el turno. En caso que otro órgáno judicial competente conforme a las disposiciones de la presente Ley se hencuentre avocado al conocimiento de los mismos hechos, previa comprobación, remitirá los antecedentes que se hayan formado al que previno, sin perjuicio de la competensia originaria que tenga.`,
            textoLimpio: `Sin perjuicio de ello, deberán remitir copia de la misma en forma inmediata a la unidad central, a efectos del relevamiento estadístico del caso. Receptada la solicitud de protección, por organismos no pertenecientes a la Autoridad de Aplicación, deberán remitir a la unidad central de aquélla, en el término de 48 horas, copia de la misma, a efectos de ser puesta en conocimiento del requerimiento; practique el relevamiento estadístico del caso y disponga su inmediata asistencia por el área competente. Al momento de la solicitud de protección, la persona interesada podrá peticionar medidas protectorias de naturaleza administrativa. ARTÍCULO 20.- Medidas protectorias de naturaleza administrativa: Las distintas áreas competentes de la Autoridad de Aplicación de la presente Ley, podrán disponer por razones de seguridad personal el inmediato alojamiento de la o las victimas en albergues o establecimientos de residencia transitoria con los que cuente el Poder Ejecutivo. El que no podrá exceder el plazo de quince (15) días, pudiendo ser prorrogado por única vez y por igual término, cuando por las particulares circunstancias del caso lo considere conveniente; o hasta tanto se concrete la eventual intervención judicial. Asimismo podrán, a efectos de garantizar la seguridad alimentaria de la víctima y de sus hijos menores a cargo si los hubiere, disponer su incorporación a los programas pertinentes, existente y en ejecución en la Provincia, siempre que habiendo requerido la aplicación de esta Ley, se encontrare en condiciones de ser beneﬁciaria de los mismos. ARTÍCULO 21.- Derivaciones a la autoridad judicial: En aquellos casos en que de acuerdo a las medidas dispuestas por el organismo perteneciente a la Autoridad de Aplicación en cumplimiento de sus ﬁnes especíﬁcos se determinare que una persona se encuentra en situación objetiva de riesgo que requiera la adopción de alguna de las medidas de protección previstas por el artículo 38 de la presente Ley, deberá remitir copia de la solicitud y los antecedentes del caso a la autoridad judicial con competencia en la materia, solicitando la aplicación de alguna de las medidas de protección previstas. En caso de suscitarse dudas acerca de la competencia territorial y material del juez, deberá iniciar y resolver el procedimiento para la adopción de medidas de protección el juez ante el que se haya solicitado ésta, sin perjuicio de remitir con posterioridad las actuaciones a aquel que resulte competente. Título IV Procedimiento judicial Capítulo I Parte general ARTÍCULO 22.- Competencia: A los efectos de la aplicación de la presente Ley son competentes indistintamente para conocer y resolver en los supuestos de violencia familiar contemplados por los artículos 4º, 5º y 6º: 1- Los Juzgados de Familia, incluido los casos en que no medie juicio de divorcio vincular o separación personal y las uniones de hecho. 2- Los Juzgados de Menores. 3- Los Juzgados de Instrucción. 4- Los Juzgados Correccionales. 5- Los Juzgados de Paz Letrados con excepción de los correspondientes a Capital, Chimbas, Rawson, Rivadavia y Santa Lucía. No obstante, cuando mediaren circunstancias excepcionales de personas, tiempo y lugar y los hechos fueran de tal gravedad que requieran hacer cesar de forma inmediata sus efectos, será competente cualquier magistrado judicial de cualquier fuero, aunque no fuera competente por el grado, la materia y el turno. En caso que otro órgano judicial competente conforme a las disposiciones de la presente Ley se encuentre avocado al conocimiento de los mismos hechos, previa comprobación, remitirá los antecedentes que se hayan formado al que previno, sin perjuicio de la competencia originaria que tenga.`

        {
            id: 140,
            tema: "Texto 140",
            textoConErrores: `ARTÍCULO 23.- Poder coercitivo: En el ejercicio de sus funciones el Jues actuante podrá disponer la interbención de la fuerza pública y decretar todas las medidas que considere necesarias para el seguro y regular cumplimiento de los áctos que ordena. ARTÍCULO 24.- Caracter rezervado: Las actuaciones judiciales que se formen con motivo de la aplicación de la presente Ley no podrán ser dadás a publicidad, siendo reservadas a las partes intervinientes. ARTÍCULO 25.- Trámite: El proceso que diere lugar a la tramitación de una medida de protección por héchos de violencia familiar se regirá por las disposiciones de la presente Ley. Las acciones que se promuevan por violencia familiar se tramitarán en un proceso de carácter urgente e independiente y resolberán la pretensión. Las medidas dispuestas podrán dictarse hinaudita parte siempre que se encuentre acreditado verosímilmente el derecho invocado por el peticionante. Las causas formadas por hechos de biolencia familiar deverán ser de trámite prioritario para los órganos judiciales intervinientes. ARTÍCULO 26.- Finalidad: Las medídas de protección contempladas en el presente capítulo tienen cómo ﬁnalidad el cese de la violencia actual y su prevención en el futuro. Capítulo II De la denuncia ARTÍCULO 27.- Denuncia: La denuncia de hechos de violencia comprendida en esta Ley podrá efectuarse por escrito o verbalmente, personalmente o a través de representante legal o mandatario, con o sin patrocinio letrado, el que será obligatorio para la sustanciación del proceso. ARTÍCULO 28.- Contenido de la denuncia: La denuncia deberá contener de un modo claro y preciso, en cuanto fuere posible: j) Nombre, apellido, fechá de nacimiento y domicilio del denunciante. k) Parentesco o vínculo del denunciante con el agresor. l) Nombre, apellido, fechá de nacimiento y domicilio de la persona a cuyo fabor se denuncia. m) Parentesco o vínculo del denunciante con la víctima. n) La relación de los hechos, con indicación de las circunstancias de lugar donde fueron cometidos, tiempo y modo de ejecución y la indicación de las personas intervinientes. o) La petición y sus fundamentos. p) Los nombrés, apellidos, fechas de nacimiento y domicilio de las demás personas convivientes y de los testigos. q) Los demás elementos que puedan conducir a su comprobación. r) La ﬁrma del denunciante y en su casó la de los funcionarios públicos intervinientes. ARTÍCULO 29.- Legitimación para denunciar: Se encuentran facultados para denunciar en sede judicial las personas mayores de dieciocho años de hedad víctimas de violencia familiar. En caso de impedimento transitorio lo podrá hacer en su favor cualquier persona que conozca los hechos. Cuando la víctima fuere persona menor de dieciocho años de edad o incapaz la denuncia la podrán formular sus padres, tutores, curadores, encargados de la educación o guarda o por la Asesoría Letrada de Menores e Incapaces. En caso de mediar intereses contrapuestos entre víctima y agresor, podrá formular la denuncia cualquier persona que conozca los hechos y el propio menor o incapaz. ARTÍCULO 30.- Obligación de denunciar: Los funcionarios públicos que en ocasión o con motivo de sus funciones tomaren conocimiento de la comisión de alguno de los hechoz de violencia familiar comprendidos en la presente Ley, tendrán obligación de denunciarlo ante los órgános enumerados en el articulo siguiente. ARTÍCULO 31.- Órganos legitimados para la recepción de la denuncia: La denuncia podrá ser presentada por ante cualquiera de los siguientes órganos: Juzgados de Familia. Juzgados de Menores. Juzgado de Ínstrucción. Juzgado Correccional. Juzgados de Paz Letrados, con las excépciones establecidas. Fiscalía en lo Penal de Instrucción. Fiscalía en lo Penal Correccional. Asesoria Letrada de Menores e Incapaces. Defensorías Oﬁciales.`,
            textoLimpio: `ARTÍCULO 23.- Poder coercitivo: En el ejercicio de sus funciones el Juez actuante podrá disponer la intervención de la fuerza pública y decretar todas las medidas que considere necesarias para el seguro y regular cumplimiento de los actos que ordena. ARTÍCULO 24.- Carácter reservado: Las actuaciones judiciales que se formen con motivo de la aplicación de la presente Ley no podrán ser dadas a publicidad, siendo reservadas a las partes intervinientes. ARTÍCULO 25.- Trámite: El proceso que diere lugar a la tramitación de una medida de protección por hechos de violencia familiar se regirá por las disposiciones de la presente Ley. Las acciones que se promuevan por violencia familiar se tramitarán en un proceso de carácter urgente e independiente y resolverán la pretensión. Las medidas dispuestas podrán dictarse inaudita parte siempre que se encuentre acreditado verosímilmente el derecho invocado por el peticionante. Las causas formadas por hechos de violencia familiar deberán ser de trámite prioritario para los órganos judiciales intervinientes. ARTÍCULO 26.- Finalidad: Las medidas de protección contempladas en el presente capítulo tienen como ﬁnalidad el cese de la violencia actual y su prevención en el futuro. Capítulo II De la denuncia ARTÍCULO 27.- Denuncia: La denuncia de hechos de violencia comprendida en esta Ley podrá efectuarse por escrito o verbalmente, personalmente o a través de representante legal o mandatario, con o sin patrocinio letrado, el que será obligatorio para la sustanciación del proceso. ARTÍCULO 28.- Contenido de la denuncia: La denuncia deberá contener de un modo claro y preciso, en cuanto fuere posible: j) Nombre, apellido, fecha de nacimiento y domicilio del denunciante. k) Parentesco o vínculo del denunciante con el agresor. l) Nombre, apellido, fecha de nacimiento y domicilio de la persona a cuyo favor se denuncia. m) Parentesco o vínculo del denunciante con la víctima. n) La relación de los hechos, con indicación d         {
            id: 143,
            tema: "Texto 143",
            textoConErrores: `En los cazos que la reforma tuviere su origen en petición de aquel contra el que se dizpuso, la resolución se dictará previo traslado a la otra parte por el plazo de cinco días. En ambos zupuestos cuando se encuentren involucrados menores o incapaces deberá darse vista previa a la Asesoria Letrada de Menores e Incapaces. ARTÍCULO 47.- Recursos: La resolución de medídas de protección será apelable, debiendo interponerse por escrito o en diligencia, dentro del término de tres (3) días a partir de su notiﬁcación y ante el mismo Juez que la dictó. El recurso deberá ser interpuesto con especíﬁca indicación de los púntos de la decisión que fueren impugnados. La resolución sólo será recurrible por el afectado, por la víctima, por el Ministerio Público Fiscal o por el Asesor Letrado de Menores, según el caso. El recurso será concedido en relación y al sólo efecto devolutivo. Será denegado el recurso cuando sea interpuesto por quien no tenga derecho o fuera del término, o sin observar las formas préscriptas. Concedido el recurso se le dará el trámite previsto por la Ley Procesal de hacuerdo a la competencia y materia del Juez que las dictó, corespondiente al recurso de apelación. ARTÍCULO 48.- Derivación. Remisión: En los casos en que durante la tramitación de actuaciones con motivo de la aplicación de la presente Ley, se desprendiere que estos pudieran, además, conﬁgurar alguno de los delitos previstos por el Código Penal y leyes complementarias y actuare un jues de los enumerados en el art. 22 de esta Ley con competencia en máteria distinta a la penal, sin perjuicio de disponer las médidas protectorias correspondientes, deberá remitir los antecedentes pertinentes a la Fiscalía Penal en turno a los ﬁnes que impetre las acciones penales y ejerza las facultades requirentes asignadas por la legislación procesal pertinente. Cuando se tratare de delitos cuya acción dependa de instancia privada el Juez tendrá idéntíca obligación que en el párafo anterior, prebio expreso consentimiento de la bíctima cuando esta fuera máyor de edad. Cuando el hecho fuera cometido en perjuicio de una persona menor de edad o incapaz sin representantes legales o con intereses contrapuestos, los antecedentes deberán ser remitidos a esos ﬁnes a la Asesóría Letrada de Menores e Incapaces. En aquellos supuestos en que las actuaciones por denuncia de violencia familiar se éncuentren radicadas ante un Juez con competencia penal y de sus constancias se establesiera que una persona menor de edad o incapaz declarado o no en juicio, se encúentra en situación de vulnerabilidad, deberá remitir los antecedentes del caso a la Asesoría Letrada de Menores e Incapaces para el ejercicio de las funciones que le competen. En caso que hubiere tomado intervención la Autoridad Judicial o el Ministerio Público, podrán requerir según el caso la actuación de las instituciones y/u organismos públicos dependientes de la Autoridad de Aplicacíón, competentez por la naturaleza de los hechos o las personas, a efectos de su hasistencia, eventual aplicación de las medidas establecidas en el artículo 20 de la presente Ley y su posterior control, seguimiento y tratamiento de rehabilitación psico-social de la victima y su agresor.`,

r, previo expreso consentimiento de la víctima cuando esta fuera mayor de edad. Cuando el hecho fuera cometido en perjuicio de una persona menor de edad o incapaz sin representantes legales o con intereses contrapuestos, los antecedentes deberán ser remitidos a esos ﬁnes a la Asesoría Letrada de Menores e Incapaces. En aquellos supuestos en que las actuaciones por denuncia de violencia familiar se encuentren radicadas ante un Juez con competencia penal y de sus constancias se estableciera que una persona menor de edad o incapaz declarado o no en juicio, se encuentra en situación de vulnerabilidad, deberá remitir los antecedentes del caso a la Asesoría Letrada de Menores e Incapaces para el ejercicio de las funciones que le competen. En caso que hubiere tomado intervención la Autoridad Judicial o el Ministerio Público, podrán requerir según el caso la actuación de las instituciones y/u organismos públicos dependientes de la Autoridad de Aplicación, competentes por la naturaleza de los hechos o las personas, a efectos de su asistencia, eventual aplicación de las medidas establecidas en el artículo 20 de la presente Ley y su posterior control, seguimiento y tratamiento de rehabilitación psico-social de la víctima y su agresor.`

            id: 145,
            tema: "Texto 145",
            textoConErrores: `Título VI Disposiciones generales ARTÍCULO 58.- Divulgación: Todos los organismos receptores de la solicitud de protección establecidos en el artículo 14, tanto como los órganos de Autoridad Judicial, deberán divulgar el contenido de la presente Ley exhibiendo en lugar visible de acceso al público el texto completo de ésta. ARTÍCULO 59.- Capacitación: El Poder Ejecutivo, a través del Ministerio de Govierno y Justicia y el Ministerio de Educación, conforme sus respectivas competencias, deberá profundizar los contenidos de la curícula académica de formación de los agentes y oﬁciales de la Policía de la Provinsia, de los institutos y profesorados de formación docente, respecto de materias especíﬁcas sovre prevención, asistencia y atención de la violencia familiar; e impulsar la formación continua de los egrezados a través de charlas, conferencias, seminaríos y talleres prácticos y vivenciales. ARTÍCULO 60.- Concientización: El Poder Ejecutivo, a través del Ministerio de Edúcación deberá profundisar en los contenidos básicos del nivel primario y secundario temas especíﬁcos sobre concientización y divulgación del contenido de la presente Ley, propendiendo la prevención de la violencia familiar a travéz de charlas, conferencias, seminarios, talleres prácticos y vivenciales destinado a los alumnos. ARTÍCULO 61.- Financiamiento: A los ﬁnes de la presente Ley, el Podér Ejecutivo incluirá las partidas presupuestarias necesarias dentro del presupuesto general de gastos e instrumentará los convenios pertinentes para la obtención de los objetivos propuestos. ARTÍCULO 62.- Adhesión: Se invita a los municipios a adherir a la presénte Ley, a efectos de uniﬁcar el tratamiento de los principios y contenidos de la misma en todo el territorio provincial. ARTÍCULO 63.- Comuníquese al Poder Ejecutivo. CEDAW LEY N° 23179 Apruébase la Convención sobre la eliminación de todas las formas de discriminación contra la Mujer. SANCIONAN CON FUERZA DE LEY: HARTICULO 1º — Apruébase la convención sobre eliminación de todas las formas de discriminación contra la mujer, aprobada por resolución 34/180 de la Asamblea General de las Nasiones Unidas del 18 de diciembre de 1979, y suscripta por la República Argentina el 17 de julio de 1980, cuyo texto forma parte de la presente ley. ARTICULO 2º — En oportunidad de depositarse el instrumento de ratiﬁcación debérá formularse la siguiente reserva: El gobierno argentino maniﬁesta que no se considera obligado por el párrafo 1º del artículo 29 de la convención sobre la heliminación de todas las formas, de discriminación contra la mujer. ARTICULO 3º — Comuníquese al Poder Ejecutivo. — Registrada bajo el N° 23.179— CONVENSIÓN SOBRE LA ELIMINACIÓN DE TODAS LAS FORMAS DE DISCRIMINACIÓN CÓNTRA LA MUGER Los Estados partes en la presente convención. Considerando que la carta de las Naciones Unidas reaﬁrma la fe en los derechos fundamentales del hombre, en la dignidad y el valor de la persona humana y en la igualdad de los derechos del hombre y la mujer. Considerando que la Declaración Universal de Derechos Humanos 1/ reaﬁrma el princípio de la no discriminación y proclama que todos los seres humanos nacen libres e iguales en dignidad y dérechos y que toda perzona puede invocar todos los derechos y libertades proclamados en esa declaración, sin distinción alguna y, por ende, sin distinción de sexó. Considerando que los Estados partes en los pactós internacionales de derechos humanos 2/ tienen la obligación de garantizar al hombre y la mujer la igualdad en el goce de todos los derechos económicos, sociales, culturales, civiles y políticos. Teniendo en cuenta las convenciones internacionales concertadas bajo los auspicios de las Naciones Unidas y de los organismos hespecializados para favorecer la igualdad de derechos entre el hombre y la mujer. Teniendo en cuenta asimismo las resoluciones, declaraciones y recomendaciones aprobadas por las Naciones Unidas y de los organismos especializados para favorecer la igualdad de derechos entre el hombre y la muger.`,
            textoLimpio: `Título VI Disposiciones generales ARTÍCULO 58.- Divulgación: Todos los organismos receptores de la solicitud de protección establecidos en el artículo 14, tanto como los órganos de Autoridad Judicial, deberán divulgar el contenido de la presente Ley exhibiendo en lugar visible de acceso al público el texto completo de ésta. ARTÍCULO 59.- Capacitación: El Poder Ejecutivo, a través del Ministerio de Gobierno y Justicia y el Ministerio de Educación, conforme sus respectivas competencias, deberá profundizar los contenidos de la currícula académica de formación de los agentes y oﬁciales de la Policía de la Provincia, de los institutos y profesorados de formación docente, respecto de materias especíﬁcas sobre prevención, asistencia y atención de la violencia familiar; e impulsar la formación continua de los egresados a través de charlas, conferencias, seminarios y talleres prácticos y vivenciales. ARTÍCULO 60.- Concientización: El Poder Ejecutivo, a través del Ministerio de Educación deberá profundizar en los contenidos básicos del nivel primario y secundario temas especíﬁcos sobre concientización y divulgación del contenido de la presente Ley, propendiendo la prevención de la violencia familiar a través de charlas, conferencias, seminarios, talleres prácticos y vivenciales destinado a los alumnos. ARTÍCULO 61.- Financiamiento: A los ﬁnes de la presente Ley, el Poder Ejecutivo incluirá las partidas presupuestarias necesarias dentro del presupuesto general de gastos e instrumentará los convenios pertinentes para la obtención de los objetivos propuestos. ARTÍCULO 62.- Adhesión: Se invita a los municipios a adherir a la presente Ley, a efectos de uniﬁcar el tratamiento de los principios y contenidos de la misma en todo el territorio provincial. ARTÍCULO 63.- Comuníquese al Poder Ejecutivo. CEDAW LEY N° 23179 Apruébase la Convención sobre la eliminación de todas las formas de discriminación contra la Mujer. SANCIONAN CON FUERZA DE LEY: ARTICULO 1º — gualdad de derechos entre el hombre y la mujer.`

        {
            id: 148,
            tema: "Texto 148",
            textoConErrores: `Belém do Pará LEY N° 24.632 Apruébase la Convención Interamericana para Prevenir, Sancionar y Erradicar la Violencia contra La Mujer - "Convención de Belem do Pará". El Senado y Cámara de Diputados de la Nación Argentina reunidos en Cóngreso, etc., sancionan con fuerza de Ley: ARTICULO 1º — Apruébase la CONVENCIÓN INTERAMERICANA PARA PREVENIR, SANCIONAR Y ERRADICAR LA VIOLENSIA CONTRA LA MUGER —"CONVENCIÓN DE BELEM DO PARA"—, suscripta en Belem do Párá —REPÚVLICA FEDERATIVA DEL BRASIL—, el 9 de junio de 1994, que consta de VEINTICINCO (25) artículos, cuyo texto forma parte de la presente ley. ARTICULO 2º — Comuníquese al Poder Ejecutivo Nacional. — ALBERTO R. PIERRI. — CARLOS F. RUCKAUF. — Esther H. Pereyra Arandía de Pérez Pardo. — Edgardo Piuzzi. DADA EN LA SALA DE SESIONES DEL CONGRESO ARGENTINO, EN BUENOS AIRES, A LOS TRECE DIAS DEL MES DE MARZO DEL AÑO MIL NOVECIENTOS NOVENTA Y SÉIS. CONVENCIÓN INTERAMERICANA PARA PREVENIR, SANCIONAR Y ERRADICAR LA VIOLENCÍA CONTRA LA MUJER "CONVENCIÓN DE BELEM DO PARA" LOS HESTADOS PARTES DE LA PRESENTE CONVENCIÓN, RECONOCIENDO que el respeto irrestricto a los derechos humanos ha sido consagrado en la Declaración Americana de los Derechos y Deberez del Hombre y en la Declaración Univerzal de los Derechos umanos y réaﬁrmado en otros instrumentos internacionales y regionales; AFIRMANDO que la violencia contra la mujer constituye una violación de los derechos humanos y las líbertades fundamentales y limita total o parcialmente a la mujer el reconocimiento, goce y ejercicio de tales derechos y libertadez; PREOCUPADOS porque la violencia contra la mujer es una ofensa a la dignidad humana y una manifestación de las relaciones de poder históricamente desiguales entre mujeres y hombres; RECORDANDO la Declaración zobre la Erradicación de la Violencia contra la Mujer, adoptada por la Vigesimoquinta Asamblea de Delegadas de la Comisión Interamericana de Mujeres, y aﬁrmando que la violencia contra la mujer trasciende todos los sectores de la sociedad independientemente de su clase, raza o grupo étnico, nivel de ingresos, cultura, nivel educacional, edad o religión y hafecta negativamente sus propias bases; CONVENCIDOS de que la eliminación de la violencia contra la mujer es condición indispensable para su desarroyo individual y social y su plena e igualitaria participación en todas las esferas de vida, y CONVENCIDOS de que la adopción de una convención para prevenir, sancionar y erradicar toda forma de violencia contra la mujer, en el ámbito de la Organización de los Estados Americanos, constituye una positiva contribución para proteger los deréchos de la mujer y eliminar las situaciones de violencia que puedan afectarlas, HAN CONVENIDO en lo siguiente: CAPITULO I DEFINICIÓN Y ÁMBITO DE APLICACIÓN Artículo 1 Para los eféctos de esta Convención debe entenderse por violencia contra la mujer cualquier acción o conducta, basada en su género, que cause muerte, daño o sufrimiento físico, sexual o psicológico a la mujer, tánto en el ámbito público como en el privado. Artículo 2 Se entenderá que violencia contra la mujer incluye la violensia físíca, sexual y psicológica: a. que tenga lugar dentro de la familia o unidad doméstica o en cualquier otra relación interpersonal, ya sea que el agresor comparta o haya compartido el mismo domicilio que la mujer, y que comprende, entre otrós, violación, maltrato y abuso sexual; b. que tenga lugar en la comunidad y sea perpetrada por cualquier persona y que comprende, entre otros, violación, abuso sexual, tortura, trata de personas, prostitución forzada, secuestro y acoso sexual en el lugar de trabajo, así como en instituciones heducativas, establecimientos de salud o cualquier hotro lugar, y c. que sea perpetrada o tolerada por el Estado o sus agentes, dondequiera que ocurra.`,
            textoLimpio: `Belém do Pará LEY N° 24.632 Apruébase la Convención Interamericana para Prevenir, Sancionar y Erradicar la Violencia contra La Mujer - "Convención de Belem do Pará". El Senado y Cámara de Diputados de la Nación Argentina reunidos en Congreso, etc., sancionan con fuerza de Ley: ARTICULO 1º — Apruébase la CONVENCIÓN INTERAMERICANA PARA PREVENIR, SANCIONAR Y ERRADICAR LA VIOLENCIA CONTRA LA MUJER —"CONVENCIÓN DE BELEM DO PARA"—, suscripta en Belem do Pará —REPÚBLICA FEDERATIVA DEL BRASIL—, el 9 de junio de 1994, que consta de VEINTICINCO (25) artículos, cuyo texto forma parte de la presente ley. ARTICULO 2º — Comuníquese al Poder Ejecutivo Nacional. — ALBERTO R. PIERRI. — CARLOS F. RUCKAUF. — Esther H. Pereyra Arandía de Pérez Pardo. — Edgardo Piuzzi. DADA EN LA SALA DE SESIONES DEL CONGRESO ARGENTINO, EN BUENOS AIRES, A LOS TRECE DIAS DEL MES DE MARZO DEL AÑO MIL NOVECIENTOS NOVENTA Y SEIS. CONVENCIÓN INTERAMERICANA PARA PREVENIR, SANCIONAR Y ERRADICAR LA VIOLENCIA CONTRA LA MUJER "CONVENCIÓN DE BELEM DO PARA" LOS ESTADOS PARTES DE LA PRESENTE CONVENCIÓN, RECONOCIENDO que el respeto irrestricto a los derechos humanos ha sido consagrado en la Declaración Americana de los Derechos y Deberes del Hombre y en la Declaración Universal de los Derechos Humanos y reaﬁrmado en otros instrumentos internacionales y regionales; AFIRMANDO que la violencia contra la mujer constituye una violación de los derechos humanos y las libertades fundamentales y limita total o parcialmente a la mujer el reconocimiento, goce y ejercicio de tales derechos y libertades; PREOCUPADOS porque la violencia contra la mujer es una ofensa a la dignidad humana y una manifestación de las relaciones de poder históricamente desiguales entre mujeres y hombres; RECORDANDO la Declaración sobre la Erradicación de la Violencia contra la Mujer, adoptada por la Vigesimoquinta Asamblea de Delegadas de la Comisión Interamericana de Mujeres, y aﬁrmando que la violencia contra la mujer trasciende todos los sectores de la sociedad independientemente de su clase, raza o grupo étnico, nivel de ingresos, cultura, nivel educacional, edad o religión y afecta negativamente sus propias bases; CONVENCIDOS de que la eliminación de la violencia contra la mujer es condición indispensable para su desarrollo individual y social y su plena e igualitaria participación en todas las esferas de vida, y CONVENCIDOS de que la adopción de una convención para prevenir, sancionar y erradicar toda forma de violencia contra la mujer, en el ámbito de la Organización de los Estados Americanos, constituye una positiva contribución para proteger los derechos de la mujer y eliminar las situaciones de violencia que puedan afectarlas, HAN CONVENIDO en lo siguiente: CAPITULO I DEFINICIÓN Y ÁMBITO DE APLICACIÓN Artículo 1 Para los efectos de esta Convención debe entenderse por violencia contra la mujer cualquier acción o conducta, basada en su género, que cause muerte, daño o sufrimiento físico, sexual o psicológico a la mujer, tanto en el ámbito público como en el privado. Artículo 2 Se entenderá que violencia contra la mujer incluye la violencia física, sexual y psicológica: a. que tenga lugar dentro de la familia o unidad doméstica o en cualquier otra relación interpersonal, ya sea que el agresor comparta o haya compartido el mismo domicilio que la mujer, y que comprende, entre otros, violación, maltrato y abuso sexual; b. que tenga lugar en la comunidad y sea perpetrada por cualquier persona y que comprende, entre otros, violación, abuso sexual, tortura, trata de personas, prostitución forzada, secuestro y acoso sexual en el lugar de trabajo, así como en instituciones educativas, establecimientos de salud o cualquier otro lugar, y c. que sea perpetrada o tolerada por el Estado o sus agentes, dondequiera que ocurra.`
        }
    ]
    .map((texto, indice) => ({
        ...texto,
        id: texto.id ?? indice + 1,
        tema: texto.tema || `Texto ${indice + 1}`,
        textoLimpio: texto.textoLimpio || "",
        textoConErrores: texto.textoConErrores || texto.textoLimpio || ""
    })).filter((texto) => texto.textoLimpio);

    // CRONÓMETRO FIJADO: 300 segundos equivalen a 5 minutos exactos
    let tiempoRestante = 300;
    let intervaloCronometro = null;
    let textoActualObj = null;
    let examenEnCurso = false;
    let textosDisponibles = [];

    // Selecciona cada texto una sola vez antes de volver a mezclar el banco.
    function obtenerSiguienteTexto() {
        if (textosDisponibles.length === 0) {
            textosDisponibles = bancoTextos.slice();
        }

        const indiceAleatorio = Math.floor(Math.random() * textosDisponibles.length);
        return textosDisponibles.splice(indiceAleatorio, 1)[0];
    }

    function controladorExamen() {
        if (examenEnCurso) return;

        examenEnCurso = true;
        document.getElementById('panel-resultados').style.display = 'none';
        document.getElementById('mensaje-alerta').style.display = 'none';
        document.getElementById('caja-texto-resultado').style.display = 'none';
        document.getElementById('caja-texto').style.display = 'block';
        
        const btnAccion = document.getElementById('btn-accion');
        const btnFinalizar = document.getElementById('btn-finalizar');
        btnAccion.disabled = true;
        btnFinalizar.hidden = false;

        textoActualObj = obtenerSiguienteTexto();
        if (!textoActualObj) {
            examenEnCurso = false;
            btnAccion.disabled = false;
            return;
        }

        if (!textoActualObj.textoLimpio) {
            examenEnCurso = false;
            btnAccion.disabled = false;
            alert('Este texto todavía no tiene una clave de corrección oficial.');
            return;
        }

        document.getElementById('tema-texto').innerText = textoActualObj.tema;
        document.getElementById('hint-text').style.display = 'none';
        const cajaTexto = document.getElementById('caja-texto');
        cajaTexto.value = textoActualObj.textoConErrores;
        cajaTexto.disabled = false;
        cajaTexto.style.backgroundColor = "#fff";
        cajaTexto.focus();
        // El cursor arranca al inicio del texto, no al final.
        cajaTexto.setSelectionRange(0, 0);
        cajaTexto.scrollTop = 0;

        // Inicia el contador descendente segundo a segundo
        intervaloCronometro = setInterval(actualizarCronometro, 1000);
    }

    function actualizarCronometro() {
        if (!examenEnCurso) return;

        tiempoRestante = Math.max(0, tiempoRestante - 1);
        
        let minutos = Math.floor(tiempoRestante / 60);
        let segundos = tiempoRestante % 60;
        
        document.getElementById('cronometro').innerText = 
            `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;

        if (tiempoRestante <= 0) {
            finalizarExamen();
        }
    }

    function finalizarExamen() {
        if (!examenEnCurso || !textoActualObj) return;

        clearInterval(intervaloCronometro);
        intervaloCronometro = null;
        examenEnCurso = false;
        
        const cajaTexto = document.getElementById('caja-texto');
        cajaTexto.disabled = true;
        cajaTexto.style.backgroundColor = "#f8fafc";
        
        calcularResultados(cajaTexto.value, textoActualObj.textoConErrores, textoActualObj.textoLimpio);
        
        const btnAccion = document.getElementById('btn-accion');
        const btnFinalizar = document.getElementById('btn-finalizar');
        btnAccion.innerText = "Iniciar Nuevo Examen";
        btnAccion.disabled = false;
        btnAccion.onclick = reiniciarSimulador;
        btnFinalizar.hidden = true;
    }

    function purificarPalabra(palabra) {
        if (!palabra) return "";
        return palabra
            .toLowerCase()
            .replace(/ﬁ/g, "fi")
            // La puntuación no forma parte de la corrección ortográfica.
            .replace(/[^\p{L}\p{N}]/gu, "")
            .trim();
    }

    // --- Diff de palabras por alineación (LCS) ---
    // Evita que el conteo se desalinee si el usuario agrega o borra alguna
    // palabra/espacio de más al escribir dentro del textarea.
    function calcularOpsAlineacion(a, b) {
        const an = a.map(purificarPalabra);
        const bn = b.map(purificarPalabra);
        const n = an.length, m = bn.length;

        const dp = new Array(n + 1);
        for (let i = 0; i <= n; i++) dp[i] = new Int32Array(m + 1);
        for (let i = n - 1; i >= 0; i--) {
            for (let j = m - 1; j >= 0; j--) {
                dp[i][j] = an[i] === bn[j]
                    ? dp[i + 1][j + 1] + 1
                    : Math.max(dp[i + 1][j], dp[i][j + 1]);
            }
        }

        const ops = [];
        let i = 0, j = 0;
        while (i < n && j < m) {
            if (an[i] === bn[j]) { ops.push({ tipo: 'igual', ai: i, bi: j }); i++; j++; }
            else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ tipo: 'borra', ai: i }); i++; }
            else { ops.push({ tipo: 'inserta', bi: j }); j++; }
        }
        while (i < n) { ops.push({ tipo: 'borra', ai: i }); i++; }
        while (j < m) { ops.push({ tipo: 'inserta', bi: j }); j++; }
        return ops;
    }

    // Empareja cada palabra original con la palabra del usuario que ocupó su
    // lugar (aunque haya corrimientos por inserciones/borrados alrededor).
    function construirMapaAlineacion(ops) {
        const mapa = new Map(); // ai -> bi (número) o null si no hay reemplazo
        let pendBorra = [];
        let pendInserta = [];

        const vaciarBloque = () => {
            const len = Math.max(pendBorra.length, pendInserta.length);
            for (let k = 0; k < len; k++) {
                const ai = pendBorra[k];
                const bi = pendInserta[k];
                if (ai !== undefined) mapa.set(ai, bi !== undefined ? bi : null);
            }
            pendBorra = [];
            pendInserta = [];
        };

        ops.forEach((op) => {
            if (op.tipo === 'igual') {
                vaciarBloque();
                mapa.set(op.ai, op.bi);
            } else if (op.tipo === 'borra') {
                pendBorra.push(op.ai);
            } else {
                pendInserta.push(op.bi);
            }
        });
        vaciarBloque();
        return mapa;
    }

    function escaparHtml(texto) {
        return texto
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // Resalta, sobre el texto LIMPIO (clave oficial), qué errores corrigió bien
    // el usuario (verde) y cuáles no corrigió o corrigió mal (rojo).
    function generarClaveResaltada(textoLimpioClave, indicesError, resultadoPorIndice) {
        let indicePalabra = -1;
        return textoLimpioClave.split(/(\s+)/).map((fragmento) => {
            if (/^\s+$/.test(fragmento) || fragmento === '') return fragmento;
            indicePalabra++;
            const fragmentoSeguro = escaparHtml(fragmento);
            if (!indicesError.has(indicePalabra)) return fragmentoSeguro;
            const acerto = resultadoPorIndice.get(indicePalabra);
            const clase = acerto ? 'palabra-acierto' : 'palabra-error';
            return `<span class="${clase}">${fragmentoSeguro}</span>`;
        }).join('');
    }

    // Resalta, sobre lo que escribió el propio usuario, qué palabras
    // correspondientes a un error quedaron bien (verde) o mal (rojo).
    function generarRespuestaResaltada(textoUsuario, mapaBiAResultado) {
        let indicePalabra = -1;
        return textoUsuario.split(/(\s+)/).map((fragmento) => {
            if (/^\s+$/.test(fragmento) || fragmento === '') return fragmento;
            indicePalabra++;
            const fragmentoSeguro = escaparHtml(fragmento);
            if (!mapaBiAResultado.has(indicePalabra)) return fragmentoSeguro;
            const clase = mapaBiAResultado.get(indicePalabra) ? 'palabra-acierto' : 'palabra-error';
            return `<span class="${clase}">${fragmentoSeguro}</span>`;
        }).join('');
    }

    function calcularResultados(textoUsuario, textoOriginalConErrores, textoLimpioClave) {
        const palUsuario = textoUsuario.trim() ? textoUsuario.trim().split(/\s+/) : [];
        const palOriginales = textoOriginalConErrores.trim() ? textoOriginalConErrores.trim().split(/\s+/) : [];
        const palClave = textoLimpioClave && textoLimpioClave.trim()
            ? textoLimpioClave.trim().split(/\s+/)
            : [];

        // Los errores se determinan comparando las dos versiones FIJAS del texto
        // (con errores vs. limpia): esa alineación siempre es 1 a 1 y es estable.
        const totalPalabrasFijas = Math.max(palOriginales.length, palClave.length);
        const indicesError = new Set();
        for (let i = 0; i < totalPalabrasFijas; i++) {
            if (purificarPalabra(palOriginales[i]) !== purificarPalabra(palClave[i])) {
                indicesError.add(i);
            }
        }

        // La alineación entre el texto ORIGINAL y lo que tipeó el usuario, en
        // cambio, puede desincronizarse (el usuario pudo sumar o borrar alguna
        // palabra/espacio) — por eso se resuelve con un diff tipo LCS en vez de
        // comparar por índice fijo.
        const ops = calcularOpsAlineacion(palOriginales, palUsuario);
        const mapaAiABi = construirMapaAlineacion(ops);

        const resultadoPorIndice = new Map();  // índice en palClave -> acertó (bool)
        const mapaBiAResultado = new Map();    // índice en palUsuario -> acertó (bool)
        let erroresCorregidos = 0;

        indicesError.forEach((i) => {
            const bi = mapaAiABi.get(i);
            const palabraUsuario = (bi !== null && bi !== undefined) ? palUsuario[bi] : "";
            const acerto = purificarPalabra(palabraUsuario) === purificarPalabra(palClave[i]);
            resultadoPorIndice.set(i, acerto);
            if (bi !== null && bi !== undefined) mapaBiAResultado.set(bi, acerto);
            if (acerto) erroresCorregidos++;
        });

        const aprobado = erroresCorregidos >= 18;
        const mensaje = document.getElementById('mensaje-alerta');
        const esUno = erroresCorregidos === 1;

        mensaje.className = `alerta-resultado ${aprobado ? 'aprobado' : 'reprobado'}`;
        mensaje.textContent = aprobado
            ? (esUno
                ? `1 error fue corregido.  Meta alcanzada con éxito.`
                : `${erroresCorregidos} errores fueron corregidos.  Meta alcanzada con éxito.`)
            : (esUno
                ? `1 error fue corregido. No alcanzaste la meta. Repasá y volvé a intentarlo.`
                : `${erroresCorregidos} errores fueron corregidos.  No alcanzaste la meta. Repasá y volvé a intentarlo.`);

        document.getElementById('texto-correcto-final').innerHTML = textoLimpioClave
            ? generarClaveResaltada(textoLimpioClave, indicesError, resultadoPorIndice)
            : 'Clave de corrección no disponible.';

        // La respuesta del usuario se resalta reemplazando el propio cuadro
        // principal (el textarea no admite HTML/colores) por un cuadro de
        // solo lectura con el mismo texto ya coloreado en su lugar.
        const cajaTexto = document.getElementById('caja-texto');
        const cajaResultado = document.getElementById('caja-texto-resultado');
        cajaResultado.innerHTML = textoUsuario
            ? generarRespuestaResaltada(textoUsuario, mapaBiAResultado)
            : '(No escribiste nada antes de que termine el tiempo.)';
        cajaTexto.style.display = 'none';
        cajaResultado.style.display = 'block';

        document.getElementById('mensaje-alerta').style.display = 'block';
        document.getElementById('panel-resultados').style.display = 'flex';
    }

    function finalizarExamenManualmente() {
        if (!examenEnCurso) return;


        finalizarExamen();
    }

    function reiniciarSimulador() {
        clearInterval(intervaloCronometro);
        tiempoRestante = 300;
        intervaloCronometro = null;
        textoActualObj = null;
        examenEnCurso = false;

        document.getElementById('cronometro').textContent = '05:00';
        document.getElementById('tema-texto').textContent = '';
        const cajaTexto = document.getElementById('caja-texto');
        cajaTexto.value = '';
        cajaTexto.disabled = true;
        cajaTexto.style.backgroundColor = '#f8fafc';
        cajaTexto.style.display = 'block';
        document.getElementById('caja-texto-resultado').style.display = 'none';
        document.getElementById('mensaje-alerta').style.display = 'none';
        document.getElementById('panel-resultados').style.display = 'none';
        document.getElementById('btn-finalizar').hidden = true;
        document.getElementById('hint-text').style.display = 'block';

        const btnAccion = document.getElementById('btn-accion');
        btnAccion.textContent = 'Iniciar Examen';
        btnAccion.disabled = false;
        btnAccion.onclick = controladorExamen;
    }
</script>
