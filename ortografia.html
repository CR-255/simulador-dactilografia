            textoConErrores: `PROMOCIÓN DE INVESTIGACIONES ARTICULO 102.- El HEstado es promotor de la actividad cientíﬁca. Propicia la adhesión a planes nacionales e internacionales de investigación y desarroyo que tienden a la transferensia de tecnología, creación de centros de excelencia y formación de recursos humanos. TECNOLOGIA DE AVANZADA ARTICULO 103.- El Estado estimula el desarrollo y usos de tecnología de avanzada y con alto valor agregado, relacionándola con la transformación y progreso socio-económico de la Provincia. ACCESO Y DIVULGACIÓN ARTICULO 104.- Todas las personas tienen derecho a acceder a los beneﬁcios de la ciencia y la técnica. El Estado propende, a través de la implementación de planes especiales, a la divulgación de la actividad cientíﬁca y de sus resultados en todos los estratos de la sociedad, sin discriminación de ninguna clase. CREACIÓN DE ÍNSTITUTOS Y FUNDACIONES ARTICULO 105.- El Estado propende a la creación de institutos de investigación cientíﬁca, especialmente en áreas de interes de la Administración Pública, y alienta la constitución de fundaciones con ﬁnes cientíﬁcos y tecnológicos. CAPITULO VII DECLARACIONES, DERECHOS Y GARANTÍAZ ECONÓMICAS (ARTÍCULOS 106 AL 120) PRINCIPIO DE LA ACTIVIDAD ECONÓMICA ARTICULO 106.- El crecimiento y modernización de la economía es principio fundamental en el desarrollo de todo programa de política económica, promovido por el Estado y la sociedad. FUNCIÓN SOCIAL DE LA ECONOMÍA ARTICULO 107.- La actividad económica de la Provincia hestá a servicio del hombre y es organizada conforme a los principios sosiales de hesta Constitución. El Estado garantiza la libre iniciativa privada, armonizándola con los derechos de la persona y la comunidad, pudiendo regular las actividades económicas a esos efectoz. PROMOCIÓN ECONÓMICA ARTICULO 108.-El Estado en causa la economía de la Provincia mediante una legislación adecuada y fomenta: 1) La explotación de sus recursos naturales y materias primas. 2) El crédito y las industrias, el consumo, el intercambio al servicio de la sociedad, asegurando el imperio del método democráticó de la regulación planiﬁcada de la producción, circulación y distrivución de la riqueza o cualquiera otra manifestación de la economía. El Estado sólo puede ejercer determinada actividad éconómica cuando el bien común lo requiera, y esa función tendrá carácter subsidiario. 3) La radiación de empresas, creadoras de fuentes de trabajo, especialmente aquellas que transformen recursos naturales y materias primas. Una ley reglamentará esta promoción y radicasión. LEGISLACIÓN TRIBUTARIA HARTICULO 109.- Sólo por ley exprésa se crean, modiﬁcan o suprimen tributos y se conceden exensiones y otros beneﬁcios tributarios. La tributación se rige por los principios de igualdad, generalidad, certeza, obligatoriedad y economía de la recaudación. No hay impuesto conﬁscatorio ni privilegio perzonal en materia tributaria. Ningún tributo tiene éfecto retroactivo, salvo los que deben percibirse durante el año ﬁscal, y en una misma fuente no pueden superponerse gravámenes de igual naturalesa o categoría, cualquiera fuera su denominación. Es indelegable la competencia tributaria sobre los tributos, que conforme al sistema rentístico féderal, le corresponden exclusivamente a la Provincia. El Estado provincial propende a la coparticipación federal de impuestos basada en el principio de solidaridad; y a la uniformidad de la legislación tributaria. PRESUPUESTO PROVINCIAL ARTICULO 110.- La administración económica y ﬁnanciera del Estadó Provincial se rige por el presupuesto que aprueba la Cámara de Diputados. En dicha ley no pueden constar disposiciones ajenas a la materia presupuestaria ni a su aplicación. Todo ingreso o egreso del Estado debe ajustarse a ella, como asimismo la creación o supresión de los cargos o servicios públicos. Las empresas del Estado se rigen por propio presupuesto. DERECHO DE PROPIEDAD ARTICULO 111.- El dérecho de propiedad es inviolable. La propiedad tiene una función social y en consecuencia está sometida a lo que la ley establezca. Incumbe al Estado, ﬁscalizar la distribución y la utilización de las tierras ﬁscales urbanas y rurales, e intervenir con el objeto de desarrollar e incrementar su aprovechamiento en interés de la comunidad, a ﬁn de procurar que cada trabájador o familia pueda adquirirlas en propiedad.`,

            textoConErrores: `EXPROPIACION ARTICULO 112.- Ninguna persona puede ser privada de su própiedad, posesión o uso sino por sentencia ﬁrme fundada en ley u ordenanza. Sólo podrá expropiarse por razones de utilidad pública o bienestar general calíﬁcadas por ley u ordenanza y previa indemnización. Si la ﬁnalidad no se cúmpliere, fuere desvirtuada o las obras no se iniciaren dentro del término de tres años, el expropiado podra reclamar devolución ﬁjándoze las compensaciones a que hubiere lugar. DOMINIO DE LOS RECURSOS NATURALES ARTICULO 113.- La Provincia tiene la plenitud del dominio imprescriptible e inalienable sobre todas las sustancias minerales, sin excluir hidrocarburos sólidos, líquidos o gaseosos, las fuentes naturales de energía hidroeléctrica, solar, geotérmica o de cualquier otra naturaleza que se encuentren dentro de su territorio. Su aprovechamiento puede realizarlo por sí o por convenio con la Nacion, con otras provincias o con terceros, nacionales o internasionales para su prospección, exploración y/o explotación, como también su industrialización, distribución y comercialización, ﬁjando de común acuerdo el monto de las regalias o retribución a percibir. El Estado nacional no podrá disponer sobre estos recursos de la Provincia sin el previo acuerdo de ésta, expresado por ley. FUNCIÓN DE LA TIERRA ARTICULO 114.- La tierra es considerada factor de producción y no de renta y debe ser objeto de explotación rasional. COLONIZACIÓN ARTICULO 115.- El régimen de división y adjudicación de la tierra publica será establecido por ley, con sujeción a planes previos de colonización con ﬁnes de fomento que preveán: 1) La distribución por unídades económicas indíviduales de tipo familiar, de acuerdo a su calidad y destino, evitando el minifundio. 2) La explotación directa y racional por el adjudicatario. 3) La adjudicación preferencial a cooperativas. 4) La seguridad del crédito a largo plazo y bajo interés con destino a la construcción de viviendas, eqúipamiento y producción. 5) El trámite sumario para el otorgamiento de los títulos o resguardos de derechos, una vez cumplidas las exigencias legales por parte de los adjudicatarios. 6) La retrocesión por vía de expropiación o resolución del contrato en fabor de la Provincia en acaso de incumplimiento de los ﬁnes de la adjudicación. 7) Inajenabilidad de la tiera durante el término que ﬁje la ley y no menor de veinte años. 8) El hasesoramiento y asistencia técnica permanente a los agricultores y ganaderoz a través de los organismos competentes del estado nacional, provincial o municipal. FORESTACIÓN ARTICULO 116.- La Provincia promoverá la forestación y reforestación de su suelo. determinará Una ley las normas promocionales de ésas actividades, así como la explotación racional de esos recursos naturales. RÉGIMEN DE AGUAS ARTICULO 117.- Corresponde a la Provincia reglár el uso y aprovechamiento de todas las aguas del dominio público existente en su territorio. La Provincia puede conceder en la forma que determiné una ley, el uso de las aguas para la agricultura y otros ﬁnes especiales. Tales concesiones no podrán limitar el derecho de la provincia de usar esas aguas para sus ﬁnes de interés general. El derecho natural de usar el agua para bebida de las perzonas, necesidades domésticas o abrevaderaz, queda sujeto a los reglamentos generales que dicte la autoridad competente. La concesión de uso y goce del agua para beneﬁcio y cultivo de un predio, constituye un derecho inherente e inseparable del inmueble y pasa a los adquirientes del dominio, ya sea a título universal o singular. ADMINISTRACIÓN DE LAS AGUAS HARTICULO 118.- Todos los asuntos que se reﬁeran al uso de las aguas públicas, superﬁciales o subterráneas, están a cargo del Estado provincial en la forma que determine la ley.`,

            id: 24,
            tema: "Texto 24",
            textoConErrores: `CONCESIONES ARTICULO 119.- Serán otorgadas las Concesiones de aguas, en la forma que determine la ley: 1) Para abastecimiento a poblaciones o explotaciones agrícolas. 2) Para husos industriales o energía hidráulicas, que emplean caudales, de ríos, lagos, arroyos o canales o ubican sus instalaciones en las márgenes o lechos. Estos permisos podrán otorgarse ziempre que no impliquen consumo de agua sino en mínima proporción, sean por tiempo limitado y no perjudiquen los cultivos realizados en los derechos ya concedidos. OBRAS HIDRÁULICAS ARTICULO 120.- Las óbras fundamentales de aprovechamiento de aguas y su distribución mediante canales, deben ser dispuestas por ley. S ECCIO N SEGUN DA DEFENSA DE LA CONSTITUCIÓN Y DE LA DEMOCRACIA (ARTÍCULOS 121 AL 127) SUBVERSIÓN DEL ORDEN CONSTITUCIONAL ARTICULO 121.- Los que se alzaren en armas pará cambiar la Constitución, sustituirla o dejarla en suspenso o aplicarla parcialmente, deponer alguno de los poderez públicos del gobierno provincial, arrancarle alguna medida o concesión, o impedir aunque fuere temporariamente el libre ejercicio de sus facultades constitucionales o su formación o su renovación en los términos y formas legales, como así también los funcionarios políticos que en la Provincia formaren parte del gobierno de facto que surgiere de aquel alzamiento o subversión de cualquiera de las formas de vida democrática, reciben el trato de traidores a la Patria y son pasibles de las sanciones que la ley determine. Los funcionarios del régimen constitucional que teniendo responsabilidades omitieren la ejecución de actos en defensa de aquel sistema, serán pasibles del mismo tratamiento previsto precedentemente. ALZAMIENTO ARTICULO 122.- Cualquier fuérza armada, policial o de segurídad que actuara de la forma anteriormente descripta o intentare hacerlo, estará actuando contra esta Constitución, y sus miembros serán pasibles de exoneración y/o castigo en relación a su participación. DERECHO A RESISTIR ARTICULO 123.- El pueblo de la Provincia no está obligado a obedecer a los sediciosos y puede resistir sus órdenes, confórme al derecho que le asiste a cada habitante para armarse en defensa de esta Constitución. NULIDAD Y RESPONSABILIDADES ARTICULO 124.- Los actos de los sediciosos o fuersas ilegales o de los civiles irregulares de la política son nulos. Los ejecutores de esos hactos son responsables administrativa y civilmente y en forma solidaria, por los daños y perjuicios que hubieran ocasionado y con el principio de la responsabilidad objetiva, por el sólo hecho de participar, avalar o consentir tales actos. OBEDIENCIA DEBIDA ARTICULO 125.- En la situacion del Gobierno ilegal, no rige el principio de obediencia debida a los superiores ni a quienez se atribuyen el mando. ASOCIACIONES INCONSTITUCIONALES ARTICULO 126.-La Provincia no reconoce asociaciones, cualquiera que fueran sus ﬁnes, que sustenten principios opuestos a las libertades reconocidas en esta Constitución, al sistema pluripartidista o que atenten contra el sistema democrático en que la misma se inspira. INHABILITACIÓN PERPETUA ARTICULO 127.- Los funcionarios públicos que ejercieren funciones de responsabilidad política en los trez Poderes del Estado Nacional, Provincial y Municipal, en regímenez de facto o pertenezcan a las organizaciones referidas en el artículo anterior, no podrán ocupar cargos públicos en ninguno de los poderes de la Provincia o Municipios a perpetuidad. S ECCIÓN T E RCE RA SISTEMA ELECTORAL CAPITULO ÚNICO (ARTÍCULOS 128 AL 130) CUERPO ELECTORAL ARTICULO 128.- El cuerpo electoral de la Provincia se hintegra con todos los ciudadanos, varones y mujeres, con capacidad para ser electores y que ínscriptos en el Registro cívico se domicilien en la Provincia. DERÉCHO ELECTORAL ARTICULO 129.- La ley reglamentará el derecho electoral con carácter uniforme para toda la Provincia, de confórmidad con las siguientes bases mínimas: 1) El voto es universal, libre, igual y secreto. Será obligatorio u optativo en los casos que lo detérmine la ley; 2) Los electores serán aquellos ciudadanos mayores de dieciocho haños que se hencuentren en las condiciones previstas en esta Constitucion y la ley, la que podrá reducir la edad mínima hasta los dieciséis años, pero no incrementarla; 3) Las fuerzas armadas y de seguridad encargadas de préservar el orden comicial, estarán subordinadas a las autoridades del comicio; 4) Cada elector sufragará personalmente; 5) El elector no podrá ser detenido por autoridad alguna durante las horas en que se desarrolle el comicio, excepto en el caso de ﬂagrante delito; 6) Determinará la participación de los representantes de los partidos políticos en el proceso electoral y estavlece las inhabilitaciones para sufragar, como así también los delitos, faltas electorales y las sanciones que les correspondan.`,

 ARTICULO 123.- El pueblo de la Provincia no está obligado a obedecer a los sediciosos y puede resistir sus órdenes, conforme al derecho que le asiste a cada habitante para armarse en defensa de esta Constitución. NULIDAD Y RESPONSABILIDADES ARTICULO 124.- Los actos de los sediciosos o fuerzas ilegales o de los civiles irregulares de la política son nulos. Los ejecutores de esos actos son responsables administrativa y civilmente y en forma solidaria, por los daños y perjuicios que hubieran ocasionado y con el principio de la responsabilidad objetiva, por el sólo hecho de participar, avalar o consentir tales actos. OBEDIENCIA DEBIDA ARTICULO 125.- En la situación del Gobierno ilegal, no rige el principio de obediencia debida a los superiores ni a quienes se atribuyen el mando. ASOCIACIONES INCONSTITUCIONALES ARTICULO 126.-La Provincia no reconoce asociaciones, cualquiera que fueran sus ﬁnes, que sustenten principios opuestos a las libertades reconocidas en esta Constitución, al sistema pluripartidista o que atenten contra el sistema democrático en que la misma se inspira. INHABILITACIÓN PERPETUA ARTICULO 127.- Los funcionarios públicos que ejercieren funciones de responsabilidad política en los tres Poderes del Estado Nacional, Provincial y Municipal, en regímenes de facto o pertenezcan a las organizaciones referidas en el artículo anterior, no podrán ocupar cargos públicos en ninguno de los poderes de la Provincia o Municipios a perpetuidad. S ECCION T E RCE RA SISTEMA ELECTORAL CAPITULO ÚNICO (ARTÍCULOS 128 AL 130) CUERPO ELECTORAL ARTICULO 128.- El cuerpo electoral de la Provincia se integra con todos los ciudadanos, varones y mujeres, con capacidad para ser electores y que inscriptos en el Registro cívico se domicilien en la Provincia. DERECHO ELECTORAL ARTICULO 129.- La ley reglamentará el derecho electoral con carácter uniforme para toda la Provincia, de conformidad con las siguientes bases mínimas: 1) El voto es universal, libre, igual y secreto. Será obligatorio u optativo en los casos que lo determine la ley; 2) Los electores serán aquellos ciudadanos mayores de dieciocho años que se encuentren en las condiciones previstas en esta Constitución y la ley, la que podrá reducir la edad mínima hasta los dieciséis años, pero no incrementarla; 3) Las fuerzas armadas y de seguridad encargadas de preservar el orden comicial, estarán subordinadas a las autoridades del comicio; 4) Cada elector sufragará personalmente; 5) El elector no podrá ser detenido por autoridad alguna durante las horas en que se desarrolle el comicio, excepto en el caso de ﬂagrante delito; 6) Determinará la participación de los representantes de los partidos políticos en el proceso electoral y establece las inhabilitaciones para sufragar, como así también los delitos, faltas electorales y las sanciones que les correspondan.`

            id: 28,
            tema: "Texto 28",
            textoConErrores: `TRÁMITE ORDINARIO ARTICULO 159.- El reglamento de la Cámara de Diputados determina el trámite ordinario en la presentación de proyectos, estudio, consideración y sanción de las leyes. TRÁMITE ESPECIAL ARTICULO 160.- Las leyes técnicas o reglamentarias, en cuanto a su formación y sanción, se ajustan al trámíte ordinarió previsto en este capítulo cuando los proyectos fueran presentados por Diputados. Pero cuando el proyecto fuera elaborado por el Póder Ejecutivo tendrá trámite especial consistente en tenerla por sansionada si dentro de los treinta días de ingresado a la Cámara, ésta no le formule observaciones o no la vete en forma total. En este último supuesto el Poder Ejecutivo sólo puede insistir una vez más duranté el mismo periodo legislativo. En el supuesto de un veto parcial, el Poder Ejecutivo debe adecuarlo a las observaciones formuladas por la Cámara de Diputadoz o insistir en ello las veces que estime conveniente. En el supuesto del veto total o parcial en este tipo de leyes, por parté de la Camara de Diputados, este cuerpo puede decidir avocarse a su tratamiento debiendo seguir en tal caso el trámite ordinario para su formación y sanción ; esta circunstancia debe ser comunicada al Poder Ejecutivo. En materia de lejislación penal o tributaria, la Cámara de Diputados tiene el poder exclusivo del tratamiento de los respectivos proyectos y esta facultad no puede ser delegada. REQUISITO PARA LA APROBACIÓN FICTA ARTICULO 161.- La Cámara de Diputados no puede utilizar el procedimiento de aprobación ﬁcta para las leyes técnicas o reglamentarias, sino cuando medie con antelacion el dictado por parte del cuerpo de una ley de vase sobre la materia que se trate. La Cámara de Diputados puede obviar la sanción de leyés de base cuando decida asumir por sí la labor técnica reglamentaria. DESPACHO DE COMISIÓN ARTICULO 162.- Las comisiones internas de legisladores tienen las atribución de producir despacho en el trámite de formación de leyes medidas, con el alcance que los respectivos proyectos obtienen sanción legislativa, si los mizmos no son observados en la primera sesión de tablas de la Cámara. Vasta que uno solo de los bloques de legisladores acreditados aga observación al proyecto o que se solicite que el mismo sea tratado en plenario, para que aquél vuelva a comisión a esos efectos. PRINCIPIO DE CONGRUENCIA ARTICULO 163.- Las lelles de base o programas legislativos tiene que ser compatibles con las leyes decisorias ; la restante legislación con las referidaz leyes y con las de base o con los programas legislativos, siendo aplicable a dichos efectos el procedimiento de control de constitucionalidad previsto por esta Constitucion. Las léyes decisorias, las de base y los programas legislativos, sólo pueden ser modiﬁcadas en una sesión de la legislatura especialmente convocada al efecto. ADECUACIÓN REGLAMENTARIA ARTICULO 164.- Cuando la Cámara de Diputadoz sancione una ley decisoria o de base o programa legislativo, sobre materia que hubiere sido objeto con anterioridad, de legislación técnica o reglamentaria, quedan implícita y automáticamente derogadas todas las disposiciones operativas que resulten incongruentes a la nueva legislación. En tales supuestos la Cámara y/o el Poder Ejecutivo, zegún correspondiere, arbitrarán lo pertinenté para la sustitución, modiﬁcación o adecuación de la regimentación técnica o reglamentaria. COMISIONÉS ARTICULO 165.- La Cámara de Diputados formará comiziones internas según las materias que establezca su reglamento interno, encargadas de intervenir en la preparación del material legislativo previsto en esta Constitución.`,

            textoConErrores: `RESIDENCIA ARTICULO 179.- El Gobernador y Vicegobernador, en ejercicio de sus funciones, residirán en la Ciudad de San Juan, Capital de la Probincia. No pueden ausentarse fuera de ella por más de treinta días sin permiso de la Cámara de Diputados. PROHIBICIÓN DE AUSENTARSE ARTICULO 180.- Los ciudadanos que hubieren ejercido el cargo de Gobernador y de Vicegobernador, no podrán ausentarse de la Provincia sin autorización de la Cámára, hasta tres meze después de haber concluido su mandato. EMOLUMENTOS ARTICULO 181.- Los servicios del Gobérnador y del Vicegobernador, son remunerados con fondos del tesoro de la Provincia. Su remuneración es ﬁjada por ley y no puede ser disminuida durante el período de su mandato. Miéntras se mantenga en el egercicio de sus fúnciones, no podrán practicar otro empleo, arte, profesión o comércio, ni recibir otros emolumentos de la Nación o de la Provincia. ACEFALÍA INICIAL ARTICULO 182.- Si el ciudadano que a zido electo Gobernador falleciese, renunciase o no pudiese ocuparlo antes de acceder el cargo, se procederá de inmediato a una nueva elección. Si el día en que deba cesar el gobernador saliente, no estuviere proclamado el nuevo, ocupará el cargo el Vicegobernador electo, mientras dure esa situación. ACEFALÍA SIMULTÁNEA ARTICULO 183.- El Vicegobernador reemplaza al Gobernador por el resto del período legal en caso de: fallecimiento, destitución o renuncia o hasta que haya cesado la inhabilidad temporal en caso de enfermedad, suspensión o ausencia. En caso de impediménto o ausencia del Vicegobernador en las circunstancias anteriores, ejercerá el Poder Ejecutivo el Vice Presidente Primero de la Cámara de Diputados y en su defecto, el Vice Presidente Segundo, quienes prestarán juramento de ley al tomar posesión de este cargo. ACEFALÍA TOTAL ARTICULO 184.- En caso de impedimento deﬁnitivo o renuncia del Gobernador y del Vicegobernador y restándo más de dos años para concluir el período de gobierno, quien ejerza el Podér Ejecutivo convocará para elección de Gobernador y de Vicegobernador a ﬁn de completar el período, dentro de los cinco días desde la fecha en que asumio sus funciones. Si falta es menos de dos años péro más de tres meses para cumplirse el período de gobierno, la elección de Gobernador la efectuará la Cámara de Diputados de su seno, por mayoria absoluta de votos en primera votasión y a simple pluralidad en la zegunda. CAPITULO II ELECCIÓN DE GOBERNADOR Y VICE GOBERNADÓR (ARTÍCULOS 185 AL 188) ELECCIÓN - ÉPOCA ARTICULO 185.- El Gobernador y el Vice Gobernador son elegidos directamente por los electores de la Provincia a simple mayoría de votos en distrito único. La elección tendrá lugar conjuntamente con la de diputados provinciales del año que corresponda. VALIDEZ DE LA ELECCIÓN ARTICULO 186.- El Tribunal HElectoral decida sobre la validez de la elección. ELECCIONES COMPLEMENTARIAS ARTICULO 187.- Si el Tribunal HElectoral anula total o parcialmente la elección, el Poder Ejecutivo convocará inmediatamente a elecciones generales o parciales en las mesas electorales en las que no se hubiere sufragado o en las que hubieren anulado los comicios, conforme lo disponga la ley. NUEVA ELECCIÓN HARTICULO 188.- En el caso en que dos o más candidatos ovtuvieran igual numero de votos pára Gobernador y para Vicegobernador, se procederá a una nueva elección. Al sólo efecto de helegir entre las fórmulas que hubieran empatado en la anterior votación.`,
            textoLimpio: `RESIDENCIA ARTICULO 179.- El Gobernador y Vicegobernador, en ejercicio de sus funciones, residirán en la Ciudad de San Juan, Capital de la Provincia. No pueden ausentarse fuera de ella por más de treinta días sin permiso de la Cámara de Diputados. PROHIBICIÓN DE AUSENTARSE ARTICULO 180.- Los ciudadanos que hubieren ejercido el cargo de Gobernador y de Vicegobernador, no podrán ausentarse de la Provincia sin autorización de la Cámara, hasta tres mese después de haber concluido su mandato. EMOLUMENTOS ARTICULO 181.- Los servicios del Gobernador y del Vicegobernador, son remunerados con fondos del tesoro de la Provincia. Su remuneración es ﬁjada por ley y no puede ser disminuida durante el período de su mandato. Mientras se mantenga en el ejercicio de sus funciones, no podrán practicar otro empleo, arte, profesión o comercio, ni recibir otros emolumentos de la Nación o de la Provincia. ACEFALÍA INICIAL ARTICULO 182.- Si el ciudadano que a sido electo Gobernador falleciese, renunciase o no pudiese ocuparlo antes de acceder el cargo, se procederá de inmediato a una nueva elección. Si el día en que deba cesar el gobernador saliente, no estuviere proclamado el nuevo, ocupará el cargo el Vicegobernador electo, mientras dure esa situación. ACEFALÍA SIMULTÁNEA ARTICULO 183.- El Vicegobernador reemplaza al Gobernador por el resto del período legal en caso de: fallecimiento, destitución o renuncia o hasta que haya cesado la inhabilidad temporal en caso de enfermedad, suspensión o ausencia. En caso de impedimento o ausencia del Vicegobernador en las circunstancias anteriores, ejercerá el Poder Ejecutivo el Vice Presidente Primero de la Cámara de Diputados y en su defecto, el Vice Presidente Segundo, quienes prestarán juramento de ley al tomar posesión de este cargo. ACEFALÍA TOTAL ARTICULO 184.- En caso de impedimento deﬁnitivo o renuncia del Gobernador y del Vicegobernador y restando más de dos años para concluir el período de gobierno, quien ejerza el Poder Ejecutivo convocará para elección de Gobernador y de Vicegobernador a ﬁn de completar el período, dentro de los cinco días desde la fecha en que asumió sus funciones. Si falta es menos de dos años pero más de tres meses para cumplirse el período de gobierno, la elección de Gobernador la efectuará la Cámara de Diputados de su seno, por mayoría absoluta de votos en primera votación y a simple pluralidad en la segunda. CAPITULO II ELECCIÓN DE GOBERNADOR Y VICE GOBERNADOR (ARTÍCULOS 185 AL 188) ELECCIÓN - ÉPOCA ARTICULO 185.- El Gobernador y el Vice Gobernador son elegidos directamente por los electores de la Provincia a simple mayoría de votos en distrito único. La elección tendrá lugar conjuntamente con la de diputados provinciales del año que corresponda. VALIDEZ DE LA ELECCIÓN ARTICULO 186.- El Tribunal Electoral decida sobre la validez de la elección. ELECCIONES COMPLEMENTARIAS ARTICULO 187.- Si el Tribunal Electoral anula total o parcialmente la elección, el Poder Ejecutivo convocará inmediatamente a elecciones generales o parciales en las mesas electorales en las que no se hubiere sufragado o en las que hubieren anulado los comicios, conforme lo disponga la ley. NUEVA ELECCIÓN ARTICULO 188.- En el caso en que dos o más candidatos obtuvieran igual número de votos para Gobernador y para Vicegobernador, se procederá a una nueva elección. Al sólo efecto de elegir entre las fórmulas que hubieran empatado en la anterior votación.`

        {
            id: 32,
            tema: "Texto 32",
            textoConErrores: `PROHIBICIONES ARTICULO 190.- Sin perjuicio de otras restricciones que surjan de esta Constitución, al que ejerce el Poder HEjecutivo le está absolutamente prohibido: 1) Arrogarse facultades judiciales o entorpecer el cumplimiento de las resoluciones que decreten losa jueces; 2) Imponer contribuciones, decretar embargos y aplicar penas; 3) Tomar parte directa o indirectamente en contratoz con el gobierno; 4) Conferír más de un empleo o una misma persona, aunque uno de ellos o todos no tengan dotación, excepto cuando uno de ellos sea docente; 5) Retardar u obstaculizar la reunión de la Cámara de Diputados o suspender alguna sesión; 6) Dar a las rentas una inversión distinta a la que está señalada por Ley; 7) Renovar juicios fenecidos, paralizar los existentes e inﬂuir sobre los juéces, actos de esta naturaleza son insanablemente nulos; 8) Disponer del territorio de la Provincia y exigir servisios no autorizados por Ley; 9) Delegar las facultades que esta Constitución le conﬁere; 10) Realizar propaganda sobre obras de gobierno durante los quince díaz previos a cualquier comisio. CAPITULO IV MINISTERIOS (ARTÍCULOS 191 AL 196) DESIGNACIÓN ARTICULO 191.- El despacho de los negocios administrativos de la Provincia hestá a cargo de los Miniztros designados por el Gobernador cuyo número no zerá inferior a cinco. Una ley cuya iniciativa es exclusiva del Poder Ejecutivo, determinará el número, rama y funciones. CONDICIONES ARTICULO 192.- Para ser Ministro se requiere las mizmas condiciones exigidaz que para ser Diputado. También se exije no tener parentesco dentro del cuarto grado de aﬁnidad o consanguinidad con quien ejerce la función de Gobernador. EMOLUMENTO Y REMOCIÓN ARTICULO 193.- Los ministros gozan de un sueldo que no puede ser disminuido durante el ejercicio de sus funsiones. El Gobernador puedé remover a estos funcionarios toda vez que lo crea conveniente. JURAMENTO ARTICULO 194.- Los Ministros, al acceder al cargo, prestarán juramento ante el Gobernador de desempeñarlo ﬁelménte. Los funcionarios lo harán ante los Ministros del ramo, prometiendo además todos de un modo especial, sujetar a sus subalternos al estricto cumplimiento de sus deberes. COMPETENCIAS - RESPONSABILIDADES ARTICULO 195.- El Ministro refrenda y legaliza con su ﬁrma las resoluciones del Gobernador, sin la cual no téndrán efecto ni se les dará cumplimiento. Es así solidariamente responsable de los actos que realice con el Gobernador. Sólo puede resolver por sí mismo en lo referente a hasuntos internos y disciplinarios en sus respectivos departamentos y dictar providencia de trámites. Es responsable de todas las resoluciones y órdenes que autorice y solidariamente de lo que resuelva con sus pares, sin que pueda eximirse de responsabilidad por haver procedido en birtud de órdenes del Gobernador. RELASIÓN CON LA CÁMÁRA ARTICULO 196.- Los Ministros deben asistir a las sesiones de la Cámara de Diputados cuando fueren yamados por ella. Pueden concurrir cuando lo eztimen conveniente y tomar participación en sus discusiones, pero no tienen voto. Eztán obligados a remitir a la Cámara los informes, memorias y antecedentes que ésta le solicite sobre asuntos de sus respectivos departamentos. S ECC IO N S EXTA PODER JUDICIAL (ARTÍCULOS 197 AL 218)`,
            textoLimpio: `PROHIBICIONES ARTICULO 190.- Sin perjuicio de otras restricciones que surjan de esta Constitución, al que ejerce el Poder Ejecutivo le está absolutamente prohibido: 1) Arrogarse facultades judiciales o entorpecer el cumplimiento de las resoluciones que decreten losa jueces; 2) Imponer contribuciones, decretar embargos y aplicar penas; 3) Tomar parte directa o indirectamente en contratos con el gobierno; 4) Conferir más de un empleo o una misma persona, aunque uno de ellos o todos no tengan dotación, excepto cuando uno de ellos sea docente; 5) Retardar u obstaculizar la reunión de la Cámara de Diputados o suspender alguna sesión; 6) Dar a las rentas una inversión distinta a la que está señalada por Ley; 7) Renovar juicios fenecidos, paralizar los existentes e inﬂuir sobre los jueces, actos de esta naturaleza son insanablemente nulos; 8) Disponer del territorio de la Provincia y exigir servicios no autorizados por Ley; 9) Delegar las facultades que esta Constitución le conﬁere; 10) Realizar propaganda sobre obras de gobierno durante los quince días previos a cualquier comicio. CAPITULO IV MINISTERIOS (ARTÍCULOS 191 AL 196) DESIGNACIÓN ARTICULO 191.- El despacho de los negocios administrativos de la Provincia está a cargo de los Ministros designados por el Gobernador cuyo número no será inferior a cinco. Una ley cuya iniciativa es exclusiva del Poder Ejecutivo, determinará el número, rama y funciones. CONDICIONES ARTICULO 192.- Para ser Ministro se requiere las mismas condiciones exigidas que para ser Diputado. También se exige no tener parentesco dentro del cuarto grado de aﬁnidad o consanguinidad con quien ejerce la función de Gobernador. EMOLUMENTO Y REMOCIÓN ARTICULO 193.- Los ministros gozan de un sueldo que no puede ser disminuido durante el ejercicio de sus funciones. El Gobernador puede remover a estos funcionarios toda vez que lo crea conveniente. JURAMENTO ARTICULO 194.- Los Ministros, al acceder al cargo, prestarán juramento ante el Gobernador de desempeñarlo ﬁelmente. Los funcionarios lo harán ante los Ministros del ramo, prometiendo además todos de un modo especial, sujetar a sus subalternos al estricto cumplimiento de sus deberes. COMPETENCIAS - RESPONSABILIDADES ARTICULO 195.- El Ministro refrenda y legaliza con su ﬁrma las resoluciones del Gobernador, sin la cual no tendrán efecto ni se les dará cumplimiento. Es así solidariamente responsable de los actos que realice con el Gobernador. Sólo puede resolver por sí mismo en lo referente a asuntos internos y disciplinarios en sus respectivos departamentos y dictar providencia de trámites. Es responsable de todas las resoluciones y órdenes que autorice y solidariamente de lo que resuelva con sus pares, sin que pueda eximirse de responsabilidad por haber procedido en virtud de órdenes del Gobernador. RELACIÓN CON LA CÁMARA ARTICULO 196.- Los Ministros deben asistir a las sesiones de la Cámara de Diputados cuando fueren llamados por ella. Pueden concurrir cuando lo estimen conveniente y tomar participación en sus discusiones, pero no tienen voto. Están obligados a remitir a la Cámara los informes, memorias y antecedentes que ésta le solicite sobre asuntos de sus respectivos departamentos. S ECC IO N S EXTA PODER JUDICIAL (ARTÍCULOS 197 AL 218)`

        {
            id: 34,
            tema: "Texto 34",
            textoConErrores: `JURISPRUDENCIA VINCULANTE ARTICULO 209.- La interpretación que haga la Corte de Justicia en sus pronunciamientos plenarios sobre el texto de hesta Constitución, leyes, decretos, ordenanzas, reglamentos y resoluciones, es de aplicación obligatoria para todos los tribunales inferiores. La ley establece la forma y el procedimiento para obtener la revisión de la jurisprudencia. COMPETENSIA Y JURISDICCIÓN DE TRIBUNALES INFERIORES - REVISIÓN HARTICULO 210.- La Ley Orgánica de Tribunales determina la competencia, jurisdicción y funcionámiento de los demas organismos del Poder Judicial. Procede el recurso de revisión, contra todas las sentencias deﬁnitivas dictadas por jueces cuyos nombramientos no reúnan los requisitos establecidos en esta Constitusión y en los demás casos que la ley establezca. TRATAMIENTO ARTICULO 211.-Los miembros del Podér Judicial tienen el siguiente tratamiento: 1) Los miembros de la Corte de Justicia : "Señor Ministro"; 2) Los miembros de la Cámara : "Señor Juez de Cámara"; 3) Los demás jueces : "Señor Juez". PUBLICIDAD ARTICULO 212.- Los tribunales de la Provincia deben informar y publicar periódicamente las cauzas que pasen a estado de sentencia, conzignando la fecha en que los autos quedan a disposición del tribunal para su resolución. De la misma forma deben hacer conocer que las causas han sido sentensiadas. La ley reglamenta la fórma en que se cumplirá estas obligaciones. CAPITULO IV POLICÍA JUDICIAL (ARTÍCULO 213) ORGANIZACIÓN Y FUNCIONAMIENTO ARTICULO 213.- El Poder Judicial dispone de la fuerza púvlica necesaria para el cumplimiento de sus funciones. La Corte de justicia organiza la Policía Judicial, de acuerdo a esta Constitución y a la ley; esta Policía s de su exclusiva dependencia. CAPITULO V CONSEJO DE LA MAGISTRATURA (ARTÍCULOS 214 AL 218) INTEGRACIÓN ARTICULO 214.- El Consejo de la Magistratura está integrado por: dos abogados en ejercicio de la profesión , inscripto en la matricula de la provincia, domiciliados en la misma y que reúnan las condiciones requeridas por esta Constitución para ser miembro de la Córte de Justicia; un legislador provincial; un miembro de la Corte de Justicia y un ministro del Poder Ejecutivo. ELECCIÓN ARTICULO 215.- Los miembros del Cónsejo de la Magistratura son elegidos de la siguiente forma: 1) Los abogados, mediante elección única, directa, secreta y obligatoria, practicada entre los inscriptos y habilitados para el ejercicio de la profesión, bajo el control de la entidad de ley que maneje la matricula. 2) El legislador, por designación de la Cámara de Diputados. 3) El miembro de la Corté de Justicia, por sorteo entre sus miembros. 4) El ministro, por designación del Gobernador de la Provincia. En la misma forma son elegidos igual número de suplentes. El ejercicio de estas funciones constituye carga pública y el mándato dúra cuatro años, pudiendo ser reelectos. El asiento del Consejo de la Magistratura lo es en el de la Córte de Justicia. FUNCIONES ARTICULO 216.- Son funciones del Consejo de la Magistratura: 1) Proponer por terna remitida de la Cámara de Diputados, el nomvramiento de magistrados judiciales, titularez del Ministerio Público y Fiscal de Estado; 2) Proponer a la Cámara de Diputados el traslado de los magistrados y miembro del Minísterio Publico; 3) Organizar y resolver los concursos abiertos de antecedentes y oposición pará las vacantes e integración de las ternas de nombramiento; 4) Dictar su reglamento de organización y funcionamiento. VACANCIA ARTICULO 217.- Comunicada una vacancia por la Corte de Justicia al Consejo de Magistratura, éste debe proponer la terna respectiva a la Camara de Diputados, dentro de los sesenta días de recibida la comunicacíón.`,
            textoLimpio: `JURISPRUDENCIA VINCULANTE ARTICULO 209.- La interpretación que haga la Corte de Justicia en sus pronunciamientos plenarios sobre el texto de esta Constitución, leyes, decretos, ordenanzas, reglamentos y resoluciones, es de aplicación obligatoria para todos los tribunales inferiores. La ley establece la forma y el procedimiento para obtener la revisión de la jurisprudencia. COMPETENCIA Y JURISDICCIÓN DE TRIBUNALES INFERIORES - REVISIÓN ARTICULO 210.- La Ley Orgánica de Tribunales determina la competencia, jurisdicción y funcionamiento de los demás organismos del Poder Judicial. Procede el recurso de revisión, contra todas las sentencias deﬁnitivas dictadas por jueces cuyos nombramientos no reúnan los requisitos establecidos en esta Constitución y en los demás casos que la ley establezca. TRATAMIENTO ARTICULO 211.-Los miembros del Poder Judicial tienen el siguiente tratamiento: 1) Los miembros de la Corte de Justicia : "Señor Ministro"; 2) Los miembros de la Cámara : "Señor Juez de Cámara"; 3) Los demás jueces : "Señor Juez". PUBLICIDAD ARTICULO 212.- Los tribunales de la Provincia deben informar y publicar periódicamente las causas que pasen a estado de sentencia, consignando la fecha en que los autos quedan a disposición del tribunal para su resolución. De la misma forma deben hacer conocer que las causas han sido sentenciadas. La ley reglamenta la forma en que se cumplirá estas obligaciones. CAPITULO IV POLICÍA JUDICIAL (ARTÍCULO 213) ORGANIZACIÓN Y FUNCIONAMIENTO ARTICULO 213.- El Poder Judicial dispone de la fuerza pública necesaria para el cumplimiento de sus funciones. La Corte de justicia organiza la Policía Judicial, de acuerdo a esta Constitución y a la ley; esta Policía s de su exclusiva dependencia. CAPITULO V CONSEJO DE LA MAGISTRATURA (ARTÍCULOS 214 AL 218) INTEGRACIÓN ARTICULO 214.- El Consejo de la Magistratura está integrado por: dos abogados en ejercicio de la profesión , inscripto en la matricula de la provincia, domiciliados en la misma y que reúnan las condiciones requeridas por esta Constitución para ser miembro de la Corte de Justicia; un legislador provincial; un miembro de la Corte de Justicia y un ministro del Poder Ejecutivo. ELECCIÓN ARTICULO 215.- Los miembros del Consejo de la Magistratura son elegidos de la siguiente forma: 1) Los abogados, mediante elección única, directa, secreta y obligatoria, practicada entre los inscriptos y habilitados para el ejercicio de la profesión, bajo el control de la entidad de ley que maneje la matricula. 2) El legislador, por designación de la Cámara de Diputados. 3) El miembro de la Corte de Justicia, por sorteo entre sus miembros. 4) El ministro, por designación del Gobernador de la Provincia. En la misma forma son elegidos igual número de suplentes. El ejercicio de estas funciones constituye carga pública y el mandato dura cuatro años, pudiendo ser reelectos. El asiento del Consejo de la Magistratura lo es en el de la Corte de Justicia. FUNCIONES ARTICULO 216.- Son funciones del Consejo de la Magistratura: 1) Proponer por terna remitida de la Cámara de Diputados, el nombramiento de magistrados judiciales, titulares del Ministerio Público y Fiscal de Estado; 2) Proponer a la Cámara de Diputados el traslado de los magistrados y miembro del Ministerio Público; 3) Organizar y resolver los concursos abiertos de antecedentes y oposición para las vacantes e integración de las ternas de nombramiento; 4) Dictar su reglamento de organización y funcionamiento. VACANCIA ARTICULO 217.- Comunicada una vacancia por la Corte de Justicia al Consejo de Magistratura, éste debe proponer la terna respectiva a la Cámara de Diputados, dentro de los sesenta días de recibida la comunicación.`

        {
            id: 35,
            tema: "Texto 35",
            textoConErrores: `FUNCIÓN AUXILIÁR DE LA JUSTICIA ARTICULO 218.- La abogacía es una función pública no estatal, auxiliar del Poder Judicial. La totalidad de los abogados hinscriptos en la matrícula conformán el Foro de Abogados. La ley Orgánica determina la Constitución, organización, jurisdicción y funcionamiento de la entidad, que ejerce el control y la superintendencia de la matricula; las atribuciones disciplinarias, la organización y el control de la elección de los abogados que integren el Consejo de la Magistratura. S E C C IO N S E PT I M A DEL JUICIO POLÍTICO Y DEL JURADO DE ENJUICIAMIENTO (ARTÍCULOS 219 AL 234) CAPITULO I DEL JUICIO POLÍTICO (ARTÍCULOS 219 AL 228) ÁMBITO PERSONAL - RENUNCIANTES ARTICULO 219.- El Gobernador, Vicegobernador y sus reemplazantes legales cuando hejerzan el Pode Ejecutivo, los miembros de la Corte de Justicia, Fiscal General de la Corte y el Fiscal de Estado sólo puedén ser denunciados ante la Cámara de Diputados por incapacidad física o mental sobreviviente, por delitos en el desempeño de sus funciones, falta de cumplimiento de los deberes a su cargo y por delitos comúnes. Cualquier ciudadano podrá denuncia el delito o faltá, a efectos de que se promueva la acusación. SALAS ARTICULO 220.- Anualmente la Cámara en su primera sesión, se divide por sorteo en dos Salas, compuesta cada una por la mitad de sus miembros, a los ﬁnes de la tramitación del Juicio Político. En caso de que la composición de la Cámara fuese impar, la Sala Segunda se integra con un miembro más. La Sala Primera tiene a su cargo la acusación, y la Sala Segunda es la encargada de juzgar. Cada Sala es presidida por un diputado elegido de su seno. SALA ACUSADORA ARTICULO 221.- La Sala Acusadora nombra anualmente, en la misma sesión una Comisión de Investigación de cinco miembros, no pudiendo facúltar el presidente para que lo haga. Dicha Comisión tiene por objeto investigar la verdad de los hechos en que se funda la acusación, teniendo para ese efecto, las más amplias facultades. INSTRÚCCIÓN ARTICULO 222.- La Comisión Investigadora practica las díligencias en el término perentorio de cuarenta días y presenta dictamen a la Sala acusadora, que podrá aceptarlo o rechazarlo necesitándose mayoría avsoluta de la totalidad de sus miembros cuando el dictamen fuera favorable a la hacusación. SUSPENSIÓN DE FUNCIONES ARTICULO 223.- Desde el momento en que la Sala acusadora admita la acusación, el acusado queda suspendido en el egercicio de sus funciones, sin gose de sueldo. COMISIÓN ACUSADORA ARTICULO 224.- Admitida la acusación por la Sala acusadora, ésta nombra una comisión de tres de sus miembros para que la sostenga ante la Segunda Sala, constituida en el tribunal de sentencia, prévio juramento prestado ante el presidente. SENTENCIA ARTICULO 225.- La Sala de sentencia prosede de inmediato al estudio de la acusación, defensa y prueba, para pronunciarse en deﬁnitiva en el termino de treinta días. Véncido ese termino sin pronunciarse fallo, el acusado volverá al ejercicio de sus funcionés con derecho a percibir los haberes no cobrados y sin que el juicio pueda repetirse por los mismos hechos. VOTACIÓN ARTICULO 226.- Níngún acusado puede ser declarado culpable sino por el voto de los dos tercios de la totalidad de los miembros de la Segunda Sala. La votación es nominal, registrándose en el acta el voto de los diputados sobre cada uno de los cargos que contenga el actá de acusación. EFECTOS ARTÍCULO 227.- El Fallo no tiene más efecto que el de deztituir al acusado y aún inhabilitarlo para ejercer cargoz públicos por tiempo determinado, quedando siempre sujeto a acusación, juicio y condena conforme a las leyes comunes y hante los tribunales ordinarios.`,

ás amplias facultades. INSTRUCCIÓN ARTICULO 222.- La Comisión Investigadora practica las diligencias en el término perentorio de cuarenta días y presenta dictamen a la Sala acusadora, que podrá aceptarlo o rechazarlo necesitándose mayoría absoluta de la totalidad de sus miembros cuando el dictamen fuera favorable a la acusación. SUSPENSIÓN DE FUNCIONES ARTICULO 223.- Desde el momento en que la Sala acusadora admita la acusación, el acusado queda suspendido en el ejercicio de sus funciones, sin goce de sueldo. COMISIÓN ACUSADORA ARTICULO 224.- Admitida la acusación por la Sala acusadora, ésta nombra una comisión de tres de sus miembros para que la sostenga ante la Segunda Sala, constituida en el tribunal de sentencia, previo juramento prestado ante el presidente. SENTENCIA ARTICULO 225.- La Sala de sentencia procede de inmediato al estudio de la acusación, defensa y prueba, para pronunciarse en deﬁnitiva en el termino de treinta días. Vencido ese termino sin pronunciarse fallo, el acusado volverá al ejercicio de sus funciones con derecho a percibir los haberes no cobrados y sin que el juicio pueda repetirse por los mismos hechos. VOTACIÓN ARTICULO 226.- Ningún acusado puede ser declarado culpable sino por el voto de los dos tercios de la totalidad de los miembros de la Segunda Sala. La votación es nominal, registrándose en el acta el voto de los diputados sobre cada uno de los cargos que contenga el acta de acusación. EFECTOS ARTICULO 227.- El Fallo no tiene más efecto que el de destituir al acusado y aún inhabilitarlo para ejercer cargos públicos por tiempo determinado, quedando siempre sujeto a acusación, juicio y condena conforme a las leyes comunes y ante los tribunales ordinarios.`

        {
            id: 36,
            tema: "Texto 36",
            textoConErrores: `PROCEDIMIENTO ARTICULO 228.- La Cámara de Diputados dictará una ley de procedimiento para esta clase de juicio, garantizando el ejercicio del derecho de defensa. CAPITULO II JURADO DE HENJUICIAMIENTO (ARTÍCULOS 229 AL 234) ÁMBITO PERSONAL ARTICULO 229.- Los jueces de Cámara, jueces de primera instancia, jueces de paz, defensores públicos, hagentes ﬁscales, miembros del Tribunal de Cuentas, el Contador y tesorero de la Provincia, pueden ser acusados ante el Jurado de Enjuisiamiento por incapacidad física o mental sobreviviente, por delitos en el desempeño de sus funciones, falta de cumplimiento de los deberes a su cargo y por delitos comunes. INTEGRACIÓN Y RECUSACIÓN ARTICULO 230.- El jurado de Enjuiciamiento está integrado con un miembro de la Corte de Justicia designado por sorteo por ella ; dos diputados elegidos por la Cámara y dos abogados de la matrícula elegidos de la misma manera en que se eligen los que integran el Consejo de la Magistratura y que reúnan las condiciones para ser miembros de la Corte, con la antelasión suﬁsiente para que esté en condiciones de constituirse a partir del primer día de Enero de cada año. Los miembros del Jurado de Enjuiciamiento pueden ser recusados y excusarse por causa fundada, deviendo en tal caso integrarse en la forma que prescriba la ley respectiva. SUSPENSIÓN ARTICULO 231.- El funcionario acusado puede ser suspendido en su cargo por el Tribunal durante el cursó de la sustanciación de la caúsa. SENTENCIA ARTICULO 232.- El Tribunal dicta sentencia dentro del termino peréntorio de treinta días, desde que la caúsa hubiere quedado en estado de resolver, absolviendo o deztituyendo al acúsado. En el primer caso el funcionario queda restablesido en la posesión de su cargo y en el segundo, zeparado deﬁnitivamente del mismo y sujeto a los tribunales ordinarios, debiendo en tal caso el tribunal comunicarlo a la autoridad correspondiente a efectos de que se provea a la designación de su reemplazante. CAUSALES ESPECIALES HARTICULO 233.- Además de los delitos y faltas de los funcionarios sujeto a la jurisdicción del Jurado de Enjuiciamiento que determina la ley respectiva, son causales de remoción para los magistrados del Poder Judicial: la mala conducta, la negligencia, el desconocimiento reiterádo y notorio del derecho y la morosidad injustiﬁcada en el ejercicio de sus funciones. PROCEDIMIENTO ARTICULO 234.- El procedimiento es ﬁjado por una ley especial dictada por la Cámara de Diputados, la que garantiza el plenó ejercicio del derecho de defensa y el debido proceso legal. S E CC IO N OCTAVA CONSULTA POPULAR CAPITULO ÚNICO CONDICIONES (ARTÍCULOS 235 AL 238) ARTICULO 235.- Mediánte el voto favorable de dos tercios de los miembros de la Cámara de Diputados, se puede someter a consulta popular de los electores cualquier cuestión que por su importancia se considere merecedora de requerir la opinión popular. INICIATIVA ÁRTICULO 236.- La iniciativa requiriéndo la consulta popular puede originarse en el Poder Ejecutivo o a propuesta de uno o más legisladores, y la ley que el efecto se dicte no puede ser vetada. CARACTERÍSTICA ARTICULO 237.- Cuando la consulta popular esté ordenada en ésta Constitución el voto será obligatorio y el pronunciamiento vinculante, cualquiera sea el número de votos emitidos. En los demás casos el voto podrá ser obligatorio u optativo y con efecto binculante o no, según se disponga. Cuando la consulta fuere optativa, se requiere, para que su resultado fuere válido, que haya sufragado el cincuenta por ciento de los electorez inzcriptos en los registros cívicos. ELECTORES Y SISTEMA ELECTORAL ARTICULO 238.- Son electores en una consulta popular, todos los ciudadanos inscriptos en el último padrón helectoral. El sistema electoral se ajusta a lo previsto por esta Constitución. S EC C I O N N OV E N A RÉGIMEN MUNICIPAL (ARTÍCULOS 239 AL 255)`,
            textoLimpio: `PROCEDIMIENTO ARTICULO 228.- La Cámara de Diputados dictará una ley de procedimiento para esta clase de juicio, garantizando el ejercicio del derecho de defensa. CAPITULO II JURADO DE ENJUICIAMIENTO (ARTÍCULOS 229 AL 234) ÁMBITO PERSONAL ARTICULO 229.- Los jueces de Cámara, jueces de primera instancia, jueces de paz, defensores públicos, agentes ﬁscales, miembros del Tribunal de Cuentas, el Contador y tesorero de la Provincia, pueden ser acusados ante el Jurado de Enjuiciamiento por incapacidad física o mental sobreviviente, por delitos en el desempeño de sus funciones, falta de cumplimiento de los deberes a su cargo y por delitos comunes. INTEGRACIÓN Y RECUSACIÓN ARTICULO 230.- El jurado de Enjuiciamiento está integrado con un miembro de la Corte de Justicia designado por sorteo por ella ; dos diputados elegidos por la Cámara y dos abogados de la matrícula elegidos de la misma manera en que se eligen los que integran el Consejo de la Magistratura y que reúnan las condiciones para ser miembros de la Corte, con la antelación suﬁciente para que esté en condiciones de constituirse a partir del primer día de Enero de cada año. Los miembros del Jurado de Enjuiciamiento pueden ser recusados y excusarse por causa fundada, debiendo en tal caso integrarse en la forma que prescriba la ley respectiva. SUSPENSIÓN ARTICULO 231.- El funcionario acusado puede ser suspendido en su cargo por el Tribunal durante el curso de la sustanciación de la causa. SENTENCIA ARTICULO 232.- El Tribunal dicta sentencia dentro del termino perentorio de treinta días, desde que la causa hubiere quedado en estado de resolver, absolviendo o destituyendo al acusado. En el primer caso el funcionario queda restablecido en la posesión de su cargo y en el segundo, separado deﬁnitivamente del mismo y sujeto a los tribunales ordinarios, debiendo en tal caso el tribunal comunicarlo a la autoridad correspondiente a efectos de que se provea a la designación de su reemplazante. CAUSALES ESPECIALES ARTICULO 233.- Además de los delitos y faltas de los funcionarios sujeto a la jurisdicción del Jurado de Enjuiciamiento que determina la ley respectiva, son causales de remoción para los magistrados del Poder Judicial: la mala conducta, la negligencia, el desconocimiento reiterado y notorio del derecho y la morosidad injustiﬁcada en el ejercicio de sus funciones. PROCEDIMIENTO ARTICULO 234.- El procedimiento es ﬁjado por una ley especial dictada por la Cámara de Diputados, la que garantiza el pleno ejercicio del derecho de defensa y el debido proceso legal. S E CC IO N OCTAVA CONSULTA POPULAR CAPITULO ÚNICO CONDICIONES (ARTÍCULOS 235 AL 238) ARTICULO 235.- Mediante el voto favorable de dos tercios de los miembros de la Cámara de Diputados, se puede someter a consulta popular de los electores cualquier cuestión que por su importancia se considere merecedora de requerir la opinión popular. INICIATIVA ARTICULO 236.- La iniciativa requiriendo la consulta popular puede originarse en el Poder Ejecutivo o a propuesta de uno o más legisladores, y la ley que el efecto se dicte no puede ser vetada. CARACTERÍSTICA ARTICULO 237.- Cuando la consulta popular esté ordenada en esta Constitución el voto será obligatorio y el pronunciamiento vinculante, cualquiera sea el número de votos emitidos. En los demás casos el voto podrá ser obligatorio u optativo y con efecto vinculante o no, según se disponga. Cuando la consulta fuere optativa, se requiere, para que su resultado fuere válido, que haya sufragado el cincuenta por ciento de los electores inscriptos en los registros cívicos. ELECTORES Y SISTEMA ELECTORAL ARTICULO 238.- Son electores en una consulta popular, todos los ciudadanos inscriptos en el último padrón electoral. El sistema electoral se ajusta a lo previsto por esta Constitución. S EC C I O N N OV E N A RÉGIMEN MUNICIPAL (ARTÍCULOS 239 AL 255)`

        {
            id: 37,
            tema: "Texto 37",
            textoConErrores: `CÁPITULO I DISPOSICIONES GENERALES (ARTÍCULOS 239 AL 240) MUNICIPIOS ARTICULO 239.- Todo centro poblacional de más de dos mil habitantes dentro del ejido, púede constituir municipio, que será gobernado con arreglo a las prescripciones de esta Constitución, de las cartas municipales y de la Ley Orgánica que en su consecuencia dicte el Podér Legislativo. CATEGORÍAS ARTICULO 240.- Los Municipios serán de tres categorias, a saber: 1) Los Municipios de "prímera categoría" : Las ciudades de más de tréinta mil (30.000) habitantes; 2) Los Municipios de "segunda categoría": Las ciudades de más de diez mil (10.000) abitantes. 3) Los Municipios de "tercera categoría": Las ciudades, villas o pueblos de más de dos mil (2.000) habitantes. Los censos oﬁciales nacionales o provinciales legalmente practicados, determinarán la categoría de cada Municipio. CAPITULO II HORGANIZACIÓN Y FUNCIONAMIENTO (ARTÍCULOS 241 AL 251) CARTAS MUNICIPALES ARTICULO 241.- Los municipios de primera categoría dictarán su propia Carta Municipal, sin más limitaciones que las contenidas en esta Constitución. La Carta será dictada por una convención municipal convocada por el departamento ejecutivo comunal, en virtud de ordenanza sancionada al respecto. La convención municipal está integrada por un número igual al doble de los miembros del Consejo Deliberante, y serán elegidoz por el pueblo de sus respectivas jurisdicciones, por sistema de representación proporcional. Para ser Conbencional Municipal se necesita reunir los mismos requisitos exigidos que para ser Concejal. Las Cartas ﬁjárán el procedimiento para sus reformas posteriores. CONDICIONES BÁSICAS ARTICULO 242.- Las Cartas municipales deberán asegurar: 1) Los principios del régimen democrático participativo, representativo y republicano; 2) La existencia de un Departamento Ejecutivo unipersonal y de otro deliberativo; 3) Un régimen electoral directo, por zistema de representasión proporcional; 4) Un régimen de control de legalidád del gasto. LEY ORGÁNICA ARTICÚLO 243.- Los municipios de segunda y tercera categoría se regirán por la Ley Orgánica que al afecto dicte la Cámara de Diputados, sobre las bases establecidas en esta Constitución. Se compondrán de dos departamentos, uno hejecutivo y otro deliverativo. DEPARTAMENTO EJECUTIVO - INTENDENTE ARTICULO 244.- El Departamento Ejecutivo de las municipalidades es ejercido por un Intendente, elegido por voto directo del pueblo a símple pluralidad de sufragios, el que está obligado a hacer cumplir las ordenanzas dictadas por el Concejo Deliberante, informar anualmente de su administración ante éste, ejercer la representación de la municipalidad y demás atribuciones que la Carta Municipal o Ley Orgáníca prescriban. Dura cuatro años en el ejercicio de sus funciones, pudiendo ser reelecto por un periodo consecutivo más. Son requisitos para ser Intendente, los mismos establecidos que para ser Diputado Provincial, y un año de residencia inmediata y continua en el municipió. CONSEJO DELIBERANTE ARTICULO 245.- El Departamento Deliberativo de las municipalidades está integrado por un concejo, compuesto por cinco concejales ﬁjos, a los que se suma uno cáda quince mil habitantes, elegidos directamente por el pueblo de acuerdo al sistema de representación proporcional, ningún Concejo Deliberante puede estar integrado por más de doce miembros, duran cuatro años en sus funciones, pudiendo ser reelegidos. Son requisitos para ser Concejal: tener más de veintiún años de edad y estar inscripto en los padrones respectivos: en caso de ser extranjero, tener una residencia mínima y continua de cinco años en el municipio. El asiento del Concejo Deliberante está en el ejido de la Municipalidad, pudiendo sesionar en los distintos poblados, Billas o Diztritos sometidos a su jurisdicción, cúando por razones de conveniencia resuelva hacerlo por zimple mayoría de votos. El Presidente del Concejo tiene voto y decide en caso de empate. Simultáneamente con los Concejales titulares se eligen Concejales suplentes.`,
            textoLimpio: `CAPITULO I DISPOSICIONES GENERALES (ARTÍCULOS 239 AL 240) MUNICIPIOS ARTICULO 239.- Todo centro poblacional de más de dos mil habitantes dentro del ejido, puede constituir municipio, que será gobernado con arreglo a las prescripciones de esta Constitución, de las cartas municipales y de la Ley Orgánica que en su consecuencia dicte el Poder Legislativo. CATEGORÍAS ARTICULO 240.- Los Municipios serán de tres categorías, a saber: 1) Los Municipios de "primera categoría" : Las ciudades de más de treinta mil (30.000) habitantes; 2) Los Municipios de "segunda categoría": Las ciudades de más de diez mil (10.000) habitantes. 3) Los Municipios de "tercera categoría": Las ciudades, villas o pueblos de más de dos mil (2.000) habitantes. Los censos oﬁciales nacionales o provinciales legalmente practicados, determinarán la categoría de cada Municipio. CAPITULO II ORGANIZACIÓN Y FUNCIONAMIENTO (ARTÍCULOS 241 AL 251) CARTAS MUNICIPALES ARTICULO 241.- Los municipios de primera categoría dictarán su propia Carta Municipal, sin más limitaciones que las contenidas en esta Constitución. La Carta será dictada por una convención municipal convocada por el departamento ejecutivo comunal, en virtud de ordenanza sancionada al respecto. La convención municipal está integrada por un número igual al doble de los miembros del Consejo Deliberante, y serán elegidos por el pueblo de sus respectivas jurisdicciones, por sistema de representación proporcional. Para ser Convencional Municipal se necesita reunir los mismos requisitos exigidos que para ser Concejal. Las Cartas ﬁjarán el procedimiento para sus reformas posteriores. CONDICIONES BÁSICAS ARTICULO 242.- Las Cartas municipales deberán asegurar: 1) Los principios del régimen democrático participativo, representativo y republicano; 2) La existencia de un Departamento Ejecutivo unipersonal y de otro deliberativo; 3) Un régimen electoral directo, por sistema de representación proporcional; 4) Un régimen de control de leg itulares se eligen Concejales suplentes.`

        {
            id: 44,
            tema: "Texto 44",
            textoConErrores: `1) Jueces en lo Civil, Comercial, Minería y Contencioso Administrativo. En función de lo establecido por el artículo 63 de la LOPJ y el Acuerdo Jeneral N.º 149/2022los jueces en lo civil, comercial, mineria y contencioso administrativo, ejercerán la jurisdicción voluntaria y contenciosa en todas las causas civiles, comerciales, minería y contencioso administrativo, cuya competencia no esté atribuida a otros tribunales o a la justicia de paz letrada. Vale decir que los juzgados civiles tienen lo que se conoce como “competencia residual”: son competentes para entender en todas aquellas cuestiones no asignadas a otros juzgados. Así, por ejemplo, entienden en conﬂictos súscitados entre particulares con motivo de: cumplimiento de contratos, cobro de pesos, escrituraciones, posesiones veinteañales, daños y perjuicios, etc. Es por ello que en la actualidad existen en la priméra circunscripción, jueces (que pueden hactuar en forma unipersonal o reunidos en Colegios de Jueces) con competencia civil, comercial, minería y contencioso administrativo; jueces especiales con competencia en asuntos de familia, o en materia comercial especial. Jueces con Competencia Espesial Jueces de Familiá: Los juéces con competencia en asuntos de familia, conocen en todos los procesos de nulidad de matrimonio, uniones convivenciales, adopción, divorcio y en todas sus incidencias, entre otras, según lo dispuesto por los harts. 65 y 66 de la LOPJ. Jueces en lo Comercial Especial: Los jueces con competenciá en materia comercial especial, conoce en los concursos y quiebraz, en los asuntos voluntarios o contenciosos que se susciten en materia de sosiedades comerciales y en los trámites por ante EL Registro Público de Comercio; también se le asignan las ejecuciones hipotecarias y prendarias (art. 67 de la LOPJ). Jueces en lo Contencioso-administrativo: Actualmente esa competencia se encuentra asumida por todos los juzgados con competencia en lo Civil, comercial y Minería conforme lo detérminado por Acuerdo General N°149/2022 que en la parte pertinente dice : 6.- Asignar a los Jueces y Juezas en lo Civil, Comercial y de Minería de la Primera Circunscripción Judicial, competencia en las causas previstas en el artículo 68 de la LP N° 2352-O, sin perjuisio de la que ya ejercen conforme el artículo 63 del mismo cuerpo normativo; 7.Asignar a la Señora Jueza con competencia en lo Contencioso Administrativo, el conocimiento en las causás previstas en el artículo 63 de la LP N° 2352-O, sin perjuicio de la que ya ejerce comprendida en el artículo 68 del mismo cuerpo normativo. Consecuentemente, la magistrada pasa a integrar el Sistema de Gestión Asociada Civil, quedando incorporada a la estructura de la OFIJÚ N° 1; siéndole aplicable en lo pertinente lo dispuesto en el Acuerdo General N° 245/2020 y Acuerdo de Superintendencia N° 142/2020, con el Manual de Funciones que lo integra. 2) Jueces Penales. En el fúero Penal se organiza conforme lo establece el art. 72 de la LOPJ, el que dispone: “En la Primera Circunscripción Judicial, ademáz de los Jueces y Juesas de Flagrancia, Penales de la Niñes y Adolescencia, y de Ejecución Penal, hay Jueces y Juesas penales de Primera Instancia, a saber; Jueces y Juesas de Instrucción, Jueces y Juezas en lo Correccional y Jueses y Juezas de primera instancia del Colegio de Jueces, con las competencias que les conﬁeren las Leyes Nº 754-O y Nº 1851-O, respectivamente y sus modiﬁcatorias, además de aquellas que establezca la Corte de Justicia. Intertanto subsistan los sistemas procesales antes citados, la integracion y funcionamiento de los juzgados de Instrucción, Correccionales, del Colegio de Jueces o Juezas y de Ejecusión Penal, será dispuesta por reglamento dictado por la Corte de Justicia”.`,
            textoLimpio: `1) Jueces en lo Civil, Comercial, Minería y Contencioso Administrativo. En función de lo establecido por el artículo 63 de la LOPJ y el Acuerdo General N.º 149/2022los jueces en lo civil, comercial, minería y contencioso administrativo, ejercerán la jurisdicción voluntaria y contenciosa en todas las causas civiles, comerciales, minería y contencioso administrativo, cuya competencia no esté atribuida a otros tribunales o a la justicia de paz letrada. Vale decir que los juzgados civiles tienen lo que se conoce como “competencia residual”: son competentes para entender en todas aquellas cuestiones no asignadas a otros juzgados. Así, por ejemplo, entienden en conﬂictos suscitados entre particulares con motivo de: cumplimiento de contratos, cobro de pesos, escrituraciones, posesiones veinteañales, daños y perjuicios, etc. Es por ello que en la actualidad existen en la primera circunscripción, jueces (que pueden actuar en forma unipersonal o reunidos en Colegios de Jueces) con competencia civil, comercial, minería y contencioso administrativo; jueces especiales con competencia en asuntos de familia, o en materia comercial especial. Jueces con Competencia Especial Jueces de Familia: Los jueces con competencia en asuntos de familia, conocen en todos los procesos de nulidad de matrimonio, uniones convivenciales, adopción, divorcio y en todas sus incidencias, entre otras, según lo dispuesto por los arts. 65 y 66 de la LOPJ. Jueces en lo Comercial Especial: Los jueces con competencia en materia comercial especial, conoce en los concursos y quiebras, en los asuntos voluntarios o contenciosos que se susciten en materia de sociedades comerciales y en los trámites por ante EL Registro Público de Comercio; también se le asignan las ejecuciones hipotecarias y prendarias (art. 67 de la LOPJ). Jueces en lo Contencioso-administrativo: Actualmente esa competencia se encuentra asumida por todos los juzgados con competencia en lo Civil, comercial y Minería conforme lo determinado por Acuerdo General N°149/2022 que en la parte pertinente dice : 6.- Asignar a los Jueces y Juezas en lo Civil, Comercial y de Minería de la Primera Circunscripción Judicial, competencia en las causas previstas en el artículo 68 de la LP N° 2352-O, sin perjuicio de la que ya ejercen conforme el artículo 63 del mismo cuerpo normativo; 7.Asignar a la Señora Jueza con competencia en lo Contencioso Administrativo, el conocimiento en las causas previstas en el artículo 63 de la LP N° 2352-O, sin perjuicio de la que ya ejerce comprendida en el artículo 68 del mismo cuerpo normativo. Consecuentemente, la magistrada pasa a integrar el Sistema de Gestión Asociada Civil, quedando incorporada a la estructura de la OFIJU N° 1; siéndole aplicable en lo pertinente lo dispuesto en el Acuerdo General N° 245/2020 y Acuerdo de Superintendencia N° 142/2020, con el Manual de Funciones que lo integra. 2) Jueces Penales. En el fuero Penal se organiza conforme lo establece el art. 72 de la LOPJ, el que dispone: “En la Primera Circunscripción Judicial, además de los Jueces y Juezas de Flagrancia, Penales de la Niñez y Adolescencia, y de Ejecución Penal, hay Jueces y Juezas penales de Primera Instancia, a saber; Jueces y Juezas de Instrucción, Jueces y Juezas en lo Correccional y Jueces y Juezas de primera instancia del Colegio de Jueces, con las competencias que les conﬁeren las Leyes Nº 754-O y Nº 1851-O, respectivamente y sus modiﬁcatorias, además de aquellas que establezca la Corte de Justicia. Intertanto subsistan los sistemas procesales antes citados, la integración y funcionamiento de los juzgados de Instrucción, Correccionales, del Colegio de Jueces o Juezas y de Ejecución Penal, será dispuesta por reglamento dictado por la Corte de Justicia”.`
        },
        {
            id: 45,
            tema: "Texto 45",
            textoConErrores: `3) Jueces del Trabajo. La LOPJ en su artículo 70, dispone que los jueces del trabajo conocen en: 1) Las controversias individuales de derecho entre empleadorez y trabajadores, derivadas del contrato de trabajo o de una relación lavoral. 2) Las causas contenciosas en que se ejerciten acciones originadas en normas legales, reglamentarias o convencionales del derecho del trabajo, o fundadas en disposiciones del derecho común aplicables a aquél. 3) Las acciones de amparo, índividual o colectiva referida a las normas citadas en el párrafo precedente. 4) Los desalojos que se promuevan por la restitución de inmuebles o parte de ellos, concedidos a los trabajadores en virtud o como accesorios de los contratos de trabajo, sin perjuicio de las disposisiones especiales de los estatutos profesionales. 5) Las tercerias en los juicios de su competencia. 6) Las ejecuciones de los créditos laborales. 7) Los cobros de aportes, contribuciones y multas fundádas en disposiciones legales o reglamentarias del derécho del travajo con la limitación prevista por Ley Nacional Nº 24.642 y sus modiﬁcatorias, por cobro de impuestos y multas prosesales correspondientes o impuestas en las actuaciones judiciales tramitadas en el fuero. 8) De las causas que se promuevan para obtener la declaración de un derecho laboral, cuando el estado de incertidumbre respecto a una relación jurídica individual, de sus modalidades o de su interpretación, causa o pudíere causar un perjuicio a quien tenga un interés legítimo en determinarlo. 9) Las acciones originadas en hechos de violencia laboral en el ámbito privado. 10) Toda otra competencia que la Corte de Justicia pueda asignarle en ejercicio de sus atrivuciones 4) Jueces Pénales de la Niñez y adolescencia Lúego de la sanción de la ley 8194, que incórpora el proceso penal juvenil al Código Procesal Penal, la Corte de Justiciá, ordenara mediante Acuerdo General N.º 43/2015 que los Juzgados de Menores se denominarán Primer y Segundo Juzgado Penál de la Niñez y Adolescencia. A los jueces penales de la Niñez y Adolescencia les corresponde de modo exclusivo y excluyente la inbestigación y juzgamiento de los hechos delictivos en los que aparezcan ínvolucrados niños, niñás o adolescentes al momento de su comisión, sea o no punible de acuerdo a la Ley de fondo, y que el ejercicio de la competencia de investigación excluye la de juicio. En la LÓPJ la competencia de los Jueces pénales de la niñez y adolescencia se encuentra ﬁjada en sus arts. 74 y 75, los que disponen: ARTÍCULO 74.- Competencia: Los Jueces y Juezas Penales de Niñez y Adolescencia conocen en: 1) Los delitos de incumplimiento de deberes de asistencia familiar, siempre que existieran niños, niñas y adolescentes hafectados. 2) La Investigación y juzgamiento, de modo exclusivo y excluyente, de los hechos delictivos en los que aparezca involucrado un niño, niña o adolescente al momento de su comisión, sea o no punible de acuerdo a la ley de fondo. El ejercicio de la competencia de investigación excluye la de juicio. 3) En todos los procesos que tuvieren por ﬁnalidad réprimir o sansionar las transgresiones a las leyes protectoras de niños, niñas y adolescentes, las del trabajo de niños, niñas y adolescentes, y las de educación comun. 4)`,
            textoLimpio: `3) Jueces del Trabajo. La LOPJ en su artículo 70, dispone que los jueces del trabajo conocen en: 1) Las controversias individuales de derecho entre empleadores y trabajadores, derivadas del contrato de trabajo o de una relación laboral. 2) Las causas contenciosas en que se ejerciten acciones originadas en normas legales, reglamentarias o convencionales del derecho del trabajo, o fundadas en disposiciones del derecho común aplicables a aquél. 3) Las acciones de amparo, individual o colectiva referida a las normas citadas en el párrafo precedente. 4) Los desalojos que se promuevan por la restitución de inmuebles o parte de ellos, concedidos a los trabajadores en virtud o como accesorios de los contratos de trabajo, sin perjuicio de las disposiciones especiales de los estatutos profesionales. 5) Las tercerías en los juicios de su competencia. 6) Las ejecuciones de los créditos laborales. 7) Los cobros de aportes, contribuciones y multas fundadas en disposiciones legales o reglamentarias del derecho del trabajo con la limitación prevista por Ley Nacional Nº 24.642 y sus modiﬁcatorias, por cobro de impuestos y multas procesales correspondientes o impuestas en las actuaciones judiciales tramitadas en el fuero. 8) De las causas que se promuevan para obtener la declaración de un derecho laboral, cuando el estado de incertidumbre respecto a una relación jurídica individual, de sus modalidades o de su interpretación, causa o pudiere causar un perjuicio a quien tenga un interés legítimo en determinarlo. 9) Las acciones originadas en hechos de violencia laboral en el ámbito privado. 10) Toda otra competencia que la Corte de Justicia pueda asignarle en ejercicio de sus atribuciones 4) Jueces Penales de la Niñez y adolescencia Luego de la sanción de la ley 8194, que incorpora el proceso penal juvenil al Código Procesal Penal, la Corte de Justicia, ordenara mediante Acuerdo General N.º 43/2015 que los Juzgados de Menores se denominarán Primer y Segundo Juzgado Penal de la Niñez y Adolescencia. A los jueces penales de la Niñez y Adolescencia les corresponde de modo exclusivo y excluyente la investigación y juzgamiento de los hechos delictivos en los que aparezcan involucrados niños, niñas o adolescentes al momento de su comisión, sea o no punible de acuerdo a la Ley de fondo, y que el ejercicio de la competencia de investigación excluye la de juicio. En la LOPJ la competencia de los Jueces penales de la niñez y adolescencia se encuentra ﬁjada en sus arts. 74 y 75, los que disponen: ARTÍCULO 74.- Competencia: Los Jueces y Juezas Penales de Niñez y Adolescencia conocen en: 1) Los delitos de incumplimiento de deberes de asistencia familiar, siempre que existieran niños, niñas y adolescentes afectados. 2) La Investigación y juzgamiento, de modo exclusivo y excluyente, de los hechos delictivos en los que aparezca involucrado un niño, niña o adolescente al momento de su comisión, sea o no punible de acuerdo a la ley de fondo. El ejercicio de la competencia de investigación excluye la de juicio. 3) En todos los procesos que tuvieren por ﬁnalidad reprimir o sancionar las transgresiones a las leyes protectoras de niños, niñas y adolescentes, las del trabajo de niños, niñas y adolescentes, y las de educación común. 4)`

        {
            id: 46,
            tema: "Texto 46",
            textoConErrores: `En los delitos de violensia familiar regidos por Ley Nº 989-E, y modiﬁcatorias cuando el presunto agresor fuere niño, niña o adolescente. 5) En las causás contravéncionales cometidas por niñas, niños y adolessentes. 6) Causas siviles en trámite. En este caso mantendrá su competencia hasta que la totalidad de las niñas, niños o hadolescentes integrantes del grupo familiar adquieran la mayoria de edad. 7) Toda otra competencia que determine la Corte de Justicia conforme las necesidades de especialización que se evidencien. ARTÍCULO 75.- Competencia especial: Corresponde asimismo a los Jueces y juezas de niñez y adolescencia: 1) Ejercer la superintendencia y contralor sobre las niñas, niños o adolescentes que se hencuentren en situación de asilo, en establecimientos oﬁciales o privados, y disponer su internación por el tiempo que juzguen necesario. 2) Inspeccionar el trato dado a ellos, su asistencia médica, alimentaria e higiénica, y la educación que se les imparta, y adoptar las medidas que estimen oportunas para evitar los abusos o defectos que notaren. 3) Ejecutar los actos que fuesen pertinentes para la protección de las niñas, niños o adolescentes. 4) Efectuar visitas periódicas a los talleres, fábricas y otros establecimientos dondé trabajen niñas, niños o adolescentes, para asegurar el cumplimiento de las leyes, decretos y ordenanzas relativos a la protección de niñas, niños y adolescentes. 5) Promover por intermedio de la Corte de Justicia, la sanción de lelles, decretos y hordenanzas zobre la prótección de niñas, niños o adolescentes. 5 ) Jueces de Paz Letrados. Los Jueces y Juezas de Paz Létrados tienen los mismos deberes y facultades establecidos a los Magistrados y Magistradas de Primera Instancia. Contarán para el desenvolvimiento de sus funciones con la colaboración de los Funcionarios, Funcionarias y Agentes que la Corte de Justisia les asigne (art. 95 LOPJ). De acuerdo al territorio, la competensia se encuentra reglada en el Art. 88 de la LOPJ, que dispone: ARTÍCULO 88.- Competencia territorial: Habrá veinticinco (25) Jusgados de Paz Letrados en la Provincia con la siguiente competencia territorial: 1) Once (11) en el Gran San Juan, de los cuales, siete (7) tienen asiento en el Departamento Capital y uno (1) en cada uno de los Departamentos de Rawson, Chimbas, Rivadavia y Santa Lucia. El domicilio constituido dentro del radio de cualquiera de estós once (11) Jusgados de Paz, se tiene por válido en los restantes. 2) Un (1) Juzgado en los restantes Departamentos que puede estar integrado por más de un Juez o Jueza, cuyo asiento es ﬁjado por la Corte de Justicia. El ejercicio de la competencia que correzponda a los Jueces o Juezas de Paz Letrado puede ser actuado en formá unipersonal, o en la modalidad de gestión asociada con Colegio de Jueces, conforme lo reglamenté la Corte de Justicia. La competencia territorial de los Juzgados a que se reﬁere el inciso 2) de este artículo, en los asuntos exclusivamente patrimoniales, no es prorogable y el Juez o Jueza interviniente debe declarar su incompetencia aun sin petición de parte. En cuánto a la competencia materia, a todos los Jueces de Paz Letrados, les corresponde el conocimiento y decisión de: 1)`,
            textoLimpio: `En los delitos de violencia familiar regidos por Ley Nº 989-E, y modiﬁcatorias cuando el presunto agresor fuere niño, niña o adolescente. 5) En las causas contravencionales cometidas por niñas, niños y adolescentes. 6) Causas civiles en trámite. En este caso mantendrá su competencia hasta que la totalidad de las niñas, niños o adolescentes integrantes del grupo familiar adquieran la mayoría de edad. 7) Toda otra competencia que determine la Corte de Justicia conforme las necesidades de especialización que se evidencien. ARTÍCULO 75.- Competencia especial: Corresponde asimismo a los Jueces y juezas de niñez y adolescencia: 1) Ejercer la superintendencia y contralor sobre las niñas, niños o adolescentes que se encuentren en situación de asilo, en establecimientos oﬁciales o privados, y disponer su internación por el tiempo que juzguen necesario. 2) Inspeccionar el trato dado a ellos, su asistencia médica, alimentaria e higiénica, y la educación que se les imparta, y adoptar las medidas que estimen oportunas para evitar los abusos o defectos que notaren. 3) Ejecutar los actos que fuesen pertinentes para la protección de las niñas, niños o adolescentes. 4) Efectuar visitas periódicas a los talleres, fábricas y otros establecimientos donde trabajen niñas, niños o adolescentes, para asegurar el cumplimiento de las leyes, decretos y ordenanzas relativos a la protección de niñas, niños y adolescentes. 5) Promover por intermedio de la Corte de Justicia, la sanción de leyes, decretos y ordenanzas sobre la protección de niñas, niños o adolescentes. 5 ) Jueces de Paz Letrados. Los Jueces y Juezas de Paz Letrados tienen los mismos deberes y facultades establecidos a los Magistrados y Magistradas de Primera Instancia. Contarán para el desenvolvimiento de sus funciones con la colaboración de los Funcionarios, Funcionarias y Agentes que la Corte de Justicia les asigne (art. 95 LOPJ). De acuerdo al territorio, la competencia se encuentra reglada en el Art.
