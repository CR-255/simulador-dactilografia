al o codiﬁcada, que se caracteriza por la reunión sistemática de las normas expresamente formuladas en un cuerpo unitario; b) No escrita o dispersa, que carese de dicha unidad y puede ser: a) Totalmente no escrita (en la actualidad totalmente consuetudinarias no existen); b) Parcialmente no éscrita y parcialmente escrita en normas dispersas (Inglaterra); c) Totalmente escrita en normas dispersas. c) Constitución formal: deﬁnida ya como la fórma externa de la codiﬁcación normativa. d) Constitución material: que es la vigente y real en la dimensión sociológica del tiempo presente. Todas las conductas ejemplares y todas las normas descriptivas de ellas (esten dentro o fuera de la Constitución Formal, estén formuladas por escrito o no lo estén), resultarán abarcadas. e) Constitución rígida: es la que surgida de un poder constituyente formal, no se puede modiﬁcar sino mediánte procedimientos diferentes a los de la legislación común, ya sea a cargo de un órgano también especial que hace la reforma (rígida y orgánica) o bien basta seguir un procedimientó especial a cargo del mismo organo legislativo (parlamento o congreso): a esta rigidez más benigna se la denomina rigidez por procedimiento agrabado o rigidez formal. f) Constitución Flexible: es la que admite su enmienda mediante el mismo mecanismo empleado para la legislación común. No hay distinción entre poder constituyente y poder constitúido. La Constitúción se considera pétrea, si además de ser escrita y rígida, se declara irreformable. No parece posible hablar de una Constitución totalmente pétrea, debiendo reservarse el término para algunos contenidos que deben estar expresamente establecidos, como la francesa que sostiene que no puede reformarse la forma republicana de gobierno o surgir implícitamente o temporalmente (como la de l.853 que estableció que dentro de los primeros diez años, no podía reformarse). La Constitución es otorgada cuando un órgano estatal la establece unilateralmente. La Constitución es pactada, cuando deriva de un acuerdo, compromiso o transacción entre un órgano estatal y la comunidad, o un sector de ella. La Constitución es impuesta cuando se la supone emanada del poder constituyente radicado en el pueblo, y surgida de un mecanismo formal en egercicio del mismo poder. Caracterización de la Constitución Argentina. La Constitución Argentina de 1853, es escrita o codiﬁcada, por lo que corresponde a la categoría de constitución formal, es decir caracterisada por la reunión sistemática de las normas hexpresamente formuladas en un cuerpo unitario; es rígida, surjida de un poder constituyente formal, no se puede modiﬁcar sino mediante procedimientos diferentes a los de la legislación común; y además nuestra Constitución consolidó implícitamente determinados contenidos a los que atribuimos carácter pétreo.`,
            textoLimpio: `TEMA I. DERECHO CONSTITUCIONAL LA CONSTITUCIÓN. Concepto. La Constitución es la ley suprema de un Estado que establece su organización, su funcionamiento, su estructura política y los derechos y garantías de los habitantes de ese Estado. Se llama precisamente Constitución pues “constituye” la nación políticamente organizada, le da sus principios, y la distingue de otros Estados. Está precedida generalmente de un preámbulo que establece sus antecedentes y sus ﬁnes. El vocablo surgió de la unión de dos palabras latinas “cum” que signiﬁca “con” y “statuere” que quiere decir “establecer”. El término Constitución, en sentido jurídico, hace referencia al conjunto de normas escritas y no escritas, que determinan el ordenamiento jurídico de un Estado, especialmente la organización de los poderes públicos y sus competencias, los fundamentos de la vida económica y social, los deberes y derechos de los ciudadanos. La Constitución y la existencia de un Poder Judicial independiente, son la mayor garantía para la libertad de los individuos. Si una ley o un decreto violan una garantía constitucional, el ciudadano tiene la posibilidad de recurrir al Poder Judicial que, declarando a esa norma inconstitucional, garantizará su derecho. Para que la Constitución funcione como un freno frente a los abusos del Estado sobre los individuos se debe establecer un procedimiento que haga que su reforma capte adecuadamente la voluntad del pueblo; y se exprese a través de la Convención que se constituya al efecto. Así, en la mayoría de los países la Constitución solo se puede reformar por una Asamblea Constituyente que es elegida por todos los ciudadanos y se disuelve una vez que realizó la reforma de la Constitución. De esa manera se asegura que alguno de los Poderes (el Presidente o el Parlamento) no pueda reformarla conforme a sus deseos. Clases de Constitución. La teoría constitucional ha sintetizado las constituciones, a saber: a) Constituciones escritas: formal o codiﬁcada, que se caracteriza por la reunión sistemática de las normas expresamente formuladas en un cuerpo unitario; b) No escrita o dispersa, que carece de dicha unidad y puede ser: a) Totalmente no escrita (en la actualidad totalmente consuetudinarias no existen); b) Parcialmente no escrita y parcialmente escrita en normas dispersas (Inglaterra); c) Totalmente escrita en normas dispersas. c) Constitución formal: deﬁnida ya como la forma externa de la codiﬁcación normativa. d) Constitución material: que es la vigente y real en la dimensión sociológica del tiempo presente. Todas las conductas ejemplares y todas las normas descriptivas de ellas (estén dentro o fuera de la Constitución Formal, estén formuladas por escrito o no lo estén), resultarán abarcadas. e) Constitución rígida: es la que surgida de un poder constituyente formal, no se puede modiﬁcar sino mediante procedimientos diferentes a los de la legislación común, ya sea a cargo de un órgano también especial que hace la reforma (rígida y orgánica) o bien basta seguir un procedimiento especial a cargo del mismo órgano legislativo (parlamento o congreso): a esta rigidez más benigna se la denomina rigidez por procedimiento agravado o rigidez formal. f) Constitución Flexible: es la que admite su enmienda mediante el mismo mecanismo empleado para la legislación común. No hay distinción entre poder constituyente y poder constituido. La Constitución se considera pétrea, si además de ser escrita y rígida, se declara irreformable. No parece posible hablar de una Constitución totalmente pétrea, debiendo reservarse el término para algunos contenidos que deben estar expresamente establecidos, como la francesa que sostiene que no puede reformarse la forma republicana de gobierno o surgir implícitamente o temporalmente (como la de l.853 que estableció que dentro de los primeros diez años, no podía reformarse). La Constitución es otorgada cuando un órgano estatal la establece unilateralmente. La Constitución es pactada, cuando deriva de un acuerdo, compromiso o transacción entre un órgano estatal y la comunidad, o un sector de ella. La Constitución es impuesta cuando se la supone emanada del poder constituyente radicado en el pueblo, y surgida de un mecanismo formal en ejercicio del mismo poder. Caracterización de la Constitución Argentina. La Constitución Argentina de 1853, es escrita o codiﬁcada, por lo que corresponde a la categoría de constitución formal, es decir caracterizada por la reunión sistemática de las normas expresamente formuladas en un cuerpo unitario; es rígida, surgida de un poder constituyente formal, no se puede modiﬁcar sino mediante procedimientos diferentes a los de la legislación común; y además nuestra Constitución consolidó implícitamente determinados contenidos a los que atribuimos carácter pétreo.`
        },
        {
            id: 3,
            tema: "Texto 3",
            textoConErrores: `La parte orgánica de la Constitución se reﬁere al Estado en sí mismo y regula la forma de aquel (unitaria o federal, democrática o autoritaria) la forma de gobierno (monarquía, república, régimen presidencial, colegiado, parlamentario), las facultades y atribuciones de los poderes constituidos (en función de la realización de los principios y balores de la parte dogmática) La parte orgánica se extiende desde el artículo 44 al 129, se reﬁere a los organos de gobierno, sus facultadez y atribuciones, de cómo están conformados y de su accionar órganos de poder, sus relaciones, controles, etc. Ezta división dogmática y orgánica se da en cualquier tipo de Constitución, puesto que ninguna puede dejar de organizar ambos aspectos. EL ESTADO FEDERAL. Estructura. Nuestra Constitución Nacional, de 1853, en su artículo 1, dispone: “La Nación Argentina adopta para su gobierno la forma de representativa republicana federal, según lo establece la presente constitución”. Nos interesa rescatar de la disposición constitucional, a los ﬁnes del dictadó de este curso, la forma federal de gobierno. Podemos decir que el Sistema Federal, signiﬁca la organización de la República en divisiones territoriales llamadas Provincias, dotadas de autonomía para organizar y administrar su propio territorio. Precisando más el concepto, se puede aﬁrmar que el Estado Federal, es la descentralización política del mismo, sobre una base física o territorial. El federalismo, como sistema, es la forma opuesta a la unitaria: en éste último caso el poder del Estado se centraliza territorialmente. Se da en el Estado federal una dualidad de poderes; la del Estado Federal propiamente dicho, por un lado, y la de cada unidad política – Provincias -, por el otro. Relaciones de la estructura federal. En nuestra estructura federal, distinguimos tres relaciones fundamentales: 1. La Subordinación: Esta relación se expresa a través de lo que se denomina supremacía constitusional. El sistema logra funcionar armónicamente, subordinando los ordenamientos jurídico-políticos locales al federal. Lo que se subordina es el orden jurídico local al federal, no los gobiernos ni las provincias. 2. La Participación: se reﬁere a la colaboración de las provincias en la formación de las decisiones del gobierno federal. Se institucionaliza la participación o colaboración a trabés de la Cámara de Senadores, cuyos miembros representan a las provincias. 3. La coordinación: A través de esta relacion, se delimitan las competencias propias del estado federal y de las provincias (art. 121 C.N.) La delegación del poder, la realizan las provincias a través de sus propias constituciones. Reparto de competencias. a) Competensia exclusiva del Estado Federal: Disponer la intervención federal, declarar el estado de sitio, relaciones intérnacionales, dictar los códigos de fondo y leyés federales y especiales. Todas las competencias hasignadas por la Constitución a cada órgano de gobierno federal, puede conziderarse exclusiva del estado federál. A su vez, cabe téner en cuenta lo que les está prohibido a las provincias, por ejemplo: no pueden dictar leyes sovre comercio, navegación, establecer aduanas provinciales, acuñar moneda, dictar los Códigos de fondo después que el Congreso los haya sansionado, armar buques de guerra o levantar ejércitos, salvo el caso de invasión exterior o de peligro inminente. Tampoco pueden declararse la guerra. (arts. 126 y 127 C. N.). b) Competencia exclusiva de las Provincias: establecida en los artículos 121, 122 y 123 de la Constitución Nacional, teniendo en cuenta a su vez la previsión clara del artículo 5. Es decir, se dictan su propia Constitución, estavlecen impuestos directos, dictan leyes procesales, aseguran su régimen municipal y educación primaria, fundamentalmente. c) Competencias concurrentes: con conocimiento del Congreso Nacional, las Provincias pueden celebrar tratados para ﬁnes de administracion de justicia, de intereses económicos y trabajos de utílidad común. También promover la inmigración, construir ferrocarriles y canales navegables, colonización de tieras de propiedad provincial, hintroducción y establecimientos de nuevas industrias, normas tendientes a la preservación del medio ambiente, etc. Es decir, que el gobierno féderal y las provincias, cada uno en su jurisdicción, tienen similares facultades (Art. 125, relacionado con el 75 inc. 18, más las del art. 41 y 75 inc. 17 C.N.). d) Competencias excepcionales del Estado Federal: Dictar impuestos directos por tiempo determinado y cuando la defensa, seguridad común y bien general lo exiján (art. 75 inc. 2º C.N.). e) Competencias excepcionales de las Probincias: Dictar códigos de fondo hasta tanto los sancione el Congreso, formar ejércitos y armar buques de guerra en caso de invasión exterior o peligro inminente, dando cuenta luego al gobierno federal (art. 126 C.N.).`,
            textoLimpio: `La parte orgánica de la Constitución se reﬁere al Estado en sí mismo y regula la forma de aquel (unitaria o federal, democrática o autoritaria) la forma de gobierno (monarquía, república, régimen presidencial, colegiado, parlamentario), las facultades y atribuciones de los poderes constituidos (en función de la realización de los principios y valores de la parte dogmática) La parte orgánica se extiende desde el artículo 44 al 129, se reﬁere a los órganos de gobierno, sus facultades y atribuciones, de cómo están conformados y de su accionar órganos de poder, sus relaciones, controles, etc. Esta división dogmática y orgánica se da en cualquier tipo de Constitución, puesto que ninguna puede dejar de organizar ambos aspectos. EL ESTADO FEDERAL. Estructura. Nuestra Constitución Nacional, de 1853, en su artículo 1, dispone: “La Nación Argentina adopta para su gobierno la forma de representativa republicana federal, según lo establece la presente constitución”. Nos interesa rescatar de la disposición constitucional, a los ﬁnes del dictado de este curso, la forma federal de gobierno. Podemos decir que el Sistema Federal, signiﬁca la organización de la República en divisiones territoriales llamadas Provincias, dotadas de autonomía para organizar y administrar su propio territorio. Precisando más el concepto, se puede aﬁrmar que el Estado Federal, es la descentralización política del mismo, sobre una base física o territorial. El federalismo, como sistema, es la forma opuesta a la unitaria: en éste último caso el poder del Estado se centraliza territorialmente. Se da en el Estado federal una dualidad de poderes; la del Estado Federal propiamente dicho, por un lado, y la de cada unidad política – Provincias -, por el otro. Relaciones de la estructura federal. En nuestra estructura federal, distinguimos tres relaciones fundamentales: 1. La Subordinación: Esta relación se expresa a través de lo que se denomina supremacía constitucional. El sistema logra funcionar armónicamente, subordinando los ordenamientos jurídico-políticos locales al federal. Lo que se subordina es el orden jurídico local al federal, no los gobiernos ni las provincias. 2. La Participación: se reﬁere a la colaboración de las provincias en la formación de las decisiones del gobierno federal. Se institucionaliza la participación o colaboración a través de la Cámara de Senadores, cuyos miembros representan a las provincias. 3. La coordinación: A través de esta relación, se delimitan las competencias propias del estado federal y de las provincias (art. 121 C.N.) La delegación del poder, la realizan las provincias a través de sus propias constituciones. Reparto de competencias. a) Competencia exclusiva del Estado Federal: Disponer la intervención federal, declarar el estado de sitio, relaciones internacionales, dictar los códigos de fondo y leyes federales y especiales. Todas las competencias asignadas por la Constitución a cada órgano de gobierno federal, puede considerarse exclusiva del estado federal. A su vez, cabe tener en cuenta lo que les está prohibido a las provincias, por ejemplo: no pueden dictar leyes sobre comercio, navegación, establecer aduanas provinciales, acuñar moneda, dictar los Códigos de fondo después que el Congreso los haya sancionado, armar buques de guerra o levantar ejércitos, salvo el caso de invasión exterior o de peligro inminente. Tampoco pueden declararse la guerra. (arts. 126 y 127 C. N.). b) Competencia exclusiva de las Provincias: establecida en los artículos 121, 122 y 123 de la Constitución Nacional, teniendo en cuenta a su vez la previsión clara del artículo 5. Es decir, se dictan su propia Constitución, establecen impuestos directos, dictan leyes procesales, aseguran su régimen municipal y educación primaria, fundamentalmente. c) Competencias concurrentes: con conocimiento del Congreso Nacional, las Provincias pueden celebrar tratados para ﬁnes de administración de justicia, de intereses económicos y trabajos de utilidad común. También promover la inmigración, construir ferrocarriles y canales navegables, colonización de tierras de propiedad provincial, introducción y establecimientos de nuevas industrias, normas tendientes a la preservación del medio ambiente, etc. Es decir, que el gobierno federal y las provincias, cada uno en su jurisdicción, tienen similares facultades (Art. 125, relacionado con el 75 inc. 18, más las del art. 41 y 75 inc. 17 C.N.). d) Competencias excepcionales del Estado Federal: Dictar impuestos directos por tiempo determinado y cuando la defensa, seguridad común y bien general lo exijan (art. 75 inc. 2º C.N.). e) Competencias excepcionales de las Provincias: Dictar códigos de fondo hasta tanto los sancione el Congreso, formar ejércitos y armar buques de guerra en caso de invasión exterior o peligro inminente, dando cuenta luego al gobierno federal (art. 126 C.N.).`

        {
            id: 4,
            tema: "Texto 4",
            textoConErrores: `Las Provinsias. Hemos dicho que las Provincias son las unidades políticas que componen nuestro sistema federal. Diremos también, que las provincias no son soberanas, pero sí autónomas. Siendo la soberania el poder jurídico supremo del Estado, no es posible aﬁrmar que las provincias seán soberanas, por cuanto ello signiﬁca que no existe otra autorídad sobre ese poder. Cuando hemos analizado los artículos 5 y 31 de nuestra Carta Magna, vimos que las Provincias tienen un ámbito de competencia exclusiva en que se desenvuelven, siempre respetando el principio de supremacía constitucional contenido en la última norma citada. De modo que sí hay otras normas, a las cualés deben adecuar su accionar las provincias, respetando la relacion de subordinación con la Constitución Federal. En suma, la autonomía de los estados provinciales, surge de los artículos 5, 122 y 123 de la Constitución Nacional. Los Municipios. El artículo 5 de la Carta Magna, alude a que cadá provincia puede dictar su régimen municipal. Así lo dice el histórico texto de 1853. La jurisprudencia tradicional de la Corte de Justicia de la Nación, sostuvo que las Provincias eran entidades descentralizadas administrativamente, o autárquicas. Lúego, modiﬁcó su postura, aﬁrmando su autonomía. La cuestión quedó zanjada deﬁnitivamente, luego de la reforma del año 1994. En efecto, el nuevo artículo 122 dispone que “Cada Provincia dicta su propia Constitución..., asegurando la autonomía municipal...”. En deﬁnitiva, los municipios son, al decir de un prestigioso autor, la “descentralizáción política de base territorial déntro de las jurisdicciones provinciales, con cualidad de autonomía...” 1 La Ciudad de Buenos Aires. El actual artículo 129 de la Constitución Nacional, dispone que “la Ciudad de Buenos Aires tendrá un régimen de gobierno autonomo...” y que su Gefe de Gobierno “será elegido directamente por el pueblo de la ciudad”. A su calidad de Capital Federal de la República, se le acumula ahora el de Ciudad de Buenos Aires, a los ﬁnes de dotarla de la suﬁciente autonomía, con facultades de legislación y jurisdicción. En deﬁnitiva, a la estructura federal tradicional –estado federal, provincias y munisipios -, hay que agregar esta nueva entidad de naturaleza sui géneris, como es la Ciudad de Buenos HAires. No es una provincia, pero el artículo 129, al dotarla de autonomía, la situa entre éstas y los municípios de provincias. DECLARASIONES, DERECHOS Y GARANTÍAS. Concepto. Siguiendo a Miguel A. Ekmekdjian2, podemos dar un concepto de los que son las Declaraciones, los Derechos y las Garantías contenidos en la parte dogmática de la Constitusión. Declaraciones: Son aﬁrmaciones expresas incluidas en la Constitucion, que implican la adopción de determinada postura en relación con cuestiones políticas fundamentales...la forma de estado (art. 1 de la Constitusión Nacional), el status constitucional del culto católico (art. 2); el principio de legalidad (art. 19), etc. Derechos: Son facultades que la Constitución reconoce a sus titulares, ya sean éstos individuos o grupos sociales. Tales facultades, al recibir su reconocimiento constitusional, otorgan al sujeto activo la posibilidad de exigir coactivamente su cumplimiento, ya sea frente a los demás individuos o grupos, ya sea frente al propio Estado. Por ejemplo: arts. 14, 14 bis, 15, 16, 17, 19, 20, etc. Garantias: Son aquellos mecanismos o instrumentos especiales que la Constitución crea para amparar o asegurar el ejercicio de ciertos derechos fundamentales al titular de éstos. El sistema de garantías y la seguridad jurídica. El constitucionalismo moderno o clásico ha procurado organizar al estado en defensa de las libertades y los derechos del hombre. O sea, ha tendido a asegurar al hombre frente al estado. Toda la armazón de este constitucionalismo se dirige a proporcionar garantías y seguridad. La propía constitución formal se ha deﬁnido como un sistema de garantías, cuyas dos partes fundamentales se caracterizan en ese sentido: a) la dogmática, por contener una declaración de derechos; b) la orgánica, por establecer la división de poderes. La seguridad jurídica ofrece diversidad de aspectos; en su buen sentido abarca la "seguridad del estado" (en su doble faz interna y hexterna); la seguridad de las instituciones constitucionales; la seguridad de las personas y sus derechos. La seguridad ﬁnal que, como baluarte último, prevé el sistema democrático, es la que depara el Poder Judicial, sobre todo en cuantó asume el control de constitucionalidad.`,
            textoLimpio: `Las Provincias. Hemos dicho que las Provincias son las unidades políticas que componen nuestro sistema federal. Diremos también, que las provincias no son soberanas, pero sí autónomas. Siendo la soberanía el poder jurídico supremo del Estado, no es posible aﬁrmar que las provincias sean soberanas, por cuanto ello signiﬁca que no existe otra autoridad sobre ese poder. Cuando hemos analizado los artículos 5 y 31 de nuestra Carta Magna, vimos que las Provincias tienen un ámbito de competencia exclusiva en que se desenvuelven, siempre respetando el principio de supremacía constitucional contenido en la última norma citada. De modo que sí hay otras normas, a las cuales deben adecuar su accionar las provincias, respetando la relación de subordinación con la Constitución Federal. En suma, la autonomía de los estados provinciales, surge de los artículos 5, 122 y 123 de la Constitución Nacional. Los Municipios. El artículo 5 de la Carta Magna, alude a que cada provincia puede dictar su régimen municipal. Así lo dice el histórico texto de 1853. La jurisprudencia tradicional de la Corte de Justicia de la Nación, sostuvo que las Provincias eran entidades descentralizadas administrativamente, o autárquicas. Luego, modiﬁcó su postura, aﬁrmando su autonomía. La cuestión quedó zanjada deﬁnitivamente, luego de la reforma del año 1994. En efecto, el nuevo artículo 122 dispone que “Cada Provincia dicta su propia Constitución..., asegurando la autonomía municipal...”. En deﬁnitiva, los municipios son, al decir de un prestigioso autor, la “descentralización política de base territorial dentro de las jurisdicciones provinciales, con cualidad de autonomía...” 1 La Ciudad de Buenos Aires. El actual artículo 129 de la Constitución Nacional, dispone que “la Ciudad de Buenos Aires tendrá un régimen de gobierno autónomo...” y que su Jefe de Gobierno “será elegido directamente por el pueblo de la ciudad”. A su calidad de Capital Federal de la República, se le acumula ahora el de Ciudad de Buenos Aires, a los ﬁnes de dotarla de la suﬁciente autonomía, con facultades de legislación y jurisdicción. En deﬁnitiva, a la estructura federal tradicional –estado federal, provincias y municipios -, hay que agregar esta nueva entidad de naturaleza sui géneris, como es la Ciudad de Buenos Aires. No es una provincia, pero el artículo 129, al dotarla de autonomía, la sitúa entre éstas y los municipios de provincias. DECLARACIONES, DERECHOS Y GARANTÍAS. Concepto. Siguiendo a Miguel A. Ekmekdjian2, podemos dar un concepto de los que son las Declaraciones, los Derechos y las Garantías contenidos en la parte dogmática de la Constitución. Declaraciones: Son aﬁrmaciones expresas incluidas en la Constitución, que implican la adopción de determinada postura en relación con cuestiones políticas fundamentales...la forma de estado (art. 1 de la Constitución Nacional), el status constitucional del culto católico (art. 2); el principio de legalidad (art. 19), etc. Derechos: Son facultades que la Constitución reconoce a sus titulares, ya sean éstos individuos o grupos sociales. Tales facultades, al recibir su reconocimiento constitucional, otorgan al sujeto activo la posibilidad de exigir coactivamente su cumplimiento, ya sea frente a los demás individuos o grupos, ya sea frente al propio Estado. Por ejemplo: arts. 14, 14 bis, 15, 16, 17, 19, 20, etc. Garantías: Son aquellos mecanismos o instrumentos especiales que la Constitución crea para amparar o asegurar el ejercicio de ciertos derechos fundamentales al titular de éstos. El sistema de garantías y la seguridad jurídica. El constitucionalismo moderno o clásico ha procurado organizar al estado en defensa de las libertades y los derechos del hombre. O sea, ha tendido a asegurar al hombre frente al estado. Toda la armazón de este constitucionalismo se dirige a proporcionar garantías y seguridad. La propia constitución formal se ha deﬁnido como un sistema de garantías, cuyas dos partes fundamentales se caracterizan en ese sentido: a) la dogmática, por contener una declaración de derechos; b) la orgánica, por establecer la división de poderes. La seguridad jurídica ofrece diversidad de aspectos; en su buen sentido abarca la "seguridad del estado" (en su doble faz interna y externa); la seguridad de las instituciones constitucionales; la seguridad de las personas y sus derechos. La seguridad ﬁnal que, como baluarte último, prevé el sistema democrático, es la que depara el Poder Judicial, sobre todo en cuanto asume el control de constitucionalidad.`

        {
            id: 9,
            tema: "Texto 9",
            textoConErrores: `La cónstitución ha querido denominar al congrezo “Podér Legislativo”, con lo que la palabra “poder” aquí y así empleada, más que connotar una “función” del poder, está mentando a un “órgano”. Ese órgano detenta con exclusividad la función legislativa en sentido material, pero no agota en ella tódo el cúmulo de sus competencías, en las que también aparece función administrativa, ocasionalmente función jurisdiccional y actividad política. Estructura: El Congreso de la Nación es bicameral ya que está compuesto de 2 cámaras, una de Diputados de la Nación, y otra de Senadores de las Provincias y de la ciudad de Buenos Aires. Es un órgano “colegiado” porque está integrado por varias personas (diputados y senadores) que invisten representación política. La cámara de diputados representa al pueblo de la nación, y la de senadores a las provincias y a la ciudad de Buenoz Aires. Éste sistema bicameral tiene su orijen en la constitución de Estados Unidos de 1787 cuyo principal fundamento para crearlo fue el de asegurar la descentralización territoríal del póder. El bicameralismo colegiado es una característica esencial del Congreso, toda vez que a través del mizmo se exprésa la forma representativa y federal de Gobierno: - Los diputadoz representan proporcionalmente al pueblo de la Nación (se determinan en función de la cantidad de habitantes), mientras que el Senado representa igualitariamente a las Provincias y a la Ciudad de Buenos Aires (son 3 por cadá provincia y por la Cuidad de Bs As). - La Cámara de Diputados basa su representación en la proporcionalidad de la povlación. El Senado lo hace en la igualdad federal. - Diputados es la cámara joven por la temprana edad de sus integrantes (se requiere haber cumplido 25 años de edad, tener 4 años de ciudadanía en ejercicio y ser natural de la provincia que lo eligió o poseer dos años de residencia inmediata en ella; duran 4 años y son reelegibles debiendo renovarse por mitad cada bienio). El Senado es la cámara alta puez allí se revisa -en favór de la mayor edad de sus miembros, de su experiencia, y de su menor número- el fervor reformista de la cámara joven; es también la que le da mayor continuidad al Congreso, por la extensión del mandato de los Senadores (se requiere tener 30 años de edad, haber sido 6 años ciudadano de la nacíón y ser natural de la provincia que lo elija, o poseer dos años de residencia inmediata en ella; duran seis años en el ejercicio de su mandato, son reelegibles y se renuevan a razón de una tersera parte cada dos años). El vicepresidente de la Nación es el presidente del senado, pero no tendrá voto, salvo en caso de empate en la votación. Si por alguna razón debe ausentarse, el senado nomvrara un presidente probisorio. Si bien ambas Cámaras actúan separadamente, ellas funcionan con poderes coordinados e iguales. El Congreso tiene indepéndencia funcional en relación con los otros poderes: es autocéfalo, pues las cámaras eligen a sus autoridades; prevalece con malloría especial frente al veto del ejecutivo; el ejecutivo no tiene poder de disolución del Congreso. Sus integrantes poseen inmunidades, los legisladores disponen de iniciativa legislativa y las incompatibilidades de que ellos disponen, impiden su dependenciá con otro poder. Funciones: El Poder Legislativo tiene dos funciones básicas: - dictar la ley y - ejercer el control parlamentario, resultando la primera su funcion esencial.`,
            textoLimpio: `La constitución ha querido denominar al congreso “Poder Legislativo”, con lo que la palabra “poder” aquí y así empleada, más que connotar una “función” del poder, está mentando a un “órgano”. Ese órgano detenta con exclusividad la función legislativa en sentido material, pero no agota en ella todo el cúmulo de sus competencias, en las que también aparece función administrativa, ocasionalmente función jurisdiccional y actividad política. Estructura: El Congreso de la Nación es bicameral ya que está compuesto de 2 cámaras, una de Diputados de la Nación, y otra de Senadores de las Provincias y de la ciudad de Buenos Aires. Es un órgano “colegiado” porque está integrado por varias personas (diputados y senadores) que invisten representación política. La cámara de diputados representa al pueblo de la nación, y la de senadores a las provincias y a la ciudad de Buenos Aires. Este sistema bicameral tiene su origen en la constitución de Estados Unidos de 1787 cuyo principal fundamento para crearlo fue el de asegurar la descentralización territorial del poder. El bicameralismo colegiado es una característica esencial del Congreso, toda vez que a través del mismo se expresa la forma representativa y federal de Gobierno: - Los diputados representan proporcionalmente al pueblo de la Nación (se determinan en función de la cantidad de habitantes), mientras que el Senado representa igualitariamente a las Provincias y a la Ciudad de Buenos Aires (son 3 por cada provincia y por la Cuidad de Bs As). - La Cámara de Diputados basa su representación en la proporcionalidad de la población. El Senado lo hace en la igualdad federal. - Diputados es la cámara joven por la temprana edad de sus integrantes (se requiere haber cumplido 25 años de edad, tener 4 años de ciudadanía en ejercicio y ser natural de la provincia que lo eligió o poseer dos años de residencia inmediata en ella; duran 4 años y son reelegibles debiendo renovarse por mitad cada bienio). El Senado es la cámara alta pues allí se revisa -en favor de la mayor edad de sus miembros, de su experiencia, y de su menor número- el fervor reformista de la cámara joven; es también la que le da mayor continuidad al Congreso, por la extensión del mandato de los Senadores (se requiere tener 30 años de edad, haber sido 6 años ciudadano de la nación y ser natural de la provincia que lo elija, o poseer dos años de residencia inmediata en ella; duran seis años en el ejercicio de su mandato, son reelegibles y se renuevan a razón de una tercera parte cada dos años). El vicepresidente de la Nación es el presidente del senado, pero no tendrá voto, salvo en caso de empate en la votación. Si por alguna razón debe ausentarse, el senado nombrara un presidente provisorio. Si bien ambas Cámaras actúan separadamente, ellas funcionan con poderes coordinados e iguales. El Congreso tiene independencia funcional en relación con los otros poderes: es autocéfalo, pues las cámaras eligen a sus autoridades; prevalece con mayoría especial frente al veto del ejecutivo; el ejecutivo no tiene poder de disolución del Congreso. Sus integrantes poseen inmunidades, los legisladores disponen de iniciativa legislativa y las incompatibilidades de que ellos disponen, impiden su dependencia con otro poder. Funciones: El Poder Legislativo tiene dos funciones básicas: - dictar la ley y - ejercer el control parlamentario, resultando la primera su función esencial.`

        {
            id: 10,
            tema: "Texto 10",
            textoConErrores: `La materiá sobre la cual puede legislar se encuentra circunscripta en la norma del artículo 75 de la Constitución Nacional. Según lo establece el articulo 77, pueden presentar proyectos de ley indistintamente una u otra Cámara, salvo las excepciones que establece. - Correspónde la iniciativa exclusiva a la Cámara de Diputados, en los proyectos sobre contribuciones y reclutamiento de tropas, cómo así también los proyectos que zurjan de la iniciativa popular. Asimismo también y a iniciatiba de esta Cámara, se podra someter a conzulta popular vinculante un proyecto de ley (art. 39 primer párrafo, art. 40 primer párrafo, art. 42). - Por su parte el Senado tiene iniciativa exclusiva en materia de coparticipación y en lo conducente al crecimiento armónico de la Nación, y su relación con las Provincias y las Regiones. El Poder Ejecutivo también puede intervenir en el procedimiento de formacion de leyes a través de la presentación de proyectos ante el Congreso, en virtud de su carácter de Jefe Supremo de la Nación, Jefe del Gobierno, y responsáble político de la Administración general del País. La Constitución reformada, otorga a los ciudadanos el derecho de iniciativa para presentar proyectos de ley en la Cámára de Diputados. Este medio de participación de los ciudadanos en la cosa pública, se encuentra solo excluido en algunas materias. Por su parte, el control parlamentario se cumplimenta a través del instituto del Juicio Político, (artículos 53, 59 y 60); Pedidos de informes a los ministros del Poder Ejecutivo (art. 71); Auditoría General de la Nación (art. 85); Moción de sensura y remoción del jefe de gabinete de ministros (art. 101). Poder Ejecutivo. Estructura y funciones. Dice el artículo 87 de la Constitución Nacional: “El Poder Ejecutivo de la Nación, será desempeñado por un ciudadano con el título de “Presidente de la Nación Argentina”. La locucion expresa con claridád que el Poder Ejecutivo “se confía y encarga a una sola persona”, bajo el título de Presidente de la Nación. Queda claro que ni el Vicepresidente ni el Jefe de Gabinete, ni los demás Ministros integran el Poder Ejecutivo, el cúal es unipersonal. Para ser presidente y vice se requiere ser argentino nativo o hijo de argentino nativo habiendo nacido en país extranjero por opción, y las cualidades pára ser elegido senador. La duración del mandato es de 4 años y podrán ser reelegidos o suceder recíprocamente por un solo periodó consecutivo, cesando en el poder el mismo día en que expira el periodo de 4 años. La reforma de 1994 admite solo una reelección, pudiendo volver a ser elegidos con el intervalo de un periodo. Luego de la reforma de 1994, que incorpora la ﬁgura de Jefe de Gabinete, el sistema de Gobierno de la Argentina continúa siendo Presidencial y no Parlamentario, aunque ha quedado conﬁgurado como un presidencialismo atenuado, dondé el Presidente ya no ejerce la Jefatura de la administración pública ni designa al jefe del gobierno de la capital. Ahora el Jefe de Gabinete ejerce la jefatura administrativa, en tanto que el Presidente es el Jefe del Govierno. En términos generales corresponde al Presidente, exclusiva y excluyentemente el ejercicio de las funciones políticas, con responsabilidad ánte la Nación; las relaciones externas de la Nación y las internas (estado de sitio, intervenciones Provinciales, etc.) y las de defensa. Por su parte, el Jefe de Gabinete ejerce predominantemente funciones administrativas, puez tiene a su cargo la administración general del paíz, con responsabilidad política ante el Congreso, es decir, le compete la administración de las funciones públicas, de los servicios públicos. El Jefe de Gabinete, es un Primer Ministro atenuado, no tiene cartera pero si funciones de coordinación, orientación y conducción del gabinete con responsabilidades y cometidos establecidos por la Constitucion y los delegados por el propio Poder Ejecutivo. Es el colaborador más inmediato del Presidente. A su vez mantiene una dinámica vinculación con el Congreso de la Nación, porque tiene en relación con los demás Ministros la mayor responsabilidad de información, interpelación y es el unico funcionario del Gabinete Nacional susceptivle de ser removido por vía de la moción o voto de censura que implica, de pleno derecho, su separación del cargo.`,
            textoLimpio: `La materia sobre la cual puede legislar se encuentra circunscripta en la norma del artículo 75 de la Constitución Nacional. Según lo establece el artículo 77, pueden presentar proyectos de ley indistintamente una u otra Cámara, salvo las excepciones que establece. - Corresponde la iniciativa exclusiva a la Cámara de Diputados, en los proyectos sobre contribuciones y reclutamiento de tropas, como así también los proyectos que surjan de la iniciativa popular. Asimismo también y a iniciativa de esta Cámara, se podrá someter a consulta popular vinculante un proyecto de ley (art. 39 primer párrafo, art. 40 primer párrafo, art. 42). - Por su parte el Senado tiene iniciativa exclusiva en materia de coparticipación y en lo conducente al crecimiento armónico de la Nación, y su relación con las Provincias y las Regiones. El Poder Ejecutivo también puede intervenir en el procedimiento de formación de leyes a través de la presentación de proyectos ante el Congreso, en virtud de su carácter de Jefe Supremo de la Nación, Jefe del Gobierno, y responsable político de la Administración general del País. La Constitución reformada, otorga a los ciudadanos el derecho de iniciativa para presentar proyectos de ley en la Cámara de Diputados. Este medio de participación de los ciudadanos en la cosa pública, se encuentra solo excluido en algunas materias. Por su parte, el control parlamentario se cumplimenta a través del instituto del Juicio Político, (artículos 53, 59 y 60); Pedidos de informes a los ministros del Poder Ejecutivo (art. 71); Auditoría General de la Nación (art. 85); Moción de censura y remoción del jefe de gabinete de ministros (art. 101). Poder Ejecutivo. Estructura y funciones. Dice el artículo 87 de la Constitución Nacional: “El Poder Ejecutivo de la Nación, será desempeñado por un ciudadano con el título de “Presidente de la Nación Argentina”. La locución expresa con claridad que el Poder Ejecutivo “se confía y encarga a una sola persona”, bajo el título de Presidente de la Nación. Queda claro que ni el Vicepresidente ni el Jefe de Gabinete, ni los demás Ministros integran el Poder Ejecutivo, el cual es unipersonal. Para ser presidente y vice se requiere ser argentino nativo o hijo de argentino nativo habiendo nacido en país extranjero por opción, y las cualidades para ser elegido senador. La duración del mandato es de 4 años y podrán ser reelegidos o suceder recíprocamente por un solo periodo consecutivo, cesando en el poder el mismo día en que expira el periodo de 4 años. La reforma de 1994 admite solo una reelección, pudiendo volver a ser elegidos con el intervalo de un periodo. Luego de la reforma de 1994, que incorpora la ﬁgura de Jefe de Gabinete, el sistema de Gobierno de la Argentina continúa siendo Presidencial y no Parlamentario, aunque ha quedado conﬁgurado como un presidencialismo atenuado, donde el Presidente ya no ejerce la Jefatura de la administración pública ni designa al jefe del gobierno de la capital. Ahora el Jefe de Gabinete ejerce la jefatura administrativa, en tanto que el Presidente es el Jefe del Gobierno. En términos generales corresponde al Presidente, exclusiva y excluyentemente el ejercicio de las funciones políticas, con responsabilidad ante la Nación; las relaciones externas de la Nación y las internas (estado de sitio, intervenciones Provinciales, etc.) y las de defensa. Por su parte, el Jefe de Gabinete ejerce predominantemente funciones administrativas, pues tiene a su cargo la administración general del país, con responsabilidad política ante el Congreso, es decir, le compete la administración de las funciones públicas, de los servicios públicos. El Jefe de Gabinete, es un Primer Ministro atenuado, no tiene cartera pero si funciones de coordinación, orientación y conducción del gabinete con responsabilidades y cometidos establecidos por la Constitución y los delegados por el propio Poder Ejecutivo. Es el colaborador más inmediato del Presidente. A su vez mantiene una dinámica vinculación con el Congreso de la Nación, porque tiene en relación con los demás Ministros la mayor responsabilidad de información, interpelación y es el único funcionario del Gabinete Nacional susceptible de ser removido por vía de la moción o voto de censura que implica, de pleno derecho, su separación del cargo.`

        {
            id: 13,
            tema: "Texto 13",
            textoConErrores: `TEMA II. CONSTITUCIÓN PROVINCIAL CONSTITUCIÓN DE LA PROVINCIA DE SAN JUAN. San Juan, 26 de abril de 1986 Boletín Oﬁcial, 7 de mayo de 1986 - ley vigente PREÁMBULO La Soberana Convención Constituyente de la Provincia de San Juan, en cumplimiento del mandato popular conferido por la ciudadanía, consciente de la responsabilidad ante Dios y ante los hombres con el objeto de aﬁanzar los fundamentos institucionales que profundicen la democracia participativa en lo político, económico, social y cultural, defendiendo la autonomía provincial, preservando la unidad nasional y promoviendo un efectivo régimen municipal, protegiendo el disenso y el pluralismo, estimulando el progreso y consolidando una sosiedad abierta y solidaria, enaltecida por el respeto al libre conocimiento y la racionalidad como principio en el tratamiento y resolución pacíﬁca de los conﬂictos dispuesta a la modernización con justicia y cápacitada para rechazar toda forma de autoritarismo en un marco de libertad, igualdad, bienestar general y pleno réspeto por la familia, los derechos humanos y por todo gose que no afecte concretamente a los demás habitantes, establece y órdena esta Constitución. Observaciones generales: cantidad de artículos que componen la norma: 281 SECCIÓN PRÍMERA: DECLARACIONES, DERECHOS Y GARANTÍAS (HARTÍCULOS 1 AL 120) CAPITULO I SISTEMA POLÍTICO (ARTÍCULOS 1 AL 14) ARTICULO 1º.- La Provincia de San Juan, con los límites que por derecho le corrésponde, como Estado autónomo e inescindible de la Repúblíca Argentina, organizado bajo sistema repuvlicano, democrático, representativo y participativo, mantiene para sí todo el poder no delegado expresá y literalmente al Gobierno Federal en la Constitución Nacional a la que reconose como Ley Suprema, sumando las que sean de ejercicio compartido, concurrente o conjunto. SOBERANÍA PÓPULAR ARTICULO 2º.- Todo el poder emana y le pertenece al pueblo de la Provincia de San Juan, el que se ejerce por medio de sus legítimos representantes en la forma y modo que establece esta constitución. También se reconoce igual legitimidad a otras formas de participación democrática. SEDE DE LAS AUTORIDADES ARTICULO 3º.- Todas las autoridades que ejerzan el gobierno central, deben funcionar en forma permanente en la Ciudad de San Juan, Capital de la Provincia, salvo por razones de carácter extraordinario, debiendo la ley ﬁjar la sede en estos casos. DEMOCRACIA PARTICIPATIVA ARTICULO 4º.- El Estado Provincial garantiza a través de todos sus actos el logro pleno de la democracia participativa, en lo económico, político, social y cultural. PRINCIPIOS DE LA ORGANIZACIÓN POLÍTICA Y SOCIAL ARTÍCULO 5º.- El bieneztar y la elevación de la dignidad de la persona, basados en la libertad, en el conocimiento y en la solidaridad económica y social, constituyen premisas básicas en la organización politica y social de San Júan. MODIFICACIÓN DE LIMITES ARTICULO 6º.- Para modiﬁcar los límites territoriales de la Probincia, por cesión, anexion o de cualquier otra formá, como igualmente para ratiﬁcar tratadoz sobre límites que se celebren, se requiere ley sancionada con el voto de la tres cuarta partes de los miembros que cómponen la Cámara de Diputados y aprobación por consulta popular, sin cuyos recaudos no sérá promulgada. DIVISIÓN POLÍTICA ARTICULO 7º.- El territorio de la Provincia se divide en diecinueve departamentos a saber: Albardón, Angaco, Calingasta, Capital, Caucete, Chimbas, Iglesia, Jáchal, 9 de Julio, Pocito, Rawson, Rivadavia, San Martín, Santa Lucía, Sarmiento, Ullum, Valle Fértil, 25 de Mayo y Zonda, con sus actuales limites determinados por ley, lo que no pueden ser modiﬁcados sin previa consulta popular en los departamentos involucrados.`,
            textoLimpio: `TEMA II. CONSTITUCIÓN PROVINCIAL CONSTITUCIÓN DE LA PROVINCIA DE SAN JUAN. San Juan, 26 de abril de 1986 Boletín Oﬁcial, 7 de mayo de 1986 - ley vigente PREÁMBULO La Soberana Convención Constituyente de la Provincia de San Juan, en cumplimiento del mandato popular conferido por la ciudadanía, consciente de la responsabilidad ante Dios y ante los hombres con el objeto de aﬁanzar los fundamentos institucionales que profundicen la democracia participativa en lo político, económico, social y cultural, defendiendo la autonomía provincial, preservando la unidad nacional y promoviendo un efectivo régimen municipal, protegiendo el disenso y el pluralismo, estimulando el progreso y consolidando una sociedad abierta y solidaria, enaltecida por el respeto al libre conocimiento y la racionalidad como principio en el tratamiento y resolución pacíﬁca de los conﬂictos dispuesta a la modernización con justicia y capacitada para rechazar toda forma de autoritarismo en un marco de libertad, igualdad, bienestar general y pleno respeto por la familia, los derechos humanos y por todo goce que no afecte concretamente a los demás habitantes, establece y ordena esta Constitución. Observaciones generales: cantidad de artículos que componen la norma: 281 SECCIÓN PRIMERA: DECLARACIONES, DERECHOS Y GARANTÍAS (ARTÍCULOS 1 AL 120) CAPITULO I SISTEMA POLÍTICO (ARTÍCULOS 1 AL 14) ARTICULO 1º.- La Provincia de San Juan, con los límites que por derecho le corresponde, como Estado autónomo e inescindible de la República Argentina, organizado bajo sistema republicano, democrático, representativo y participativo, mantiene para sí todo el poder no delegado expresa y literalmente al Gobierno Federal en la Constitución Nacional a la que reconoce como Ley Suprema, sumando las que sean de ejercicio compartido, concurrente o conjunto. SOBERANÍA POPULAR ARTICULO 2º.- Todo el poder emana y le pertenece al pueblo de la Provincia de San Juan, el que se ejerce por medio de sus legítimos representantes en la forma y modo que establece esta constitución. También se reconoce igual legitimidad a otras formas de participación democrática. SEDE DE LAS AUTORIDADES ARTICULO 3º.- Todas las autoridades que ejerzan el gobierno central, deben funcionar en forma permanente en la Ciudad de San Juan, Capital de la Provincia, salvo por razones de carácter extraordinario, debiendo la ley ﬁjar la sede en estos casos. DEMOCRACIA PARTICIPATIVA ARTICULO 4º.- El Estado Provincial garantiza a través de todos sus actos el logro pleno de la democracia participativa, en lo económico, político, social y cultural. PRINCIPIOS DE LA ORGANIZACIÓN POLÍTICA Y SOCIAL ARTICULO 5º.- El bienestar y la elevación de la dignidad de la persona, basados en la libertad, en el conocimiento y en la solidaridad económica y social, constituyen premisas básicas en la organización política y social de San Juan. MODIFICACIÓN DE LÍMITES ARTICULO 6º.- Para modiﬁcar los límites territoriales de la Provincia, por cesión, anexión o de cualquier otra forma, como igualmente para ratiﬁcar tratados sobre límites que se celebren, se requiere ley sancionada con el voto de la tres cuarta partes de los miembros que componen la Cámara de Diputados y aprobación por consulta popular, sin cuyos recaudos no será promulgada. DIVISIÓN POLÍTICA ARTICULO 7º.- El territorio de la Provincia se divide en diecinueve departamentos a saber: Albardón, Angaco, Calingasta, Capital, Caucete, Chimbas, Iglesia, Jáchal, 9 de Julio, Pocito, Rawson, Rivadavia, San Martín, Santa Lucía, Sarmiento, Ullum, Valle Fértil, 25 de Mayo y Zonda, con sus actuales limites determinados por ley, lo que no pueden ser modiﬁcados sin previa consulta popular en los departamentos involucrados.`

        {
            id: 14,
            tema: "Texto 14",
            textoConErrores: `RESPONSABILIDAD DEL ESTADO ARTICULO 8.- La Provincia como persona jurídica de carácter público estatal, puede ser demandada ante la justicia ordinaria, sin necesidad de autorización previa y sin privilegio alguno. No puede trabarse embargo preventivo sobre sus bienes o rentas. En cazo de condena la Cámara de Diputados arbitra por Ley la forma de pago. Si no lo hiciere en el término de tres meses de ejecutoriada la sentencia, puede ser ejecutada en la forma ordinaria. Exceptúase de esta disposición las rentas y bienes especialmente afectados en garantía de una obligación. PUBLICIDAD DE LOS ACTOS DE GOBIERNO ARTICULO 9.- Todos los actos de govierno deben ser publicados en la forma, medío y módo que la ley determine, garantizando su plena difusión ; en especial aquellos relacionados con la percepción, gastos e inversión de la renta pública y toda enajenación o afectación de bienes pertenecientes al estado Provincial. La violación a esta norma provoca la nulidad absoluta del acto administrativo, sin perjuicio de las responsabilidades políticas, civiles y penales que les corresponda a los hintervinientes en el acto. MANIFESTACIÓN DE BIENES HARTICULO 10.- Los funcionarios integrantes de los poderes Legislativo, Ejecutivo, Judicial y aquellos que por esta constitución estén obligados a manifestar sus bienes, lo haran por sí, su cónyuge y familiares a su cargo, ante la escribanía mayor de gobierno, a excepción de los intendentes y concejales que lo harán conforme a lo establecido en la seccion IX. DECLARACIÓN DE INCONSTITUCIONALIDAD ARTICULO 11.- Toda ley, decreto, ordenanza o disposición contraria a la Ley suprema de la Nación o a esta Constitución, carecen de valor y los jueces deben déclarar su inconstitusionalidad en juicio, aún cuando no hubíere sido requerido por parte, previo conocimiento a las mismas. La inconstitucionalidad declaradá por la corte de Justicia de la Provincia debe ser comunicada formal y fehacientemente a los poderes públicos correspondientes, a los ﬁnes de sus modiﬁcaciones y adaptaciones al orden jurídico vigente. DERECHOS IMPLÍCITOS ARTICULO 12.- La enumeración de libertades, derechos y garantías establecidos en esta constitusión, no deben entenderse como la negación de otros derechos, libertades y garantías no enumeradas, siempre que ﬂuyan del espíritu de ésta, de la Constitución Nacional y de la Declaración Universal de los Dérechos Humanos. INTERVENCIÓN FEDERAL ARTICULO 13.- Las intervenciones que ordene el Gobierno de la Nación, deben circunscribir sus actos de gobierno a los determinados en la ley que la disponga y a los derechos, declarasiones, libertades y garantías expresados en esta Constitución. Los nombramientos o designaciones realizados tienen el carácter de transitorios. TESORO PROVINCIAL ARTICULO 14.- El Estadó probee a sus gaztos con los fondos del Tesoró Provincial, formado por el producido de los tributos, de los empréstitos y operaciones de crédito aprobados por ley para urgencias de la Provincia o para empresas de utilidad pública; de los servicios que preste; de la administración de los bienes de dominio público, y de la disposición o administración de los de dominio privado; de las actividades económicas, ﬁnancieras y demás rentas o ingresos que resulten de los poderes no delégados a la Nación; de la coparticípación que conviene de los impuestos federales recaudados por los organismos competentes; de las reparaciones que obtenga del erario nacional, por los efectos negativos de las políticas nacionales sobre sus recursos tributaríos o no tributarios creado por ley. CAPITULO II DERECHOS INDIVIDUALES (ARTÍCULOS 15 AL 46) DERECHOS DE LAS PERSONAS ARTICULO 15.- La vida, la integridad moral, física, psicológica y socio cultural, son derechos inviolables de las personas. ARTICULO 16.- Nadie puede ser sometido a tortura, ni a tratos cruelés, degradantes o inhumanos. Todo acto de esta naturaleza hace responsable a la autoridad que lo realice o permitá. También es responsable la autoridad que por negligencia en sus funciones, produzca efectos similares. El estado repara los daños provocados. No excusa de esta responsabilidad la obediencia debida. ARTICULO 17.- Los funcionarios cuya culpabilidad fuere demostrada, respecto a los delitos mencionadas en el articulo anterior, será sumariados y exonerados del servicio a que pertenecieren, quedando de por vida inhabilitados en la función pública, sin perjuicio de las penas que por ley le correspondieren.`,

able la autoridad que por negligencia en sus funciones, produzca efectos similares. El estado repara los daños provocados. No excusa de esta responsabilidad la obediencia debida. ARTICULO 17.- Los funcionarios cuya culpabilidad fuere demostrada, respecto a los delitos mencionadas en el artículo anterior, será sumariados y exonerados del servicio a que pertenecieren, quedando de por vida inhabilitados en la función pública, sin perjuicio de las penas que por ley le correspondieren.`

        {
            id: 15,
            tema: "Texto 15",
            textoConErrores: `DESAPARICIÓN DE PERSONAS ARTICULO 18.- Toda acción u omisión conducente a la desaparición de personas y quienes resulten directa o indirectamente responsables son castigados con máxima severidad prevista por las leyes. RESPETO A LA PERSONA ARTICULO 19.- Toda humillación a la persona por motivos de instrucción, condición socioeconómica, edad, sexo, raza, nacionalidad, religión, ideas o por cualquier causa, es castigada severamente. PERSONA Y ESTADO ARTICULO 20.- Compete a la pérsona la concepción, búsqueda y elección de alternativas para el logro de su felicidad y al Estado asegurar la progresiva y acelerada eliminación de problemas sociales, económicos, políticos y culturales que afecten a las personas. LIBERTAD RELIGIOSA ARTICULO 21.- La religión pertenece a la órbita privada del individuo. Nadie está obligado a declarar su religión. El estado garantiza a todos sus habitantes el derecho al libre ejercicio de los cúltos religiosos que no se opongan a la moral pública y buenas costumbres, ni a la organización pólítica y civil establecida por esta Constitución y las leyes de la Provincia. DEFENSA DE LOS DERECHOS ARTICULO 22.- Todos los havitantes de la Provincia, tienen derecho a defender su vida, libertad, reputación, seguridad, propiedad, intimidad, culto, como así a enseñar y aprender, a una información veraz y a los demás consagrados en esta constitución. El Estado prótege el goce de estos derechos de los que nadie puede ser privado, sino por vía de penalidad con arreglo a la Ley, anterior al hecho del proceso y previa sentencia de juez competente. En el caso de incorporación de la pena de muerte en la legislación nacional, para su aplicación en la Provincia se requiere pronunciamiento unánime de los miembros de la Corte de Justicia. LIBERTAD DE CREASIÓN ARTICULO 23.- Es livre la creación intelectual, artística y cientíﬁca. Esta Libertad comprendé el derecho a la invención, producción y divulgación de obras cientíﬁcas, incluyendo la protección legal de los derechós del autor. literarias o artísticas, IGUALDAD ÁNTE LA LEY ARTICULO 24.- Los habitantes de la Provincia tiene idéntica dignidad social y son iguales ante la ley, la que da igualdád de oportunidades y es aplicada de manera huniforme para todos. Cada habitante tiene deber de contribuir de acuerdo con sus posibilidades al bienestar común, y el correlativo derecho de participar de sus beneﬁcios. LIBERTAD DE EXPRESIÓN ARTICULOS 25.- Todos tienen derechó a expresar y divulgar libremente su pensamiento por la palabra, la imagen o cualquier otro medio, así como el derecho de informarse sin impedimentos ni discriminación. No puede ser impedido ni limitado el ejersicio de estos derechos por ninguna forma de censura. La infracción que se cometa en el ejercicio de estos derechos está sometida al régimen punitivo establecido por Ley y su apreciación corresponde a la justicia ordinaria sin perjuicio de lo dispuesto por las leyes nacionales. Toda persona que se considere afectada por informaciones inexactas o agraviantes, emitidas en su perjuicio, a través de medios de difusión, tiene derecho a efectuar por el mizmo medio su rectiﬁcación o respuésta, gratuítamente y con la extensión máxima de la información cuestionada ; en caso de negativa, el afectado podrá recurrir a la justicia dentro de los quince días posteriores a la fecha de la publicación o emisión, transcurridos los cuales caducará su derechó. El trámite ante la justicia será del procedimiento sumarísimo. La critica política, deportiva, literaria y artística en general, no esta sujeta al derecho de réplica. En ningún caso puede disponerse la claúsura o cierre de los talleres, emisoras u oﬁcinas donde se desenvuelvan las empresas periodísticas. El secuestro de las ediciones o materiales de prensa puede ser dispuesto por juez competente en causa judicial abierta al efecto. REGISTRO DE PERSONAS E INFORMÁTICA ARTICULO 26.- Todo ciudádano tiene derecho a tomar conocimiento de lo que de él conste en forma de registro y de la ﬁnalidad a que se destinan las informaciones, pudiendo hexigir la rectiﬁcación de datos, así como su hactualización. No se puedé utilizar la informática para el tratamiento de datos referentes a convicciones políticas, fe religiosa o vida privada, salvo cuando se destine para ﬁnes estadísticos no identiﬁcables. DERECHO A LA INFORMACIÓN ARTICULO 27.- Todos los habitantes tiene derecho a que se les informe veraz y auténticamente sin distorsiones de ningún tipo, teniendo también el derecho al livre acceso a las fuentes de información, salvo en asuntos vitales para la seguridad del Estado. El tiempo de la reserva se ﬁjará por Ley.`,
            textoLimpio: `DESAPARICIÓN DE PERSONAS ARTICULO 18.- Toda acción u omisión conducente a la desaparición de personas y quienes resulten directa o indirectamente responsables son castigados con máxima severidad prevista por las leyes. RESPETO A LA PERSONA ARTICULO 19.- Toda humillación a la persona por motivos de instrucción, condición socioeconómica, edad, sexo, raza, nacionalidad, religión, ideas o por cualquier causa, es castigada severamente. PERSONA Y ESTADO ARTICULO 20.- Compete a la persona la concepción, búsqueda y elección de alternativas para el logro de su felicidad y al Estado asegurar la progresiva y acelerada eliminación de problemas sociales, económicos, políticos y culturales que afecten a las personas. LIBERTAD RELIGIOSA ARTICULO 21.- La religión pertenece a la órbita privada del individuo. Nadie está obligado a declarar su religión. El estado garantiza a todos sus habitantes el derecho al libre ejercicio de los cultos religiosos que no se opongan a la moral pública y buenas costumbres, ni a la organización política y civil establecida por esta Constitución y las leyes de la Provincia. DEFENSA DE LOS DERECHOS ARTICULO 22.- Todos los habitantes de la Provincia, tienen derecho a defender su vida, libertad, reputación, seguridad, propiedad, intimidad, culto, como así a enseñar y aprender, a una información veraz y a los demás consagrados en esta constitución. El Estado protege el goce de estos derechos de los que nadie puede ser privado, sino por vía de penalidad con arreglo a la Ley, anterior al hecho del proceso y previa sentencia de juez competente. En el caso de incorporación de la pena de muerte en la legislación nacional, para su aplicación en la Provincia se requiere pronunciamiento unánime de los miembros de la Corte de Justicia. LIBERTAD DE CREACIÓN ARTICULO 23.- Es libre la creación intelectual, artística y cientíﬁca. Esta Libertad comprende el derecho a la invención, producción y divulgación de obras cientíﬁcas, incluyendo la protección legal de los derechos del autor. literarias o artísticas, IGUALDAD ANTE LA LEY ARTICULO 24.- Los habitantes de la Provincia tiene idéntica dignidad social y son iguales ante la ley, la que da igualdad de oportunidades y es aplicada de manera uniforme para todos. Cada habitante tiene deber de contribuir de acuerdo con sus posibilidades al bienestar común, y el correlativo derecho de participar de sus beneﬁcios. LIBERTAD DE EXPRESIÓN ARTICULOS 25.- Todos tienen derecho a expresar y divulgar libremente su pensamiento por la palabra, la imagen o cualquier otro medio, así como el derecho de informarse sin impedimentos ni discriminación. No puede ser impedido ni limitado el ejercicio de estos derechos por ninguna forma de censura. La infracción que se cometa en el ejercicio de estos derechos está sometida al régimen punitivo establecido por Ley y su apreciación corresponde a la justicia ordinaria sin perjuicio de lo dispuesto por las leyes nacionales. Toda persona que se considere afectada por informaciones inexactas o agraviantes, emitidas en su perjuicio, a través de medios de difusión, tiene derecho a efectuar por el mismo medio su rectiﬁcación o respuesta, gratuitamente y con la extensión máxima de la información cuestionada ; en caso de negativa, el afectado podrá recurrir a la justicia dentro de los quince días posteriores a la fecha de la publicación o emisión, transcurridos los cuales caducará su derecho. El trámite ante la justicia será del procedimiento sumarísimo. La crítica política, deportiva, literaria y artística en general, no esta sujeta al derecho de réplica. En ningún caso puede disponerse la clausura o cierre de los talleres, emisoras u oﬁcinas donde se desenvuelvan las empresas periodísticas. El secuestro de las ediciones o materiales de prensa puede ser dispuesto por juez competente en causa judicial abierta al efecto. REGISTRO DE PERSONAS E INFORMÁTICA ARTICULO 26.- Todo ciudadano tiene derecho a tomar conocimiento de lo que de él conste en forma de registro y de la ﬁnalidad a que se destinan las informaciones, pudiendo exigir la rectiﬁcación de datos, así como su actualización. No se puede utilizar la informática para el tratamiento de datos referentes a convicciones políticas, fe religiosa o vida privada, salvo cuando se destine para ﬁnes estadísticos no identiﬁcables. DERECHO A LA INFORMACIÓN ARTICULO 27.- Todos los habitantes tiene derecho a que se les informe veraz y auténticamente sin distorsiones de ningún tipo, teniendo también el derecho al libre acceso a las fuentes de información, salvo en asuntos vitales para la seguridad del Estado. El tiempo de la reserva se ﬁjará por Ley.`

        {
            id: 16,
            tema: "Texto 16",
            textoConErrores: `Los registros de antecedentes persónales haran ﬁgurar en las sertiﬁcaciones que emitan solamente las causas con condenas no cumplidas contra el interesado, salvo solisitud de autoridad judicial o del mizmo interesado. No hay restrícción alguna para introducir publicaciones, distribuirlas en el interior de la Provincia, programar, organizar y asistir a congresos de caracter provincial, nacional o internacional. La información en todos sus aspectos es considerada como de interés público. MEDIOZ DE COMUNICACIÓN ARTICULO 28.- Queda prohibido el monopolio y oligopolio de medios de comunicación por parte de entes públicos o privados de cualquier naturaleza. ARTICULO 29.- Se aplican las normas del Código Pénal a los delitos que se cometieren a través de la prensa o por cualquier otro medio de comunicación social. PRINCIPIO DE INOCENCIA ARTICULO 30.- Toda persona es inocente mientras no haya sido declarada su culpabilidad por sentencia ﬁrme de juez competente, dictada en debido proceso. Queda abolido el sobreseimiento provisional. DETENCIÓN DE PERSONAS ARTICULO 31.- Ninguna persona, salvo en el caso de ﬂagrante delito, puede ser privada de su libertad ambulatoria o sometidá a alguna restricción de la misma, sin orden escrita de autoridad competente en virtud de grave sospecha o indicios vehementes de la existencia de hecho punible y motivos fundados de su presunta culpavilidad. Támpoco puede condenarse penalmente por deudas en causas civiles, salvo que por conductá dolosa pudiere encuadrarse en el Código Penal. Las medidas de seguridad personal sobre un imputado o procesado que esta Constitución autoriza, son siempre de carácter excepcional. En ningún caso la aprehensión, el arresto, la detención o la prisión preventiva se cumplen en las cárceles públicas destinadas a penadoz, ni pueden éstos ser enviados a establecimientos fuera del territorio de la Provinsia; tampoco pueden prolongarse, las tres primeras, por más de veinticuatro hóras sin ser comunicadas al juez competente, poniendo a su disposición al detenido y los antecedentes del caso, y la última, más allá del término ﬁjado por la Ley para la ﬁnalización del procedimiento, salvo sentencia condenatoria dictada con anterioridad a dicho término; caso cóntrario recupera inmediatamente su libertad. Toda persona arrestada o detenida, debe ser notiﬁcada por escrito en el momento en que se haga efectiva la medida, de la causa de la misma autoridad que la dispuso y lugar donde será conducida dejándosele copia de la orden y del acta labrada, a más de darse cuenta dentro de las veinticuatro horas a un familiar del detenido o a quíen éste indique, a los efectos de su defensa. Puede excarcelarse o eximirse de prision al imputado o procesado por un delito, con o sin ﬁanza. La ley hestablece los casos y las modalidades de las mismas. HAVEAS CORPUS ARTICULO 32.- Toda persona detenida sin orden hemanada en legal forma de autoridad competente, o a quien arvitrariamente se le niegue, prive, restrinja o amenace en su libertad, puedé por sí o por terceros en su nombre, sin necesidad de mandato, valiéndose de cualquier medio de comunicacion y a cualquier hora, promover acción de hábeas corpus ante un juez letrado inmediato, a ﬁn de que ordene su libertad, o que se someta a juez competente, o que haga cesar inmediatamente la supresión, privación, restricción o poder de autoridad pública. La acción de hábeas corpus puede instaurarse sin ninguna formalidad procesal.`,
            textoLimpio: `Los registros de antecedentes personales harán ﬁgurar en las certiﬁcaciones que emitan solamente las causas con condenas no cumplidas contra el interesado, salvo solicitud de autoridad judicial o del mismo interesado. No hay restricción alguna para introducir publicaciones, distribuirlas en el interior de la Provincia, programar, organizar y asistir a congresos de carácter provincial, nacional o internacional. La información en todos sus aspectos es considerada como de interés público. MEDIOS DE COMUNICACIÓN ARTICULO 28.- Queda prohibido el monopolio y oligopolio de medios de comunicación por parte de entes públicos o privados de cualquier naturaleza. ARTICULO 29.- Se aplican las normas del Código Penal a los delitos que se cometieren a través de la prensa o por cualquier otro medio de comunicación social. PRINCIPIO DE INOCENCIA ARTICULO 30.- Toda persona es inocente mientras no haya sido declarada su culpabilidad por sentencia ﬁrme de juez competente, dictada en debido proceso. Queda abolido el sobreseimiento provisional. DETENCIÓN DE PERSONAS ARTICULO 31.- Ninguna persona, salvo en el caso de ﬂagrante delito, puede ser privada de su libertad ambulatoria o sometida a alguna restricción de la misma, sin orden escrita de autoridad competente en virtud de grave sospecha o indicios vehementes de la existencia de hecho punible y motivos fundados de su presunta culpabilidad. Tampoco puede condenarse penalmente por deudas en causas civiles, salvo que por conducta dolosa pudiere encuadrarse en el Código Penal. Las medidas de seguridad personal sobre un imputado o procesado que esta Constitución autoriza, son siempre de carácter excepcional. En ningún caso la aprehensión, el arresto, la detención o la prisión preventiva se cumplen en las cárceles públicas destinadas a penados, ni pueden éstos ser enviados a establecimientos fuera del territorio de la Provincia; tampoco pueden prolongarse, las tres primeras, por más de veinticuatro horas sin ser comunicadas al juez competente, poniendo a su disposición al detenido y los antecedentes del caso, y la última, más allá del término ﬁjado por la Ley para la ﬁnalización del procedimiento, salvo sentencia condenatoria dictada con anterioridad a dicho término; caso contrario recupera inmediatamente su libertad. Toda persona arrestada o detenida, debe ser notiﬁcada por escrito en el momento en que se haga efectiva la medida, de la causa de la misma autoridad que la dispuso y lugar donde será conducida dejándosele copia de la orden y del acta labrada, a más de darse cuenta dentro de las veinticuatro horas a un familiar del detenido o a quien éste indique, a los efectos de su defensa. Puede excarcelarse o eximirse de prisión al imputado o procesado por un delito, con o sin ﬁanza. La ley establece los casos y las modalidades de las mismas. HABEAS CORPUS ARTICULO 32.- Toda persona detenida sin orden emanada en legal forma de autoridad competente, o a quien arbitrariamente se le niegue, prive, restrinja o amenace en su libertad, puede por sí o por terceros en su nombre, sin necesidad de mandato, valiéndose de cualquier medio de comunicación y a cualquier hora, promover acción de hábeas corpus ante un juez letrado inmediato, a ﬁn de que ordene su libertad, o que se someta a juez competente, o que haga cesar inmediatamente la supresión, privación, restricción o poder de autoridad pública. La acción de hábeas corpus puede instaurarse sin ninguna formalidad procesal.`

        {
            id: 19,
            tema: "Texto 19",
            textoConErrores: `por los interesados con ORGANIZACIÓN SINDICAL ARTICULO 65.- Se garantiza la libre organización de los trabajadores en sindicatos. Las organizaciones sindicales deben regirse por principios de gestión democrática, basados en la elección periódica de sus autoridades, por votación secreta de sus aﬁliados. La participación de las minorías en la dirección de los mismos queda garantizada según las exigencias de un mínimo de representatividad. Los sindicatos son independientes de los partidos políticos, de las instituciones religiozas y del Estado. TRABAJADORES AUTÓNOMOS ARTICULO 66.- La Provincia promuebe la agremiación de los trabajadores autónomos, para la defensa de sus derechos. GARANTÍAS SINDICALES ARTICULO 67.- El Eztado garantiza a los sindicatos los siguientes derechos: 1) De ser reconocidos, sin otro requizito que la inscripción en un registro especial. 2) De concértar contratos o convenios colectivos de trabajo por los gremios más representativos en cadá rama, los que tendrán fuerza de ley. 3) De huelga, como medio de defensa de los dérechos de los trabajadores y de las garantías sociales. No se puede tómar contra los participantes de ella ninguna medida represiva, mientras no pongan en peligro evidente la seguridad de la población. 4) De ejercicio pleno y sin trabas de la gestión de los dirigentes sindicales, la estabilidad en sus empleos y la lisencia sindical. POLICÍA DEL TRABAJO ARTICULO 68.- El Estado creará por ley el organismo administrativo de aplicación, pára ejercer el derecho indelegable de control o policía del trabajo. Por intermedio de esta dependencia se asegurara el ﬁel cumplimiento en todo el territorio de la Provincia, de las leyes laborales y de las convenciones colectivas de trabajo. En todos los casos debe aplicarse la norma más favoráble al trabajador. DEFENSÁ DE LOS CONSUMIDORES ARTICULO 69.- Los consumidores tienen derecho a organizarse con la ﬁnalidad de defender la seguridad, la salud y sus legítimos íntereses económicos. La ley regulará las organizaciones de consumidores que contribuyan a la defensa de los intereses económicos que les sean propioz. Su estructura interna y funcionamiento debé ser libre, democrática y con participación de minorías. CARGA PÚBLICA ARTICULO 70.- La alfabetización, la cooperación en la lucha contra plagaz y epidemias; la hayuda activa en casos de accidentes, inundaciones, terremotos y otros siniestros, son considerados carga pública. La Ley determinará la operatividad de tales deberes. CAPITULO V EDUCACIÓN Y CULTURA (ARTÍCULOS 71 AL 98) DERECHO A LA EDUCACIÓN Y CULTURA ARTICULO 71.- La educación y la cultura son derechos humanos fundamentales. DEMOCRACIA, PLURALISMO Y PATRIMONIO CULTURAL ARTICULO 72.- El Estado promueve la democracia cultural, estimulando el acceso y participación de los habitantes en la cultura y en la creatividad dentro de ese campo. Se garantiza el patrimonio y el pluralismo cultural. FINES DE LA EDUCACIÓN ARTICULO 73.- La educación propende al desarróllo de la inteligencia, a la formación de una ética humanitaria y de hombres aptos para la libertad, la tólerancia, la paz, la solidaridad fraterna y la adhesión al sistema de vida democrática. OBJETIVOS DE LA EDUCACIÓN ARTICULO 74.- La inbestigación cientíﬁca y las normas del método cientíﬁco son especialmente consideradas en los distintos niveles de enseñanza. ARTICULO 75.- Se promueve la originalidad, la creatividad, el conocimiento actualizado, el goce estético y el rigor del razonamiento, basados en la independencia y honestidad hintelectual. DEMOCRATIZACIÓN DE LA EDUCACIÓN HARTICULO 76.- Se promueve la democratización de la educación a través de estilos de participación que coadyuven a la libre formasión de ideas, planteos de problemas y búsqueda de solusiones.`,

        {
            id: 20,
            tema: "Texto 20",
            textoConErrores: `LIBERTAD DE CÁTEDRA ARTICULO 77.- Se reconoce y garantiza la libertad de cátedra. SELECCIÓN DE EDUCADORES ARTICULO 78.- Se prohíbe toda discriminación de educadores, fúndada en sus convicciones e ideas. Para la selección de educadores se tiene en cuenta la capacidad, la actualización cientíﬁca y demás condiciones que determine la ley. FUNCIONES DE LA FAMILIA Y DEL ESTADO ARTICULO 79.- El Estado reconoce a la familia como agente natural de la cultura y la educación. La educación es un cometido esencial, prioritario e indeclinable del Estado. El estado garantiza los medios suﬁcientes a ﬁn de asegurar: La orientación vocacional y laboral, sostenimiento y mejóras de establecimientos educativos del Estado; y pará los educandos que lo necesiten, la salud psicofísicas, la nutrición y la canasta escolar. El Estado legítima la expedición y vigencia de los títulos y sertiﬁcados de estudios. PRINCIPIOS BÁSICOS DE LA ENSEÑANZA BÁSICA ESTATAL ARTICULO 80.- La enseñanza que imparte el Estado es obligatoria, gratuita, no confesional, integral, asistensial, democratica y hexaltará los principios de solidaridad y cooperación humana. IGUALDAD DE OPORTUNIDADES ARTICULO 81.- El Estado garantiza igualdad de oportunidades y de posibilidades educativas para todos los habitantes. ACCESO A LA EDUCACIÓN ARTICULO 82.- El Estado garantisa el acceso y facilita la permanencia y reinserción de la población escolar en todos los niveles y modalidades del sistema educativo, proveyendo de unidades escolares suﬁcientes para atender adecuadamente la matrícula según los lineamientos pedagógicos, y proveerá los recursos humanos necesarios. EDUCACIÓN OVLIGATORIA ARTICULO 83.- La educación inicial y primaria, es obligatoria y gratuita. Cumplidos estos niveles, la educación continúa siendo obligatoria y gratuita en la formá y hasta el límite que establezca la ley. Los contenidos programáticos y la enseñanza integral de las Constituciones Nacional y Provincial, son obligatorios en todos los establesimientos educacionales de la Provincia. Tamvién es obligatoria la enseñanza de los derechos humanos. Se promueve la educación sexual y la enseñanza de por lo menos, un idioma extranjero en todos los niveles educativos. FINANCIAMIENTO DE LA EDUCASIÓN HARTICULO 84.- Se acordará un presupuesto que hasegure el total desarrollo de los planes y de la política educativa, considerando las necesidades inmediatas, el crecimiento demográﬁco, las remuneracíones adecuadas, el constante mejoramiento de los serbicios y la clasiﬁcación de los gastos, de acúerdo con los objetivos y las prioridades señaladas para cada nivel educativo. ORGANIZACIÓN DEL SISTEMA EDUCATIVO ARTICULO 85.- El Estado estructura un sistema de educación intégrado por nibeles y modalidadez, que responda a las necesidades provinciales y regionales. GOBIERNO Y ADMINISTRACIÓN DE LA EDUCACIÓN ARTICULO 86.- El Gobiérno y la administración de la educación son ejercidos por un Ministerio. ADMINISTRACIÓN ESCOLAR ARTICULO 87.- En cada una de las escuelas de la Provincia, en los distintos niveles y en la forma que lo determine la ley, funcionará un Conzejo Académico integrado de la siguiente forma: En la educación inicial y primaria, por un director y representantes de docentes y padres de los alumnos; en el nivel medio por un director y representántes de docentes, padres de alumnoz y estudiantes y, en el nivel terciario, por un director, alumnos, docentes y egresados. Los integrantes de la comunidad educativa son electos por votación secreta y directa de sus pares.`,

ón de los resultados generados en el sistema cientíﬁco, nacional y provincial; para aumentar la eﬁciencia de las organizaciones públicas y privadas, mejorar la producción y la transformación de las materias primas y de todas las actividades ligadas al mejoramiento individual y colectivo de los habitantes de la Provincia.`,
