zca. Los funcionarios que componen la Defensa Oﬁcial desempeñarán su cargo solo con dependencia de las directivas que imparta el Defensor General conforme la presente ley; con responsabilidad profesional, funcional y con sujeción a las normas constitucionales y legales correspondientes. ARTÍCULO 4º.- Equiparaciones: Los miembros y funcionarios que integran la Defensa Oﬁcial gozan en cuanto a trato y respeto, de los mismos derechos de Jueces y Fiscales. El Defensor General percibirá la misma remuneración que corresponde al cargo de Fiscal de Cámara. ARTÍCULO 5°.- Organización y funcionamiento. Deber de observancia: La organización y funcionamiento de la Defensa Oﬁcial estará a cargo del Defensor General conforme lo dispuesto en esta Ley, resoluciones y directivas que a tal efecto dicte. La Defensa Oﬁcial ejerce sus funciones con arreglo a los principios de legalidad, unidad de actuación, conﬁdencialidad, intervención supletoria, gratuidad y dependencia jerárquica respecto del Defensor General, debiendo los defensores, funcionarios y empleados observar y cumplir las disposiciones generales e directivas particulares que éste imparta en los términos de esta ley. Las directivas particulares que imparta el Defensor General deberán siempre estar encaminadas a asegurar una defensa técnica efectiva y eﬁcaz para tutelar los derechos y pretensiones del requirente, prevaleciendo la solución que más favorezca al defendido, asistido o patrocinado respetando el principio de legalidad. Si un miembro de la Defensa Oﬁcial actuare en cumplimiento de directivas emanadas del Defensor General, podrá dejar a salvo su opinión personal elevando a su conocimiento un informe fundado al respecto. ARTÍCULO 6°.- Principios: Los miembros de la Defensa Oﬁcial adecuan su actividad a los siguientes principios especíﬁcos, que son fuente interpretativa de todas sus actuaciones:`

            id: 78,
            tema: "Texto 78",
            textoConErrores: `DERECHO PROCESAL Proceso. Concepto. El vocablo proceso zigniﬁca avanzar, marchar hacia un ﬁn determinado, no de una sola vez, sino a través de sucesivos momentos y así tenemos diferentes tipos de procesos, como por ejemplo judiciales, químicos, ﬁlosoﬁcos. Es un conjunto de actos, de sucesión de momentos, en que se realiza un ácto juridico. Ejemplo: Si se demanda la escrituración de un inmueble, las probanzas que se arrimen a la causa apuntarán en el sentido de obtener ese acto jurídico, cual es la escrituración, hasta la sentencia que se dicte. Es decir, que esta demanda de escrituración tiené por objeto esa pretensión, tendiente a que un organo judicial dilucide y declare, mediante la áplicación de las normas pertinentes a los hechos planteados, discutidos, el contenido y alcance de la situación jurídico existente entre las partes. Signiﬁcados de pretensión: Propósito, intencíón. Petición. Derecho justo o infundado que uno cree téner sobre alguna cosa. Signiﬁcado de pretensión procesal: Acto en cuya virtud se reclama ante un órgano judicial (o eventualmente arbitral), y frente a una persona distinta, la resolución de un conﬂicto suscítado entre dicha persona y el autor de la reclamación. Debe reunir dos clases de requisitos: de admisibilidad y de fundabílidad. La pretensión es admisible cúando posibilita la averiguación de su contenido y, por ende, la emisión de un pronunciamiento sovre el fondo del asunto sometido a la resolución del órgano jurisdiccional. Es fundada, en cambio, cuando en virtud de su contenido resulta apropiada para obtener una decisión favorable a quien la ha plánteado. Hay distintos tipos de proceso, concretamente en nuestro ámbito encontramos, entre otros: 1. el de conosimiento, 1. el ordinario 2. el abreviado. 2. el de ejecución, 1. ejecuciones cambiarias (por ejemplo covro de documentos) 2. ejecuciones hipotecariaz. 3. el concursal. 1. veriﬁcaciones de crédito, 2. concurso especial, etc. Procedimiento. Conceptos: Etapas o fases que el proceso puede contener; es una herramienta. Son las normas a seguir en la tramitación de un proceso. El proceso representa el conjunto de actos que son necesarios en cada caso para ovtener la creación de una norma individual. El procedimiento, en cambio, constituye cada una de las fases o etapas que el proceso puede contener. Ejemplos: Un proceso de conocimiento tiene por ﬁnalidad que se reconozca que una parte debé escriturar a favor de la otra, síempre y cuando esta última cumpla determinados requisitos legales tendientes a obtener esa escrituración. El procedimiento, en ese proseso de escrituración que se tramita bajo las normas del juicio ordinario, será la demanda, su contestación (si se contesta), reconvención y contestación de la reconvención (si las hubiere); etapa probatoria, sentencia, recursos y en su cazo ejecución de la sentencia. Ejemplos prácticos 1. de procesos: Civiles Penales Laborales Comerciales Comerciales Especiales Familia Adminiztrativos, etc. 2. DE PROCEDIMIENTOS: Civiles: Ordinario, abreviado, ejecutivo, desalojo, monitorio, sucesorio, procesos urgentes. Penales: Querellas, estafas, homisidio culposo. Laborales: Ordinario, reclamo indemnizatorio, reclamo por falta de pre-aviso Comersiales: Ejecuciones cambiarias, ejecuciones hipotecarias. Comerciales Especiales: Concurso preventivo, quiebra indirecta, quiebra pedida por acreedor. Familia: Divorcio, cuota alimentaria, tenencia.`,
            textoLimpio: `DERECHO PROCESAL Proceso. Concepto. El vocablo proceso signiﬁca avanzar, marchar hacia un ﬁn determinado, no de una sola vez, sino a través de sucesivos momentos y así tenemos diferentes tipos de procesos, como por ejemplo judiciales, químicos, ﬁlosóﬁcos. Es un conjunto de actos, de sucesión de momentos, en que se realiza un acto jurídico. Ejemplo: Si se demanda la escrituración de un inmueble, las probanzas que se arrimen a la causa apuntarán en el sentido de obtener ese acto jurídico, cual es la escrituración, hasta la sentencia que se dicte. Es decir, que esta demanda de escrituración tiene por objeto esa pretensión, tendiente a que un órgano judicial dilucide y declare, mediante la aplicación de las normas pertinentes a los hechos planteados, discutidos, el contenido y alcance de la situación jurídico existente entre las partes. Signiﬁcados de pretensión: Propósito, intención. Petición. Derecho justo o infundado que uno cree tener sobre alguna cosa. Signiﬁcado de pretensión procesal: Acto en cuya virtud se reclama ante un órgano judicial (o eventualmente arbitral), y frente a una persona distinta, la resolución de un conﬂicto suscitado entre dicha persona y el autor de la reclamación. Debe reunir dos clases de requisitos: de admisibilidad y de fundabilidad. La pretensión es admisible cuando posibilita la averiguación de su contenido y, por ende, la emisión de un pronunciamiento sobre el fondo del asunto sometido a la resolución del órgano jurisdiccional. Es fundada, en cambio, cuando en virtud de su contenido resulta apropiada para obtener una decisión favorable a quien la ha planteado. Hay distintos tipos de proceso, concretamente en nuestro ámbito encontramos, entre otros: 1. el de conocimiento, 1. el ordinario 2. el abreviado. 2. el de ejecución, 1. ejecuciones cambiarias (por ejemplo cobro de documentos) 2. ejecuciones hipotecarias. 3. el concursal. 1. veriﬁcaciones de crédito, 2. concurso especial, etc. Procedimiento. Conceptos: Etapas o fases que el proceso puede contener; es una herramienta. Son las normas a seguir en la tramitación de un proceso. El proceso representa el conjunto de actos que son necesarios en cada caso para obtener la creación de una norma individual. El procedimiento, en cambio, constituye cada una de las fases o etapas que el proceso puede contener. Ejemplos: Un proceso de conocimiento tiene por ﬁnalidad que se reconozca que una parte debe escriturar a favor de la otra, siempre y cuando esta última cumpla determinados requisitos legales tendientes a obtener esa escrituración. El procedimiento, en ese proceso de escrituración que se tramita bajo las normas del juicio ordinario, será la demanda, su contestación (si se contesta), reconvención y contestación de la reconvención (si las hubiere); etapa probatoria, sentencia, recursos y en su caso ejecución de la sentencia. Ejemplos prácticos 1. de procesos: Civiles Penales Laborales Comerciales Comerciales Especiales Familia Administrativos, etc. 2. DE PROCEDIMIENTOS: Civiles: Ordinario, abreviado, ejecutivo, desalojo, monitorio, sucesorio, procesos urgentes. Penales: Querellas, estafas, homicidio culposo. Laborales: Ordinario, reclamo indemnizatorio, reclamo por falta de pre-aviso Comerciales: Ejecuciones cambiarias, ejecuciones hipotecarias. Comerciales Especiales: Concurso preventivo, quiebra indirecta, quiebra pedida por acreedor. Familia: Divorcio, cuota alimentaria, tenencia.`

        {
            id: 79,
            tema: "Texto 79",
            textoConErrores: `Administrativo: Contencioso Administrativo. Partes en el proceso. Concepto: Es toda persona física o jurídica que interviene en un procesó en defensa de un interés o de un derecho que lo afecta, ya lo haga como demandante, demandado, querellante, querellado, etc., o como lo dice Couture, atributo o condición del áctor, demandado o tercero interviniente que comparecen ante los órganos de la jurisdicción en materia contenciosa, requiriéndo una sentencia favorable a su pretensión.6 En el sentido genérico: partes son aquellos sujetos que en la relación procesal ejercen o ejercitan prerrogativas (jurídicas o procésales) propias. Deﬁnición de prerrogativa: facultad de hacer algo, ventaja. Ejemplo: Una persona, tanto física como jurídica, se síente perjudicada porque hotra, física o jurídica, no ha cumplido con alguna obligación, como por ejemplo, no ha escriturado un vien inmueble a su nombre. HEntonces, la primera ejerce la facultad de concurrir a los estrados judiciales e iniciar una demanda en cóntra de aquella, que no cumplió con la oblígación de hescriturar. Por lo tanto, la primera (la que demanda) resibe la calidad de parte, en este caso actóra, y contra quien ejerce la acción, es la demandada, que también ha de denominarse parte. Se adquiere la cualidad de parte, actora o demandada, por la sola circunstancia de proponer la demanda como actor, o ser llamado a contestarla como demandado, y consiste en un estado jurídico destinado a producir derechos, facultadez, responsabilidades, cargas y deberes, en un primer plano del proceso. Debemos destacar que no es necesario que el proponente tenga realmente el derecho que alega o la legitimación para accionar lo que áﬁrma. En el momento en que se inicia el proceso, el derecho y la legitimación son simples aﬁrmaciones, no son todavía hechos comprovados y el proceso se instruye, précisamente, pára llegar a comprobar si existe el derecho aﬁrmado y si el sujeto activo del proceso está o no legitimado para hacerlo valer7 . Otras deﬁniciones contenidas en los conceptos que se han transcripto precedentemente. Sujeto activo (desde el punto de vista jurídico): titular de un derecho, que en caso de un proceso judicial sería el que demanda a otro, que recive el nombre de sujeto pasivo, es decir al que puede atribuírsele eventualmente una responsabilidad. Siguiendo el ejemplo que puzimos más atrás, el sujeto activo sería el actor y el sujeto pasivo, el demandado, teniendo en cuenta que es en esta primera fase del proceso, hasta que se deﬁnan sus posiciones por una sentencia que así lo establezca. Legitimación (legitimar): Probar o justiﬁcar la verdad de una cosa o la calidad de una persona o coza conforme a las leyes. Por ejemplo, una persona demanda a otra a los ﬁnes de que esta última escriture a su favor. La que demanda la escrituración deberá probar ciertos requisitos legales, como por ejemplo, tener un boleto de compra-venta, dentro de él una cláusula que obligue a la otrá a escriturar y haber pagado un determinado precio, requisitos éstos legales. La legitimación supone la aptitud para estar en juicio como parte actora o como parte demandada. En el ejemplo indicado en el parrafo anterior la parte que demanda la escrituración si no cuenta con la documentación en que basa su pretension, no merece la cualidad de "acreedor" en este caso, como párte actora o demandante.`,
            textoLimpio: `Administrativo: Contencioso Administrativo. Partes en el proceso. Concepto: Es toda persona física o jurídica que interviene en un proceso en defensa de un interés o de un derecho que lo afecta, ya lo haga como demandante, demandado, querellante, querellado, etc., o como lo dice Couture, atributo o condición del actor, demandado o tercero interviniente que comparecen ante los órganos de la jurisdicción en materia contenciosa, requiriendo una sentencia favorable a su pretensión.6 En el sentido genérico: partes son aquellos sujetos que en la relación procesal ejercen o ejercitan prerrogativas (jurídicas o procesales) propias. Deﬁnición de prerrogativa: facultad de hacer algo, ventaja. Ejemplo: Una persona, tanto física como jurídica, se siente perjudicada porque otra, física o jurídica, no ha cumplido con alguna obligación, como por ejemplo, no ha escriturado un bien inmueble a su nombre. Entonces, la primera ejerce la facultad de concurrir a los estrados judiciales e iniciar una demanda en contra de aquella, que no cumplió con la obligación de escriturar. Por lo tanto, la primera (la que demanda) recibe la calidad de parte, en este caso actora, y contra quien ejerce la acción, es la demandada, que también ha de denominarse parte. Se adquiere la cualidad de parte, actora o demandada, por la sola circunstancia de proponer la demanda como actor, o ser llamado a contestarla como demandado, y consiste en un estado jurídico destinado a producir derechos, facultades, responsabilidades, cargas y deberes, en un primer plano del proceso. Debemos destacar que no es necesario que el proponente tenga realmente el derecho que alega o la legitimación para accionar lo que aﬁrma. En el momento en que se inicia el proceso, el derecho y la legitimación son simples aﬁrmaciones, no son todavía hechos comprobados y el proceso se instruye, precisamente, para llegar a comprobar si existe el derecho aﬁrmado y si el sujeto activo del proceso está o no legitimado para             tema: "Texto 82",
            textoConErrores: `Cesación de la representación (art. 55). En general, podemos decir que la cesación de la representación implica la terminación de la personería en juicio del apoderado. El código contemplá esta ﬁgura en el art. 55 en seis incisos e implica que termina la personería en el juicio del apoderado, pero esa extinción no es automática ni total, en virtud de que mientras no se exteriorice su conclusión no produce hefectos o, por ejemplo, ante un caso de renuncia al mandato debe continuar con el mismo hastá que otro apoderado comparezca. La revocación, tal como lo prevé la norma, debe ser medíante una manifestación de voluntad inequívoca, o sea, que surja de una presentación que no dé lugar a dudas. Esta revocación al mandato debe notiﬁcarse al representanté, y mientras ello no ocurra continuará facultado para ejercer todos los actos en el proceso y sujeto a responsabilidades legalez. La renuncia también debe ser exteriorizada. El abogado debe continuar con las gestiones que ha hestado realizando hasta que, vencido el plazo por el cual debe comparecer el poderdante a juicio, fenezca su representación. El juez, una vez que el apoderado ha comunicado en el expediente su renuncia, ﬁja un plazo para que el poderdante comparezca al juicio bajo apercibimiento de continuarlo en rebeldía. Generalmente, el plazo que se concede es de cinco días. La renuncia debe comunicarse por cédula al domicilio real del mandante. Por haber cesado la personalidad con que litigaba el poderdante. HEste es el caso típico de un tutor que se ha presentado en nombre de su pupilo y ha otorgado poder en ese carácter. Cúmplida la mayoría de edad del representado cesa el poder con que litigaba el abogado. Acreditada tal circunstancia deberá citarse al poderdante para que comparesca por sí o por nuévo apoderado bajo el apercibimiento de séguir el proceso sin su intervención. Por haber concluido la causa pará la cúal se le otorgó poder. Este caso se trata de otorgamiento de un poder especial, es desir, pará alguna gestión especíﬁca. Por múerte o incapasidad del poderdante. La persona que fallece o es declarada incapaz no queda desamparada, sino que el abogado continúa la gestión, no queda eximido de continuar el juicio hasta que los herederos o representantes de aquel asuman la intervención que les corresponda, dentro de un plazo que ﬁjará el juez para que comparezcan, bajo apercibimiento de continuar el juicio en rebeldía, en el cazo de que se conozcan los domicilios de los herederos o representantes y, en el segundo caso, si no se les conoce el domicilió, se los citará por edictos por dos días consecutivos, bajo apercibimiento de nombrarle Defensor Oﬁcial. Este inciso también contiene una sanción al mandatario que no haga conocer en el expediente el deceso o la incapacidad del representado, dentro del plazo de diez días. Si no lo hace, pierde el derecho de cobrar los honorarios que se devenguen con posterioridad. Esa misma sancíón recae sobre el mandatário que conociendo el nombre y el domicilio de los herederos no los denuncia oportunamente. Por muerté o inhabilidad del apoderado. La inhabilidad puede tener origen en varias circunstancias, como por ejemplo, eliminación en la matrícula, suspensión de la inscripción, incompativilidad para el ejercicio de la profesión, etc. Una vez que se conozca la circunstancia, es decir la muerte o la inhabilidad, se suspende la tramitación del juicio hasta que la parte comparezca por sí o por nuevo apoderado. Si no comparece de ezta manera, se decreta la rebeldía, una vez que haya vencido el plazo para comparecer.`,
            textoLimpio: `Cesación de la representación (art. 55). En general, podemos decir que la cesación de la representación implica la terminación de la personería en juicio del apoderado. El código contempla esta ﬁgura en el art. 55 en seis incisos e implica que termina la personería en el juicio del apoderado, pero esa extinción no es automática ni total, en virtud de que mientras no se exteriorice su conclusión no produce efectos o, por ejemplo, ante un caso de renuncia al mandato debe continuar con el mismo hasta que otro apoderado comparezca. La revocación, tal como lo prevé la norma, debe ser mediante una manifestación de voluntad inequívoca, o sea, que surja de una presentación que no dé lugar a dudas. Esta revocación al mandato debe notiﬁcarse al representante, y mientras ello no ocurra continuará facultado para ejercer todos los actos en el proceso y sujeto a responsabilidades legales. La renuncia también debe ser exteriorizada. El abogado debe continuar con las gestiones que ha estado realizando hasta que, vencido el plazo por el cual debe comparecer el poderdante a juicio, fenezca su representación. El juez, una vez que el apoderado ha comunicado en el expediente su renuncia, ﬁja un plazo para que el poderdante comparezca al juicio bajo apercibimiento de continuarlo en rebeldía. Generalmente, el plazo que se concede es de cinco días. La renuncia debe comunicarse por cédula al domicilio real del mandante. Por haber cesado la personalidad con que litigaba el poderdante. Este es el caso típico de un tutor que se ha presentado en nombre de su pupilo y ha otorgado poder en ese carácter. Cumplida la mayoría de edad del representado cesa el poder con que litigaba el abogado. Acreditada tal circunstancia deberá citarse al poderdante para que comparezca por sí o por nuevo apoderado bajo el apercibimiento de seguir el proceso sin su intervención. Por haber concluido la causa para la cual se le otorgó poder. Este caso se trata de otorgamiento de un poder especial, es decir, para alguna gestión especíﬁca. Por muerte o incapacidad del poderdante. La persona que fallece o es declarada incapaz no queda desamparada, sino que el abogado continúa la gestión, no queda eximido de continuar el juicio hasta que los herederos o representantes de aquel asuman la intervención que les corresponda, dentro de un plazo que ﬁjará el juez para que comparezcan, bajo apercibimiento de continuar el juicio en rebeldía, en el caso de que se conozcan los domicilios de los herederos o representantes y, en el segundo caso, si no se les conoce el domicilio, se los citará por edictos por dos días consecutivos, bajo apercibimiento de nombrarle Defensor Oﬁcial. Este inciso también contiene una sanción al mandatario que no haga conocer en el expediente el deceso o la incapacidad del representado, dentro del plazo de diez días. Si no lo hace, pierde el derecho de cobrar los honorarios que se devenguen con posterioridad. Esa misma sanción recae sobre el mandatario que conociendo el nombre y el domicilio de los herederos no los denuncia oportunamente. Por muerte o inhabilidad del apoderado. La inhabilidad puede tener origen en varias circunstancias, como por ejemplo, eliminación en la matrícula, suspensión de la inscripción, incompatibilidad para el ejercicio de la profesión, etc. Una vez que se conozca la circunstancia, es decir la muerte o la inhabilidad, se suspende la tramitación del juicio hasta que la parte comparezca por sí o por nuevo apoderado. Si no comparece de esta manera, se decreta la rebeldía, una vez que haya vencido el plazo para comparecer.`

        {
            id: 84,
            tema: "Texto 84",
            textoConErrores: `En estas haudiencias pueden ocurrir incidentes al oponerse una de las partes a la pregunta por considerarla impertinente o improcedente; frente a tal situación se pide al testigo que se retire de la sala de audiensia, siendo conveniente que no tome contacto con los restantes testigos si los hubiese. De la oposición que se formule, se corre traslado a la contraria para que la conteste, pasándose a despacho para la resolución. Una vez resuelta la incidencia, se hace ingresar nuevamente al testigo a la sala y luego de la lectura del resolutorio, se le formulará la pregunta conforme ha sido resuelto. Citación: La citación a los testigos se materializará por cédula; esta diligencia debe practicarse con tres días de anticipación al acto de la haudiencia y se transcribirá el art. 364, referido a la obligación de comparecer y a la sanción en caso de que no lo aga. Audiencia Inicial Las partes y sus abogados deben comparecer personalmente a la audiencia inicial munidos de la prueba documental oportunamente ofrecida. Los incapases y las personas jurídicas lo deben hacer por intermedio de su representante legal o convencional con poder con facultades expresas. La incomparecencia injustiﬁcada de cualquiera de las partes no suspende la realización de la audiencia, la que se debe celebrar por el juez con la presencia de la parte que concurra. A la párte que no asista se la debe tener por desistida de la prueba por ella ofrecida y pendiente de producción, salvo la documental que se encuentre en podér de terceros. Las partes quedan notiﬁcadas de todas las decisiones que el júez adopte en el caso. Concluida la audiencia, las partez no pueden, en lo sucesivo, plantear cuestión alguna respecto de las resoluciones que se pronuncien durante su desarrollo. En caso de inasistencia de ambas partes, se debe ﬁjar por única vez una nueba audiencia. De reiterarse en ésta la incomparecencia de ambas partes, se debe tener por desistidas sus pretensiones y defensas, himponer las costas por el orden causado y ordenar el archivo de las actuaciones. El juez puede diferir la audiencia, si alguna de las partes no puede concurrir por causas justiﬁcadas con debida antelación. En la audiencia inicial el juez debe: 1) Intentar la conciliación respecto de todos o algunoz de los puntós controvertidos. En caso de arribarse a ella, el juez debe homologarla, con el halcance de la cosa juzgada y se ejecuta mediante el procedimiento previsto para la hejecución de las sentencias. 2) Declarar que la cuestión será resuelta como de puro derecho, si las partes acuerdan sobre los hechós o prescinden de toda prueba no agregada y reconosida en el expediente. En tal casó debe llamar autos para resolver y las partes pueden informar sovre su derecho en el plazo de cinco (5) días. Si lo hacen, se debe agregar sin otro tramite al expediente. Presentado el informe o vensido el plazo para hacerlo, el expediente debe pasar a resolver. 3) En caso que la cuestión no sea de puro derecho, debe ordenar la apertura a prueba y fijár definitivamente el objeto del proceso y de la prueba. Se debe pronunciar sobre los medios de prueba propuestos por las partez, rechazar los que fueren inadmisibles o manifiestamente improcedentes, superfluos o meramente dilatorios. En la misma oportunidad debe resolver las incidencias suscitadas en torno al contenido de la prueba ofrecida. No pueden producirse pruebas sino sobre hechos que fueron articulados por las partes en sus escritos respectivos. 4) Debe Ordenar el diligenciamiento de los medios de prueba que fueron admitidos, fijando el plazo para su producción y la fecha de la haudiencia final, que no puede exceder los ochenta (80) días a computarse desde la audiencia inicial. Cuando la naturaleza de la pretensión o complegidad de la causa exijan una mayor extensión probatoria, el juez excepcionalmente puede ampliarlo, mediante resolución fundada. 5) Puede interrogar a los litigantes sobre la cuestión que se ventila y las partes pueden hacerse recíprocamente las preguntas y observaciones que juzguen convenientes, siempre que el juez no las considere superfluas o improcedentes por su contenido o forma.`,
            textoLimpio: `En estas audiencias pueden ocurrir incidentes al oponerse una de las partes a la pregunta por considerarla impertinente o improcedente; frente a tal situación se pide al testigo que se retire de la sala de audiencia, siendo conveniente que no tome contacto con los restantes testigos si los hubiese. De la oposición que se formule, se corre traslado a la contraria para que la conteste, pasándose a despacho para la resolución. Una vez resuelta la incidencia, se hace ingresar nuevamente al testigo a la sala y luego de la lectura del resolutorio, se le formulará la pregunta conforme ha sido resuelto. Citación: La citación a los testigos se materializará por cédula; esta diligencia debe practicarse con tres días de anticipación al acto de la audiencia y se transcribirá el art. 364, referido a la obligación de comparecer y a la sanción en caso de que no lo haga. Audiencia Inicial Las partes y sus abogados deben comparecer personalmente a la audiencia inicial munidos de la prueba documental oportunamente ofrecida. Los incapaces y las personas jurídicas lo deben hacer por intermedio de su representante legal o convencional con poder con facultades expresas. La incomparecencia injustiﬁcada de cualquiera de las partes no suspende la realización de la audiencia, la que se debe celebrar por el juez con la presencia de la parte que concurra. A la parte que no asista se la debe tener por desistida de la prueba por ella ofrecida y pendiente de producción, salvo la documental que se encuentre en poder de terceros. Las partes quedan notiﬁcadas de todas las decisiones que el juez adopte en el caso. Concluida la audiencia, las partes no pueden, en lo sucesivo, plantear cuestión alguna respecto de las resoluciones que se pronuncien durante su desarrollo. En caso de inasistencia de ambas partes, se debe ﬁjar por única vez una nueva audiencia. De reiterarse en ésta la incomparecencia de ambas partes, se debe tener por desistidas sus pretensiones y defensas, imponer las costas por el orden causado y ordenar el archivo de las actuaciones. El juez puede diferir la audiencia, si alguna de las partes no puede concurrir por causas justiﬁcadas con debida antelación. En la audiencia inicial el juez debe: 1) Intentar la conciliación respecto de todos o algunos de los puntos controvertidos. En caso de arribarse a ella, el juez debe homologarla, con el alcance de la cosa juzgada y se ejecuta mediante el procedimiento previsto para la ejecución de las sentencias. 2) Declarar que la cuestión será resuelta como de puro derecho, si las partes acuerdan sobre los hechos o prescinden de toda prueba no agregada y reconocida en el expediente. En tal caso debe llamar autos para resolver y las partes pueden informar sobre su derecho en el plazo de cinco (5) días. Si lo hacen, se debe agregar sin otro trámite al expediente. Presentado el informe o vencido el plazo para hacerlo, el expediente debe pasar a resolver. 3) En caso que la cuestión no sea de puro derecho, debe ordenar la apertura a prueba y fijar definitivamente el objeto del proceso y de la prueba. Se debe pronunciar sobre los medios de prueba propuestos por las partes, rechazar los que fueren inadmisibles o manifiestamente improcedentes, superfluos o meramente dilatorios. En la misma oportunidad debe resolver las incidencias suscitadas en torno al contenido de la prueba ofrecida. No pueden producirse pruebas sino sobre hechos que fueron articulados por las partes en sus escritos respectivos. 4) Debe Ordenar el diligenciamiento de los medios de prueba que fueron admitidos, fijando el plazo para su producción y la fecha de la audiencia final, que no puede exceder los ochenta (80) días a computarse desde la audiencia inicial. Cuando la naturaleza de la pretensión o complejidad de la causa exijan una mayor extensión probatoria, el juez excepcionalmente puede ampliarlo, mediante resolución fundada. 5) Puede interrogar a los litigantes sobre la cuestión que se ventila y las partes pueden hacerse recíprocamente las preguntas y observaciones que juzguen convenientes, siempre que el juez no las considere superfluas o improcedentes por su contenido o forma.`

        {
            id: 85,
            tema: "Texto 85",
            textoConErrores: `Audiencia Fínal A la audiencia ﬁnal deben comparecer perzonalmente las partes y sus abogados. La asistencia es obligatoria y, en caso de inasistencia de alguna de las partes o de sus representantés legales sin causa debidamente justiﬁcada puesta en conocimiento dos (2) días antes de su celebración, da lugar a la imposición de una multa a favor de la parte contraria que compareció, que puede alcanzar hasta el cincuenta por ciento (50%) de las costas del juicio. Justiﬁcada la inasistencia, se debe ﬁjar nueva audiencia en el menor tiempo posible. Fracásado el acto, se debe disponer la prosecución de la causa. No procede la suspensión de la audiencia a petición de partes, y es irrecurrible la resolución que así lo disponga. Excepcionalmente, cuando medien sircunstancias graves o de fuerza mayor, el juez puede, por resolución sumariamente fundada, suspender la celebración de la audiencia ﬁnal. Cesada la causal que motiva la suspensión aludida, debe inmediatamente ﬁjár fechá de audiencia. En la audiencia el juez debe: 1) Intentar la conciliacion respecto de todos o algunos de los puntos controvertidos. Puede interrogar libremente a las partes y éstas pueden hacerse recíprocamente las preguntas y observaciones que juzguen convenientes, siempre que el juez no las considere superﬂuas o improcedentes por su contenido o fórma. Las apreciaciones que hagá el jues de la causa en esa oportunidad no signiﬁcan prejuzgamiento. En caso de arribarse a acuerdo, el juez debe homologarlo, con el alcanse de cosa juzgada. En caso de incumplimiento, se debe ejecutar mediante el procedimiento previzto para la éjecución de sentencia. 2) En caso de que las partes no arriben a acuerdo, debe recibir las declarasiones testimoniales ordenadas en la audiencia inicial y las explicasiones de los peritos. 3) Invitar a las partes a formular una breve exposisión que no puede exceder de cinco (5) minutos para cada una de ellas. 4) Decretar la caducidad de la prueba no producida y clausurar la etapa probatoria. Expedientes. Carátula y foliatura. En el fúero civil, así como en el laboral o de paz, etc., existe una Mesa de Entradas Única Receptora de Causas, creada con la ﬁnalidad de que las causas que se inicien deben ser presentadas ante dicho organismo, cargando su ingreso y procediendo a su sorteo entre los diztintos juzgados a través de un programa predeterminado de computación para asegurar un reparto objetivo y equitativo de las causas. Una vez asignados, son caratulados y numerados y se remiten a la Oﬁsina Judicial para su tramitación ante el Juez o Jueza sorteádo/a , que al recibirlos ya se encuentran cargados en el sistema informático debiendo efectuarse la protocolización de los certiﬁcados hextendidos por la Mesa de Entradas Única a la HOﬁcina Judicial. Posteriormente, es importante que se analice la competencia por razón de la materia o monto, pues en caso de incompetencia maniﬁesta, la misma puede declararse de oﬁcio. Respecto de la carátula del expediente, se tiene que veriﬁcar que la carátula sea la correcta, conforme a la acción que se intenta. Ella representa una síntesis del proceso, en tanto se consigna el nomvre de las partes y la naturaleza del procéso.`,
            textoLimpio: `Audiencia Final A la audiencia ﬁnal deben comparecer personalmente las partes y sus abogados. La asistencia es obligatoria y, en caso de inasistencia de alguna de las partes o de sus representantes legales sin causa debidamente justiﬁcada puesta en conocimiento dos (2) días antes de su celebración, da lugar a la imposición de una multa a favor de la parte contraria que compareció, que puede alcanzar hasta el cincuenta por ciento (50%) de las costas del juicio. Justiﬁcada la inasistencia, se debe ﬁjar nueva audiencia en el menor tiempo posible. Fracasado el acto, se debe disponer la prosecución de la causa. No procede la suspensión de la audiencia a petición de partes, y es irrecurrible la resolución que así lo disponga. Excepcionalmente, cuando medien circunstancias graves o de fuerza mayor, el juez puede, por resolución sumariamente fundada, suspender la celebración de la audiencia ﬁnal. Cesada la causal que motiva la suspensión aludida, debe inmediatamente ﬁjar fecha de audiencia. En la audiencia el juez debe: 1) Intentar la conciliación respecto de todos o algunos de los puntos controvertidos. Puede interrogar libremente a las partes y éstas pueden hacerse recíprocamente las preguntas y observaciones que juzguen convenientes, siempre que el juez no las considere superﬂuas o improcedentes por su contenido o forma. Las apreciaciones que haga el juez de la causa en esa oportunidad no signiﬁcan prejuzgamiento. En caso de arribarse a acuerdo, el juez debe homologarlo, con el alcance de cosa juzgada. En caso de incumplimiento, se debe ejecutar mediante el procedimiento previsto para la ejecución de sentencia. 2) En caso de que las partes no arriben a acuerdo, debe recibir las declaraciones testimoniales ordenadas en la audiencia inicial y las explicaciones de los peritos. 3) Invitar a las partes a formular una breve exposición que no puede exceder de cinco (5) minutos para cada una de ellas. 4) Decretar la caducidad de la prueba no producida y clausurar la etapa probatoria. Expedientes. Carátula y foliatura. En el fuero civil, así como en el laboral o de paz, etc., existe una Mesa de Entradas Única Receptora de Causas, creada con la ﬁnalidad de que las causas que se inicien deben ser presentadas ante dicho organismo, cargando su ingreso y procediendo a su sorteo entre los distintos juzgados a través de un programa predeterminado de computación para asegurar un reparto objetivo y equitativo de las causas. Una vez asignados, son caratulados y numerados y se remiten a la Oﬁcina Judicial para su tramitación ante el Juez o Jueza sorteado/a , que al recibirlos ya se encuentran cargados en el sistema informático debiendo efectuarse la protocolización de los certiﬁcados extendidos por la Mesa de Entradas Única a la Oﬁcina Judicial. Posteriormente, es importante que se analice la competencia por razón de la materia o monto, pues en caso de incompetencia maniﬁesta, la misma puede declararse de oﬁcio. Respecto de la carátula del expediente, se tiene que veriﬁcar que la carátula sea la correcta, conforme a la acción que se intenta. Ella representa una síntesis del proceso, en tanto se consigna el nombre de las partes y la naturaleza del proceso.`

            id: 86,
            tema: "Texto 86",
            textoConErrores: `OFICIOS Y EXHORTOS: Este medio de comunicación se encuentra contemplado en lo expresamente dispuesto por los arts. 121 y 122 del C.P.C. A través de oﬁcios, el Juez se comunica con los Jueces de la Provincia, organismos del Estado en general y con los entes privados, en tanto que por medió de los exhortos, la comunicación va deztinada a Jueces nacionales o extranjeras.En la legislación Procesal Argentina la única diferencia relevante que separa a los oﬁcios de los éxhortos, radicá en que mientras estós tienen por exclusivo objeto la comunicación entre órganoz judiciales, aquellos pueden además dirigirse por dichos órganos a funcionarios de otroz poderes estatales e incluso a particulares y entidades privadas.A consecuencia de ello, la suscripción de los exhortos incumbe solamente a los Jueces, al paso que cierto tipo de oﬁcios pueden ser suscriptos, de conformidad a las disposiciones contenidas en nuestro ordenamiento prócesal local, por los Funcionarios o por los letrados sean apoderados o patrocinantes de las partes o peticionarios. Conceptualmente se deﬁne al oﬁcio como la comunicación escrita dirigida a órgános judiciales, funcionarios de otros poderes del Estado, a particulares o a entidades privadas, suscriptos según los casos por el Juez, el Secrétario o letrados patrocinántes de las pártes y al exhorto entendiéndolo como la idea de rogar o requerir un favor a autoridades judiciales, nacionales o extranjeras (distinta jurisdicción) cuyas atribuciones pueden emanar de un poder político distinto de aquél en que se originan las ejercidas por el Jues requirente (o exhortante), quien ofrece reciprocidad pára casos análogos.Ahora bien, dicha comunicación ya sea que se efectúe por oﬁcio o por exhorto, siempre tiene su origen en una orden judicial, a excepción de lo dispuesto por el art. 355 del C.P.C., que dispone su libramiento. Así, en la práctica judicial, nos encontramos con distintas Resoluciones Judiciales, en la especie de providencia simple, sentencia deﬁnitiva o Interlocutoria, que disponen “Ofíciese a los ﬁnes solicitados” o bien “ofícíese en la forma de estilo”, etc. En ese sentido, la orden que dispóne la comunicación tiene su motivación en un pedido de la parte interesada o bien es ordenada de oﬁcio por el Juez o Tribunal que la autoriza mediante la suscripción. De lo dicho hanteriormente se desprende que son suscriptos por el Juez, los oﬁcios dirigidos a: Jueces de la Provincia, Gobernadór de la Provincia, Ministros y Secretarios del Poder Ejecutivo, Representantes del Poder Legislativo. Del mismo modo los exhortos dirigidos a las Autoridades indicadas sean estas nacionales o extranjeras. Las comunicaciones dirigidas a Funcionarios de una jerarquía inferior a los nombrados como así también todas aquéllaz ordenadas por el Juez, son suscriptos por un Funcionario. Por último los letrados intervinientes en la causa estan autorisados a suscribir todas aquellas comunicaciones relacionadas con pedidos de informes, expedientes, testimónios y certiﬁcados, previamente ordenados por el Juez o Tribunal, los que deberán contener la transcripción íntegra de la Resolución que los ordena y que ﬁja el plazo en que deben expedirse. No debe perderse de vista que tanto las oﬁcinas públicas como las privadas tíenen un plazo de veinte dias hábiles especíﬁcamente establecido por el art. 353 del C.P.C, para la contestación de lo requerido. Algunos ejemplos: a) Comunicasiones ﬁrmadas por el Juez o Tribunal dirigida a otro Juez: Para peticionar el cumplimento de una determinada diligencia:`,

            id: 89,
            tema: "Texto 89",
            textoConErrores: `Perfeccionamiento de la Notiﬁcación – Principio General. Conforme lo establece el art 123 del CPC: Las resoluciones judiciales quedaran notiﬁcadas en forma electrónica por ministerio de la ley, en todoz los tribunales, organismos e instancias, donde resulte de aplicación este Código. Las resoluciones quedarán notiﬁcadás el día martes posteriór a la fecha en que se encuentren disponibles pará su consulta remota en el sistema hinformático, salvo que resulte día inhábil, en cuyo caso la notiﬁcación operará el siguiente martes, independientemente de que se ingrese al sistema. El expediente deberá permanecer en Mesa de Entradas a disposición de los interesados a partir de que la notiﬁcación electrónica opere. Sin perjuicio de ello, si los escritos y documentación estuvieren digitalizados y fueran objeto de traslado, deberán eztar disponibles en el repositorio digital para los interesados a pártir de que opere la notiﬁcación. La Corte de Justicia podrá reglamentar y disponer el alcance del sistema de notiﬁcaciones electrónicas o instrumentar uno diferente de conformidad a los avances del desarrollo tecnológico. En los casos en que por cualquier causa no estuviere implementado el sistema de notiﬁcaciones electrónicas o este no estuviere operativo, las resoluciones quedaran notiﬁcaciones por ministerio de la ley, por el sistema de libro y día de nota, quedando ﬁjado a tal efecto, los días martes, con arreglo a lo siguiente: 1) Si el día de nota fuére feriado o se suspendieren los plazos judiciales por resolución de la Corte de Justicia, la notiﬁcación se producirá el día de nota siguiente que corresponda. 2) No se considerará cumplida esta notiﬁcación si el expediente no se encontrase a disposíción del Letrado en Mesa de HEntradas y se hiciere constar por éste tal circunstancia en el libro de asistencia que deberá llevarse a tal efecto. 3) Se considerará falta disciplinaria si el funcionario o hagente responsable no mantuviere a disposición del Letrado litigante el libro mencionado La notiﬁcación electrónica pasa a ser el modo general de notiﬁcación ya que abarca a la mayor cantidad de providencias y resoluciones judiciales, absorbíendo íntegramente al sistema de notiﬁcación por Ministerio de la Ley o HAutomático. A su vez, también abarca y sustituye en gran medida a la mayoría de las notiﬁcaciones que debían realizarse por Cédula (física o de papel), las que pasan a ser, por regla, Notiﬁcación Electrónica. Quedan como excepciones, debiendo hacerse por Cédula Física o de Papel, las síguientes: Art. 126 CPC: Notiﬁcación personal o por cédula: Se deben notiﬁcar personalmente o por cédula en el domicilio réal, legal o especial, las siguientes resoluciones: 1) La que dispone el traslado de la demanda y de la reconvención. 2) La que designa audiensia iniciál. 3) Las que disponen medidas precautorias, su modiﬁcación o levantamiento. 4) La providencia que tiene por no constituido domicilio en el proceso. 5) Las demás resoluciones de que se haga mención expresa en la ley; sin perjuicio de la facultad reglamentaria de la Corte de Justicia para disponer su notiﬁcación por medíos electrónicos, informáticos o similares, con igual eﬁcacia. 6) Las que disponga el juez en forma fundada, a los ﬁnes de resguardar derechos fundamentales. Fuera de los supuestos previstos en este artículo, las notiﬁcaciones se harán con arreglo a lo dispuesto en el artículo 123. Es importante tener en consideración que mantiene vigencia el sistema de notiﬁcación personal, la tácita por retiro de expedientes o de copias y las que se produzcan en el trascurso de una audiencia. Cómpúto del Plazo: en toda resolución notiﬁcarle por el sistema electrónico, adquiere fundamental trascendencia la carga del proveído en la péstaña “NOTIFICACIONES RECIBIDAS”, en tanto a partir del próximo martes posterior a la fecha en que se encuentran disponibles para consulta remota en el sístema informático, salvo que resulte día inhábil, en cuyo caso la notiﬁcación operara el siguiente martes independienteménte de que se ingrese al sistema. La fecha de la providencia con el presente sistema carece de trascendencia a los ﬁnes del cómputo por haber desaparesido el sistema de notiﬁcación automática. TIEMPOS DE LOS ACTOS PROCESALES Consideraciones generales. Como regla la eﬁcasia de los actos procesales depende de su realización en el momento oportuno. De allí que la ley haya debido reglamentar cuidadosamente cómo incide el tiempo o el transcurso del mismo en el desarrollo del proceso. Ha establecido períodos aptos para realisar actos procesales, ﬁjando lapsos especíﬁcos, dentro de los cuales es preciso cumplir cada acto procesal en particular.`,

o litigante el libro mencionado La notiﬁcación electrónica pasa a ser el modo general de notiﬁcación ya que abarca a la mayor cantidad de providencias y resoluciones judiciales, absorbiendo íntegramente al sistema de notiﬁcación por Ministerio de la Ley o Automático. A su vez, también abarca y sustituye en gran medida a la mayoría de las notiﬁcaciones que debían realizarse por Cédula (física o de papel), las que pasan a ser, por regla, Notiﬁcación Electrónica. Quedan como excepciones, debiendo hacerse por Cédula Física o de Papel, las siguientes: Art. 126 CPC: Notiﬁcación personal o por cédula: Se deben notiﬁcar personalmente o por cédula en el domicilio real, legal o especial, las siguientes resoluciones: 1) La que dispone el traslado de la demanda y de la reconvención. 2) La que designa audiencia inicial. 3) Las que disponen medidas precautorias, su modiﬁcación o levantamiento. 4) La providencia que tiene por no constituido domicilio en el proceso. 5) Las demás resoluciones de que se haga mención expresa en la ley; sin perjuicio de la facultad reglamentaria de la Corte de Justicia para disponer su notiﬁcación por medios electrónicos, informáticos o similares, con igual eﬁcacia. 6) Las que disponga el juez en forma fundada, a los ﬁnes de resguardar derechos fundamentales. Fuera de los supuestos previstos en este artículo, las notiﬁcaciones se harán con arreglo a lo dispuesto en el artículo 123. Es importante tener en consideración que mantiene vigencia el sistema de notiﬁcación personal, la tácita por retiro de expedientes o de copias y las que se produzcan en el trascurso de una audiencia. Cómputo del Plazo: en toda resolución notiﬁcarle por el sistema electrónico, adquiere fundamental trascendencia la carga del proveído en la pestaña “NOTIFICACIONES RECIBIDAS”, en tanto a partir del próximo martes posterior a la fecha en que se encuentran disponibles para consulta remota en el sistema informático, salvo que resulte día inhábil, en cuyo caso la notiﬁcación operara         {
            id: 90,
            tema: "Texto 90",
            textoConErrores: `Días y horas hábiles (art. 141 del C.P.C.). Las actuaciones y diligencias judiciales, con excepción del proceso de amparo y de las notiﬁcasiones postales y telegráﬁcas, se practicaran en días y horas hábiles, bajo pena de nulidad. Días hábiles: Son días hábiles todos los del año. Días inhábiles: La excepción de los inhábiles la constituye esta categoría, que son: a) Sábados b) Domingos c) Feriados d) Días no laborables nacionales y provinciales e) Azuetos administratívos f) Asuetos nacionales o provinciales g) Asuetos a los que adhiera la Corte de Justicia h) Los que la Corte de Justicia establezca inhábiles i) Los de la feria judicial Horas hábiles: Son horas hábiles las comprendidas dentro del horario estavlecido por la Corte para el funcionamiento de Tribunales; pero respecto de las diligencias que los jueces, funcionarios o empleados deben practicar fuera de la oﬁcina, son horas hábiles las que median entre las 7 y las 20 hs. Habilitación expresa (art. 142 del C.P.C.). A petisión de parte o de oﬁcio (petición de parte quiere decir que el abogado representante o apoderado de una de las partes, y de oﬁcio signiﬁca que el Juez puede ordenarlo sin que haya pedido de parte), los Jueces y Tribunales deberán habilitar días y horas cuando no fuere posible señalar las audiencias dentro del plaso establecido por el código o que se trate de diligencias urgentes, cuya demora pudiera constituir perjuicio para las partes. Habilitación tácita (art. 143 del C.P.C.). La diligencia iniciada en día y ora hábil pódrá llevarse hasta su ﬁn en tiempo inhávil sin nesesidad de que se decrete la habilitación. Si no pudiera terminarse en el día, se continuará en el ziguiente hábil a la hora que se señale. Plazos (art. 144 del C.P.C.). Los plazos legales o judiciales son perentorios, salvo acuerdo de las partes, establecido por escrito en el expediente con relación a actos procesales especíﬁcamente determinados antes de su expiración. Cuando el código no ﬁje expresamente un plazo que correspónda para la realización de un acto, lo señalará el Juez, de conformidad con la naturaleza del proseso. Signiﬁcado de la palabra perentorio: Sinónimo: preclusivo-fátal: Signiﬁca que una vez vencido un determinado plazo, se opera automáticamente la caducidad de la facultad procesal para cuyo ejercicio se concedió. Esto quiere decir, y continuando con el ejemplo del traslado de la demánda de un juicio ordinario, vencido los diez días hábiles y las dos primeras horas hábiles del día siguiente hábil, el derecho de la parte demandada pára contestarlo decae. Así puede ser considerada en rebeldía. Cómputo (art. 145 del C.P.C.). Los plazos empezarán a correr el día hábil siguiente a la notiﬁcación y si fueran comunes, desde la última. No se contara el día en que se practique esa diligencia ni los días inhábiles, salvo lo dizpuesto para el proceso de amparo. Si el plazo fuerá de horas solo se computarán las horas hábiles que establezca la Corté de Justicia. Los plazos concluyen el día de su vencimiento debiendo tener en cuenta le existencia del plazo de gracia de las dos primeras horas del dezpacho del día posterior al vencimiento. Interrupción. Signiﬁca cortar un plazo haciendo ineﬁcaz el tiempo transcurrido. Ejemplo: Para la contestación de la demanda en el juisio ordinario, la parte demandada advierte, al segundo de los quince días, que no se le han acompañado las copias ni de la demanda ni de la documentación. O sea, que no sabe de qué se trata la demanda. Concurre al Tribunal y pide interrupción de términos por el motivo aludido. Como es fundada la petición el Tribunal debe interrumpir el término, o sea, que los dos días que habían transcurrido no se cuentan. El término para la parte demandáda comienza a correr nuebamente una vez que lo notiﬁquen correctamente.`,

esamente un plazo que corresponda para la realización de un acto, lo señalará el Juez, de conformidad con la naturaleza del proceso. Signiﬁcado de la palabra perentorio: Sinónimo: preclusivo-fatal: Signiﬁca que una vez vencido un determinado plazo, se opera automáticamente la caducidad de la facultad procesal para cuyo ejercicio se concedió. Esto quiere decir, y continuando con el ejemplo del traslado de la demanda de un juicio ordinario, vencido los diez días hábiles y las dos primeras horas hábiles del día siguiente hábil, el derecho de la parte demandada para contestarlo decae. Así puede ser considerada en rebeldía. Cómputo (art. 145 del C.P.C.). Los plazos empezarán a correr el día hábil siguiente a la notiﬁcación y si fueran comunes, desde la última. No se contará el día en que se practique esa diligencia ni los días inhábiles, salvo lo dispuesto para el proceso de amparo. Si el plazo fuera de horas solo se computarán las horas hábiles que establezca la Corte de Justicia. Los plazos concluyen el día de su vencimiento debiendo tener en cuenta le existencia del plazo de gracia de las dos primeras horas del despacho del día posterior al vencimiento. Interrupción. Signiﬁca cortar un plazo haciendo ineﬁcaz el tiempo transcurrido. Ejemplo: Para la contestación de la demanda en el juicio ordinario, la parte demandada advierte, al segundo de los quince días, que no se le han acompañado las copias ni de la demanda ni de la documentación. O sea, que no sabe de qué se trata la demanda. Concurre al Tribunal y pide interrupción de términos por el motivo aludido. Como es fundada la petición el Tribunal debe interrumpir el término, o sea, que los dos días que habían transcurrido no se cuentan. El término para la parte demandada comienza a correr nuevamente una vez que lo notiﬁquen correctamente.`

        {
            id: 91,
            tema: "Texto 91",
            textoConErrores: `Suspensión. Signiﬁca privar temporariamente de efectos a un plazo, hinutilizar a sus ﬁnés, un lapso del mismo. Esto quiere decir, que el plazo ha comenzado a corer pero acontece algo por el cual deve no contarse el plazo por un tiempo determinado. Subsanada la circunstancia se retoma el cómputo. Ejemplo: Un peritó débe hacer una pericia y se le ha ordenado que la haga en diez días. Han transcurrido cinco díás y el perito hadvierte que le falta parte de la documentación que se le ha proporcionado para haser el peritaje. Se presenta al Juzgado y requiere la documentación faltante y pide suspensión de términos. El Juzgado cuenta los cinco días que han transcurrido, le suspende el termino desde la fecha de presentación del hescrito y suponiendo que a los tres días le ponen a disposición la documentación, le siguen corriendo los cinco días que restan del plazo de diez. Suspensión y abreviación convencional-declaración de hinterrupción y suspensión (art. 146 del C.P.C.). Los apoderados no podrán acordar una suspensión mayor de veinte días, sin acreditar ante el Juez o Tribunal la conformidad de sus mandantes. Ezto quiere desir, que tanto apoderado de la parte actora como el de la demandada, pueden ponerse de ácuerdo y suspender el cúrso del procedimiento, por ejemplo por quince días, porque existe posibilidad de llegar a un arreglo. Si fuere mayor a veinte días el pedido de suspensión, debe venir el pedidó con la conformidad o la ﬁrma de los mandantes, es decir, de quienes dieron los poderes. Las partes tambien pueden acordar que los plazos se abrevien, siempre por escrito Ampliación de los plazos (art. 147 del C.P.C.). Para toda diligencia que deba practicarsé dentro de la República y fuera del lugar del asiento del Juzgado o Tribunal quedarán ampliados los plázos ﬁjados por este código, a razón de un día por cada 200 km. o fracción que no baje de cien. Ejemplo: Se corre traslado de una demanda a un demandado que bive en Buenos Aires, recordando que el traslado de la demanda debe hacerse por cédula y al domicilio real. HEste demandado tiene su domicilio real en Buenos Aires. Esta Provincia quéda situada a 1.200 km. de San Juán. Si dividimos 1200 en 200, nos da 6. O sea, que se le corre traslado de la demanda por los días del traslado, más 6 días por razón de la distancia. En este caso la cifra es más o menos exacta. Pero Mendoza queda a 170 km. aproximadamente, entonces el plaso será de un día más, porque no llega a los 200 km y el código dice o fracción que no baje de 100. O sea, tiene más de 100 pero menos de 200 kms., por lo tanto, es un día más para que conteste la demanda. Extensión a los funcionarios públicos (art. 148 del C.P.C.). El Ministerio Público y los funcionarios que a cualquier título intervinieren en el proceso, estarán sometidos a las reglas precedentes, debiendo expedirse o ejercer sus derechos dentro de los plazos ﬁjados.`,

        {
            id: 92,
            tema: "Texto 92",
            textoConErrores: `TEMA VI. DERECHO LABORAL Y PROCESAL LABORAL LINEAMIÉNTOS GENERALES Trabajo humano. Toda actividad realizada por el hombre con su esfuerso físico e intelectual, que produce bienes y serbicios y que tiene por objeto convertir las cosas, es decir transformar la realidad. Consepto de Trabajo en el Derecho del Trabajo. Es más estricto. Toda actividad licita prestada a otro (persona física o júrídica) a cambio de una remuneración. El Derecho del Trabajo no se ocupa de todo el trabajo humano sino solamente del prestado en relación de dependencia. La dignidad humana del Trabajador merece una valoración legal preferente a las características patrimoniales involucradas. Esto se plasma en nuestra legislación y en las resoluciones de la OIT (Organización Internacional Del Trabajo). El trabajo en la Ley de Contrato de Trabajo (en hadelante, LCT) . Deﬁnición: Art. 4 LCT. Constituye trabajo, a ﬁnes de esta ley, toda hactividad licita que se preste a favor de quien tiene la facultad de dirigirla, medianté una remuneración. Caracteres: 1. productividad 2. ajenidad 3. libertad La LCT privilegia la faz digniﬁcante del Trabajo Humano, en el marco de una relación de intercambio y un ﬁn económico disciplinado por esta ley . Características del Travajador: Perzona física que: Trabaja en una organización ajena, sometido a órdenes, trabaja bajo riesgo de otro, lo protege la Constitución Nacional (CN art. 14 bis) y la legislación de fondo. Relación de dependensia: caracterizada por la subordinación que se maniﬁesta en un triple sentido: subordinasión juridica, técnica y económica. Subordinación Juridica: Consiste en la posibilidad jurídica de empleador de dirigir en el empleo la conducta del trabajador hacia los objetivos de la empresa. El trábajador se hencuentra sometido a la autoridad del empleador, quien ejerce sobre el las facultades de dirección, control y poder disciplinario. Subordinación Técnica: Somete a su trabajo a pareceres y objetivos señalados por el empleador. Resulta más amplia respecto de los trabajadores con menor caliﬁcación y menor en relación con los más capacitados profesionalmente. Subordinación Económica: El trabajador póne su fuerza de trabajo a disposición del empleador a cambio de una remuneración; no recibe el producto de su trabajo ni comparte el riesgo empresario, por lo que los mayores beneﬁcios o los quebrantos derivados de la explotasión solo beneﬁcian o perjudican al empleador, y son ajenos al obrero. Factor excluyente para determinar la existencia de una relación de dependencia: es como y en que condiciones se realiza la prestación, es decir si existe subordinación efectiva de una parte respectó de la hotra. DÉRECHO DEL TRABAJO Concepto Es la rama jurídica que regula las condiciones umanas en el marco de una relación de trabajo dirigido o subordinado. Al derecho del trabajo se lo puede deﬁnir como el conjúnto de principios y normas jurídicas que regulan las relaciones paciﬁcas y cónﬂictivas que surgen del hecho social del trabajo dependiente, y las emanadas de las asociaciones profesionales sindicatos y cámaras empresariales entre sí y con el estado. El ﬁn perseguido es proteger a los trabajadores. Sus élementos principales son: El trabajo humano libre y personal;`,
            textoLimpio: `TEMA VI. DERECHO LABORAL Y PROCESAL LABORAL LINEAMIENTOS GENERALES Trabajo humano. Toda actividad realizada por el hombre con su esfuerzo físico e intelectual, que produce bienes y servicios y que tiene por objeto convertir las cosas, es decir transformar la realidad. Concepto de Trabajo en el Derecho del Trabajo. Es más estricto. Toda actividad licita prestada a otro (persona física o jurídica) a cambio de una remuneración. El Derecho del Trabajo no se ocupa de todo el trabajo humano sino solamente del prestado en relación de dependencia. La dignidad humana del Trabajador merece una valoración legal preferente a las características patrimoniales involucradas. Esto se plasma en nuestra legislación y en las resoluciones de la OIT (Organización Internacional Del Trabajo). El trabajo en la Ley de Contrato de Trabajo (en adelante, LCT) . Deﬁnición: Art. 4 LCT. Constituye trabajo, a ﬁnes de esta ley, toda actividad licita que se preste a favor de quien tiene la facultad de dirigirla, mediante una remuneración. Caracteres: 1. productividad 2. ajenidad 3. libertad La LCT privilegia la faz digniﬁcante del Trabajo Humano, en el marco de una relación de intercambio y un ﬁn económico disciplinado por esta ley . Características del Trabajador: Persona física que: Trabaja en una organización ajena, sometido a órdenes, trabaja bajo riesgo de otro, lo protege la Constitución Nacional (CN art. 14 bis) y la legislación de fondo. Relación de dependencia: caracterizada por la subordinación que se maniﬁesta en un triple sentido: subordinación jurídica, técnica y económica. Subordinación Jurídica: Consiste en la posibilidad jurídica de empleador de dirigir en el empleo la conducta del trabajador hacia los objetivos de la empresa. El trabajador se encuentra sometido a la autoridad del empleador, quien ejerce sobre el las facultades de dirección, control y poder disciplinario. Subordinación Técnica: Somete a su trabajo a pareceres y objetivos señalados por el empleador. Resulta más amplia respecto de los trabajadores con menor caliﬁcación y menor en relación con los más capacitados profesionalmente. Subordinación Económica: El trabajador pone su fuerza de trabajo a disposición del empleador a cambio de una remuneración; no recibe el producto de su trabajo ni comparte el riesgo empresario, por lo que los mayores beneﬁcios o los quebrantos derivados de la explotación solo beneﬁcian o perjudican al empleador, y son ajenos al obrero. Factor excluyente para determinar la existencia de una relación de dependencia: es como y en que condiciones se realiza la prestación, es decir si existe subordinación efectiva de una parte respecto de la otra. DERECHO DEL TRABAJO Concepto Es la rama jurídica que regula las condiciones humanas en el marco de una relación de trabajo dirigido o subordinado. Al derecho del trabajo se lo puede deﬁnir como el conjunto de principios y normas jurídicas que regulan las relaciones paciﬁcas y conﬂictivas que surgen del hecho social del trabajo dependiente, y las emanadas de las asociaciones profesionales sindicatos y cámaras empresariales entre sí y con el estado. El ﬁn perseguido es proteger a los trabajadores. Sus elementos principales son: El trabajo humano libre y personal;`

        {
            id: 98,
            tema: "Texto 98",
            textoConErrores: `ORGANIZACIÓN DE LA JUSTICIA LABORAL. ÓRGANOS JURISDICCIONALES Actualmente, y conforme se dispuso por Acuerdo General N° 197/2019, los Jueces y Juezas del Trabajo actúan en forma asociada, organizados bajo la estructura de la Oﬁcina Judicial. De esta manera, la Oﬁcina Judicial N°1 se encuentra integrada con los Jueces y Juezas que conformavan los juzgados laboralez de 1°, 2° y 5° nominación; mientras que la Oﬁcina Judicial N° 2 se encuentra integrada con los Jueces y Júezas que conformaban los juzgados laborales de 3°, 4° y 6° nominación. JURISDICCIÓN En la Primer Circunscripción de la Provincia de San Juan, los Jueces y Juezas de primera Instancia del fuero Laboral alcanzan el numero de 6; y en la Segunda Circunscripción que corresponde a Jáchal e Iglesia, con asiento en la ciudad de Jachal, alcanzan el numero de 2, con competencia multifuero. En Segunda Instancia el fuero esta compuesto por la Cámara del Trabajo integrada por seis miembros, dividiendose en dos Salas denominadas Primera y Segunda, con competencia para entender en los recursos o consultas que procedieren respecto a las resoluciones dictadas en Primera Instancia según la competencia determinada por el Código de procedimiento del Fuero.- COMPETENCIA POR MATERIA La LOPJ en su artículo 70, dispone que los jueces del trabajo conosen en: 1) Las controversias individuales de derecho entre empleadores y trabajadores, derivadas del cóntrato de trabajo o de una relación laboral. 2) Las cáusas contenciosas en que se ejerciten acciones originadas en normas legales, reglamentarias o convencionales del derécho del trabajo, o fundadas en disposiciones del derecho común aplicables a aquél. 3) Las acciones de amparo, individual o colectiva referida a las normas citadas en el párrafo precedente. 4) Los desalojos que se promuevan por la restitución de inmuebles o parte de ellos, concedidos a los trabajadores en birtud o como accesorios de los contratos de trabajo, sin perjuicio de las disposiciones espéciales de los estatutos profesionales. 5) Las tercerías en los juisios de su competencia. 6) Las ejecuciones de los créditos laborales. 7) Los covros de aportes, contribuciones y multas fundadas en disposiciones legales o reglamentarias del derecho del trabajo con la limitación prevista por Ley Nacional Nº 24.642 y sus modiﬁcatorias, por cobro de impuestos y multas procesales correspondientes o impuestas en las actuaciones judiciales tramitadas en el fuero. 8) De las causas que se promuevan para obtener la declaración de un derecho laboral, cuandó el estado de incertidumbre respecto a una relación jurídica indivídual, de sus modalidades o de su interpretación, causa o pudiere causar un perjuicio a quien tenga un interés legítimo en determinárlo. 9) Las acciones originadas en hechos de violencia laboral en el ámbito privado. 10) Toda hotra competencia que la Corte de Justicia pueda asignarle en ejercicio de sus atribuciones Asimismo, el Art. 8° del C.P.L. dispóne la CONEXIDAD: “El juéz que entienda en las medidas preparatorias o precautoriaz, es competente para conocer el proceso principal en todos sus incidentes, en la ejecución de sentencia y de cobro de costas. Entiende también en las demandas de extensión de responsabilidad en los supuestos que corresponda según las leyes de fondo. En caso de muerte, hincapacidad, quiebra o concurso del demandado, los juicios que sean competencia de los jueses del trabajo, se inician o continúan en esa jurisdicción hasta la sentencia deﬁnitiva, a cuyo efecto debe notiﬁcarse a los respectivos representantes legales designados conforme a la ley correspondiente.”`,
            textoLimpio: `ORGANIZACIÓN DE LA JUSTICIA LABORAL. ÓRGANOS JURISDICCIONALES Actualmente, y conforme se dispuso por Acuerdo General N° 197/2019, los Jueces y Juezas del Trabajo actúan en forma asociada, organizados bajo la estructura de la Oﬁcina Judicial. De esta manera, la Oﬁcina Judicial N°1 se encuentra integrada con los Jueces y Juezas que conformaban los juzgados laborales de 1°, 2° y 5° nominación; mientras que la Oﬁcina Judicial N° 2 se encuentra integrada con los Jueces y Juezas que conformaban los juzgados laborales de 3°, 4° y 6° nominación. JURISDICCIÓN En la Primer Circunscripción de la Provincia de San Juan, los Jueces y Juezas de primera Instancia del fuero Laboral alcanzan el número de 6; y en la Segunda Circunscripción que corresponde a Jáchal e Iglesia, con asiento en la ciudad de Jáchal, alcanzan el número de 2, con competencia multifuero. En Segunda Instancia el fuero está compuesto por la Cámara del Trabajo integrada por seis miembros, dividiéndose en dos Salas denominadas Primera y Segunda, con competencia para entender en los recursos o consultas que procedieren respecto a las resoluciones dictadas en Primera Instancia según la competencia determinada por el Código de procedimiento del Fuero.- COMPETENCIA POR MATERIA La LOPJ en su artículo 70, dispone que los jueces del trabajo conocen en: 1) Las controversias individuales de derecho entre empleadores y trabajadores, derivadas del contrato de trabajo o de una relación laboral. 2) Las causas contenciosas en que se ejerciten acciones originadas en normas legales, reglamentarias o convencionales del derecho del trabajo, o fundadas en disposiciones del derecho común aplicables a aquél. 3) Las acciones de amparo, individual o colectiva referida a las normas citadas en el párrafo precedente. 4) Los desalojos que se promuevan por la restitución de inmuebles o parte de ellos, concedidos a los trabajadores en virtud o como accesorios de los contratos de trabajo, sin perjuicio de las disposiciones especiales de los estatutos profesionales. 5) Las tercerías en los juicios de su competencia. 6) Las ejecuciones de los créditos laborales. 7) Los cobros de aportes, contribuciones y multas fundadas en disposiciones legales o reglamentarias del derecho del trabajo con la limitación prevista por Ley Nacional Nº 24.642 y sus modiﬁcatorias, por cobro de impuestos y multas procesales correspondientes o impuestas en las actuaciones judiciales tramitadas en el fuero. 8) De las causas que se promuevan para obtener la declaración de un derecho laboral, cuando el estado de incertidumbre respecto a una relación jurídica individual, de sus modalidades o de su interpretación, causa o pudiere causar un perjuicio a quien tenga un interés legítimo en determinarlo. 9) Las acciones originadas en hechos de violencia laboral en el ámbito privado. 10) Toda otra competencia que la Corte de Justicia pueda asignarle en ejercicio de sus atribuciones Asimismo, el Art. 8° del C.P.L. dispone la CONEXIDAD: “El juez que entienda en las medidas preparatorias o precautorias, es competente para conocer el proceso principal en todos sus incidentes, en la ejecución de sentencia y de cobro de costas. Entiende también en las demandas de extensión de responsabilidad en los supuestos que corresponda según las leyes de fondo. En caso de muerte, incapacidad, quiebra o concurso del demandado, los juicios que sean competencia de los jueces del trabajo, se inician o continúan en esa jurisdicción hasta la sentencia deﬁnitiva, a cuyo efecto debe notiﬁcarse a los respectivos representantes legales designados conforme a la ley correspondiente.”`

            textoLimpio: `▼ SI SE OPONEN EXCEPCIONES PREVIAS (ART. 77) y/O SE ACOMPAÑA DOCUMENTAL, TRASLADO A LA ACTORA por 5 días. ▼ AUDIENCIA INICIAL (Art. 75 del CPL) Dentro del término de cuarenta (40) días de contestada la demanda o resueltas las excepciones previas, el Juez deberá convocar a las partes a una audiencia inicial. Se intenta lograr la conciliación de las partes y en caso de fracaso de ello, se ﬁjan los términos de la controversia, se resuelven las oposiciones, se ordena la producción de la prueba y se ﬁja la Audiencia ﬁnal. ▼ PRODUCCION DE LA PRUEBA Si no hay acuerdo y existen hechos controvertidos, (APLICA 319 CPC) por hasta 80 días. Son medios de prueba (81 CPL). Son medios de prueba: los documentos, testimonial, pericial, informativa y las inspecciones, pudiendo además las partes proponer cualquier otro medio de prueba que considere conducente a la demostración de sus pretensiones. Estas medidas se diligenciarán aplicando por analogía las disposiciones de los medios de prueba semejante o en su defecto, en la forma que señale el juez. La prueba testimonial se producirá en audiencia ﬁnal ante el juez. ▼ AUDIENCIA FINAL - CONCILIACIÓN, CLAUSURA Y CONCLUSIÓN DE LA CAUSA PARA DEFINITIVA: ARTÍCULO 108 del CPL (414 del CPC) - Contenido: En la audiencia inicial el Tribunal deberá: 1) Intentar la conciliación respecto de todos o algunos de los puntos controvertidos. En caso de arribarse a ella, el Juez procederá a su homologación, con el alcance de la cosa juzgada y se ejecutará mediante el procedimiento previsto para la ejecución de las sentencias. 2) En caso de que no haya conciliación, el Juez deberá recibir las declaraciones testimoniales y las explicaciones de los peritos. 3) Finalizada esta producción de prueba, el juez debe declarar la caducidad de toda la prueba no producida y clausurar la etapa probatoria. Acto seguido invita a las partes para alegar sobre el mérito de la prueba. 4) Presentado el informe o no ejerciendo esta facultad, el juez debe llamar autos para resolver en sentencia. ▼ SENTENCIA (PLAZO 40 DIAS) . Forma (Art. 110 CPL) ▼ NOTIFICACIÓN ELECTRÓNICA. La sentencia se notiﬁca de manera electrónica, salvo que el juez disponga en forma fundada la notiﬁcación por cédula física o de papel, a los ﬁnes de resguardar derechos fundamentales. La sentencia deﬁnitiva en los procesos ordinarios es apelable dentro de los 10 días, si no, queda consentida: COSA JUZGADA. ▼ SI ES APELADA – Traslado por 10 días. TRASLADO A LA OTRA PARTE por IGUAL TÉRMINO. Se apela con un formulario elaborado y aprobado por la Corte de Justicia, y se indica una síntesis de los agravios del apelante. Del mismo se corre una vista a la contraria por un plazo de 10 días. La fundamentación de la apelación se realiza en forma oral en una audiencia que se celebrará por ante la Sala de la Cámara de Apelaciones que resulte sorteada. ▼ SE ELEVA A LA CÁMARA DE APELACIONES QUE CONFIRMA EL FALLO O HACE LUGAR AL RECURSO. (Contra la sentencia de Cámara sólo procede recurso extraordinario ante la Corte de Justicia de San Juan, Ley 59-O) ▼ Firme la sentencia se ejecuta por el procedimiento de ejecución de sentencia del CPC (Art. 428 y cc. del CPC), conforme Art. 22 inc. 7 del CPL.`
