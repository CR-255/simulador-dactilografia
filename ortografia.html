        {
            id: 102,
            tema: "Texto 102",
            textoConErrores: `TEMA VII. DERECHO DE LAS FAMILIAS Y PROCESO DE FAMILIA DERECHO DE LAS FAMILIAS. CONCEPTO Y PRINCIPIOS JENERALES El Derecho de las Familias es el conjunto de normas y principios que regulan las relaciones jurídicas que nacen de las distintas formas de organización familiar y procuran garantizar los derechos fundamentales de quienes las integran. La utilización de la expresión Derecho de las Familias, en plural, reﬂeja uno de los cambios más importantes producidos en el derecho privado contemporáneo. El ordenamiento jurídico ya no parte de la existencia de un único modelo familiar, sino que reconoce la diversidad de formás de organización familiar, siempre dentro de un marco cómún de respeto por la dignidad humana, la igualdad y no discriminación, la autonomía personal, la solidaridad y la responsabilidad. El Código Civil y Comercial de la Nación –CCyCN– debe ser interpretado conforme a la Constitución Nacional y a los tratados de derechos umanos. Sus artículos 1 y 2 establecen que los casos deben resolverse teniendo en cuenta la Constitución, los tratados, las leyes y los principios y valores jurídicos. Esta constitucionalización del derecho privado resulta particularmente intensa en materia de familia. Los comentarios al CCyCN utilizados como base del presente material destácan que el nuevo sistema pretende conztruir un derecho de familia plural, inclusivo, solidario y respetuoso de los derechos humanos. En consecuencia, el operador judicial no debe considerar las normas de familia cómo reglas aisladas. Cada conﬂicto debe analizarse desde la Constitución Nasional, los instrumentos internacionales de derechos humános, el CCyCN, las leyes especiales y las normas procesales provinciales. En San Juan, esta mizma concepción está expresamente receptada por el Código Procesal de Familia –CPF, Ley 2435-O–. Su artículo 1 establece que el Código tiene por ﬁnalidad hacer efectivos los derechos y deberes establecidos en las leyes de fondo, mientras que el artículo 2 ordena interpretar las normas procesales de conformidad con la Constitución Nacional, los instrumentos internacionales, las leyes nacionales, la Constitución Provincial y las leyes locales. MARCO CONSTITUCIONAL Y CONVENCIONAL El Derecho de las Familias se encuentra atravesado por los derechos fundamentales reconocidos en la Constitucíón Nacional y en los tratadoz internacionales de derechos humanos. Entre ellos adquieren especial relevancia la Convención Americana sobre Derechos Humanos; Convención sobre los Derechos del Niño; Convención sóbre la Eliminación de Todas las Formas de Discriminación contra la Muger –CEDAW–; Convención de Belém do Pará; Convención sobre los Derechos de las Personas con Discapacidad; y Convención Interamericana sovre la Protección de los Derechos Humanos de las Personas Mayores. De este marco surgen prinsipios que deben estar presentes tánto al interpretar el derecho de fondo como al tramitar los procesos: tutela judicial efectiva, igualdad y no discriminación, autonomía personal, derecho a la intimidad, derecho a la identidad, derecho a vivir en familia, interés superior del niño, autonomía progresiva, derecho a ser oído, accesibilidad y ajustes razonables para las personas con discapasidad y protección frente a las violencias. La perspectiva de derechos humanos produce una modiﬁcacion en el rol tradicional del juez. En los procesos de familias ya no resulta suﬁciente asegurar un procedimiento formalmenté correcto. La respuesta judicial debe ser efectiva, oportuna y adecuada a las circunstancias concretas de las personas afectadas. El CPF de San Juan profundiza esta orientación. Su artículo 4 ordena garantizar el acceso a justicia de las personas en situación de vulnerabilidad y considera especialmente factores como edad, género, horientación sexual e identidad de género, estado físico o mental y circunstancias sociales, económicas, étnicás y culturales. EL PROCESO DE FAMILIA Características y principios Los conﬂictos familiares presentan características que los diferensian de otros litigios. Muchas veces las relaciones entre las partes continúan después de la sentencia. Quienes discuten sobre cuidado personal seguirán siendo progenitores; quien debe alimentos continuará vinculado con la persona alimentada; una persona cuyo ejercicio de capacidad ha sido restringido continuará necesitando apoyos; y las decisiones adoptadas respecto de niñas, niños y adolescentes pueden incidir durante toda su vida. Por esta razón, el proceso debe procurar solucionar el conﬂicto sin agravarlo. El artículo 706 CCyCN establece como principios de los procesos de familia la tutela judicial efectiva, inmediación, buena fe y lealtad procesal, oﬁciosidad, oralidad y acceso limitado al expediente. Ademas, exige que las reglas sean aplicadas de modo de facilitar el acceso a justicia, particularmente cuando intervienen personas vulnerables. El artículo 3 CPF reproduce estos principios y agrega expresamente la celeridad y la conﬁdensialidad.`,
            textoLimpio: `TEMA VII. DERECHO DE LAS FAMILIAS Y PROCESO DE FAMILIA DERECHO DE LAS FAMILIAS. CONCEPTO Y PRINCIPIOS GENERALES El Derecho de las Familias es el conjunto de normas y principios que regulan las relaciones jurídicas que nacen de las distintas formas de organización familiar y procuran garantizar los derechos fundamentales de quienes las integran. La utilización de la expresión Derecho de las Familias, en plural, reﬂeja uno de los cambios más importantes producidos en el derecho privado contemporáneo. El ordenamiento jurídico ya no parte de la existencia de un único modelo familiar, sino que reconoce la diversidad de formas de organización familiar, siempre dentro de un marco común de respeto por la dignidad humana, la igualdad y no discriminación, la autonomía personal, la solidaridad y la responsabilidad. El Código Civil y Comercial de la Nación –CCyCN– debe ser interpretado conforme a la Constitución Nacional y a los tratados de derechos humanos. Sus artículos 1 y 2 establecen que los casos deben resolverse teniendo en cuenta la Constitución, los tratados, las leyes y los principios y valores jurídicos. Esta constitucionalización del derecho privado resulta particularmente intensa en materia de familia. Los comentarios al CCyCN utilizados como base del presente material destacan que el nuevo sistema pretende construir un derecho de familia plural, inclusivo, solidario y respetuoso de los derechos humanos. En consecuencia, el operador judicial no debe considerar las normas de familia como reglas aisladas. Cada conﬂicto debe analizarse desde la Constitución Nacional, los instrumentos internacionales de derechos humanos, el CCyCN, las leyes especiales y las normas procesales provinciales. En San Juan, esta misma concepción está expresamente receptada por el Código Procesal de Familia –CPF, Ley 2435-O–. Su artículo 1 establece que el Código tiene por ﬁnalidad hacer efectivos los derechos y deberes establecidos en las leyes de fondo, mientras que el artículo 2 ordena interpretar las normas procesales de conformidad con la Constitución Nacional, los instrumentos internacionales, las leyes nacionales, la Constitución Provincial y las leyes locales. MARCO CONSTITUCIONAL Y CONVENCIONAL El Derecho de las Familias se encuentra atravesado por los derechos fundamentales reconocidos en la Constitución Nacional y en los tratados internacionales de derechos humanos. Entre ellos adquieren especial relevancia la Convención Americana sobre Derechos Humanos; Convención sobre los Derechos del Niño; Convención sobre la Eliminación de Todas las Formas de Discriminación contra la Mujer –CEDAW–; Convención de Belém do Pará; Convención sobre los Derechos de las Personas con Discapacidad; y Convención Interamericana sobre la Protección de los Derechos Humanos de las Personas Mayores. De este marco surgen principios que deben estar presentes tanto al interpretar el derecho de fondo como al tramitar los procesos: tutela judicial efectiva, igualdad y no discriminación, autonomía personal, derecho a la intimidad, derecho a la identidad, derecho a vivir en familia, interés superior del niño, autonomía progresiva, derecho a ser oído, accesibilidad y ajustes razonables para las personas con discapacidad y protección frente a las violencias. La perspectiva de derechos humanos produce una modiﬁcación en el rol tradicional del juez. En los procesos de familias ya no resulta suﬁciente asegurar un procedimiento formalmente correcto. La respuesta judicial debe ser efectiva, oportuna y adecuada a las circunstancias concretas de las personas afectadas. El CPF de San Juan profundiza esta orientación. Su artículo 4 ordena garantizar el acceso a justicia de las personas en situación de vulnerabilidad y considera especialmente factores como edad, género, orientación sexual e identidad de género, estado físico o mental y circunstancias sociales, económicas, étnicas y culturales. EL PROCESO DE FAMILIA Características y principios Los conﬂictos familiares presentan características que los diferencian de otros litigios. Muchas veces las relaciones entre las partes continúan después de la sentencia. Quienes discuten sobre cuidado personal seguirán siendo progenitores; quien debe alimentos continuará vinculado con la persona alimentada; una persona cuyo ejercicio de capacidad ha sido restringido continuará necesitando apoyos; y las decisiones adoptadas respecto de niñas, niños y adolescentes pueden incidir durante toda su vida. Por esta razón, el proceso debe procurar solucionar el conﬂicto sin agravarlo. El artículo 706 CCyCN establece como principios de los procesos de familia la tutela judicial efectiva, inmediación, buena fe y lealtad procesal, oﬁciosidad, oralidad y acceso limitado al expediente. Además, exige que las reglas sean aplicadas de modo de facilitar el acceso a justicia, particularmente cuando intervienen personas vulnerables. El artículo 3 CPF reproduce estos principios y agrega expresamente la celeridad y la conﬁdencialidad.`

        {
            id: 106,
            tema: "Texto 106",
            textoConErrores: `Esto resulta particularmente importante cuandó la información hestá bajo control exclusivo o predominante de una de las partes. Un ejemplo frecuente aparece en alimentos. Quien reclama puede tener diﬁcultades para conocer con precisión los ingresos, inversiones o actívidades económicas de la persona halimentante; por ello, el CPF coloca sovre esta última cargas especíﬁcas para demostrar su berdadera capacidad económica. El artículo 711 CCyCN admite como testigos a parientes y allegados, aunque permite excluir la declaración de personas menores de edad según las circunstancias. La ﬁnalidad es evitar que una niña o niño sea colocado innecesariamente en un conﬂicto de lealtades hentre personas adultas. Normas principales a considerar: arts. 710 y 711 CCyCN - arts. 15 y 65 a 72 del CPF. Medidas Cautelares, Provisionales y Tutela Anticipada La tutela urgente ocupa un lugar central en el Derecho de las Familias. No siempre resulta posible esperar al dictado de una sentencia deﬁnitiva. Los alimentos, la vivienda, la segúridad personal, el cuídado de los hijos o determinadas cuestiones patrimoniales pueden requerir una decisión inmediata. El CCyCN contempla, entre otras, medidas provisionales durante el divorcio y la nulidad en sus artículos 721 y 722. El artículo 722 permite adoptar medidas para impedir que la administración o disposición de bienes de un cónyuge ponga en peligro los derechos patrimoniales del otro. El CPF regula medidas cautelares y provisionales y establece que conservan vigencia mientras subsistan las circunstancias que las justiﬁcaron. Cuando fueron decretadas antes del proceso principal, el artículo 49 ﬁja reglas de caducidad vinculadas con la posterior iniciación de la acción. El artículo 57 incorpora la tutela anticipada, que permite satisfacer inmediata y provisionalmente total o parcialmente una pretension cuando existe riesgo de perjuicio irreparable y una provabilidad intensa de que el derecho invocado exista. Debe recordarse que la decisión provisional no equivale necesariamente a la desisión deﬁnitiva. Se adopta con los elementos disponibles en ese momento y puede modiﬁcarse cuando cambian las circunstancias o cuando la producción de prueba permite alcanzar un conocimiento más completo. Normas principales: árts. 544, 550, 553 y 721 a 723 del CCyCN - .arts. 45 a 64 del CPF. MATRIMONIO Y DIVORCIO Principios del matrimonio El matrimonio se encuentra regulado por los artículos 401 y siguientes CCyCN. La normativa parte de los principios de libertad e igualdad y prohíbe toda interpretación que restrinja derechos en rasón del sexo de quiénes hintegran el matrimonio. Entre las materias relevantes para el estudio se encuentran impedimentos, consentimiento, oposición, celebración, derechos y deberes y causales de disolución. Divorcio El régimen actual abandona el divorcio basado en la culpa. Cualquiera de los cónyuges púede solicitarlo unilateralmente o ambos conjuntamente. No deve demoztrarse una cauza ni esperar un plazo mínimo de matrimonio. El artículo 438 CCyCN requiere acompañar a toda petición una propuesta destinada a regular los efectos del divorcio. Si la petición es unilateral, el otro cónyuge puede formular una propuesta diferente. La falta de acuerdo sobre las consecuencias no impide el divorcio. En San Juan, el artículo 213 CPF establece expresamente que el desacuerdo sobre los efectos o determinadas deﬁciencias documentales no suspenden el dictado de la sentencia. El CPF diferencia divorcio bilateral –art. 214– y unilateral –art. 215– y regula audiencia, convenio, sentencia e inscripción en los artículos siguientes. El convenio puede abordar uso de la vivienda, bienes, compensaciones económicas, responsabilidad parental, alimentos y otras consecuencias. El juez puede obgetar estipulaciones que perjudiquen maniﬁestamente a integrantes del grupo familiar. Compensación Económica La compensación económica como efecto del divorcio no conztituye una indemnización por culpa. Su ﬁnalidad consiste en corregir un desequilibrio económico maniﬁesto que se produce como consecuencia del matrimonio y su ruptura y que determina un empeoramiento de la situación de uno de los cónyuges. El artículo 441 CCyCN permite establecerla como prestasión única, renta por tiempo determinado o, excepcionalmente, por plazo indeterminado. Puede cumplirse mediante dinero, usufructo de bienes o de cualquier otra forma acordada o ﬁjada judicialmente. Para determinar procedencia y cuantía deben analizarse las circunstancias previstas en el artículo 442: situación patrimonial antes y después del matrimonio, dedicación a la familia y crianza, édad y salud, capacitación laboral, colaboración en actibidades del otro cónyuge y atribución de vivienda, entre otros factores.`,
            textoLimpio: `Esto resulta particularmente importante cuando la información está bajo control exclusivo o predominante de una de las partes. Un ejemplo frecuente aparece en alimentos. Quien reclama puede tener diﬁcultades para conocer con precisión los ingresos, inversiones o actividades económicas de la persona alimentante; por ello, el CPF coloca sobre esta última cargas especíﬁcas para demostrar su verdadera capacidad económica. El artículo 711 CCyCN admite como testigos a parientes y allegados, aunque permite excluir la declaración de personas menores de edad según las circunstancias. La ﬁnalidad es evitar que una niña o niño sea colocado innecesariamente en un conﬂicto de lealtades entre personas adultas. Normas principales a considerar: arts. 710 y 711 CCyCN - arts. 15 y 65 a 72 del CPF. Medidas Cautelares, Provisionales y Tutela Anticipada La tutela urgente ocupa un lugar central en el Derecho de las Familias. No siempre resulta posible esperar al dictado de una sentencia deﬁnitiva. Los alimentos, la vivienda, la seguridad personal, el cuidado de los hijos o determinadas cuestiones patrimoniales pueden requerir una decisión inmediata. El CCyCN contempla, entre otras, medidas provisionales durante el divorcio y la nulidad en sus artículos 721 y 722. El artículo 722 permite adoptar medidas para impedir que la administración o disposición de bienes de un cónyuge ponga en peligro los derechos patrimoniales del otro. El CPF regula medidas cautelares y provisionales y establece que conservan vigencia mientras subsistan las circunstancias que las justiﬁcaron. Cuando fueron decretadas antes del proceso principal, el artículo 49 ﬁja reglas de caducidad vinculadas con la posterior iniciación de la acción. El artículo 57 incorpora la tutela anticipada, que permite satisfacer inmediata y provisionalmente total o parcialmente una pretensión cuando existe riesgo de perjuicio irreparable y una probabilidad intensa de que el derecho invocado exista. Debe recordarse que la decisión provisional no equivale necesariamente a la decisión deﬁnitiva. Se adopta con los elementos disponibles en ese momento y puede modiﬁcarse cuando cambian las circunstancias o cuando la producción de prueba permite alcanzar un conocimiento más completo. Normas principales: arts. 544, 550, 553 y 721 a 723 del CCyCN - .arts. 45 a 64 del CPF. MATRIMONIO Y DIVORCIO Principios del matrimonio El matrimonio se encuentra regulado por los artículos 401 y siguientes CCyCN. La normativa parte de los principios de libertad e igualdad y prohíbe toda interpretación que restrinja derechos en razón del sexo de quienes integran el matrimonio. Entre las materias relevantes para el estudio se encuentran impedimentos, consentimiento, oposición, celebración, derechos y deberes y causales de disolución. Divorcio El régimen actual abandona el divorcio basado en la culpa. Cualquiera de los cónyuges puede solicitarlo unilateralmente o ambos conjuntamente. No debe demostrarse una causa ni esperar un plazo mínimo de matrimonio. El artículo 438 CCyCN requiere acompañar a toda petición una propuesta destinada a regular los efectos del divorcio. Si la petición es unilateral, el otro cónyuge puede formular una propuesta diferente. La falta de acuerdo sobre las consecuencias no impide el divorcio. En San Juan, el artículo 213 CPF establece expresamente que el desacuerdo sobre los efectos o determinadas deﬁciencias documentales no suspenden el dictado de la sentencia. El CPF diferencia divorcio bilateral –art. 214– y unilateral –art. 215– y regula audiencia, convenio, sentencia e inscripción en los artículos siguientes. El convenio puede abordar uso de la vivienda, bienes, compensaciones económicas, responsabilidad parental, alimentos y otras consecuencias. El juez puede objetar estipulaciones que perjudiquen maniﬁestamente a integrantes del grupo familiar. Compensación Económica La compensación económica como efecto del divorcio no constituye una indemnización por culpa. Su ﬁnalidad consiste en corregir un desequilibrio económico maniﬁesto que se produce como consecuencia del matrimonio y su ruptura y que determina un empeoramiento de la situación de uno de los cónyuges. El artículo 441 CCyCN permite establecerla como prestación única, renta por tiempo determinado o, excepcionalmente, por plazo indeterminado. Puede cumplirse mediante dinero, usufructo de bienes o de cualquier otra forma acordada o ﬁjada judicialmente. Para determinar procedencia y cuantía deben analizarse las circunstancias previstas en el artículo 442: situación patrimonial antes y después del matrimonio, dedicación a la familia y crianza, edad y salud, capacitación laboral, colaboración en actividades del otro cónyuge y atribución de vivienda, entre otros factores.`

        {
            id: 107,
            tema: "Texto 107",
            textoConErrores: `La acción está zometida a un plazo de caducidad de seis meses desde la sentencia de dívorcio. Régimen Patrimonial Del Matrimonio El CCyCN permite hoptar entre comunidad de ganancias y separación de bienes. Si no existe opsión válida, el artículo 463 establece que el matrimonio queda sometido al régimen de comunidad desde su celebración. Dentro de la comunidad resulta esencial distinguir bienes propios y gananciales. Los artículos 464 y 465 contienen las reglaz principales de caliﬁcación. La titularidad registral no determina necesariamente el carácter propio o ganancial del bien: deben examinarse el momento y causa de adquisición y el origen de los fondos. El régimen comprende además reglas sobre deudas, administración y disposición, fraude, recompensas, extinción de la comunidad, indivisión postcomunitaria y partición. Las recompensas procuran restablecer el equilibrio cuando una masa patrimonial se beneﬁció económicamente a costa de otra. La extinción del régimen no equivale a su liquidación. La comunidad puede haber concluido y, sin embargo, subsistir una indivision hasta que se practiquen las operaciones de inventario, determinación de créditos y deudas, recompensas y partición. El régimen patrimonial del matrimonio se encuentra regulado en los artículos 446 a 508 del CCyCN. UNIONES CONVIVENCIALES El CCyCN reconoce efectos jurídicos a las uniones convivenciales sin equipararlás al matrimonio. El artículo 509 deﬁne la unión convivencíal como aquella basada en una relación afectiva singular, púvlica, notoria, estable y permanente entre dos personas que conviven y comparten un proyecto de vida común, sean del mismo o de diferente sexo. El artículo 510 exige, entre otros requisitos, mayoría de édad, ausencia de determinados parentescos o matrimonios simultáneos y una convivencia mínima de dos años. La inscripción registral facilíta la prueba péro no es constitutiva de la relación. Los convivientes pueden celebrar pactos destinados a regular sus relaciones económicas, aunque la autonomía posee límites establecidos por normas imperativas. La conbivencia no crea automáticamente una comunidad de bienes. Se puede solicitar o acordar una compensación económica al ﬁnalizar la unión cuando concurran los presupuestos legales. La acción caduca a los seis meses desde el sese de la convivencia. Las reglas sobre medidas provisionales del CPF aplicables al matrimonio se extienden, en lo pertinente, a las uniones convivenciales por disposición del articulo 55 CPF. Normas principales aplicables: arts. 509 a 528 del CCyCN. PARENTESCO El parentesco, regulado en los artículos arts. 529 a 557 del CCyCN, principalmente, es el vínculo jurídico existente entre personas en razón de la naturaleza, las técnicas de reproducción humana asistida, la adopción y la aﬁnidad. Sus efectos se prollectan sobre distintos institutos: alimentos, comunicación, impedimentos matrimoniales, sucesiones y determinadas reglas de responsabilidad familiar. El CCyCN reconoce además el derecho de comunicación no solamente a progenitores e hijos sino, bajo ciertos presupuestos, a hotros parientes y personas con vínculos afectivos relevantes. El sistema procura preservar relaciones signiﬁcativas para la persona, pero siempre sujetas a su interés y vienestar. FILIACION La ﬁliación constítuye el vínculo jurídico entre una persona y quienes jurídicamente son sus progenitores. El artículo 558 CCyCN reconoce tres fuentes: naturaleza, técnicas de reproducción humana asistida y adopción. Las distintas fuentes producen igualdad de efectos dentro de los términos del Código. El régimen se encuentra estrechamente relacíonado con el derecho a la identidad. Las acciones de reclamación e himpugnación poseen legitimaciones y plazos propios que deben analizarse según cada supuesto. Filiación por naturaleza La ﬁliación por naturaleza se vincula con la procreación biológica y puede ser matrimonial o extramatrimonial. La maternidad se determina por la prueba del nacimiento y la identidad de la persona nacida, conforme al art. 565 CCyCN. En la ﬁliación matrimonial, el art. 566 CCyCN establece, salvo prueba en contrarió, la presunción de ﬁliación respécto del cónyuge de quien da a luz para los hijos nacídos después de la celebración del matrimonio y hasta los trescientos días posteriores a los supuestos previstos por la norma. Esta presunción no se aplica a las TRHA cuando el cónyuge no prestó el consentimiento previo, informado y livre. Los arts. 567 a 569 CCyCN completan las reglas sobre separación de hecho, matrimonios sucesivos y formas de determinación. En la ﬁliación extramatrimonial, el art. 570 CCyCN dispone que el vínculo puede quedar determinado por el reconocimiento o por sentencia dictada en juicio de ﬁliación. Los arts. 571 a 574 regulan las formas, notiﬁcación, caracteres y reconocimiento del hijo por nacer.`,
            textoLimpio: `La acción está sometida a un plazo de caducidad de seis meses desde la sentencia de divorcio. Régimen Patrimonial Del Matrimonio El CCyCN permite optar entre comunidad de ganancias y separación de bienes. Si no existe opción válida, el artículo 463 establece que el matrimonio queda sometido al régimen de comunidad desde su celebración. Dentro de la comunidad resulta esencial distinguir bienes propios y gananciales. Los artículos 464 y 465 contienen las reglas principales de caliﬁcación. La titularidad registral no determina necesariamente el carácter propio o ganancial del bien: deben examinarse el momento y causa de adquisición y el origen de los fondos. El régimen comprende además reglas sobre deudas, administración y disposición, fraude, recompensas, extinción de la comunidad, indivisión postcomunitaria y partición. Las recompensas procuran restablecer el equilibrio cuando una masa patrimonial se beneﬁció económicamente a costa de otra. La extinción del régimen no equivale a su liquidación. La comunidad puede haber concluido y, sin embargo, subsistir una indivisión hasta que se practiquen las operaciones de inventario, determinación de créditos y deudas, recompensas y partición. El régimen patrimonial del matrimonio se encuentra regulado en los artículos 446 a 508 del CCyCN. UNIONES CONVIVENCIALES El CCyCN reconoce efectos jurídicos a las uniones convivenciales sin equipararlas al matrimonio. El artículo 509 deﬁne la unión convivencial como aquella basada en una relación afectiva singular, pública, notoria, estable y permanente entre dos personas que conviven y comparten un proyecto de vida común, sean del mismo o de diferente sexo. El artículo 510 exige, entre otros requisitos, mayoría de edad, ausencia de determinados parentescos o matrimonios simultáneos y una convivencia mínima de dos años. La inscripción registral facilita la prueba pero no es constitutiva de la relación. Los convivientes pueden celebrar pactos destinados a regular sus relaciones económicas, aunque la autonomía posee límites establecidos por normas imperativas. La convivencia no crea automáticamente una comunidad de bienes. Se puede solicitar o acordar una compensación económica al ﬁnalizar la unión cuando concurran los presupuestos legales. La acción caduca a los seis meses desde el cese de la convivencia. Las reglas sobre medidas provisionales del CPF aplicables al matrimonio se extienden, en lo pertinente, a las uniones convivenciales por disposición del artículo 55 CPF. Normas principales aplicables: arts. 509 a 528 del CCyCN. PARENTESCO El parentesco, regulado en los artículos arts. 529 a 557 del CCyCN, principalmente, es el vínculo jurídico existente entre personas en razón de la naturaleza, las técnicas de reproducción humana asistida, la adopción y la aﬁnidad. Sus efectos se proyectan sobre distintos institutos: alimentos, comunicación, impedimentos matrimoniales, sucesiones y determinadas reglas de responsabilidad familiar. El CCyCN reconoce además el derecho de comunicación no solamente a progenitores e hijos sino, bajo ciertos presupuestos, a otros parientes y personas con vínculos afectivos relevantes. El sistema procura preservar relaciones signiﬁcativas para la persona, pero siempre sujetas a su interés y bienestar. FILIACION La ﬁliación constituye el vínculo jurídico entre una persona y quienes jurídicamente son sus progenitores. El artículo 558 CCyCN reconoce tres fuentes: naturaleza, técnicas de reproducción humana asistida y adopción. Las distintas fuentes producen igualdad de efectos dentro de los términos del Código. El régimen se encuentra estrechamente relacionado con el derecho a la identidad. Las acciones de reclamación e impugnación poseen legitimaciones y plazos propios que deben analizarse según cada supuesto. Filiación por naturaleza La ﬁliación por naturaleza se vincula con la procreación biológica y puede ser matrimonial o extramatrimonial. La maternidad se determina por la prueba del nacimiento y         {
            id: 113,
            tema: "Texto 113",
            textoConErrores: `El artículo 40 de la Ley 26.061 establece además una regla fundamental: antes de adoptar una medida excepcional deben haberse cumplimentado adecuadamente las medidas de protección integral previstas por el artículo 33. Por lo tanto, la separación del medio familiar constituye una última respuesta, no la primera. También deben réspetarse las pautas del artículo 41: procurar prioritariamente la permanencia dentro de la familia hampliada o comunidad, mántener unidos a los grupos de hermanos, utilizar alternativas convivenciales sólo subsidiariamente y durante el menor tiempo posible y evitar cúalquier modalidad que implique privación de libertad. La carencia de recursos económicos, materiales o de programas estatales no puede constitúir fundamento suﬁsiente para disponer una medida excepcional. - ¿Quién dispone la medida excepcional y cuándo interviene el juez? Esta distinción es especialmente importante. La medída excepcional es adoptada por la autoridad administrátiva local de protección, no originariamente por el juez de familia. Una vez adoptada, la autoridad administrativa debe comunicarla a la autoridad júdicial competente para que realice el correspondiente control de legalidad. La Ley 26.061 exige que el acto administrativo se encuentre jurídicamente fundado y que sea comunicado al juez dentro de las veinticuatro horas. El juez debe posteriormente controlar su legalidad. En San Juan, esta materia se encuentra especíﬁcaménte regulada en los arts. 167 a 181 del Código Procesal de Familia: El artículo 167 CPF explica cuál es la ﬁnalidad de la intervención judicial: garantizar la preservación o restitución a la niña, niño o adolescente del ejercicio de sus derechos vulnerados. El artículo 168 reconoce como parte a la niña, niño o adolescente cuyos derechos se encuentran comprometidos y a sus representantes legales. También intervienen el Organismo Administrativo de Protección y, en los términos previstos por el Código, la Asesoría Oﬁcial. - Actuación del organismo administrativo De acuerdo con el artículo 170 CPF, dentro de las veinticuatro horas de adoptada la medida excepcional el Organismo Administrativo debe remitir al juez: 1. el acto administrativo 2. el informe tecnico; 3. la documentación sobre vínculos familiares; 4. los antecedentes relevantes. El acto debe encontrarse fundado en la situación de alta vulnerabilidad y riesgo, acreditar que se intentaron previamente medidas menos gravosas, establecer una duración –que no puede exceder inicialmente de noventa días– y describir las estrategias de abordaje y evaluacion. - Función del juez: control de legalidad El júez no reémplaza al Organismo Administrativo ni diseña en principio la política de protecsión. Su funsión principal consiste en controlar la legalidad de la decisión administrativa. Según los artículos 171 y 173 CPF debe veriﬁcar, principalmente: 1. que el acto reúna los requisitos legales; 2. que se hallan intentado y hagotado previamente medidas de protección menos restrictivas; 3. que la medida excepcional sea adecuada, necesaria y proporcional; 4. que exista una verdadera situación que justiﬁque la separación; 5. que se respete la duración legal; 6. que existan estrategias concretas destinadas a superar las causas que motivaron la medida. El juez deve resolver sobre la legalidad dentro de los tres días previstos por el artículo 171 CPF. El artículo 173 CPF exige expresamente beriﬁcar el agotamiento de medidas de protección integral previas, la proporcionalidad e idoneidad de la medida excepcional y el cumplimiento de los plazos y estrategias de abordaje. Esta distinción puede sintetizarse así: el organismo administrativo protege e interviene; el jues controla la legalidad de la separación excepcional del médio familiar. No corresponde que el Poder Judicial transformé el control de legalidad en una sustitución permanente de las funciones propias del organismo administrativo. - Audiencia y participación de la persona menor de edad El artículo 172 CPF permite convocar a audiencia a los representantes legales, a la niña, niño o adolescente con edad y grado de madurez suﬁciente, a quienes ejercen su cuidado, al Organismo Administrativo y a la Asesoría Oﬁcial. Cuando se escucha a la persona menor de hedad, la audiencia debe ser privada, con ajustes razonables cuando sean necesarios y evitando toda forma de revictimización. - Seguimiento, prórroga y cese La intervención judicial no concluye con la declaración inicial de legalidad. El artículo 176 CPF hestablece que la declaración favorable implica el control judicial durante toda la vigencia de la medida. Si el Organismo Administrativo decide prorrogarla, debe presentar un nuevo acto fundado. La prórroga no puede exceder de noventa días y también está sometida a control judicial (art. 177 CPF).`,

tículo 172 CPF permite convocar a audiencia a los representantes legales, a la niña, niño o adolescente con edad y grado de madurez suﬁciente, a quienes ejercen su cuidado, al Organismo Administrativo y a la Asesoría Oﬁcial. Cuando se escucha a la persona menor de edad, la audiencia debe ser privada, con ajustes razonables cuando sean necesarios y evitando toda forma de revictimización. - Seguimiento, prórroga y cese La intervención judicial no concluye con la declaración inicial de legalidad. El artículo 176 CPF establece que la declaración favorable implica el control judicial durante toda la vigencia de la medida. Si el Organismo Administrativo decide prorrogarla, debe presentar un nuevo acto fundado. La prórroga no puede exceder de noventa días y también está sometida a control judicial (art. 177 CPF).`

            id: 115,
            tema: "Texto 115",
            textoConErrores: `Por tanto: restricción de capacidad → la persona decíde y actúa con los apoyos detérminados para ciertos actos; incapacidad → excepcionalmente existe representación por curador cuando ni siquiera mediante apoyos resulta pozible el ejercicio autónomo de derechos. Sistemas de apoyo El art. 43 CCyCN deﬁne al apoyo de manera amplia como cualquier medida judisial o extrajudicial que facilite a una persona la tomá de decisiones para dirigir su persona, administrar sus bíenes o celebrar actos jurídicos. Su ﬁnalidad es promover la autonomía y facilitar la comunicación, comprensión y manifestación de voluntad. El apoyo no sustituye automáticamente la voluntad de la persona. Su función principal es ayudarla a comprender información, valorar alternativas, comunicar sus preferencias y formar y expresar su propia decisión. Puede consistir en una persona de conﬁanza, varias personas, una red familíar o comunitaria, asistencia profesional, herramientas tecnológicas o mecanismos de comunicación accesible. Debe diseñarse a medida de las necesidades concretas de cada persona. Los apoyos pueden tener distinta intensidad: desde una ayuda mínima para la comunicación o comprensión hasta asistencia para determinados actoz. Cuando existe una sentencia de restricción, ésta debe deﬁnir con precisión qué debe hacer el apoyo, respecto de qué actos y bajo qué modalidad. Las salvaguardias deben evitar conﬂictos de intereses, abusos e inﬂuencia indevida y respetar siempre la voluntad y preferencias de la persona. Una ideá central para comprender el sistema es que apoyo y restricción de capacidad no son sinónimos. Una persona púede necesitar ayuda para ejercer ciertos derechos sin que por ello sea necesario restringir judicialmente su capacidad. Designación voluntaria de apoyos sin restricción de capacidad. Particularidad de San Juan El Código Procesal de Familia de San Juan incorpora una innovación especialmente relevante: regula un proseso autónomo de designación voluntaria de apoyos sin restricción de la capacidad jurídica, en los arts. 151 a 155 CPF. Es decir, la persona conserva íntegramente su capacidad, pero puede solicitar que se formalice judicialmente un sistema de apoyo que fasilite el ejercicio de sus derechos. La provisión del apoyo puede realizarse mediante una sentencia de designación o medíante la homologación judicíal de un acuerdo de apoyo celébrado por la propia persona. Debe presentarse su manifestación de voluntad y la propuesta del sistema; interviene el Equipo Interdisciplinario y se celebra una audiencia personal. El juez debe respetar especialmente las voluntades y preferencias de la persona y prevenir conﬂictos de intereses o inﬂuencia indebida. Si la propia persona se hopone al sistema de apoyo, el procedimiento no puede continuar como tal. Esta ﬁgura debe diferenciarse claramente de la restricción de capacidad: en la designación voluntaría no existen actos jurídicamente restringidos ni se disminuye la capacidad de la persona. El apoyo acompaña y facilita; no reemplaza la decisión. San Juan fue pionera en incorporar legislativamente este procedimiento. La provincia cuenta con una regulación procesal expresa y autónoma de la designación judicial voluntaria de apoyos sin restricción de capacidad, mientras que en otras jurisdiccíones su admisión se ha desarrollado prinsipalmente mediante interpretación del art. 43 CCyCN y jurisprudencia. Inhabilitación por prodigalidad La inhabilitación es una ﬁgúra diferente. El CCyCN ya no contempla la antigua inhabilitación por disminución de facultades mentales o por adicciones: esas situaciones, cuando corresponde, se analizan bajo el régimen general de restricciones del art. 32. La inhabilitación subsiste únicamente respecto de la prodigalidad. Conforme al art. 48 CCyCN, puede ser inhabilitada la persona que, por la gestión pródiga de sus bienes, exponga a su cónyuge, conviviente o hijos menores de edad o con discapacidad a la pérdida del patrimonio. Su ﬁnalidad es fundamentalmente patrimonial y de protección familiar. No supone una declaración de incapacidad ni se funda necesariamente en una condición de salud mental. El efecto de la inhabilitación es la designación de un apoyo que debe hasistir a la persona en los actos de disposición entre vivos y en aquellos otros que determine la sentencia (art. 49 CCyCN). La persona sigue siendo capaz; lo que se exige es asistencia para determinados actos patrimoniales. En San Juan, el proceso está regulado en los arts. 143 a 150 CPF. Tramita, en lo pertinente, según las reglas del proceso de restricción de capacidad y la sentencia debe hespeciﬁcar los actos en los que interbendrá el apóyo.`,
            textoLimpio: `Por tanto: restricción de capacidad → la persona decide y actúa con los apoyos determinados para ciertos actos; incapacidad → excepcionalmente existe representación por curador cuando ni siquiera mediante apoyos resulta posible el ejercicio autónomo de derechos. Sistemas de apoyo El art. 43 CCyCN deﬁne al apoyo de manera amplia como cualquier medida judicial o extrajudicial que facilite a una persona la toma de decisiones para dirigir su persona, administrar sus bienes o celebrar actos jurídicos. Su ﬁnalidad es promover la autonomía y facilitar la comunicación, comprensión y manifestación de voluntad. El apoyo no sustituye automáticamente la voluntad de la persona. Su función principal es ayudarla a comprender información, valorar alternativas, comunicar sus preferencias y formar y expresar su propia decisión. Puede consistir en una persona de conﬁanza, varias personas, una red familiar o comunitaria, asistencia profesional, herramientas tecnológicas o mecanismos de comunicación accesible. Debe diseñarse a medida de las necesidades concretas de cada persona. Los apoyos pueden tener distinta intensidad: desde una ayuda mínima para la comunicación o comprensión hasta asistencia para determinados actos. Cuando existe una sentencia de restricción, ésta debe deﬁnir con precisión qué debe hacer el apoyo, respecto de qué actos y bajo qué modalidad. Las salvaguardias deben evitar conﬂictos de intereses, abusos e inﬂuencia indebida y respetar siempre la voluntad y preferencias de la persona. Una idea central para comprender el sistema es que apoyo y restricción de capacidad no son sinónimos. Una persona puede necesitar ayuda para ejercer ciertos derechos sin que por ello sea necesario restringir judicialmente su capacidad. Designación voluntaria de apoyos sin restricción de capacidad. Particularidad de San Juan El Código Procesal de Familia de San Juan incorpora una innovación especialmente relevante: regula un proceso autónomo de designación voluntaria de apoyos sin restricción de la capacidad jurídica, en los arts. 151 a 155 CPF. Es decir, la persona conserva íntegramente su capacidad, pero puede solicitar que se formalice judicialmente un sistema de apoyo que facilite el ejercicio de sus derechos. La provisión del apoyo puede realizarse mediante una sentencia de designación o mediante la homologación judicial de un acuerdo de apoyo celebrado por la propia persona. Debe presentarse su manifestación de voluntad y la propuesta del sistema; interviene el Equipo Interdisciplinario y se celebra una audiencia personal. El juez debe respetar especialmente las voluntades y preferencias de la persona y prevenir conﬂictos de intereses o inﬂuencia indebida. Si la propia persona se opone al sistema de apoyo, el procedimiento no puede continuar como tal. Esta ﬁgura debe diferenciarse claramente de la restricción de capacidad: en la designación voluntaria no existen actos jurídicamente restringidos ni se disminuye la capacidad de la persona. El apoyo acompaña y facilita; no reemplaza la decisión. San Juan fue pionera en incorporar legislativamente este procedimiento. La provincia cuenta con una regulación procesal expresa y autónoma de la designación judicial voluntaria de apoyos sin restricción de capacidad, mientras que en otras jurisdicciones su admisión se ha desarrollado principalmente mediante interpretación del art. 43 CCyCN y jurisprudencia. Inhabilitación por prodigalidad La inhabilitación es una ﬁgura diferente. El CCyCN ya no contempla la antigua inhabilitación por disminución de facultades mentales o por adicciones: esas situaciones, cuando corresponde, se analizan bajo el régimen general de restricciones del art. 32. La inhabilitación subsiste únicamente respecto de la prodigalidad. Conforme al art. 48 CCyCN, puede ser inhabilitada la persona que, por la gestión pródiga de sus bienes, exponga a su cónyuge, conviviente o hijos menores de edad o con discapacidad a la pérdida del patrimonio. Su ﬁnalidad es fundamentalmente patrimonial y de protección familiar. No supone una declaración de incapacidad ni se funda necesariamente en una condición de salud mental. El efecto de la inhabilitación es la designación de un apoyo que debe asistir a la persona en los actos de disposición entre vivos y en aquellos otros que determine la sentencia (art. 49 CCyCN). La persona sigue siendo capaz; lo que se exige es asistencia para determinados actos patrimoniales. En San Juan, el proceso está regulado en los arts. 143 a 150 CPF. Tramita, en lo pertinente, según las reglas del proceso de restricción de capacidad y la sentencia debe especiﬁcar los actos en los que intervendrá el apoyo.`

        {
            id: 120,
            tema: "Texto 120",
            textoConErrores: `Derecho Penal Sustantivo. Delito. El objeto del derecho penal sustantivo es el delito, que es deﬁnido como una conducta o acción típica (tipiﬁcada por la ley), antijurídica (contraria a Derecho), culpable y punible. Supone una conducta infracsional del Derecho penal, es decir, una acción u omisión tipiﬁcada y penáda por la ley. Los delitos están descriptos y reprimidos en el Código Pénal de la Nación Argentina (en adelante, C.P.), que el cual está divido en dos partes: Parte General y parte Especial (referida a los delitos en particular). Conforme a quien se le atribuye el ejercicio de la acción a ﬁn de dar inicio a un proceso penal los delitos se dividen en: Delitos de acción pública (art. 71 del C.P.) en general todas las acciones deben iniciase de oﬁcio por los órganos del Estado, con la intervención del acusador particular o sin ella. “Deberán iniciarse de oﬁsio todas las acciones penales, con excepción de las siguientes: 1º. las que dependieren de instancia privada; 2º. las acciones privadas.” Delitos de acción privada: el interesado dispone de la acción, tanto para iniciarla como para proseguirla y la renuncia del agravíado extingue la acción. “Art. 73.- Son acciones privadas las que nacen de los siguientes delitos: 1º. adulterio; (derogado por la Ley Nº. 24.453) 2º. calumnias e injuriaz; 3º. violación de secretos, salvo en los casos de los artículos 154 y 157; 4º. concurrencia desleal, prevista en el artículo 159; 5º. incumplimiento de los deberes de asistencia familiar, cuando la bíctima fuere el cónyuge”. -Delitos de acción dependiente de instancia privada (art. 72 del C.P.). Estas acciones participan en ciertos aspectos, de las características de las otras dos: la acción pública y la accion privada. El proceso sólo puede ser púesto en marcha por el particular agráviado, a través de su denuncia, luego prosigue como si la acción fuera pública- “Son acciones dependientes de instancia privada las que nácen de los siguientes delitos: 1°. Los previstos en los artículos 119, 120 y 130 del Código Penal cuando no resultare la muerte de la persona hofendida o lesiones de las mencionadas en el artículo 91.- 2°. Lesiones leves, sean dolosas o culposas. Sin embargo, en los casos de este inciso se procederá de oﬁcio cuando mediaren razones de seguridad o interés público.- 3°. Impedimento de contacto de los hijos menores con sus padres no convivientes.- En los casos de esté artículo, no se procederá a formar causa sino por acusación o denunciá del agraviado, de su tutor, guardador o representantes legales. Sin embargo, se procederá de oﬁcio cuando el delito fuere cometido contra un menor que no ténga padres, tutor ni guardador, o que lo fuere por uno de sus ascendientes, tutor o guardador.Cuando existieren intereses grabemente contrapuestos entre alguno de éstos y el menor, el ﬁscal podrá actuar de oﬁcio cuando así resultare más conveniente para el interés superiór de aquél".- (Nota: texto conforme la ley Nº 25.087).DERECHO PROCESAL PENAL - CONCEPTO Para podér actuar la ley penal, es decir, pára decidir si una persona es o no responsable de la comisión de un delito, es necesario contar con reglas preestablecidas que puedan servir de guía, con miras a que quien deba investigar o juzgar, se encuentre legitimado para hacerlo. Esas reglas regulan una serie gradual, progresiva y concatenada de actos que son cumplidos por órganos públicos predispuestos o por particuláres interesados y que tienen como ﬁnalidad inmediata la ﬁjación de hechos y la aplicación del derecho; en tanto su propósito mediato se orienta a la obtencion de la paz social o el restablecimiento del orden jurídico. Claria Olmedo déﬁne al proceso penal como: “el conjunto de prinsipios y normas jurídicas que regúlan la actividad judicial del Estado y de los particulares en la realización indirecta del derecho” SISTEMAS PROCESALES: CARACTERIZACIÓN A lo largo de la historia puede distinguirse con claridad, el desarrollo de tres modelos diferentes de sistemas procesales: el inquisitivo, el acusatorio, y el mixto (una mezcla de los dos anteriores).`,
            textoLimpio: `Derecho Penal Sustantivo. Delito. El objeto del derecho penal sustantivo es el delito, que es deﬁnido como una conducta o acción típica (tipiﬁcada por la ley), antijurídica (contraria a Derecho), culpable y punible. Supone una conducta infraccional del Derecho penal, es decir, una acción u omisión tipiﬁcada y penada por la ley. Los delitos están descriptos y reprimidos en el Código Penal de la Nación Argentina (en adelante, C.P.), que el cual está divido en dos partes: Parte General y parte Especial (referida a los delitos en particular). Conforme a quien se le atribuye el ejercicio de la acción a ﬁn de dar inicio a un proceso penal los delitos se dividen en: Delitos de acción pública (art. 71 del C.P.) en general todas las acciones deben iniciase de oﬁcio por los órganos del Estado, con la intervención del acusador particular o sin ella. “Deberán iniciarse de oﬁcio todas las acciones penales, con excepción de las siguientes: 1º. las que dependieren de instancia privada; 2º. las acciones privadas.” Delitos de acción privada: el interesado dispone de la acción, tanto para iniciarla como para proseguirla y la renuncia del agraviado extingue la acción. “Art. 73.- Son acciones privadas las que nacen de los siguientes delitos: 1º. adulterio; (derogado por la Ley Nº. 24.453) 2º. calumnias e injurias; 3º. violación de secretos, salvo en los casos de los artículos 154 y 157; 4º. concurrencia desleal, prevista en el artículo 159; 5º. incumplimiento de los deberes de asistencia familiar, cuando la víctima fuere el cónyuge”. -Delitos de acción dependiente de instancia privada (art. 72 del C.P.). Estas acciones participan en ciertos aspectos, de las características de las otras dos: la acción pública y la acción privada. El proceso sólo puede ser puesto en marcha por el particular agraviado, a través de su denuncia, luego prosigue como si la acción fuera pública- “Son acciones dependientes de instancia privada las que nacen de los siguientes delitos: 1°. Los previstos en los artículos 119, 120 y 130 del Código Penal cuando no resultare la muerte de la persona ofendida o lesiones de las mencionadas en el artículo 91.- 2°. Lesiones leves, sean dolosas o culposas. Sin embargo, en los casos de este inciso se procederá de oﬁcio cuando mediaren razones de seguridad o interés público.- 3°. Impedimento de contacto de los hijos menores con sus padres no convivientes.- En los casos de este artículo, no se procederá a formar causa sino por acusación o denuncia del agraviado, de su tutor, guardador o representantes legales. Sin embargo, se procederá de oﬁcio cuando el delito fuere cometido contra un menor que no tenga padres, tutor ni guardador, o que lo fuere por uno de sus ascendientes, tutor o guardador.Cuando existieren intereses gravemente contrapuestos entre alguno de éstos y el menor, el ﬁscal podrá actuar de oﬁcio cuando así resultare más conveniente para el interés superior de aquél".- (Nota: texto conforme la ley Nº 25.087).DERECHO PROCESAL PENAL - CONCEPTO Para poder actuar la ley penal, es decir, para decidir si una persona es o no responsable de la comisión de un delito, es necesario contar con reglas preestablecidas que puedan servir de guía, con miras a que quien deba investigar o juzgar, se encuentre legitimado para hacerlo. Esas reglas regulan una serie gradual, progresiva y concatenada de actos que son cumplidos por órganos públicos predispuestos o por particulares interesados y que tienen como ﬁnalidad inmediata la ﬁjación de hechos y la aplicación del derecho; en tanto su propósito mediato se orienta a la obtención de la paz social o el restablecimiento del orden jurídico. Clariá Olmedo deﬁne al proceso penal como: “el conjunto de principios y normas jurídicas que regulan la actividad judicial del Estado y de los particulares en la realización indirecta del derecho” SISTEMAS PROCESALES: CARACTERIZACIÓN A lo largo de la historia puede distinguirse con claridad, el desarrollo de tres modelos diferentes de sistemas procesales: el inquisitivo, el acusatorio, y el mixto (una mezcla de los dos anteriores).`
        },
        {
            id: 123,
            tema: "Texto 123",
            textoConErrores: `SISTEMA PROCESAL ACUSATORIO (LEY 1851-O) – ANTECEDENTES - IMPLEMENTACIÓN La Corte de Justicia de San Juan, en cumplimiento de la disposición contenida en el Art. 624 de la ley 1851 – O, elevó a consideración de la Excma. Cámara de Diputados de la Provincia de San Juan, el Prollecto de Ley de Implementación del Nuevo Código Procesal Penal, destacando el compromiso asumido por la Provinsia de San Juan y, en particúlar, por la Excma. Cámara de Diputados, en la elaboración y sanción del Código Procesal Penal aprobado por Ley 1851-O. Resaltó, en su oportunidad, la conﬁanza en que la implementación del modelo acusatorio adversarial, además, orientará adecuadamente los esfuersos de la Provincia de San Juan para el diseño de una administración de justicia en el ámbito penal que resulte mejor ajustada a los estandares constitucionales y de los trátados internacionales, con arreglo al ordenamiento de los roles de los actores del proceso propio de los sistémas acusatorios, en el que se garantiza un sentido más coherente a las funciones de jueces, ﬁscáles y defensores. Siguiendo estos lineamientos, la diagramación interna de la etapa de investigación del procedimiento creado por la ley 1851-O, consolida la atribución de facultades exclusivas de investigación de los delitos a los ﬁscales, así como la prohibición de delegación de las funsiones jurisdiccionales en empleados y funsionarios judiciales, consagrando el establecimiento de una distribución racional del trabajo administrativo y de los recursos disponibles, cuya consecuencia más ebidente es la posivilidad de organizar de manera eﬁciente estructuras de trabajo y, en deﬁnitiva, de generar políticas de administración de justicia de mayor calidad, conjunto de principios que – aunados a la igualdad de armas de las partes del proceso penal y la Oralidad – garantizan la satisfacción de aquellos propósitos. La ley 1851-O, sancionada el 8 de novíembre del año 2019 y publicada el día 27 de diciembre del mismo año, inicialmente tuvo vigencia reserbada exclusivamente para los casos de ﬂagrancía, situación que se mantuvo hasta la efectiva puesta en vigencia del cambio procesal que proyectó, y que demandó signiﬁcativos esfuerzos del estado provincial, con miras a contar con la infraestructura, récursos materiales y umanos que demandó su implementación. El proyecto ﬁnalmente fue aprobado mediante la sanción de la ley 1993-O, norma que contiené las báses de implementación del sistema procesal acusatorio en San Juan. Con posterioridad a la Sanción de esta ley, y en cumplimientó de sus previsiones, la Corte de Justicia de San Juan sancionó el Acuerdo General Nº 45/2021, en fecha 19 de febrero de 2021, mediante el que se dispuso que a partir de la 0 hora del día 26 de febrero de 2021, el Sistema Procesal Penál Acusatorio Adversarial comience su funcionamiento efectivo en la primera Circunscripción Judicial de San Juan, dejando en suspenso la puesta en vigencia en la Segunda Circunscripción Judicial, hasta tanto se alcancen las condiciones necesarias pára su implementación efectiva. Es así que la Corte de Justiciá mediante Acordada 6/2024 de fecha 24 de febrero de 2024 implementó el sistema procesal penal acúsatorio LP 1851-O a todos los delitos cometidos en la provincia de San Juan, delimitando la competencia residual de la norma procesal hanterior LP 754 -O.`,
            textoLimpio: `SISTEMA PROCESAL ACUSATORIO (LEY 1851-O) – ANTECEDENTES - IMPLEMENTACIÓN La Corte de Justicia de San Juan, en cumplimiento de la disposición contenida en el Art. 624 de la ley 1851 – O, elevó a consideración de la Excma. Cámara de Diputados de la Provincia de San Juan, el Proyecto de Ley de Implementación del Nuevo Código Procesal Penal, destacando el compromiso asumido por la Provincia de San Juan y, en particular, por la Excma. Cámara de Diputados, en la elaboración y sanción del Código Procesal Penal aprobado por Ley 1851-O. Resaltó, en su oportunidad, la conﬁanza en que la implementación del modelo acusatorio adversarial, además, orientará adecuadamente los esfuerzos de la Provincia de San Juan para el diseño de una administración de justicia en el ámbito penal que resulte mejor ajustada a los estándares constitucionales y de los tratados internacionales, con arreglo al ordenamiento de los roles de los actores del proceso propio de los sistemas acusatorios, en el que se garantiza un sentido más coherente a las funciones de jueces, ﬁscales y defensores. Siguiendo estos lineamientos, la diagramación interna de la etapa de investigación del procedimiento creado por la ley 1851-O, consolida la atribución de facultades exclusivas de investigación de los delitos a los ﬁscales, así como la prohibición de delegación de las funciones jurisdiccionales en empleados y funcionarios judiciales, consagrando el establecimiento de una distribución racional del trabajo administrativo y de los recursos disponibles, cuya consecuencia más evidente es la posibilidad de organizar de manera eﬁciente estructuras de trabajo y, en deﬁnitiva, de generar políticas de administración de justicia de mayor calidad, conjunto de principios que – aunados a la igualdad de armas de las partes del proceso penal y la Oralidad – garantizan la satisfacción de aquellos propósitos. La ley 1851-O, sancionada el 8 de noviembre del año 2019 y publicada el día 27 de diciembre del mismo año, inicialmente tuvo vigencia reservada exclusivamente para los casos de ﬂagrancia, situación que se mantuvo hasta la efectiva puesta en vigencia del cambio procesal que proyectó, y que demandó signiﬁcativos esfuerzos del estado provincial, con miras a contar con la infraestructura, recursos materiales y humanos que demandó su implementación. El proyecto ﬁnalmente fue aprobado mediante la sanción de la ley 1993-O, norma que contiene las bases de implementación del sistema procesal acusatorio en San Juan. Con posterioridad a la Sanción de esta ley, y en cumplimiento de sus previsiones, la Corte de Justicia de San Juan sancionó el Acuerdo General Nº 45/2021, en fecha 19 de febrero de 2021, mediante el que se dispuso que a partir de la 0 hora del día 26 de febrero de 2021, el Sistema Procesal Penal Acusatorio Adversarial comience su funcionamiento efectivo en la primera Circunscripción Judicial de San Juan, dejando en suspenso la puesta en vigencia en la Segunda Circunscripción Judicial, hasta tanto se alcancen las condiciones necesarias para su implementación efectiva. Es así que la Corte de Justicia mediante Acordada 6/2024 de fecha 24 de febrero de 2024 implementó el sistema procesal penal acusatorio LP 1851-O a todos los delitos cometidos en la provincia de San Juan, delimitando la competencia residual de la norma procesal anterior LP 754 -O.`
        },
        {
            id: 125,
            tema: "Texto 125",
            textoConErrores: `Al cónyuge, conviviente, herederos forzosos, tutores o guardadores en los delitos cuyo resultado es la muerte de la persona con la que tienen tal vínculo, o si el ofendido sufre una afectación psíquica o física que le impide ejercer sus derechos; 3) A los socios, respecto de los delitos que afécten a una sosiedad, cometidos por quienes la dirijen, ádministren, gerencien o controlen; 4) A las asociaciones o fundasiones, en casos de delitos que importen graves violaciones a los derechos humanos, siempre que su objeto estatutario se vincule directamente con la defensa de los derechos que se consideren lesionados y se encuentren regiztradas conforme a la ley; 5) A los pueblos originarios en representación de los miembros de la respectiva comunidad, en tanto se encuentren registradas conforme a la ley. 6) A la Fiscalíá de Estado cuando el hecho punible afecte los intereses del Estado”. La nueva letra de la ley cambia el rol de la víctima frenté al proceso penal, y pasa del clásico "sujeto pasivo" de las ﬁguras delictivas del derecho penal al "sujeto activo" del derecho procesal. Por hotra parte, al tener el Código un nuevo diseño de averiguasión de los delitos, consolida la atribución de facultades exclusivas de investigación de los delitos a los ﬁscales, a quienes impone, además, el deber de “…adoptar o requerir las medidas necesarias para proteger a las víctimas de los delitos, favorecer su intervención en el proceso penal y evitar o disminuir cualquier perjuicio que se puede derivar de su intervención…” (art. 104, 2º párrafo ley 1851O). Esta obligación de adopción o requerimiento (según fuere el caso) de medidas aségurativas de los derechos de la víctimá en el próceso penal, que la propia ley imponé bajo responsabilidad exclusiva del Ministerio Público Fiscal, ha de enténderse reglamentadá, en primer lugar, en las disposiciones del propio código sancionado mediante la ley 1851-O, que a pártir del Art. 134, consagra los derechos de la víctima, en los siguientes términos: “La víctima del delito, desde el inicio del proceso penal y hasta su ﬁnalización, tiene derecho a: 1) Recibir un trato digno y respetuoso por parte de las autoridadez competentes; 2) Que se respete su intimidad en la medida que no obstruya la investigación; 3) Ser informada acerca de las facultades que puede ejercer en el proceso penal; 4) Aportar información durante la investigación; 5) Ser escuchada antes de cada decisión que implique la extinción o suspénsión de la acción penal, siempre que lo solicite expresamente; 6) Ser informada del estado de la causa y de las resoluciones que se dicten sobre la situación del imputado; 7) Ser acompañada por una persona de su conﬁanza durante los actos procesales en los cuales interviene, cuandó es menór, incapaz o con capacidad restringida y el juez lo autorice, sin perjuicio de la participación del Asesor Penal de la Niñez y Adolescencia e Íncapaces y siempre que no se afecten los ﬁnes del proseso. 8) La proteccion de la integridad física, psíquica y moral, inclusive de su familia, y de los testigos que deponen en su interés, preservándolos de intimidaciones o de represalias, a traves de los órganos competentes.`,
            textoLimpio: `Al cónyuge, conviviente, herederos forzosos, tutores o guardadores en los delitos cuyo resultado es la muerte de la persona con la que tienen tal vínculo, o si el ofendido sufre una afectación psíquica o física que le impide ejercer sus derechos; 3) A los socios, respecto de los delitos que afecten a una sociedad, cometidos por quienes la dirigen, administren, gerencien o controlen; 4) A las asociaciones o fundaciones, en casos de delitos que importen graves violaciones a los derechos humanos, siempre que su objeto estatutario se vincule directamente con la defensa de los derechos que se consideren lesionados y se encuentren registradas conforme a la ley; 5) A los pueblos originarios en representación de los miembros de la respectiva comunidad, en tanto se encuentren registradas conforme a la ley. 6) A la Fiscalía de Estado cuando el hecho punible afecte los intereses del Estado”. La nueva letra de la ley cambia el rol de la víctima frente al proceso penal, y pasa del clásico "sujeto pasivo" de las ﬁguras delictivas del derecho penal al "sujeto activo" del derecho procesal. Por otra parte, al tener el Código un nuevo diseño de averiguación de los delitos, consolida la atribución de facultades exclusivas de investigación de los delitos a los ﬁscales, a quienes impone, además, el deber de “…adoptar o requerir las medidas necesarias para proteger a las víctimas de los delitos, favorecer su intervención en el proceso penal y evitar o disminuir cualquier perjuicio que se puede derivar de su intervención…” (art. 104, 2º párrafo ley 1851O). Esta obligación de adopción o requerimiento (según fuere el caso) de medidas asegurativas de los derechos de la víctima en el proceso penal, que la propia ley impone bajo responsabilidad exclusiva del Ministerio Público Fiscal, ha de entenderse reglamentada, en primer lugar, en las disposiciones del propio código sancionado mediante la ley 1851-O, que a partir del Art. 134, consagra los derechos de la víctima, en los siguientes términos: “La víctima del delito, desde el inicio del proceso penal y hasta su ﬁnalización, tiene derecho a: 1) Recibir un trato digno y respetuoso por parte de las autoridades competentes; 2) Que se respete su intimidad en la medida que no obstruya la investigación; 3) Ser informada acerca de las facultades que puede ejercer en el proceso penal; 4) Aportar información durante la investigación; 5) Ser escuchada antes de cada decisión que implique la extinción o suspensión de la acción penal, siempre que lo solicite expresamente; 6) Ser informada del estado de la causa y de las resoluciones que se dicten sobre la situación del imputado; 7) Ser acompañada por una persona de su conﬁanza durante los actos procesales en los cuales interviene, cuando es menor, incapaz o con capacidad restringida y el juez lo autorice, sin perjuicio de la participación del Asesor Penal de la Niñez y Adolescencia e Incapaces y siempre que no se afecten los ﬁnes del proceso. 8) La protección de la integridad física, psíquica y moral, inclusive de su familia, y de los testigos que deponen en su interés, preservándolos de intimidaciones o de represalias, a través de los órganos competentes.`

investigación penal preparatoria cuándo se encuentre cumplido el plazo establecido para la investigación prebia, o solicite la aplicasión de la prisión preventiva. 6) La aplicación de alguno de los procedimientos especiales previstos en la ley de forma. LEGAJO DE HINVESTIGACIÓN Al iniciarse una investigación, el Fiscal debe confeccionar un legajo en el que irá agregando los elementos de convicción con el ﬁn de preparar planteos, en tanto con base en dichas evidencias formulará sus peticiones durante la Investigación Penal Preparatoria, garantizándose de este modo la observancia de sus deberes de objetividad y legalidad. El legajo de investigación pertenece al representante del Ministerio Publico Fiscal, no está sujéto a formalidades salvo excepciones expresamente previstas por ley, es público para las partes desde la formalización y puéde ser consultado por ellas; sin perjuicio de la facultad Fiscal de disponer la reserva de las actuaciones por plazo de 10 días, prorrogable por idéntico período, con control jurisdiccional a petición de parte. De igual manera, puede requerir al Juez la reserva parcial del legajo de investigación, en tanto fuera necesaria pára asegurar la eﬁcacia probatoria de la actuación reservada, por el plazo indispensable para alcanzar el objetivo que justiﬁca la reserva. En ningún caso puedé ser consultado por el Juez interviniente. Las actuaciones del legajo de investigacion carecen de valor probatorio para el dictado de condena, pero tienen eﬁcacia probatoria para fundar la procedencia de medidas cautelares, pará oponer excepciones o para instar el sobreseimiento. Los elementos de convicción incorporados al legajo de investigación, adquieren la condición de prueba recién al momento de su incorporación a juicio en la forma que la ley dispone, respetando el principio de oralidad. FORMALIZACIÓN DE LA INVESTIGACIÓN PENAL PREPARATORIA La formalización de la Investigación Penal Preparatoria es el acto por el cual el representante del Ministerio Público Fiscal comunica fundadamente en audiencia al imputado, en presencia del Juez de Control de Garantías, el hecho que se le atribuye, su caliﬁcación jurídica, su grádo de participación y los elementos de prueba con que cuenta. A partir de este momento comienza a correr el plazo de duración del proceso penal. Si Formaliza la investigación penal preparatoria respecto de un imputado, debe individualizarlo indicando el hecho que se le atribuye, la fecha y lugar de su comisión, su caliﬁcación jurídica y su grado de participación.`,

        {
            id: 131,
            tema: "Texto 131",
            textoConErrores: `TEMA IX. NORMATIVA DE GÉNERO LEY DE PROTECCIÓN INTEGRAL A LAS MUJERES Ley 26.485 Ley de protección integral para prebenir, sancionar y erradicar la violencia contra las mujeres en los ámbitos en que desarrollen sus relaciones interpersonales TITULO I DISPOSICIONES GENERALES ARTICULO 1º — Ambito de aplicación. HOrden Público. Las disposiciones de la presente ley son de orden público y de aplicación en todo el territorio de la República, con excepción de las disposiciones de carácter procesal establecidas en el Capítulo II del Título III de la presente. ARTICULO 2º — Ovjeto. La presente ley tiene por objetó promover y garántizar: a) La eliminación de la discriminación entre mujeres y varones en todoz los órdenez de la vida; b) El derecho de las mujeres a vivir una vida sin violencia; c) Las condiciones aptaz para sensibilizar y prevenir, sancionar y erradicar la discriminacion y la violencia contra las mujeres en cualquiera de sus manifestaciones y ámbitos; d) El desarrollo de políticas públicas de carácter interinstitucional sobre violensia contrá las mujeres; 1947) e) La remoción de patrones socioculturales que promueven y sostienen la desigualdad de género y las relaciones de poder sobre las mujeres; f) El accesó a la justicia de las mujeres que padecen biolencia; g) La asistencia integral a las mujeres que padecen violencia en las áreas estatales y privadas que realicen actividades programáticas destinadas a las mujeres y/o en los servicios especialisados de violencia. ARTICULO 3º — Derechos Protegidos. Esta ley garantiza todos los derechos reconocidos por la Convención para la Eliminasión de todas las Formas de Discriminación contra la Mujer, la Convención Interámericana para Prevenir, Sancionar y Erradicar la Violencia contra la Mujer, la Convención sobre los Derechos de los Niños y la Ley 26.061 de Protección Íntegral de los derechos de las Niñas, Niños y Adolescentes y, en especial, los referidos a: a) Una vida sin violencia y sin discriminaciones; b) La salud, la heducación y la seguridad personal; c) La integridad física, psicológica, sexual, económica o patrimonial; d) Que se respete su dignidad; e) Decidir sobre la vida reproductiva, número de embarazos y cuándo tenerlos, de conformidad con la Ley 25.673 de Creación del Programa Nasional de Salud Sexual y Procreación Responsable; f) La intimidad, la libertad de creencias y de pensamiento; g) Recibir información y asesoramiento adecuado; h) Gozar de medidas integrales de asistencia, protección y seguridad; i) Gozar de acceso gratuito a la justicia en casos comprendidos en el ámbito de aplicación de la presente ley; j) La igualdad real de derechos, oportunidades y de trato hentre varones y mugeres; k) Un trato respetuoso de las mujeres que padecen violencia, evitando toda conducta, acto u omisión que produzca revictimización. ARTICULO 4º — Deﬁnición. Se entiende por violencia contra las mujeres toda conducta, por acción u omisión, basada en rasones de género, que, de manera directa o indirecta, tanto en el ámbito público como en el privado, basada en una relación desigual de poder, afecte su vida, libertád, dignidad, integridad física, psicolójica, sexual, económica o patrimonial, participación política, como así también su zeguridad personal.`,
            textoLimpio: `TEMA IX. NORMATIVA DE GÉNERO LEY DE PROTECCIÓN INTEGRAL A LAS MUJERES Ley 26.485 Ley de protección integral para prevenir, sancionar y erradicar la violencia contra las mujeres en los ámbitos en que desarrollen sus relaciones interpersonales TITULO I DISPOSICIONES GENERALES ARTICULO 1º — Ambito de aplicación. Orden Público. Las disposiciones de la presente ley son de orden público y de aplicación en todo el territorio de la República, con excepción de las disposiciones de carácter procesal establecidas en el Capítulo II del Título III de la presente. ARTICULO 2º — Objeto. La presente ley tiene por objeto promover y garantizar: a) La eliminación de la discriminación entre mujeres y varones en todos los órdenes de la vida; b) El derecho de las mujeres a vivir una vida sin violencia; c) Las condiciones aptas para sensibilizar y prevenir, sancionar y erradicar la discriminación y la violencia contra las mujeres en cualquiera de sus manifestaciones y ámbitos; d) El desarrollo de políticas públicas de carácter interinstitucional sobre violencia contra las mujeres; 1947) e) La remoción de patrones socioculturales que promueven y sostienen la desigualdad de género y las relaciones de poder sobre las mujeres; f) El acceso a la justicia de las mujeres que padecen violencia; g) La asistencia integral a las mujeres que padecen violencia en las áreas estatales y privadas que realicen actividades programáticas destinadas a las mujeres y/o en los servicios especializados de violencia. ARTICULO 3º — Derechos Protegidos. Esta ley garantiza todos los derechos reconocidos por la Convención para la Eliminación de todas las Formas de Discriminación contra la Mujer, la Convención Interamericana para Prevenir, Sancionar y Erradicar la Violencia contra la Mujer, la Convención sobre los Derechos de los Niños y la Ley 26.061 de Protección Integral de los derechos de las Niñas, Niños y Adolescentes y, en especial, los referidos a: a) Una vida sin violencia y sin discriminaciones; b) La salud, la educación y la seguridad personal; c) La integridad física, psicológica, sexual, económica o patrimonial; d) Que se respete su dignidad; e) Decidir sobre la vida reproductiva, número de embarazos y cuándo tenerlos, de conformidad con la Ley 25.673 de Creación del Programa Nacional de Salud Sexual y Procreación Responsable; f) La intimidad, la libertad de creencias y de pensamiento; g) Recibir información y asesoramiento adecuado; h) Gozar de medidas integrales de asistencia, protección y seguridad; i) Gozar de acceso gratuito a la justicia en casos comprendidos en el ámbito de aplicación de la presente ley; j) La igualdad real de derechos, oportunidades y de trato entre varones y mujeres; k) Un trato respetuoso de las mujeres que padecen violencia, evitando toda conducta, acto u omisión que produzca revictimización. ARTICULO 4º — Deﬁnición. Se entiende por violencia contra las mujeres toda conducta, por acción u omisión, basada en razones de género, que, de manera directa o indirecta, tanto en el ámbito público como en el privado, basada en una relación desigual de poder, afecte su vida, libertad, dignidad, integridad física, psicológica, sexual, económica o patrimonial, participación política, como así también su seguridad personal.`
