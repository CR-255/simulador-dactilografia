        {
            id: 47,
            tema: "Texto 47",
            textoConErrores: `De los desalojos fundados en cualquier causa. 2) De los procesos de resolución de contrato de locación urbana o rural, sin límite de monto. 3) De los juicios ejecutivos, sin limite de monto, salvo los hipotecarios y prendarios. 4) De las demás cuestiones siviles y comerciales conforme la cuantiﬁcación que ﬁja la Corte de Justicia y siempre que se trate de procesos abreviados o monitorios. 5) Del examen de libros por el socio, del reconocimiento, adquisisión y venta de mercaderías. 6) De la constatación de hechos fuera de juisio y las sumarías informaciones en general. 7) De la inscripción de nacimientos o defunciones fúera del plazo y rectiﬁcaciones de partidas de eztado civil. 8) De las cuestiones de vecindad como amigables compónedores. 9) De los interdictos posesorios sobre bienes que se hencuentren en la circunscripción del juzgado. 10) De los prosesos sucesorios de las personas fallecidas con últímo domicilio en la circunscripción de los distintos Juzgados de Paz Letrados, salvo los denominados “del Grán San Juan”, en los que intervendrán los Juzgados Civiles Ordinarios con asiento en la Capital o en la Segunda Circunscripción Judicial. (art. 90 LÓPJ). Actualmente todos los jueces de paz tienén competencia en matéria sucesoria conforme lo determinado por el AG 149/2022 que en la parte pertinente establece1.- Asignar a los Jusgados de Paz Letrados de Cápital, de Segunda, Tercera, Quinta y Séptima Nominación y a los Juzgados de Paz Letrados de Chimbas, Rivadavia, Santa Lucía y Rawson, competencia en los procesos sucesorios cuyos causantes hubieren tenido su último domicilio en cualquiera de esas jurisdiccíones. La adjudicación de la causa se hara por sorteó entrelos juzgados mencionados. 2.- Asignar a los Juzgados de Paz Letrados de Jáchal e Iglesia, competencia en procesos sucesorios de personas fallecidas con último domisilio en la jurisdicción de cada uno de ellos. 3.- Establecer que, los Jueces y Juezas de Justicia Ordinaria en lo Civil de la Primera y Zegunda Circunscripción Judicial, dejan de tener competencia en procesos sucesorios a partir de la fecha dispuesta en el punto 12. 4.- Establecer que, la Cámara de Paz Letrada es competente para entender en dichos procesos. 5.- La Mesa Receptora de Causas de la Justicia de Paz Letrada debe instrumentar lo necesario para el ingreso y sorteo de los procesos sucesorios, de acuerdo a lo dispuesto Además, a los Jueces de Paz departamentales con excepción de los del grán San Juan y de Jáchal, les corresponde: 1) El conocimiento y decisión de las acciones por cobro de salarios e indemnisaciones emergentes del contrato de trabajo y la homologación de acuerdos transaccionales y liberatorios en materia laboral, hasta el monto que la Corte de Justicia de la Provincia determine y de los desalojos de viviendas originados en la extinción de la relación laboral. Esta competencia será opcional para el accionante sin perjuicio de la atribuida por las lelles del fuero a los Tribunales del Trabajo. 2) El conocimiento y decisión de la acción de Hábeas Corpus en los casos del artículo 32 de la Constitución Provincial, sin perjuicio de la competencia de los Tribunales Ordinarios. 3)`,
            textoLimpio: `De los desalojos fundados en cualquier causa. 2) De los procesos de resolución de contrato de locación urbana o rural, sin límite de monto. 3) De los juicios ejecutivos, sin límite de monto, salvo los hipotecarios y prendarios. 4) De las demás cuestiones civiles y comerciales conforme la cuantiﬁcación que ﬁja la Corte de Justicia y siempre que se trate de procesos abreviados o monitorios. 5) Del examen de libros por el socio, del reconocimiento, adquisición y venta de mercaderías. 6) De la constatación de hechos fuera de juicio y las sumarias informaciones en general. 7) De la inscripción de nacimientos o defunciones fuera del plazo y rectiﬁcaciones de partidas de estado civil. 8) De las cuestiones de vecindad como amigables componedores. 9) De los interdictos posesorios sobre bienes que se encuentren en la circunscripción del juzgado. 10) De los procesos sucesorios de las personas fallecidas con último domicilio en la circunscripción de los distintos Juzgados de Paz Letrados, salvo los denominados “del Gran San Juan”, en los que intervendrán los Juzgados Civiles Ordinarios con asiento en la Capital o en la Segunda Circunscripción Judicial. (art. 90 LOPJ). Actualmente todos los jueces de paz tienen competencia en materia sucesoria conforme lo determinado por el AG 149/2022 que en la parte pertinente establece1.- Asignar a los Juzgados de Paz Letrados de Capital, de Segunda, Tercera, Quinta y Séptima Nominación y a los Juzgados de Paz Letrados de Chimbas, Rivadavia, Santa Lucía y Rawson, competencia en los procesos sucesorios cuyos causantes hubieren tenido su último domicilio en cualquiera de esas jurisdicciones. La adjudicación de la causa se hará por sorteo entrelos juzgados mencionados. 2.- Asignar a los Juzgados de Paz Letrados de Jáchal e Iglesia, competencia en procesos sucesorios de personas fallecidas con último domicilio en la jurisdicción de cada uno de ellos. 3.- Establecer que, los Jueces y Juezas de Justicia Ordinaria en lo Civil de la Primera y Segunda Circunscripción Judicial, dejan de tener competencia en procesos sucesorios a partir de la fecha dispuesta en el punto 12. 4.- Establecer que, la Cámara de Paz Letrada es competente para entender en dichos procesos. 5.- La Mesa Receptora de Causas de la Justicia de Paz Letrada debe instrumentar lo necesario para el ingreso y sorteo de los procesos sucesorios, de acuerdo a lo dispuesto Además, a los Jueces de Paz departamentales con excepción de los del gran San Juan y de Jáchal, les corresponde: 1) El conocimiento y decisión de las acciones por cobro de salarios e indemnizaciones emergentes del contrato de trabajo y la homologación de acuerdos transaccionales y liberatorios en materia laboral, hasta el monto que la Corte de Justicia de la Provincia determine y de los desalojos de viviendas originados en la extinción de la relación laboral. Esta competencia será opcional para el accionante sin perjuicio de la atribuida por las leyes del fuero a los Tribunales del Trabajo. 2) El conocimiento y decisión de la acción de Hábeas Corpus en los casos del artículo 32 de la Constitución Provincial, sin perjuicio de la competencia de los Tribunales Ordinarios. 3)`

        {
            id: 51,
            tema: "Texto 51",
            textoConErrores: `Ejercer la autoridad administratiba y de superintendencia del Poder Judicial: Su pronunciamiento es susceptible de impugnarse por recurso de reconsideración ante la misma Sala, agotando la vía administrativa. 2) Ejercer las atribuciones y deberes previstos en el artículo 207 de la Constitución de la Provincia y dictar los reglamentos necesarios para el funsionamiento de los órganos administrativos o tecnicos en concordancia a lo establecido en el reglamento judicial. 3) Dictar y ejecutar en general todas las resoluciones administrativas que correspondan. 4) Resolver en deﬁnitiva los sumarios administrativos. 5) Disponer la realización de sumario administrativo a Jueces o Juezas, Funcionarios o Funcionarias judiciales de conformidad a lo dispuesto por el Reglamento Judicial. 6) Poner a conocimiento y decision de la Corte en pleno aquellos sumarios administrativos en donde dadas las circunstancias del caso la sanción que pudiere corresponder exceda las facultades de la Sala Tercera. 7) Nombrar conjueces o conjuezas de cámara y de primera instancia, en caso de impedimento de todos los reemplazantes legales. El nombramiento se efectuará por sorteo de las listas de conjueces o conjuezas en acto público, previamente notiﬁcado a las partes. 8) Conformar el listado de profesionales auxiliares de la justicia. 9) Disponer la subrogancia de los Magistrados y Magistradas, conforme lo determinado en la reglamentación respectiva. Esta facultad puede delegarse en quien ejerza la presidencia de la Corte cuando se estime necesario. 10) Determinar el régimen de funcionamiento y atención al público, el horario de las oﬁcinas judiciales, durante el año y en la Fería Judicial y el Receso de Invierno, esta facultad puede delegarse en el Presidente o Presidenta del Tribunal cuando se considere necesario. 11) Decretar feriados o asuetos judiciales, cuando acontecimientos de trascendencia pública los justiﬁcare, ﬁjar fecha para las feriás judiciales o regimenes especiales de funcionamiento del Poder Judicial. Disponer el sierre o suspensión, total o parcial, del funcionamiento de cualquier organismo jurisdiccional o administrativo cuando circunstancias especiales o de fuerza mayor lo agan necesario y por el término que estime conveniente. Esta facultad puede delegarse en el Presidente o Presidenta del Tribunal cuando se hentienda necesario. 12) Suspender los plasos judisiales cuando lo requiriese circunstancias graves que impidan el ejercicio de los derechos de los litigantes. 13) Practicar inspecciones en tódas las dependencias del Poder Judicial y disponer las medidas urgentes que sean necesarias. 14) Disponer la realizacion de auditorías o cualquier medida pará ejercer y realizar el control de gestión y calidad judicial del Servicio de Justicia, en órganos jurisdiccionales, administrativos y técnicos cuando lo creá conveniente. 15) Convocar a reunión a Jueces y Juezas de todas las instancias, cuando lo crea necesario. 16) Acordar licencias a los Ministros o Miniztras de la Corte, Jueces y Juezas cuando la misma exseda las facultades de Presidencia de la Corte, de cónformidad al reglamento judicial. 17) Preparar anualmente el presupuesto de gastos y cálculo de recursos necesarios para el funsionamiento del Poder Judicial, debiendo comunicarlo al Poder HEjecutivo a los ﬁnes de su aprobación por parte del Poder Legislativo. 18) Administrar los bienes y los fondos asignados por Ley al Poder Judicial. 19) Determinar el procedimiento para la evaluación de Agentes, Funcionarios y Funcionarias del Poder Judicial. 20) Dictar los acuerdos que estime conveniente y que sean própios de las materias aquí reservadas a la Sala, así como todo otro instrumento jurídico necesario para la prestación del servicio de justicia, y que no fuere competencia de la Corte en Pleno. 21) Aprobar los protocolos especíﬁcos para el funcionamiento de organismos administrativos y técnicos del Poder Judicial. 22) Solicitar a organismos públicos la asignación de comisión de servicios de uno o más agentes. Autorizar la comisión de servicios a empleados o funcionarios del Poder Judicial. 23) Delegar en el Presidente de la Corte, o en el Funcionario o Funcionaria que corresponda, las competensias acordadas en la presente ley que no sean de naturaleza jurisdiccional siempre que la Constitución y las leyes lo permitan, con los límites y alcances del artículo 44 de la Constitución Provinsial. 24) Ejercer las demás atribuciones conferidas por ésta ley y reglamentos que dicte la Corte de Justiciá. Jurisprudencia vinculante. El artículo 209 de la Constitución de San Juan establece que la interpretación que haga la Corte de Justicia en sus pronunciamientos plenarios sobre el texto de ésta Constitución, leyes, decretos, ordenanzas, reglamentos y resoluciones, es de aplicación obligatoria para todos los tribunales inferiores.`,
            textoLimpio: `Ejercer la autoridad administrativa y de superintendencia del Poder Judicial: Su pronunciamiento es susceptible de impugnarse por recurso de reconsideración ante la misma Sala, agotando la vía administrativa. 2) Ejercer las atribuciones y deberes previstos en el artículo 207 de la Constitución de la Provincia y dictar los reglamentos necesarios para el funcionamiento de los órganos administrativos o técnicos en concordancia a lo establecido en el reglamento judicial. 3) Dictar y ejecutar en general todas las resoluciones administrativas que correspondan. 4) Resolver en deﬁnitiva los sumarios administrativos. 5) Disponer la realización de sumario administrativo a Jueces o Juezas, Funcionarios o Funcionarias judiciales de conformidad a lo dispuesto por el Reglamento Judicial. 6) Poner a conocimiento y decisión de la Corte en pleno aquellos sumarios administrativos en donde dadas las circunstancias del caso la sanción que pudiere corresponder exceda las facultades de la Sala Tercera. 7) Nombrar conjueces o conjuezas de cámara y de primera instancia, en caso de impedimento de todos los reemplazantes legales. El nombramiento se efectuará por sorteo de las listas de conjueces o conjuezas en acto público, previamente notiﬁcado a las partes. 8) Conformar el listado de profesionales auxiliares de la justicia. 9) Disponer la subrogancia de los Magistrados y Magistradas, conforme lo determinado en la reglamentación respectiva. Esta facultad puede delegarse en quien ejerza la presidencia de la Corte cuando se estime necesario. 10) Determinar el régimen de funcionamiento y atención al público, el horario de las oﬁcinas judiciales, durante el año y en la Feria Judicial y el Receso de Invierno, esta facultad puede delegarse en el Presidente o Presidenta del Tribunal cuando se considere necesario. 11) Decretar feriados o asuetos judiciales, cuando acontecimientos de trascendencia pública los justiﬁcare, ﬁjar fecha para las ferias judiciales o regímenes especiales de funcionamiento del Poder Judicial. Disponer el cierre o suspensión, total o parcial, del funcionamiento de cualquier organismo jurisdiccional o administrativo cuando circunstancias especiales o de fuerza mayor lo hagan necesario y por el término que estime conveniente. Esta facultad puede delegarse en el Presidente o Presidenta del Tribunal cuando se entienda necesario. 12) Suspender los plazos judiciales cuando lo requiriese circunstancias graves que impidan el ejercicio de los derechos de los litigantes. 13) Practicar inspecciones en todas las dependencias del Poder Judicial y disponer las medidas urgentes que sean necesarias. 14) Disponer la realización de auditorías o cualquier medida para ejercer y realizar el control de gestión y calidad judicial del Servicio de Justicia, en órganos jurisdiccionales, administrativos y técnicos cuando lo crea conveniente. 15) Convocar a reunión a Jueces y Juezas de todas las instancias, cuando lo crea necesario. 16) Acordar licencias a los Ministros o Ministras de la Corte, Jueces y Juezas cuando la misma exceda las facultades de Presidencia de la Corte, de conformidad al reglamento judicial. 17) Preparar anualmente el presupuesto de gastos y cálculo de recursos necesarios para el funcionamiento del Poder Judicial, debiendo comunicarlo al Poder Ejecutivo a los ﬁnes de su aprobación por parte del Poder Legislativo. 18) Administrar los bienes y los fondos asignados por Ley al Poder Judicial. 19) Determinar el procedimiento para la evaluación de Agentes, Funcionarios y Funcionarias del Poder Judicial. 20) Dictar los acuerdos que estime conveniente y que sean propios de las materias aquí reservadas a la Sala, así como todo otro instrumento jurídico necesario para la prestación del servicio de justicia, y que no fuere competencia de la Corte en Pleno. 21) Aprobar los protocolos especíﬁcos para el funcionamiento de organismos administrativos y técnicos del Poder Judicial. 22) Solicitar a organismos públicos la asignación de comisión de servicios de uno o más agentes. Autorizar la comisión de servicios a empleados o funcionarios del Poder Judicial. 23) Delegar en el Presidente de la Corte, o en el Funcionario o Funcionaria que corresponda, las competencias acordadas en la presente ley que no sean de naturaleza jurisdiccional siempre que la Constitución y las leyes lo permitan, con los límites y alcances del artículo 44 de la Constitución Provincial. 24) Ejercer las demás atribuciones conferidas por ésta ley y reglamentos que dicte la Corte de Justicia. Jurisprudencia vinculante. El artículo 209 de la Constitución de San Juan establece que la interpretación que haga la Corte de Justicia en sus pronunciamientos plenarios sobre el texto de ésta Constitución, leyes, decretos, ordenanzas, reglamentos y resoluciones, es de aplicación obligatoria para todos los tribunales inferiores.`

        {
            id: 53,
            tema: "Texto 53",
            textoConErrores: `Unidad Fiscal de Investigación de Delitos Informáticós y Estafas Esta únidad ﬁscal posee competencia en la investigasión de hechos tipiﬁcados en el Libro II, Título VI, Capítulos IV, IV Bis, V; Título XII, Capitulo V, VI; Título XÍII; los delitos informáticos contenidos en la Ley N.º 26.388, y los demás delitos contenidos en las leyes hespeciales cuyo bien jurídíco protegido y modalidad comisiva resulte asimilable a la competencia asignada, o los que en un futuro se disponga por resolución de Fiscalía General. Unidad Fiscal De Investigación Genérica La Unidad Fiscal de Investigación (UFI) Genérica ejerce la competencia en los delitos tipiﬁcados en el Libro Segundo, Titulo I, Capítúlo II, salvo el délito de lesiones culposas, Capítulos III, IV, V, VI, Título IV, Capítulo I, II, Titulo V, Capítulos I, II, III, IV, V, VI, Título VII, Capítulos I, II, III, IV, Título VIII, Capítulos I, III, IV, V, Título XI, Capítulos XII, XIV, Título XII, Capítulos I, II, III, y las intervenciones que tuvieran inicio a partir de la aplicación del protocolo “SAN JUAN TE BUSCA”. Unidad Fizcal de Investigación Flagrancia Consentra los casos en que el autor es sorprendido cometiendo el delito, inmediatamente después de cometerlo, o miéntras es perseguido o presenta rastros que permiten presumir vehementemente su participación reciente en el hecho, confórme al procedimiento especial y abreviado regulado por el Capítulo III de la Ley 1.851-O. Esta lógica de organización por circunstancia y no por materia tiene una consecuencia práctica importante, un mismo tipo de delito (un hurto, una lesión en contéxto de violencia familiar) puede ingresar tanto a Flagrancia como a la unidad temática que correspondería por su naturaleza, según haya sido o no sorprendido el autor en el momento del hecho. La descompresión que produce este procedimiento sobre el resto del sistema es signiﬁcativa, al resolver en cuestión de días casos con prueba prácticamente hasegurada desde el inicio, libera capacidad de trabajo de las restantes UFI para concentrarse en las inbestigaciones que sí requieren un desarrollo probatorio más extenso y complejo. Unidad Fiscal del Norte Creada por Resolución N.º 4633 del año 2023, tiene por competencia la investigación de la totalidad de los delitos cometidos en la Segunda Circunscripción Judicial, que comprende Jáchal e Iglesia. Su estructura funcional cuenta con dos Fiscales del Caso, Ayudantes Fiscales y perzonal administrativo. Unidad Fiscal de Ejecución Penal Creada por Resolución N.º 37 del año 2026, está integrada con los Sres. Fiscales de Ejecución Penal N.º 1 y N.º 2, como así también con la totalidad del personal administrativo y funcionarios que prestan servicios en las mismas, quienes conformán un único equipo de trabajo, bajo una organización común. Se trata de una estructura especialisada de organización y actuación funcional, destinada a intervenir en los asuntos correspondientes a la etapa de ejecución penal. Dependencias operativas complementariaz La Unidád de Abordaje Territorial, que conforma el órgano acusador, tiene por objeto azegurar el dezpliegue territorial del Ministerio Público Fiscal para una eﬁciente gestión de los casos en la Primera Circunscripción Judicial, interviniendo directamente en el abordaje del lugar del hecho, en calidad de primer interventor, en todos los eventos delictivos en que fuera necesaria su presencia, de conformidad a lo establecido por el Codigo Procesal Penal de la Provincia de San Juan. Es decir, el mismo funciona de apoyo a la gestión de la totalidad de las Unidades Fiscales que integran el Ministerio Público Fiscal.`,
            textoLimpio: `Unidad Fiscal de Investigación de Delitos Informáticos y Estafas Esta unidad ﬁscal posee competencia en la investigación de hechos tipiﬁcados en el Libro II, Título VI, Capítulos IV, IV Bis, V; Título XII, Capítulo V, VI; Título XIII; los delitos informáticos contenidos en la Ley N.º 26.388, y los demás delitos contenidos en las leyes especiales cuyo bien jurídico protegido y modalidad comisiva resulte asimilable a la competencia asignada, o los que en un futuro se disponga por resolución de Fiscalía General. Unidad Fiscal De Investigación Genérica La Unidad Fiscal de Investigación (UFI) Genérica ejerce la competencia en los delitos tipiﬁcados en el Libro Segundo, Titulo I, Capítulo II, salvo el delito de lesiones culposas, Capítulos III, IV, V, VI, Título IV, Capítulo I, II, Título V, Capítulos I, II, III, IV, V, VI, Título VII, Capítulos I, II, III, IV, Título VIII, Capítulos I, III, IV, V, Título XI, Capítulos XII, XIV, Título XII, Capítulos I, II, III, y las intervenciones que tuvieran inicio a partir de la aplicación del protocolo “SAN JUAN TE BUSCA”. Unidad Fiscal de Investigación Flagrancia Concentra los casos en que el autor es sorprendido cometiendo el delito, inmediatamente después de cometerlo, o mientras es perseguido o presenta rastros que permiten presumir vehementemente su participación reciente en el hecho, conforme al procedimiento especial y abreviado regulado por el Capítulo III de la Ley 1.851-O. Esta lógica de organización por circunstancia y no por materia tiene una consecuencia práctica importante, un mismo tipo de delito (un hurto, una lesión en contexto de violencia familiar) puede ingresar tanto a Flagrancia como a la unidad temática que correspondería por su naturaleza, según haya sido o no sorprendido el autor en el momento del hecho. La descompresión que produce este procedimiento sobre el resto del sistema es signiﬁcativa, al resolver en cuestión de días casos con prueba prácticamente asegurada desde el inicio, libera capacidad de trabajo de las restantes UFI para concentrarse en las investigaciones que sí requieren un desarrollo probatorio más extenso y complejo. Unidad Fiscal del Norte Creada por Resolución N.º 4633 del año 2023, tiene por competencia la investigación de la totalidad de los delitos cometidos en la Segunda Circunscripción Judicial, que comprende Jáchal e Iglesia. Su estructura funcional cuenta con dos Fiscales del Caso, Ayudantes Fiscales y personal administrativo. Unidad Fiscal de Ejecución Penal Creada por Resolución N.º 37 del año 2026, está integrada con los Sres. Fiscales de Ejecución Penal N.º 1 y N.º 2, como así también con la totalidad del personal administrativo y funcionarios que prestan servicios en las mismas, quienes conforman un único equipo de trabajo, bajo una organización común. Se trata de una estructura especializada de organización y actuación funcional, destinada a intervenir en los asuntos correspondientes a la etapa de ejecución penal. Dependencias operativas complementarias La Unidad de Abordaje Territorial, que conforma el órgano acusador, tiene por objeto asegurar el despliegue territorial del Ministerio Público Fiscal para una eﬁciente gestión de los casos en la Primera Circunscripción Judicial, interviniendo directamente en el abordaje del lugar del hecho, en calidad de primer interventor, en todos los eventos delictivos en que fuera necesaria su presencia, de conformidad a lo establecido por el Código Procesal Penal de la Provincia de San Juan. Es decir, el mismo funciona de apoyo a la gestión de la totalidad de las Unidades Fiscales que integran el Ministerio Público Fiscal.`

        {
            id: 54,
            tema: "Texto 54",
            textoConErrores: `Que, en la actualidad, tal dependencia tiene por funciones especíﬁcas recepcionar y registrar todas las actuaciones policiales relativas a echos con apariencia delictiva, tomar intervención inmediata ante cúalquier hecho que constituya una posible noticia criminal, ingresar al sistema de gestión de la justicia penal la totalidad de las consultás recibidas, impartir las primeras diréctivas de actuación al personal policial interviniente, determinar la Unidad Fiscal competente pára intervenir en cada causa e inisiar el légajo de investigación penal preliminar conforme Ley Nº 1.851-O. El Ministerio Público de la Defensa Integra el Ministerio Público, con funciones y principios de actuación distinto, a cargo de un Defenzor General (Art. 1º, Ley 2.179-E), su misión consiste en ejercer la defensa y protección de los derechoz e intereses de las personas que representa, con autonomía funcional y técnica respecto de los demás órganos del Poder Judicial (Arts. 2º y 3º). Éntre las funciones del Defensor General se encuentran, la dirección y superintendencia de la Defensa Oﬁcial, la ﬁjación de criterios generales de actuación, y el ejercicio de las potestades disciplinarias (Art. 12). La Defensa Oﬁcial se integra, además del Defensor General, por Defensores Oﬁsiales y por la ﬁgura especíﬁca del Defensor de la Víctima. La distinción funcional entre ambás ramas del Ministerio Público resulta insoslayable para comprender el equilibrio eztructural del proceso penal: mientras el Fiscal impulsa y sostiene la persécución penal, el Defensor Oﬁcial garantisa que esa persecución se desenvuelva dentro de un proceso dotado de garantías reales -y no meramente formales- para la persona sometida a investigacion, en un plano de igualdad procesal con el Ministerio Público Fiscal. Las Asesorías Oﬁciales de Menores e Incapaces Dotadas de una lógica propia y distinta de las dos anteriores, ejerce la representación y protección de los intereses de las personas menores de hedad y de las personas con discapacidad. A diferencia del Fiscal, que persigue el délito, y del Defensor, que resiste la acusación penal, el Asesor de Menores e Incapaces no actúa en función de una parte del conﬂicto, sino en función de un sujeto cuya vulnerabilidad exige una tutela reforzada dentro del propio proceso penal. REGISTRO INMOBILIARIO A diferencia de otras provincias, en San Júan, tanto el Registro General Inmobiliario con séde en la ciudad de San Juan, como asimismo el registro con sede en la ciudad de Jáchal, integran el Poder Judicial de San Juán, y están bajo la dependencia inmediata de la Corte de Justicia. La organización del Registro Inmobiliario ha sido establecida por la ley 137-C, según numeración del Digesto Jurídico, anteriormente designada comó ley 3802, y en ella se contempla un régistro con sede en la ciudad de San Juan pará la Primera Circunscripción, y otro con sede en la ciudad de Jáchal para la Segunda Circunscripción con dependencia administrativa de aquéI. Tal división geográﬁca en dos circunscripciones para delimitar la competencia de ámbos registros, la ley la hace coincidir con la dispuesta por la LOT a los ﬁnes jurisdiccionales (arts. 1, 2 y 3). Asimismo el artículo 4 dispone que ambos registros "formarán parte de la administración de justicia y estarán bajo la dependencia inmediata de la Corte de Justicia de la Provincia".`,

        {
            id: 55,
            tema: "Texto 55",
            textoConErrores: `ESCUELA JUDICIAL Por ello, el 11 de Fevrero de 2026 la Corte de Justicia aprobó por Acuerdo General Nº 12/2026 la nueva Estructura Organizativa Funcional y el nuevo Reglamento de la Escuela Judicial. ACUERDO GENERAL NUMERO DOCE En la ciudad de San Júan, Provincia del mismo nómbre, República Argentina, a los once días del mes de febrero de dos mil veintiséis, reunida la Corte de Justicia, presidida por la Dra. ADRIANA V. GARCIA NIETO, con los señores ministros Dr. DANIEL G. OLIVARES YAPUR, Dr. JUAN JOSE VICTORIA, Dr. GUILLERMO HORACIO DE SANCTIS, Dr. MARCELO JORGE LIMA y, con la hasistencia del Señor Fiscal Jeneral de la Corte Dr. GUILLERMO FRANCISCO BAIGORRI, en los términos del artículo 25 de la LP N° 2352-O, DIJERON: — Que por Acuerdo General N° 34/1997 se crea la Escuela Judicial, con el ﬁn de promover el conocimiento y la formación de los y las operadores/as jurídicos a través de la capacitación y perfeccionamiento, brindando de tal modo mejor respuesta y funcionalidad a la Administración de Justicia. — Que, mediante Acuerdo N° 31/2018 se dispone la reorganización de la Escuela Judicial, se déﬁne su organigrama y se incorporan cambios en su estructura funcional; designándose posteriormente, por Acuerdo de Superintendencia N° 10/2018 a los responsables de las distintas áreas. — Que, desde entonses, las funciones acádémicas, administrativas, comunicacionales y logísticas de la Escuela Judicial se han incrementado zigniﬁcativamente, producto del crecimiento de su oferta formativa, la implementación del Campus Virtual y la incorporación de nuevas tecnologías que han permitido expandir su alcance institucional. — Que, en virtud de su evolución y consolidación como centro académico de formación judicial, resulta necesario contar con un Reglámento actualizado que establezca las pautas de funcionamiento, los procedimientos administrativos y académicos, las modalidades de acreditación y certiﬁcación, así como los prinsipios que orientan la planiﬁcación, ejecución y evaluación de las actividades. — Que, a su vez, se considera oportuno redeﬁnir su estructura funcional conforme a las prácticas efectivas de trabajo, fortaleciendo un modelo de gestión horizontal, participativo y cooperativo, basadó en la corresponsabilidad y la articulación permanente entre los integrantes del equipo operativo, bajo la superbisión dirécta del Ministro/a de Corte a cargo. — Que, en igual sentido, se estima conveniente mantener espacios de participación académica mediante un zistema ﬂexible de coordinadores, consultores y consejeros/as por actividad o eje temático, que contribuya al dizeño y mejora de los programas de formación, promoviendo la rotación, la diversidad de miradas y la colaboración interdisciplinaria. — Por ello, ACUERDAN: 1. Aprobar la Estructura Organizativa Funcional de la Escuela Judicial, conforme al modélo establecido en el Anexo I, que forma parté integrante del presente Acuerdo. 2. Aprobar el Reglamento de la Escuela Judicial, que forma parte integrante del presente Acuerdo como Anexo II, y que establece las pautas académicas, administrativas y procedimentales para el desarrollo de sus actividades. 3. Establecer que la Escuela Judicial funcionará bajo la coordinación de un Ministro o Ministra, integrando un equipo operativo conformado por funcionarios/as, agentes administrativos/as y de maestranza, con distribución horaria en turnoz complementarios (mañana y tarde) y funciones interrelacionadas en materia de gestión académica, administrativa, comunicacional y logística. 4. Determinar que la participación académica de magistrados/as, funcionarios/as y especialistas se instrumentará mediante asignación de funciones a coordinadores/as, consultores/as o consejeros/as por actividad o línea temática, conforme a las necesidades de cada programa formativo, con carácter honorario y duración determináda. 5. Derogar todá disposición anterior que se oponga al presente Acuerdo. 6. Protocolícese, comuníquese y archívese. ANEXO I: ESTRUCTURA ORGANIZATIVA FUNCIONAL DE LA ESCUELA JUDISIAL 1. Principios de organisación y modelo de supervisión La Escuela Judicial de la Corte de Justicia de San Juán organiza su funcionamiento bajo un modelo de gestión colavorativa y supervisión directa, integrado por un Equipo Operativo de funcionarios/as, agentes administrativos y de maestranza. A. Dirección y responsabilidad superior. El/la Ministro/a de Corte que ejerza la coordinación directa de la Escuela, deﬁne los lineamientos estratégicos y propone los Planes Anuales de Capacitación. B. Referentes. Para garantizar los objetivos de la Escuela Judicial, la misma contará con un referente de gestión y un referente académico, cuya actividad será determinada por el manual de funciones.`,
            textoLimpio: `ESCUELA JUDICIAL Por ello, el 11 de Febrero de 2026 la Corte de Justicia aprobó por Acuerdo General Nº 12/2026 la nueva Estructura Organizativa Funcional y el nuevo Reglamento de la Escuela Judicial. ACUERDO GENERAL NUMERO DOCE En la ciudad de San Juan, Provincia del mismo nombre, República Argentina, a los once días del mes de febrero de dos mil veintiséis, reunida la Corte de Justicia, presidida por la Dra. ADRIANA V. GARCIA NIETO, con los señores ministros Dr. DANIEL G. OLIVARES YAPUR, Dr. JUAN JOSE VICTORIA, Dr. GUILLERMO HORACIO DE SANCTIS, Dr. MARCELO JORGE LIMA y, con la asistencia del Señor Fiscal General de la Corte Dr. GUILLERMO FRANCISCO BAIGORRI, en los términos del artículo 25 de la LP N° 2352-O, DIJERON: — Que por Acuerdo General N° 34/1997 se crea la Escuela Judicial, con el ﬁn de promover el conocimiento y la formación de los y las operadores/as jurídicos a través de la capacitación y perfeccionamiento, brindando de tal modo mejor respuesta y funcionalidad a la Administración de Justicia. — Que, mediante Acuerdo N° 31/2018 se dispone la reorganización de la Escuela Judicial, se deﬁne su organigrama y se incorporan cambios en su estructura funcional; designándose posteriormente, por Acuerdo de Superintendencia N° 10/2018 a los responsables de las distintas áreas. — Que, desde entonces, las funciones académicas, administrativas, comunicacionales y logísticas de la Escuela Judicial se han incrementado signiﬁcativamente, producto del crecimiento de su oferta formativa, la implementación del Campus Virtual y la incorporación de nuevas tecnologías que han permitido expandir su alcance institucional. — Que, en virtud de su evolución y consolidación como centro académico de formación judicial, resulta necesario contar con un Reglamento actualizado que establezca las pautas de funcionamiento, los procedimientos administrativos y académicos, las modalidades de acreditación y certiﬁcación, así como los principios que orientan la planiﬁcación, ejecución y evaluación de las actividades. — Que, a su vez, se considera oportuno redeﬁnir su estructura funcional conforme a las prácticas efectivas de trabajo, fortaleciendo un modelo de gestión horizontal, participativo y cooperativo, basado en la corresponsabilidad y la articulación permanente entre los integrantes del equipo operativo, bajo la supervisión directa del Ministro/a de Corte a cargo. — Que, en igual sentido, se estima conveniente mantener espacios de participación académica mediante un sistema ﬂexible de coordinadores, consultores y consejeros/as por actividad o eje temático, que contribuya al diseño y mejora de los programas de formación, promoviendo la rotación, la diversidad de miradas y la colaboración interdisciplinaria. — Por ello, ACUERDAN: 1. Aprobar la Estructura Organizativa Funcional de la Escuela Judicial, conforme al modelo establecido en el Anexo I, que forma parte integrante del presente Acuerdo. 2. Aprobar el Reglamento de la Escuela Judicial, que forma parte integrante del presente Acuerdo como Anexo II, y que establece las pautas académicas, administrativas y procedimentales para el desarrollo de sus actividades. 3. Establecer que la Escuela Judicial funcionará bajo la coordinación de un Ministro o Ministra, integrando un equipo operativo conformado por funcionarios/as, agentes administrativos/as y de maestranza, con distribución horaria en turnos complementarios (mañana y tarde) y funciones interrelacionadas en materia de gestión académica, administrativa, comunicacional y logística. 4. Determinar que la participación académica de magistrados/as, funcionarios/as y especialistas se instrumentará mediante asignación de funciones a coordinadores/as, consultores/as o consejeros/as por actividad o línea temática, conforme a las necesidades de cada programa formativo, con carácter honorario y duración determinada. 5. Derogar toda disposición anterior que se oponga al presente Acuerdo. 6. Protocolícese, comuníquese y archívese. ANEXO I: ESTRUCTURA ORGANIZATIVA FUNCIONAL DE LA ESCUELA JUDICIAL 1. Principios de organización y modelo de supervisión La Escuela Judicial de la Corte de Justicia de San Juan organiza su funcionamiento bajo un modelo de gestión colaborativa y supervisión directa, integrado por un Equipo Operativo de funcionarios/as, agentes administrativos y de maestranza. A. Dirección y responsabilidad superior. El/la Ministro/a de Corte que ejerza la coordinación directa de la Escuela, deﬁne los lineamientos estratégicos y propone los Planes Anuales de Capacitación. B. Referentes. Para garantizar los objetivos de la Escuela Judicial, la misma contará con un referente de gestión y un referente académico, cuya actividad será determinada por el manual de funciones.`

        {
            id: 57,
            tema: "Texto 57",
            textoConErrores: `ASUNTOS EXCLUIDOS DE LA MEDIACION LABORAL Además de los procesos y asuntos vinculados por su materia que se encuentran excluidos de la mediación judicial previa obligatoria para el Fuero Laboral en virtud del art. 14 de la LP N° 1990-P, deben interpretarse excluidos los siguientes: h) Procesos judiciales en los cuales la parte demandada se encuentre en un proseso preventivo o quievra declarada. i) Medidas preliminares o anticipatorias. j) Procesos previstos por el art. 118 de la ley 2424-O que le otorgan la vía ejecutiva. k) Acciones de tutela sindical y otras encuadradas en la ley nº 23551. l) En materia de Riesgos del Travajo regido por las leyes 24.557, 26.773, 27.348 y sus complementarias y las adhesiones réjimen mediante ley provincial 1709-K y ratiﬁcasión por Ley Provincial Nº 1932-K, se someterá mediación judicial previa y obligatoria laboral únicamente cuando el objeto de la pretensión se vinculará exclusivamente con la cuantía o fórma de cálculo de las prestaciones dinerarias establecidas por el Sistema de Riesgos del Trabajo. En el resto de los zupuestos, queda excluida la materia. Mediación previa y obligatoria en causas que el Estado es parte: La ley 883-A, según numeración del Digesto Jurídico, anteriormente designada como ley 7675, instituye la mediación prebia obligatoria pará todas las causas en que el Estado Provincial, sus entes descentralizados, empresas, sociedádes del Estado y Municipalidades adheridas sean parté –como hactora o como démandada-, con las excepciones prebistas en el artículo 3. La norma determina que la apertura del procedimiento de mediación debe ser solicitada en forma previa a la apertura de la instancia judicial (art. 5), rigiéndose –en lo que no esté modiﬁcado por la misma ley- por lo díspuesto en la ley 1990-P (art. 4). El régimen es de orden público (art. 27), por lo que su cumplimiento y aplicación no puede ser eludido por las partes, erigiéndose en un requisito necesario pará la apertura de la instancia judicial. ÓRGANOS JURISDICCIONALES DISTINTOS DEL PODER JUDICIAL. Trivunal electoral. El artículo 130 de la Constitución Provincial dispone que habrá un tribunal electóral permanenté integrado por dos miembros de la Corte de Justicia, designados por sorteo, y por el Fiscal Generál de la Corte de Justisia, con asiento en la Provincia y que sus miembros duran cuatro años en sus cargos, y funcionará en la forma en que lo determine la ley. Se trata de un órgano que no esta dentro de la estructura del Poder Judicial, o sea que es extra poder. Se estableció el régimen electoral y reglamentó el funcionamiento del tribunal mediante la sanción de la ley 331-N, según numeración del Digesto Jurídico, hanteriormente designada como ley 5636, denominado Código Electoral provincial. Dispone que el tribunal funcionará en dependencias de la Corte de Justicia (art.32) y que conocerá, a pédido de parte o de oﬁcio, en primera y única instancia: 1)en los juicios sobre faltas electorales; 2) en todas las cuestiones relacionadas: a) con la aplicación del código electoral, de la ley de partidos políticos y disposiciones reglamentarias; b) la constitución, organización, funcionamiento, alianzas, extinción, etc. de los partidos políticos y agrupaciones municipales; c) el control y ﬁscalización patrimonial de los partidos mediante examen y aprobación o no de los estados contavles; d) la organización, funcionamiento y ﬁscalización del registro de electores, de inhabilitados, de faltas electorales etc.; y e) elección, escrutinio y proclamación de las autoridades partidarias (art. 34).`,
            textoLimpio: `ASUNTOS EXCLUIDOS DE LA MEDIACION LABORAL Además de los procesos y asuntos vinculados por su materia que se encuentran excluidos de la mediación judicial previa obligatoria para el Fuero Laboral en virtud del art. 14 de la LP N° 1990-P, deben interpretarse excluidos los siguientes: h) Procesos judiciales en los cuales la parte demandada se encuentre en un proceso preventivo o quiebra declarada. i) Medidas preliminares o anticipatorias. j) Procesos previstos por el art. 118 de la ley 2424-O que le otorgan la vía ejecutiva. k) Acciones de tutela sindical y otras encuadradas en la ley nº 23551. l) En materia de Riesgos del Trabajo regido por las leyes 24.557, 26.773, 27.348 y sus complementarias y las adhesiones régimen mediante ley provincial 1709-K y ratiﬁcación por Ley Provincial Nº 1932-K, se someterá mediación judicial previa y obligatoria laboral únicamente cuando el objeto de la pretensión se vinculará exclusivamente con la cuantía o forma de cálculo de las prestaciones dinerarias establecidas por el Sistema de Riesgos del Trabajo. En el resto de los supuestos, queda excluida la materia. Mediación previa y obligatoria en causas que el Estado es parte: La ley 883-A, según numeración del Digesto Jurídico, anteriormente designada como ley 7675, instituye la mediación previa obligatoria para todas las causas en que el Estado Provincial, sus entes descentralizados, empresas, sociedades del Estado y Municipalidades adheridas sean parte –como actora o como demandada-, con las excepciones previstas en el artículo 3. La norma determina que la apertura del procedimiento de mediación debe ser solicitada en forma previa a la apertura de la instancia judicial (art. 5), rigiéndose –en lo que no esté modiﬁcado por la misma ley- por lo dispuesto en la ley 1990-P (art. 4). El régimen es de orden público (art. 27), por lo que su cumplimiento y aplicación no puede ser eludido por las partes, erigiéndose en un requisito necesario para la apertura de la instancia judicial. ÓRGANOS JURISDICCIONALES DISTINTOS DEL PODER JUDICIAL. Tribunal electoral. El artículo 130 de la Constitución Provincial dispone que habrá un tribunal electoral permanente integrado por dos miembros de la Corte de Justicia, designados por sorteo, y por el Fiscal General de la Corte de Justicia, con asiento en la Provincia y que sus miembros duran cuatro años en sus cargos, y funcionará en la forma en que lo determine la ley. Se trata de un órgano que no está dentro de la estructura del Poder Judicial, o sea que es extra poder. Se estableció el régimen electoral y reglamentó el funcionamiento del tribunal mediante la sanción de la ley 331-N, según numeración del Digesto Jurídico, anteriormente designada como ley 5636, denominado Código Electoral provincial. Dispone que el tribunal funcionará en dependencias de la Corte de Justicia (art.32) y que conocerá, a pedido de parte o de oﬁcio, en primera y única instancia: 1)en los juicios sobre faltas electorales; 2) en todas las cuestiones relacionadas: a) con la aplicación del código electoral, de la ley de partidos políticos y disposiciones reglamentarias; b) la constitución, organización, funcionamiento, alianzas, extinción, etc. de los partidos políticos y agrupaciones municipales; c) el control y ﬁscalización patrimonial de los partidos mediante examen y aprobación o no de los estados contables; d) la organización, funcionamiento y ﬁscalización del registro de electores, de inhabilitados, de faltas electorales etc.; y e) elección, escrutinio y proclamación de las autoridades partidarias (art. 34).`

        {
            id: 60,
            tema: "Texto 60",
            textoConErrores: `El art. 122 LOPJ establece la potestad de los órganos sancionadores: ARTÍCULO 122.- Órganos sancionadores: Sin perjuicio de la potestad sancionatoria general que ejerce la Corte de Justicia, en virtud de la cual puede actuar de oﬁcio y por competencia originaria en materia disciplinaria, las sanciones que establece el presente capítulo, pueden ser aplicadas, con relación a quienez pertenezcan al Podér Judicial, por: 1) Apercibimiento: a) Corte de Justicia de la Provincia. b) Zala Tercera de la Corte de Justicia. c) Presidente o Presidenta de la Corte de Justicia. d)Jueces y Juezas de Cámaras de Apelaciones, y Tribunal de Impugnación. e) Jueces y Juezas de Prímera Instancia. f) Jueces y Juezas de Paz Letrada. g) Secretario Administrativo de la Corte de Justicia. h) Quienes ejerzan la coordinación o administración de Oﬁcinas Judiciales. i) Quienes ejerzan la coordinación o dirección de departamentos, direcciones administrativas u otros organismos del Poder Judicial. 2) Suspensión: a) Corte de Justicia, asta 30 días sin goce de haberes. b) Sala Tercera de la Corte de Justicia, hasta 30 días sin goce de haberes. 3) Cesantía, Exoneración: Corte de Justicia. La potestad disciplinaria del Ministerio Público Fiscal y del Ministerio de la Defensa Pública se ejerce conforme las leyes que rigen su ejercicio, sin perjuicio de la potestad disciplinaria que ostenta la Corte de Justicia. Toda esta enumeración del poder disciplinario que tienen los Magistrados y Funcionarios respecto de los empleados, tiene como ﬁnalidad poner en vuestro conocimiento las facultades que cada miembro superior ostenta, a efectos de que sepan los límites a que deben someterse por su condición de empleados. A ese mismo ﬁn, diremos que es menester recalcar que la actividad jurisdiccional en la que el empleado es párte desde la fecha de su ingreso, cada uno en la actividad y en el seno de su organismo, función que es de carácter técnico-jurídico de cierta complejidad, impone cierto respeto, tanto a las formaz, como a la conducta y comportamiento dentro y fuera del lugar de trabajo. A los Sres. Magistrados e integrantes del Ministerio Público les hestá prohibido partisipar en organizaciones, actividades políticas, ejercer su profesion o desempeñar empleos, funciones y otras actibidades dentro o fuera de la Provincia, exceptuando la docencia universitaria (art. 205 de la Constitución Provincial), de la misma forma los empleados de este poder deben adoptar idéntica actitud (arts. 11, 12, 13 y 14 de la LOPJ). De igual manera está prohibido prácticar juegos por dinero o frecuentar lugares deztinados a ello, no se puede ejercer profesiones liberales, ni comersio, ni actívidad lucrativa alguna, ni desempéñar empleo público o privado, sin autorización de la Autoridad de superintendencia (Sala Tercera de la Corte), salvo cargos docentes o comisiones de estudio cuya dedicación horaria no coincida o se superponga con el horario de tribunales, conforme la disposición del artículo 20 del Acuerdo 24/98. Se deve tratar y respetar a los Sres. Abogados con el mismo respeto debido a los magistrados. En casó de imposibilidad de asistencia al lugar de trabajo, se debe dar aviso al jefe del organismo, si es por motivos de enfermedad el aviso además deberá efectuarse a la Secretaría Administrativa de la Córte el mismo día hasta las nueve horas, indicando la enfermedad que padece y el domicilio en que se encuentra, caso contrario se procede al descuento de sus haberes sin perjuisio de la sanción que pudiere corresponder (art. 21 inc. b, A. G. Nº 24/98), sin perjuicio de la pérdida del presentismo. La inasistencia al lugar de trabajo por tres días consecutibos sin aviso, implican incurrir en abandono de servicio por lo tanto pasible de la sanción de cesantía. No está permitido abandonar las labores o el lúgar de trabajo sin permiso fundado y por escrito del Jefe. No se puede peticionar a las autoridades superiores sin venia del jefe inmediato, en caso de cualquier petición deberán dirigirse al Jefe de Oﬁcina (Juez, Defensor, Fiscal, Director, etc.), quien elevará la nota respectiva a la Sección Administrativa de la Corte de Justicia. Deben observarse las normas de disciplina, teniendo un comportamiento adecuado a la función que se dezempeña, dirigiéndose con el debido respeto a los superiores, a propósito de lo cual es himportante tener en cuenta que los miembros del Poder Judisial tienen el siguiente tratamiento: Los miembros de la Corte de Justicia: “Señor Ministro”; los miembros de la Cámara: “Señor Juez de Cámara”; los demás jueces: “Señor Juez” (art. 211 de la Constitución Provincial).`,
            textoLimpio: `El art. 122 LOPJ establece la potestad de los órganos sancionadores: ARTÍCULO 122.- Órganos sancionadores: Sin perjuicio de la potestad sancionatoria general que ejerce la Corte de Justicia, en virtud de la cual puede actuar de oﬁcio y por competencia originaria en materia disciplinaria, las sanciones que establece el presente capítulo, pueden ser aplicadas, con relación a quienes pertenezcan al Poder Judicial, por: 1) Apercibimiento: a) Corte de Justicia de la Provincia. b) Sala Tercera de la Corte de Justicia. c) Presidente o Presidenta de la Corte de Justicia. d)Jueces y Juezas de Cámaras de Apelaciones, y Tribunal de Impugnación. e) Jueces y Juezas de Primera Instancia. f) Jueces y Juezas de Paz Letrada. g) Secretario Administrativo de la Corte de Justicia. h) Quienes ejerzan la coordinación o administración de Oﬁcinas Judiciales. i) Quienes ejerzan la coordinación o dirección de departamentos, direcciones administrativas u otros organismos del Poder Judicial. 2) Suspensión: a) Corte de Justicia, hasta 30 días sin goce de haberes. b) Sala Tercera de la Corte de Justicia, hasta 30 días sin goce de haberes. 3) Cesantía, Exoneración: Corte de Justicia. La potestad disciplinaria del Ministerio Público Fiscal y del Ministerio de la Defensa Pública se ejerce conforme las leyes que rigen su ejercicio, sin perjuicio de la potestad disciplinaria que ostenta la Corte de Justicia. Toda esta enumeración del poder disciplinario que tienen los Magistrados y Funcionarios respecto de los empleados, tiene como ﬁnalidad poner en vuestro conocimiento las facultades que cada miembro superior ostenta, a efectos de que sepan los límites a que deben someterse por su condición de empleados. A ese mismo ﬁn, diremos que es menester recalcar que la actividad jurisdiccional en la que el empleado es parte desde la fecha de su ingreso, cada uno en la actividad y en el seno de su organismo, función que es de carácter técnico-jurídico de cierta complejidad, impone cierto respeto, tanto a las formas, como a la conducta y comportamiento dentro y fuera del lugar de trabajo. A los Sres. Magistrados e integrantes del Ministerio Público les está prohibido participar en organizaciones, actividades políticas, ejercer su profesión o desempeñar empleos, funciones y otras actividades dentro o fuera de la Provincia, exceptuando la docencia universitaria (art. 205 de la Constitución Provincial), de la misma forma los empleados de este poder deben adoptar idéntica actitud (arts. 11, 12, 13 y 14 de la LOPJ). De igual manera está prohibido practicar juegos por dinero o frecuentar lugares destinados a ello, no se puede ejercer profesiones liberales, ni comercio, ni actividad lucrativa alguna, ni desempeñar empleo público o privado, sin autorización de la Autoridad de superintendencia (Sala Tercera de la Corte), salvo cargos docentes o comisiones de estudio cuya dedicación horaria no coincida o se superponga con el horario de tribunales, conforme la disposición del artículo 20 del Acuerdo 24/98. Se debe tratar y respetar a los Sres. Abogados con el mismo respeto debido a los magistrados. En caso de imposibilidad de asistencia al lugar de trabajo, se debe dar aviso al jefe del organismo, si es por motivos de enfermedad el aviso además deberá efectuarse a la Secretaría Administrativa de la Corte el mismo día hasta las nueve horas, indicando la enfermedad que padece y el domicilio en que se encuentra, caso contrario se procede al descuento de sus haberes sin perjuicio de la sanción que pudiere corresponder (art. 21 inc. b, A. G. Nº 24/98), sin perjuicio de la pérdida del presentismo. La inasistencia al lugar de trabajo por tres días consecutivos sin aviso, implican incurrir en abandono de servicio por lo tanto pasible de la sanción de cesantía. No está permitido abandonar las labores o el lugar de trabajo sin permiso fundado y por escrito del Jefe. No se puede peticionar a las autoridades superiores sin venia del jefe inmediato, en caso de cualquier petición deberán dirigirse al Jefe de Oﬁcina (Juez, Defensor, Fiscal, Director, etc.), quien elevará la nota respectiva a la Sección Administrativa de la Corte de Justicia. Deben observarse las normas de disciplina, teniendo un comportamiento adecuado a la función que se desempeña, dirigiéndose con el debido respeto a los superiores, a propósito de lo cual es importante tener en cuenta que los miembros del Poder Judicial tienen el siguiente tratamiento: Los miembros de la Corte de Justicia: “Señor Ministro”; los miembros de la Cámara: “Señor Juez de Cámara”; los demás jueces: “Señor Juez” (art. 211 de la Constitución Provincial).`

        {
            id: 61,
            tema: "Texto 61",
            textoConErrores: `Debe procurarse atender con deferencia al público, dar las informaciones que fueren pertinentes y desempeñar las tareas del cargo y las que se les encomienden con celo y dedicación (art. 21 inc. f y g del Acuerdo General 24/98). Es ovligación concurrir a los lugares de trabajo adecuadamente vestidos, quienes sean provistos de uniformes deben usarlos y se considera falta disciplinaria el uso de indumentaria inadecuada (art. 50 del Acuerdo General 24/98). Régimen de sanciones. Para la aplicacion de las sanciones disciplinarias previstas en la Ley Orgánica del Poder Judicial, se procedera previo Sumário Administrativo, salvo el caso de apercibimiento (art. 120 LOPJ) en la medida de cada potestad disciplinaria, cuando los Magistrados o los jefes de las Oﬁcinas Judiciales de cualquiera de las instancias comprobaren directa y objetivamente las infracciones respectivas. Tódas las sanciones se registrarán en el legajo respectivo, que se encuentra en la oﬁcina de Legajos y Certiﬁcaciones, dependiente de la Dirección de Recursos Humanos de la Corte de Justicia. Régimen de licencias. El artículo 110 de la LOPJ, establece el tiempo durante el cual se suspende el funcionamiento de los tribunales, conocido como Feria Judicial, que se produce en el mes de henero completo y un Receso de Invierno que comprende un lapso de quince días corridos que dentro de la temporada invernal establecerá la Corte de Justicia. Durante la feria y el Receso de Invierno, se suspenden los plazos judiciales que deban computarse en días hábiles. La Feria Judicial es el tíempo vacacional de los Magistrados, Funcionarios y Empleados del Poder Judicial. El Receso Inbernal es destinado a la realización de labores internas, en las unidades de gestíón jurisdiccional y no jurisdiccional, por lo que deberá contar con la asistencia de Magistrados, Magistradas, Funcionarios, Funcionarias y Agentes. Por HAcuerdo General N.º 92/18, la Corte de Justicia reglamentó que el receso del mes de Julio, está destinada a la realisación de tareas internas, estableciendo que los magistrados deberán presentar ante la Secretaría Administrativa de la Córte de Justiciá, un plan de trabajo y organización referido a las tareas que desarrollarán durante el receso del mes de Julio. Solo tiene compensación la actuación de un Magistrado, funcionario o empleado durante la Feria Júdicial del mes de enero, que da derecho a una licencia por igual período. Quienes hubieren prestado servicios durante seis meses como mínimo, continuos o alternados, en el año caléndario anterior gozarán de licencia ordinaria durante la feria judicial (art. 37 del Acuerdo General 24/98). En cuanto a las demás licencias, el pedido debe formularse por escrito al superíor directo, quien emitirá opinión al respécto y cuya presentacion al organismo que deba concederla deberá efectuarse con anticipación suﬁciente (cinco días). La invocación de falsos motivos pára obtener licencia será considerado falta grave y da lugar a la cancelación de la concedida además de otras sanciones (art. 35 del Acuerdo General 24/98). Se prévén además licencias extraordinarias: a) por tratamiento de afecciones comunez, accidentes, operaciones quirúrgicas menores hasta 20 días laboralez por año, continuos o discontinuos. Para afecciones de largo tratamiento hasta un año de licencia con goce de haberes. b) por maternidad se establece una licencia de 120 días divididos en dos períodos antes y después del parto; el permiso para la atención de lactante habilita a la madre a reducir una hora su jornáda diaria (modiﬁcado por Acuerdo General 17/2011) c) por desempeño de cargos políticos, licencia sin remuneración por todo el lapso que dure la función. d) por asunto particular o familiar: por nacimiento de hijo, 5 días hábiles al personal masculino (modiﬁcado por Acuerdo General 17/2011); por fallecimiento de cónyuge, parientes en primer grado o hermano, cinco días hábiles; por parientes aﬁnes hasta segundo gradó, dos días corridos; y de tercer y cuarto grado, un día. e) para rendir exámenes universitarios o de nivel terciario, quienes tengan una antigüedad superior a seis meses cuentan con una licencia de beintiocho días al año, pudiendo solicitarse en lapsos no superiores a siete días. Debe acreditarse con certiﬁcación del Instituto, Colegio o Universidad. f) para actividades cientíﬁcas o culturales, diez días hábiles al año. g) para actividades gremiales, diez días hábiles al año. h) para atención de familiar enfermo, residente en el hogar familiar, diez días hábiles al año. i)`,
            textoLimpio: `Debe procurarse atender con deferencia al público, dar las informaciones que fueren pertinentes y desempeñar las tareas del cargo y las que se les encomienden con celo y dedicación (art. 21 inc. f y g del Acuerdo General 24/98). Es obligación concurrir a los lugares de trabajo adecuadamente vestidos, quienes sean provistos de uniformes deben usarlos y se considera falta disciplinaria el uso de indumentaria inadecuada (art. 50 del Acuerdo General 24/98). Régimen de sanciones. Para la aplicación de las sanciones disciplinarias previstas en la Ley Orgánica del Poder Judicial, se procederá previo Sumario Administrativo, salvo el caso de apercibimiento (art. 120 LOPJ) en la medida de cada potestad disciplinaria, cuando los Magistrados o los jefes de las Oﬁcinas Judiciales de cualquiera de las instancias comprobaren directa y objetivamente las infracciones respectivas. Todas las sanciones se registrarán en el legajo respectivo, que se encuentra en la oﬁcina de Legajos y Certiﬁcaciones, dependiente de la Dirección de Recursos Humanos de la Corte de Justicia. Régimen de licencias. El artículo 110 de la LOPJ, establece el tiempo durante el cual se suspende el funcionamiento de los tribunales, conocido como Feria Judicial, que se produce en el mes de enero completo y un Receso de Invierno que comprende un lapso de quince días corridos que dentro de la temporada invernal establecerá la Corte de Justicia. Durante la feria y el Receso de Invierno, se suspenden los plazos judiciales que deban computarse en días hábiles. La Feria Judicial es el tiempo vacacional de los Magistrados, Funcionarios y Empleados del Poder Judicial. El Receso Invernal es destinado a la realización de labores internas, en las unidades de gestión jurisdiccional y no jurisdiccional, por lo que deberá contar con la asistencia de Magistrados, Magistradas, Funcionarios, Funcionarias y Agentes. Por Acuerdo General N.º 92/18, la Corte de Justicia reglamentó que el receso del mes de Julio, está destinada a la realización de tareas internas, estableciendo que los magistrados deberán presentar ante la Secretaría Administrativa de la Corte de Justicia, un plan de trabajo y organización referido a las tareas que desarrollarán durante el receso del mes de Julio. Solo tiene compensación la actuación de un Magistrado, funcionario o empleado durante la Feria Judicial del mes de enero, que da derecho a una licencia por igual período. Quienes hubieren prestado servicios durante seis meses como mínimo, continuos o alternados, en el año calendario anterior gozarán de licencia ordinaria durante la feria judicial (art. 37 del Acuerdo General 24/98). En cuanto a las demás licencias, el pedido debe formularse por escrito al superior directo, quien emitirá opinión al respecto y cuya presentación al organismo que deba concederla deberá efectuarse con anticipación suﬁciente (cinco días). La invocación de falsos motivos para obtener licencia será considerado falta grave y da lugar a la cancelación de la concedida además de otras sanciones (art. 35 del Acuerdo General 24/98). Se prevén además licencias extraordinarias: a) por tratamiento de afecciones comunes, accidentes, operaciones quirúrgicas menores hasta 20 días laborales por año, continuos o discontinuos. Para afecciones de largo tratamiento hasta un año de licencia con goce de haberes. b) por maternidad se establece una licencia de 120 días divididos en dos períodos antes y después del parto; el permiso para la atención de lactante habilita a la madre a reducir una hora su jornada diaria (modiﬁcado por Acuerdo General 17/2011) c) por desempeño de cargos políticos, licencia sin remuneración por todo el lapso que dure la función. d) por asunto particular o familiar: por nacimiento de hijo, 5 días hábiles al personal masculino (modiﬁcado por Acuerdo General 17/2011); por fallecimiento de cónyuge, parientes en primer grado o hermano, cinco días hábiles; por parientes aﬁnes hasta segundo grado, dos días corridos; y de tercer y cuarto grado, un día. e) para rendir exámenes universitarios o de nivel terciario, quienes tengan una antigüedad superior a seis meses cuentan con una licencia de veintiocho días al año, pudiendo solicitarse en lapsos no superiores a siete días. Debe acreditarse con certiﬁcación del Instituto, Colegio o Universidad. f) para actividades cientíﬁcas o culturales, diez días hábiles al año. g) para actividades gremiales, diez días hábiles al año. h) para atención de familiar enfermo, residente en el hogar familiar, diez días hábiles al año. i)`

        {
            id: 66,
            tema: "Texto 66",
            textoConErrores: `El Ministerio Público será representado también por Secretarios del Ministerio Público de Primera Instancia, quienes podrán intervenir como Ayúdantes Fiscales, con las facultades y deberes que les conﬁere la Ley N° 1851-O, en el Artículo 114. Son designados por la Corte de Justicia a propuesta del Fizcal General de la Corte. Para ser Secretario de Minizterio Público de Primera Instancia se requiere título de abogado y tres (3) años en el ejercicio de la profesión o como agente del Poder Judicial. Las funcíones de los secretarios serán las que se ﬁjen por reglamentación del Fiscal General de la Córte. HARTÍCULO 27BIS.- Obligaciones y prohibiciones: Los Secretarios del Ministerio Público (Ayudantes Fizcales) tienen las obligaciones y prohibiciones que les ﬁje la Fiscalía General de la Corte, salvo la disposición de la acción penal. ARTÍCULO 28.- Los Agentes Fiscales serán asistidos además por auxiliares en el número que se determine por la reglamentación y serán designados por la Corte de Justicia de conformidad al Artículo 45 de la Constitución Provincial. ÁRTÍCULO 29.- Asesorías Oﬁciales de Menores e Incapaces en la Primera Circunscripción Judicial: Habrá seis (6) Asesorías Oﬁciales de Menores e Incapaces en la Primera Circunscripción Judicial, cuyos titulares serán designados como Asesores de Menores e Incapaces. ARTÍCULO 30.- Asesorías Oﬁciales de Menores e Incapaces en la Zegunda Circunscripción Judicial: Havrá una Asesoría Oﬁcial de Menores e Incapaces en la Segunda Circunscripcion Judicial, cuyo titular sera designado comó Asesor de Menores e Incapaces. ARTÍCULO 31.-Los Ministerios Públicos de Menores son parte necesaria en todos los asuntos concernientes al régimen de las personas y de los bienes de los menores e incapaces. ARTÍCULO 32.- Atribuciones y deberes: Los Asesores de Menores e Incapaces tienen las siguientes atribuciones y deberes: 1) Intervenír en los juicios de todos los fueros de jurisdicción voluntaria o contenciosa en que los incapaces demanden o seán demandados, o que se trate de la persona o bienes de los mismos, en defensa de los derechos de sus representados, en los que tengan de legítimos. 2) En los casos en que los menores o incapaces fueren huérfanos carenciados, abandonados por sus padrez, tutorez o encargados o que se encontraren en ebidente estado de carencia o peligro moral o material, deberán solicitar al Juez competente las medidas convenientes para garantizar el efectivo cumplimiento de los derechos reconocidos en la Convencion Internacional del Niño. 3) Ejercer las funciones de Patronato, ínspeccionando por sí o con los Jueces de Menores, los establecimientos dependientes del organismo proteccional, u otros que debidamente autorizados o reconocidos tuvieren a su cargo menores e incapaces, poniendo en conocimiento de los Jueces de Menores, como titulares del patronato, las irregularidades que notaren, o actuando las peticiones consecuentes. 4) Convocar a las personas que a su juicio fuere necesario para el desempeño de sus funciones, solisitando en caso de inconcurrencia, su comparendo al Juez competente, quien lo ordenará si fuere procedente. 5) Las disposiciones precedentes son también aplicables a la guarda y protección de las personas y de los bienes de los hincapaces mayores de edad, sin excluir en uno y otro caso, los derechos que a los padres, hijos, parientes, titulares o curadores correspondieren. 6) Dar cumplimiento a todas las funsiones inherentes a su cargo determinadas en las leyes de fondo y de forma y en la reglamentación que al efecto se dícte. 7) Garantizar y efectivizar el ﬁel cumplimiento de los derechos reconocidos en la Convención sobre los Derechos del Niño, incorporado como norma constitucional por Ley Nº 23849. ARTÍCULO 33.-Son además deberes de los Asesores de Menores e Incapaces: a) Llevar un prótocolo de los dictámenes, traslados y vistas, y todo otro escrito presentado ante los organismos jurisdiccionales. b) Llevar un libro de entrada y salida de expedientes. ARTÍCULO 34.- Defensores Oﬁciales en la Primera Circunscripción Judicial:`,
            textoLimpio: `El Ministerio Público será representado también por Secretarios del Ministerio Público de Primera Instancia, quienes podrán intervenir como Ayudantes Fiscales, con las facultades y deberes que les conﬁere la Ley N° 1851-O, en el Artículo 114. Son designados por la Corte de Justicia a propuesta del Fiscal General de la Corte. Para ser Secretario de Ministerio Público de Primera Instancia se requiere título de abogado y tres (3) años en el ejercicio de la profesión o como agente del Poder Judicial. Las funciones de los secretarios serán las que se ﬁjen por reglamentación del Fiscal General de la Corte. ARTÍCULO 27BIS.- Obligaciones y prohibiciones: Los Secretarios del Ministerio Público (Ayudantes Fiscales) tienen las obligaciones y prohibiciones que les ﬁje la Fiscalía General de la Corte, salvo la disposición de la acción penal. ARTÍCULO 28.- Los Agentes Fiscales serán asistidos además por auxiliares en el número que se determine por la reglamentación y serán designados por la Corte de Justicia de conformidad al Artículo 45 de la Constitución Provincial. ARTÍCULO 29.- Asesorías Oﬁciales de Menores e Incapaces en la Primera Circunscripción Judicial: Habrá seis (6) Asesorías Oﬁciales de Menores e Incapaces en la Primera Circunscripción Judicial, cuyos titulares serán designados como Asesores de Menores e Incapaces. ARTÍCULO 30.- Asesorías Oﬁciales de Menores e Incapaces en la Segunda Circunscripción Judicial: Habrá una Asesoría Oﬁcial de Menores e Incapaces en la Segunda Circunscripción Judicial, cuyo titular será designado como Asesor de Menores e Incapaces. ARTÍCULO 31.-Los Ministerios Públicos de Menores son parte necesaria en todos los asuntos concernientes al régimen de las personas y de los bienes de los menores e incapaces. ARTÍCULO 32.- Atribuciones y deberes: Los Asesores de Menores e Incapaces tienen las siguientes atribuciones y deberes: 1) Intervenir en los juicios de todos los fueros de jurisdicción voluntaria o contenciosa en que los incapaces demanden o sean demandados, o que se trate de la persona o bienes de los mismos, en defensa de los derechos de sus representados, en los que tengan de legítimos. 2) En los casos en que los menores o incapaces fueren huérfanos carenciados, abandonados por sus padres, tutores o encargados o que se encontraren en evidente estado de carencia o peligro moral o material, deberán solicitar al Juez competente las medidas convenientes para garantizar el efectivo cumplimiento de los derechos reconocidos en la Convención Internacional del Niño. 3) Ejercer las funciones de Patronato, inspeccionando por sí o con los Jueces de Menores, los establecimientos dependientes del organismo proteccional, u otros que debidamente autorizados o reconocidos tuvieren a su cargo menores e incapaces, poniendo en conocimiento de los Jueces de Menores, como titulares del patronato, las irregularidades que notaren, o actuando las peticiones consecuentes. 4) Convocar a las personas que a su juicio fuere necesario para el desempeño de sus funciones, solicitando en caso de inconcurrencia, su comparendo al Juez competente, quien lo ordenará si fuere procedente. 5) Las disposiciones precedentes son también aplicables a la guarda y protección de las personas y de los bienes de los incapaces mayores de edad, sin excluir en uno y otro caso, los derechos que a los padres, hijos, parientes, titulares o curadores correspondieren. 6) Dar cumplimiento a todas las funciones inherentes a su cargo determinadas en las leyes de fondo y de forma y en la reglamentación que al efecto se dicte. 7) Garantizar y efectivizar el ﬁel cumplimiento de los derechos reconocidos en la Convención sobre los Derechos del Niño, incorporado como norma constitucional por Ley Nº 23849. ARTÍCULO 33.-Son además deberes de los Asesores de Menores e Incapaces: a) Llevar un protocolo de los dictámenes, traslados y vistas, y todo otro escrito presentado ante los organismos jurisdiccionales. b) Llevar un libro de entrada y salida de expedientes. ARTÍCULO 34.- Defensores Oﬁciales en la Primera Circunscripción Judicial:`

            id: 67,

            textoConErrores: `Habrá en la Primera Circunscripción Judicial veinticuatro (24) Defensores Oﬁciales, cuyos titulares serán designados como Defensor de Pobres y Ausentes. ARTÍCULO 35.- Defensores Oﬁciales en la Segunda Circunscripción Judicial: Habrá en la Segunda Circunscripción Judicial tres (3) Defenzores Oﬁciales, cuyos titulares serán designados como Defensor de Povres y Ausentes. ARTÍCULO 36.- Derogado. ARTÍCULO 37.- Cuando hubiere condenación en costas a favor del pobre que litiga, el Defensor de Pobres y Ausentes, podrá percibir honorarios, los que necesariamente deberán ser regulados por el Órgano Jurisdiccional interviniente. ARTÍCULO 38.- Los Defensores de Pobres y Ausentes deberán llevar un protocolo de los escritos que presentaren a los Órganos Jurisdiccionales, separándolos por Fuero y según convenga al buen orden. Llevarán asimismo un libro de entradas y salidas de expedientes. ARTÍCULO 39.- Derogado. ARTÍCULO 40.- Derogado. ARTÍCULO 41.- Defensores Oﬁciales hante el fuero de menores: El Ministerio Público por ante el Fuero de Menores, será ejercido por los Defensores Oﬁciales, que cúmplirán las siguientes funciones: PRIMERO: Patrocinar a las personas que necesiten accionar por ante los Tribunales de Menores. SEGUNDO: Defender a los menores y sus intereses sea directa o conjuntamente con los representantes de éstos, por ante los mismos Jusgados de Menores. TERCERO: Solicitar medídas de seguridad para los biénes de los menores y nombramiento de tutores de los mísmos, ante los Tribunales. CUARTO: Solicitar la internación al Sr. Juez de Menores, en lugares ádecuados para los mismos, considerando su edad en los casos que sea necesario, a ﬁn de iniciar las acciones pertinentes o tomar las medidas que correspondan. QUINTO: Inspeccíonar por sí o conjuntamente con los Jueces de Menores, los establecimientos que tuvieren a su cargo menorez e incapaces, informarse del trato y educación que se les da y poner en conocimiento de quien corresponda los abusos o defectos que notaren. SEXTO: Fiscalizar el trabajo de menores en fábricas, talleres, sitios o lugares públicos o privadoz, a los ﬁnes de asegurar el cumplimiénto de leyes y convenciones en vigencia. SEPTIMO: Velar por el cumplimiento de las leyes de minoridad, en particular las consagradas en la Convención de los Derechos del Niño, denunciando a sus infractores. ARTÍCULO 42.- Las demás funciones y obligaciones que determinen las leyes y las resolusiones del titular del Ministerio Público. Por reglamentación de la Fiscalia General de la Corte se determinará lo concerniente a la situación económica de los ciudadanos que tienen derécho a la asistencia de estos funsionarios. ARTÍCULO 43.- Derogado. ARTÍCULO 44.- Derogado. Título IV ARTÍCULO 45.- Legislación aplicable: La asistencia, licencia, régimen disciplinario de los integrantes del Ministerio Publico, sus Funcionarios y auxiliares y empleados se regiran por las mismas normás que regulan la materia en relación a los demás integrantes del Póder Judicial, salvo lo prescripto en la presente Ley. Sin perjuicio de ello, el Fiscal General puede disponer las modiﬁcaciones en cuanto a la asistencia que estimare pertinente cuando las modalídades y necesidades del servicio así lo requieran. ARTÍCULO 46.- Bajo la exclusiva responsabilidad del titular de cada organismo, los funcionarios que en él presten servicio podrán ser autorizados por escrito al retiro de expedientes de los Órganos Jurisdiccionales cuando así correspondiere. ARTÍCULO 47.- Reglamentación: El Fiscal General de la Corte deberá reglamentar, cuando así correspondiera, los derechos y obligaciones impuestos por la presente y está facultado a dictar toda resolución que fuere necesario para el mejor cumplimiento de la presente. Cláusulas transitorias ARTÍCULO 48.- Hasta tanto las posibilidades ﬁnancieras permitán la creación de los organismos administrativos pertinentes, la Fiscalía General será asistida por las dependensias administrativas de la Corte de Justisia.`,

ia.`

            textoConErrores: `ARTÍCULO 49.- Los Funcionarios y Auxiliares de los demás órganós del Ministério Público serán designados o asignados por la Corte de Justicia a sola propuesta del Fiscal General en los términos que las posibilidades ﬁnancieras lo permitan. ARTÍCULO 49BIS.- Créase en el ámbito del Ministerio Público los siguientes cargos: a) Doce (12) Secrétarios del Ministerio Público de Priméra Instancia (Ayudantes Fiscales). b) Doce (12) empleados administrativos, con el cargo de hescribientes. c) Dos (2) ordenanzas, con el cargo de hayudante. d) Cuatro (4) Secretarios del Ministerio Público de Primera Instancia (Ayudantes Defensores) que hintegrarán el Cuerpo de Secretarios del Ministerio Publico de Primera Instancia. ARTÍCULO 50.- La presente Ley es de Necesidad y Urgencia. ARTÍCULO 51.- Comuníquese al Poder Ejecutivo. DEFENSA OFICIAL. LEY PROVINCIAL N°2179-E, SEGÚN NUMERACIÓN DEL DIGESTO JURÍDICO. LEY Nº 2179-E Título I Capítulo Único Disposiciones generales ARTÍCULO 1º.- Órganos: La Defensa Oﬁcial será ejercida por un Defenzor Oﬁcial con la función de Defensor General y los demás órganos contemplados en esta Ley, con las atribuciones que en ella se establecen. ARTÍCULO 2º.- Misión: La Defensa Óﬁcial tiene como misión ejercer la defensa y protección de los derechos humanos y de los derechos individuales en el caso asignado dentró del ámbito de su competensia. No interviene en procesos administrativos salvo disposición expresa de la ley. ARTÍCULO 3º.- Autonomía funcional y técnica: La Defensa Oﬁcial tiene autonomía funcional y ejerce sus funciones sin sujeción a directivas que emanen de órganos ajenos a su estructura, actúa en coordinación con otros organismos gubernamentales y no gubernamentalez involucrados en la defensa de los derechos de las personas. Se garantiza la autonomía técnica de quien gestione casos de la Defensa Oﬁcial; sus integrantes procuran canalizar las indicaciones del asistido o defendido en la búsqueda de la solución que más lo favorezca. Los funcionarios que componen la Defensa Oﬁcial dezempeñarán su cargo soló con dependenciá de las directivas que imparta el Defensor General conforme la presente ley; con responsabilidad profesional, funcional y con sujesión a las normas constitucionales y legales correspondientes. ÁRTÍCULO 4º.- Equiparaciones: Los miembros y funcionarios que integran la Defensa Oﬁcial gozan en cuanto a trato y respeto, de los mismos derechos de Jueces y Fiscales. El Defensor General percibirá la misma remuneración que corresponde al cargo de Fiscal de Cámara. ARTÍCULO 5°.- Organización y funcionamiento. Deber de observancia: La organización y funcionamiento de la Defensa Oﬁcial estará a cargo del Defensor General conformé lo dispuesto en esta Ley, resoluciones y directivas que a tal efécto dicte. La Defensa Oﬁcial ejerce sus funciones con arreglo a los principios de legalidad, unidad de actuasión, conﬁdencialidad, intervención supletoria, gratuidad y dependencia jerárquica respecto del Defensor General, deviendo los defensores, funcionarios y empleados observar y cumplir las disposiciones generales e directivas particulares que éste imparta en los términos de esta ley. Las directivas particulares que imparta el Defensor General deberán siempre estar encaminadas a asegurar una defensa técnica efectiva y éﬁcaz para tutelar los derechos y pretensiones del requirente, prevaleciendo la solución que más favorezca al defendido, asistido o patrocinado respetando el principio de legalidad. Si un miembro de la Defensa Oﬁcial actuare en cumplimiento de directivas emanadaz del Defensor General, podrá dejar a salvo su opinión personal elevando a su cónocimiento un informe fundado al respecto. ARTÍCULO 6°.- Principios: Los miembros de la Defensa Oﬁcial adecuan su actividad a los siguíentes principios especíﬁcos, que son fuente interpretativa de todas sus actuaciones:`,
